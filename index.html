/* ---------- 나레이션 (음성 읽기) ---------- */
function clean(s){
  return String(s)
    .replace(/[“”"‘’'「」]/g,'')
    .replace(/→/g,', ').replace(/[·•]/g,', ').replace(/[★☆]/g,'').replace(/—/g,', ')
    .replace(/(\d{4})–(\d{2,4})/g,'$1년에서 $2년').replace(/–/g,'에서 ')
    .replace(/([A-Ga-g])#/g,'$1샵 ').replace(/([A-Ga-g])♭/g,'$1플랫 ')
    .replace(/Op\.(\d+)-(\d+)/g,'작품번호 $1의 $2').replace(/Op\.(\d+)/g,'작품번호 $1').replace(/K\.(\d+)/g,'쾨헬 $1')
    .replace(/\s+/g,' ').trim();
}
const ORD = ['첫째','둘째','셋째','넷째','다섯째'];
function pieceScript(p, len, lead){
  const c = COMP[p.c], out = [];
  out.push((lead || '') + c.full + '의 ' + p.t + '입니다.');
  out.push('이 곡의 이야기입니다.');
  p.story.forEach(s => out.push(s));
  if (len !== 'short') {
    out.push('듣기 포인트를 알려드릴게요.');
    p.points.forEach((x, i) => out.push(ORD[i] + ', ' + x + '.'));
  }
  if (len === 'long') {
    out.push('그 무렵 ' + c.name + '에 대해 조금 더 이야기해 볼게요.');
    out.push(c.why);
  }
  out.push('그럼, 들어보시죠.');
  return out.map(clean);
}
function composerScript(c){
  return [c.full + '. ' + c.tagline + '.'].concat(c.story, ['왜 이 시대에 이런 음악이었을까요?', c.why]).map(clean);
}

/* ---------- AI 음성 파일 (드라이브에 저장된 해설 음성) ---------- */
const NARR = window.NARR || { p:{}, c:{}, v:{}, g:{}, voices:[] };
const Clips = {
  mem: {}, wait: {},
  url(k){ return 'tts-cache/' + encodeURIComponent(k); },
  async fromCache(k){
    try { if (!window.caches) return null; const c = await caches.open('cw-tts'); const r = await c.match(this.url(k)); return r ? await r.blob() : null; } catch(e){ return null; }
  },
  async toCache(k, blob){ try { if (!window.caches) return; const c = await caches.open('cw-tts'); await c.put(this.url(k), new Response(blob, { headers: { 'Content-Type': 'audio/mpeg' } })); } catch(e){} },
  async get(keys){
    const out = {}, miss = [];
    for (const k of keys) {
      if (this.mem[k]) { out[k] = this.mem[k]; continue; }
      const b = await this.fromCache(k);
      if (b) { out[k] = this.mem[k] = URL.createObjectURL(b); } else miss.push(k);
    }
    for (let i = 0; i < miss.length; i += 4) {
      const part = miss.slice(i, i + 4);
      let got = null;
      // 실패하면 한 번 더 시도 (통신이 잠깐 끊긴 경우)
      for (let tr = 0; tr < 2 && !got; tr++) {
        try { got = await call('getClips', part); } catch(e){ if (tr === 0) await new Promise(r => setTimeout(r, 1200)); }
      }
      for (const k of part) {
        if (!got || !got[k]) continue;
        const bin = atob(got[k]), arr = new Uint8Array(bin.length);
        for (let j = 0; j < bin.length; j++) arr[j] = bin.charCodeAt(j);
        const blob = new Blob([arr], { type: 'audio/mpeg' });
        this.toCache(k, blob);
        out[k] = this.mem[k] = URL.createObjectURL(blob);
      }
    }
    return keys.map(k => out[k] || null);
  },
  prefetch(keys){ if (SET.ai && keys.length) this.get(keys).catch(() => {}); }
};
function voiceOf(cid){ return NARR.v[cid] || NARR.voices[0] || ''; }
function hasAI(p){ return !!(NARR.p[p.id] && NARR.v[p.c]); }
// 곡 해설: 음성 파일 키 + 자막(대체 읽기용) 목록
function pieceClips(p, len, lead){
  if (!hasAI(p)) return pieceScript(p, len, lead === 'start' ? '드라이브 모드를 시작합니다. 첫 곡은 ' : lead === 'next' ? '다음 곡은 ' : '').map(t => ({ t }));
  const v = voiceOf(p.c), n = NARR.p[p.id], out = [];
  if (lead) out.push({ k: 'g_' + v + '_' + lead, t: NARR.g[lead] });
  out.push({ k: 'a_' + p.id, t: n.a });
  if (len !== 'short') out.push({ k: 'b_' + p.id, t: n.b });
  if (len === 'long' && NARR.c[p.c]) out.push({ k: 'w_' + p.c, t: NARR.c[p.c].w });
  out.push({ k: 'g_' + v + '_end', t: NARR.g.end });
  return out;
}
function composerClips(c){
  if (!NARR.c[c.id] || !NARR.v[c.id]) return composerScript(c).map(t => ({ t }));
  return [{ k: 'c_' + c.id, t: NARR.c[c.id].s }];
}
function silentWav(sec){
  const n = Math.round((sec || 0.1) * 8000), b = new ArrayBuffer(44 + n), d = new DataView(b), w = (o, s) => { for (let i = 0; i < s.length; i++) d.setUint8(o + i, s.charCodeAt(i)); };
  w(0,'RIFF'); d.setUint32(4, 36 + n, true); w(8,'WAVE'); w(12,'fmt '); d.setUint32(16,16,true); d.setUint16(20,1,true); d.setUint16(22,1,true);
  d.setUint32(24,8000,true); d.setUint32(28,8000,true); d.setUint16(32,1,true); d.setUint16(34,8,true); w(36,'data'); d.setUint32(40,n,true);
  for (let i = 0; i < n; i++) d.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
}

const Narrator = {
  ok: 'speechSynthesis' in window,
  voice: null, queue: [], idx: 0, token: 0, speaking: false, paused: false, onEnd: null, cur: '', owner: null,
  mode: 'tts', audio: null, clips: [], urls: [],
  pickVoice(){
    if (!this.ok) return;
    const vs = speechSynthesis.getVoices();
    this.voice = vs.find(v => /^ko/i.test(v.lang) && /google/i.test(v.name)) || vs.find(v => /^ko/i.test(v.lang)) || null;
  },
  el(){ if (!this.audio) { this.audio = new Audio(); this.audio.preload = 'auto'; } return this.audio; },
  // 사용자가 화면을 누른 순간 한 번 소리 없이 재생해 두면, 이후 자동 재생이 막히지 않아요
  unlock(){ try { const a = this.el(); if (a.src && !a.paused) return; a.src = silentWav(); const p = a.play(); p && p.catch(() => {}); } catch(e){} },
  split(text){ return String(text).replace(/([.!?])\s+/g, '$1\n').split('\n').map(s => s.trim()).filter(Boolean); },
  // 음성 파일로 읽기 (없거나 실패하면 기기 음성으로)
  say(clips, onEnd, owner){
    const texts = clips.map(c => c.t);
    if (!SET.ai || !clips.length || !clips.every(c => c.k)) return this.speak(texts, onEnd, owner);
    this.stop();
    this.unlock();
    const tok = ++this.token;
    this.mode = 'ai'; this.clips = clips; this.idx = 0; this.onEnd = onEnd || null; this.owner = owner || null;
    this.speaking = true; this.paused = false; this.cur = clips[0].t; this.loading = true;
    notify();
    const fail = () => {
      if (tok !== this.token) return;
      this.loading = false;
      toast('AI 성우 음성을 불러오지 못해 기기 음성으로 읽어요');
      const f = this.onEnd, o = this.owner;
      this.speak(texts, f, o);
    };
    Clips.get(clips.map(c => c.k)).then(urls => {
      if (tok !== this.token) return;
      if (!urls.some(Boolean)) return fail();
      this.loading = false; this.urls = urls; this._aiNext(tok);
    }).catch(fail);
  },
  _aiNext(tok){
    if (tok !== this.token) return;
    if (this.idx >= this.clips.length) return this._finish();
    const a = this.el();
    this.cur = this.clips[this.idx].t;
    // 이 문장만 음성 파일이 없으면 그 문장만 기기 음성으로 읽고 다음으로
    if (!this.urls[this.idx]) { this._ttsOne(tok); notify(); return; }
    a.onended = () => { if (tok !== this.token) return; this.idx++; this._aiNext(tok); };
    a.onerror = () => { if (tok !== this.token) return; this._toTts(tok); };
    a.src = this.urls[this.idx];
    a.playbackRate = SET.rate || 1;
    const p = a.play();
    if (p) p.catch(() => { if (tok === this.token && !this.paused) this._toTts(tok); });
    notify();
  },
  _ttsOne(tok){
    if (!this.ok) { this.idx++; return this._aiNext(tok); }
    const parts = this.split(this.clips[this.idx].t); let j = 0;
    this.oneTts = true;
    const nx = () => {
      if (tok !== this.token) return;
      if (j >= parts.length) { this.oneTts = false; this.idx++; return this._aiNext(tok); }
      const u = new SpeechSynthesisUtterance(parts[j++]);
      u.lang = 'ko-KR'; if (this.voice) u.voice = this.voice; u.rate = SET.rate;
      u.onend = nx; u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') nx(); };
      speechSynthesis.speak(u);
    };
    nx();
  },
  _toTts(tok){
    if (tok === this.token) toast('AI 성우 음성을 재생하지 못해 기기 음성으로 읽어요');
    const rest = this.clips.slice(this.idx).map(c => c.t), f = this.onEnd, o = this.owner;
    this.speak(rest, f, o);
  },
  _finish(){
    this.speaking = false; this.cur = ''; this.mode = 'tts';
    const f = this.onEnd; this.onEnd = null; this.owner = null;
    notify(); f && f();
  },
  speak(parts, onEnd, owner){
    if (!this.ok) { toast('이 브라우저는 음성 읽기를 지원하지 않아요'); onEnd && onEnd(); return; }
    this.stop();
    if (!this.voice) this.pickVoice();
    this.mode = 'tts';
    this.queue = parts.flatMap(p => this.split(p));
    this.idx = 0; this.onEnd = onEnd || null; this.owner = owner || null;
    this.speaking = true; this.paused = false;
    this._next(++this.token);
  },
  _next(tok){
    if (tok !== this.token) return;
    if (this.idx >= this.queue.length) return this._finish();
    const u = new SpeechSynthesisUtterance(this.queue[this.idx]);
    u.lang = 'ko-KR'; if (this.voice) u.voice = this.voice; u.rate = SET.rate;
    u.onend = () => { if (tok !== this.token) return; this.idx++; this._next(tok); };
    u.onerror = e => { if (tok !== this.token) return; if (e.error === 'interrupted' || e.error === 'canceled') return; this.idx++; this._next(tok); };
    this.cur = this.queue[this.idx];
    speechSynthesis.speak(u);
    notify();
  },
  pause(){
    if (!this.speaking) return;
    if (this.mode === 'ai') { if (this.oneTts) { this.token++; speechSynthesis.cancel(); this.oneTts = false; this.reOne = true; } else if (this.audio) this.audio.pause(); }
    else { this.token++; speechSynthesis.cancel(); }
    this.speaking = false; this.paused = true; notify();
  },
  resume(){
    if (!this.paused) return;
    this.paused = false; this.speaking = true;
    if (this.mode === 'ai') {
      if (this.loading) { notify(); return; }
      if (this.reOne) { this.reOne = false; this._aiNext(++this.token); return; }
      const p = this.audio && this.audio.play(); p && p.catch(() => this._toTts(this.token)); notify();
    } else this._next(++this.token);
  },
  stop(){
    this.token++;
    if (this.ok) speechSynthesis.cancel();
    if (this.audio) { try { this.audio.pause(); } catch(e){} }
    this.speaking = false; this.paused = false; this.onEnd = null; this.cur = ''; this.owner = null; this.mode = 'tts'; this.loading = false; this.oneTts = false; this.reOne = false;
  },
  busy(){ return this.speaking || this.paused; }
};
if (Narrator.ok) { Narrator.pickVoice(); speechSynthesis.onvoiceschanged = () => Narrator.pickVoice(); }

/* ---------- 유튜브 플레이어 (iframe + postMessage 직접 제어) ---------- */
const Player = {
  frame: null, ready: false, st: -1, piece: null, cands: [], ci: 0, wantPlay: false, readyP: null, watch: null, ping: null,
  cur: 0, dur: 0, lastT: -1, tChange: 0, at: 0, pre: null, adMuted: false, vid: '',
  ensure(){
    if (this.readyP) return this.readyP;
    this.readyP = new Promise(res => {
      this._res = res;
      const f = document.createElement('iframe');
      f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
      f.setAttribute('allowfullscreen', '');
      f.src = YTB + '/embed/?enablejsapi=1&playsinline=1&rel=0&modestbranding=1&origin=' + encodeURIComponent(location.origin);
      f.onload = () => this._listen();
      document.getElementById('ytPlayer').appendChild(f);
      this.frame = f;
    });
    return this.readyP;
  },
  _post(o){ try { this.frame.contentWindow.postMessage(JSON.stringify(Object.assign({ id: 1, channel: 'widget' }, o)), '*'); } catch(e){} },
  _listen(){
    let n = 0; clearInterval(this.ping);
    this.ping = setInterval(() => {
      if (this.ready || ++n > 60) { clearInterval(this.ping); if (!this.ready) toast('플레이어를 불러오지 못했어요. 새로고침해 주세요.'); return; }
      this._post({ event: 'listening' });
    }, 250);
  },
  _msg(e){
    if (!/^https:.{2}(www\.)?youtube(-nocookie)?\.com$/.test(e.origin || '')) return;
    let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch(err){ return; }
    if (!d || !d.event) return;
    if (d.event === 'onReady' || (d.event === 'initialDelivery' && !this.ready)) {
      if (!this.ready) { this.ready = true; clearInterval(this.ping); this._res && this._res(); notify(); }
    } else if (d.event === 'onStateChange') {
      this._state(d.info);
    } else if (d.event === 'infoDelivery' && d.info) {
      const i = d.info;
      if (typeof i.duration === 'number' && i.duration > 0) this.dur = i.duration;
      if (i.videoData && i.videoData.video_id) this.vid = i.videoData.video_id;
      if (typeof i.playerState === 'number' && i.playerState !== this.st) this._state(i.playerState);
      if (typeof i.currentTime === 'number') this._time(i.currentTime);
    } else if (d.event === 'onError') {
      this._error(d.info);
    }
  },
  cmd(func, args){ this._post({ event: 'command', func, args: args || [] }); },
  candidates(p){ return [...new Set([S.videos[p.id]].concat((DATA.videos || {})[p.id] || []).filter(Boolean))]; },
  load(p, autoplay, at){
    this.piece = p; this.cands = this.candidates(p); this.ci = 0; this.wantPlay = !!autoplay; this.at = at || 0;
    this.pre = null; this.cur = this.at; this.dur = 0; this.lastT = -1;
    if (this.adMuted) { this.adMuted = false; this.cmd('unMute'); }
    setDockInfo(p);
    if (!this.cands.length) { toast('이 곡은 등록된 영상이 없어요'); return false; }
    this._loadCur();
    return true;
  },
  _loadCur(){
    const id = this.cands[this.ci];
    this.st = -1;
    const o = { videoId: id }; if (this.at > 0) o.startSeconds = Math.floor(this.at);
    this.cmd(this.wantPlay ? 'loadVideoById' : 'cueVideoById', [o]);
  },
  // 해설이 나오는 동안 영상을 소리 없이 미리 틀어 둡니다.
  // 영상 앞에 광고가 붙어 있으면 그 사이에 소리 없이 지나가고, 본 영상이 시작되는 순간 첫 장면에서 멈춰 기다립니다.
  // 해설이 끝났는데 광고가 아직이면, 광고가 끝나는 순간 소리를 켜고 바로 이어서 재생합니다.
  preroll(p, at){
    this.cmd('mute');
    if (!this.load(p, true, at)) return false;
    this.pre = { phase: 'run', since: Date.now(), waitAd: false, waitSince: 0 };
    notify();
    return true;
  },
  _contentStarted(){
    const pr = this.pre; if (!pr || pr.phase !== 'run') return;
    if (!pr.waitAd) {
      pr.phase = 'held';
      this.cmd('pauseVideo'); this.cmd('seekTo', [this.at || 0, true]);
    } else {
      this.pre = null; this.wantPlay = true;
      if (this.cur > (this.at || 0) + 3) this.cmd('seekTo', [this.at || 0, true]);
      this.cmd('unMute');
    }
    notify();
  },
  adWaiting(){ return !!(this.pre && this.pre.phase === 'run' && this.pre.waitAd); },
  _time(t){
    if (t !== this.lastT) { this.lastT = t; this.tChange = Date.now(); }
    this.cur = t;
    if (this.pre && this.pre.phase === 'run' && this.st === 1 && t > (this.at || 0) + 0.3) this._contentStarted();
    if (this.adMuted && this.st === 1) { this.adMuted = false; if (!this.pre) this.cmd('unMute'); notify(); }
  },
  // 1초마다: 광고 대기 시간 초과 처리 + 재생 중 중간 광고(시간이 멈춘 채 재생 상태) 소리 끄기
  _tick(){
    const pr = this.pre, now = Date.now();
    if (pr && pr.phase === 'run' && pr.waitAd && now - pr.waitSince > 75000) {
      this.pre = null; this.cmd('unMute'); this.cmd('playVideo'); notify();
    }
    if (SET.admute !== false && !this.pre && this.wantPlay && this.st === 1 && !document.hidden && !this.adMuted && this.tChange && now - this.tChange > 2500) {
      this.adMuted = true; this.cmd('mute'); notify();
    }
    if (this.adMuted && (this.st !== 1 || !this.wantPlay)) { this.adMuted = false; this.cmd('unMute'); notify(); }
  },
  _error(){
    if (this.ci < this.cands.length - 1) { this.ci++; this._loadCur(); return; }
    this.pre = null;
    toast('재생 가능한 영상을 찾지 못했어요');
    if (Drive.started) setTimeout(() => Drive.next(), 1500);
  },
  _state(s){
    if (s === this.st) return;
    this.st = s;
    if (s === 1) { Drive.needTap = false; this.tChange = Date.now(); }
    if (s === 0) { const p = this.piece; this.wantPlay = false; this.pre = null; if (p) markListened(p.id); if (Drive.started) setTimeout(() => Drive.next(), 300); }
    notify();
  },
  mute(){ this.cmd('mute'); },
  play(){
    if (!this.frame) return;
    this.wantPlay = true;
    const pr = this.pre;
    if (pr && pr.phase === 'run') {
      // 아직 광고 중(또는 로딩 중): 소리 끈 채로 계속 두고, 본 영상이 시작되면 자동으로 소리를 켭니다
      pr.waitAd = true; pr.waitSince = Date.now();
      this.cmd('playVideo');
      notify();
      return;
    }
    this.pre = null;
    this.cmd('unMute'); this.cmd('playVideo');
    clearTimeout(this.watch);
    this.watch = setTimeout(() => {
      if (this.wantPlay && this.st !== 1 && this.st !== 3) { Drive.needTap = true; notify(); }
    }, 3500);
  },
  pause(){ this.wantPlay = false; if (this.pre) { this.pre = null; this.cmd('unMute'); } this.cmd('pauseVideo'); },
  seek(t){ this.cmd('seekTo', [Math.max(0, t), true]); this.cur = t; },
  state(){ return this.st; },
  isPlaying(){ return this.st === 1 && !this.pre; },
  currentId(){ return this.cands[this.ci]; }
};
setInterval(() => Player._tick(), 1000);
window.addEventListener('message', e => Player._msg(e));

/* ---------- 하단 플레이어(독) ---------- */
function setDockInfo(p){
  const c = COMP[p.c];
  document.getElementById('dockTitle').textContent = p.t;
  document.getElementById('dockSub').textContent = c.name + ' · ' + p.alias;
}
function showDock(){
  dock.classList.remove('hidden');
  document.body.classList.add('docked');
}
function playPiece(p){
  showDock();
  dock.classList.remove('min'); document.body.classList.remove('dock-min');
  document.getElementById('dockMin').textContent = '–';
  if (Narrator.busy() && !Drive.active) Narrator.stop();
  // 광고 소리 끄기: 소리 없이 시작해 두었다가 본 영상이 나오면 소리를 켭니다
  const go = () => { if (SET.admute !== false) { if (Player.preroll(p)) Player.play(); } else Player.load(p, true); };
  if (Player.ready) go();
  else { setDockInfo(p); Player.ensure().then(go); }
}
document.getElementById('dockClose').onclick = () => {
  Player.pause(); Narrator.stop(); Player.piece = null;
  dock.classList.add('hidden'); document.body.classList.remove('docked','dock-min'); notify();
};
document.getElementById('dockMin').onclick = e => {
  const m = dock.classList.toggle('min');
  e.target.textContent = m ? '▢' : '–';
  document.body.classList.toggle('dock-min', m);
};
document.getElementById('dockNarr').onclick = () => {
  const p = Player.piece; if (!p) return;
  if (Narrator.busy()) { Narrator.stop(); notify(); return; }
  const resume = Player.isPlaying(); if (resume) Player.pause();
  Narrator.say(pieceClips(p, SET.len, ''), () => { if (resume) Player.play(); }, 'dock');
};

/* ---------- 상태 갱신 ---------- */
function notify(){
  const db = document.getElementById('dockNarr'); if (db) db.textContent = Narrator.busy() ? '⏹' : '🔊';
  document.querySelectorAll('[data-narr]').forEach(b => {
    const on = Narrator.busy() && Narrator.owner === b.dataset.narr;
    b.classList.toggle('on', on);
    b.textContent = on ? '⏹ 해설 멈추기' : (b.dataset.label || '🔊 해설 듣기');
  });
  if (Drive.active) { Drive.render(); mediaState(); }
}

/* ---------- 라우팅 (앱에서는 휴대폰 뒤로가기 버튼과 연동) ---------- */
const NAV = APP_MODE && !!(window.history && history.pushState);
const DETAIL = ['piece', 'composer'];
let exitArmed = false;
window.go = function(v, id, opts){
  const tab = opts && opts.tab;
  if (NAV) {
    const st = { v, id: id || null };
    if (tab && route.v !== 'home') history.replaceState(st, '');
    else history.pushState(st, '');
  } else if (!tab) {
    stack.push(route);
  } else {
    stack = [];
  }
  route = { v, id };
  render();
  window.scrollTo(0,0);
};
window.back = function(){
  if (NAV) { history.back(); return; }
  route = stack.pop() || { v:'home' }; render(); window.scrollTo(0,0);
};
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.v === route.v) { window.scrollTo(0,0); return; }
  if (NAV && b.dataset.v === 'home') { history.replaceState({ v:'home', id:null }, ''); route = { v:'home' }; render(); window.scrollTo(0,0); return; }
  go(b.dataset.v, null, { tab:true });
});
if (NAV) {
  history.replaceState({ root: true }, '');
  history.pushState({ v: 'home', id: null }, '');
  window.addEventListener('popstate', e => {
    const s = e.state || {};
    if (Drive.active && !s.drive) Drive.close(true);
    if (s.drive && Drive.active) { Drive.fromState(s.drive, s.d); return; }
    if (s.root) {
      if (exitArmed) { history.back(); return; }
      exitArmed = true;
      toast('뒤로 버튼을 한 번 더 누르면 종료됩니다');
      setTimeout(() => { exitArmed = false; }, 2200);
      history.pushState({ v: 'home', id: null }, '');
      if (route.v !== 'home') { route = { v: 'home' }; render(); }
      return;
    }
    if (s.drive) return;
    if (s.v && (s.v !== route.v || s.id !== (route.id || null))) { route = { v: s.v, id: s.id }; render(); window.scrollTo(0,0); }
  });
}

function render(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on',
    b.dataset.v === route.v || (route.v==='composer' && b.dataset.v==='composers') || (route.v==='piece' && b.dataset.v==='library')));
  const fn = { home:vHome, eras:vEras, composers:vComposers, composer:vComposer, library:vLibrary, piece:vPiece, me:vMe }[route.v] || vHome;
  view.innerHTML = fn(route.id);
  if (route.v === 'piece') bindPiece(route.id);
  if (route.v === 'library') bindLibrary();
  if (route.v === 'composer') bindComposer(route.id);
  notify();
}
const backBtn = () => (NAV ? DETAIL.includes(route.v) : stack.length) ? '<button class="back" onclick="back()">← 뒤로</button>' : '';

/* ---------- 드라이브 모드 ---------- */
function fmtT(t){ t = Math.max(0, Math.floor(t || 0)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), x = String(t % 60).padStart(2, '0'); return h ? h + ':' + String(m).padStart(2, '0') + ':' + x : m + ':' + x; }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/* ---------- 전체화면 · 화면 회전 ---------- */
const FS = {
  ok(){ return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  on(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  async enter(){
    try {
      const el = document.documentElement;
      if (!this.on()) await (el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen && el.webkitRequestFullscreen());
    } catch(e){}
    await this.applyOrient(false);
  },
  // 전체화면일 때만 화면 방향을 바꿀 수 있어요(안드로이드). '자동'은 기기 회전을 따라갑니다.
  async applyOrient(user){
    const o = SET.orient || 'any';
    try {
      if (!this.on()) { if (!user) return; await this.enter(); return; }
      await screen.orientation.lock(o);
    } catch(e){
      try { if (o === 'any') screen.orientation.unlock(); } catch(e2){}
      if (user) toast('이 기기에서는 화면 방향을 바꿀 수 없어요');
    }
  },
  async exit(){ try { if (this.on()) await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen()); } catch(e){} }
};

function mediaMeta(p){
  if (!('mediaSession' in navigator) || !p) return;
  try { navigator.mediaSession.metadata = new MediaMetadata({ title: p.t, artist: COMP[p.c].full, album: '클래식 산책', artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }] }); } catch(e){}
}
/* ---------- 차량 핸들 버튼(블루투스 이전/다음 곡) ----------
   휴대폰은 '지금 소리를 내고 있는 화면'에 버튼 신호를 보냅니다. 음악은 유튜브 영상(별도 화면) 안에서 나오므로,
   드라이브 모드 동안 우리 앱도 들리지 않는 무음을 계속 재생해 버튼 신호를 우리 앱이 받도록 합니다.
   (5초보다 짧은 소리는 휴대폰이 '효과음'으로 보고 무시하므로 10초짜리 무음을 반복) */
const Keep = {
  a: null, url: null,
  on(){
    try {
      if (!this.a) { this.url = silentWav(10); this.a = new Audio(this.url); this.a.loop = true; this.a.preload = 'auto'; }
      if (this.a.paused) { const p = this.a.play(); p && p.catch(() => {}); }
    } catch(e){}
  },
  off(){ try { this.a && this.a.pause(); } catch(e){} }
};
function mediaState(){
  if (!('mediaSession' in navigator)) return;
  try { navigator.mediaSession.playbackState = (Narrator.speaking || Player.wantPlay) ? 'playing' : 'paused'; } catch(e){}
}
try {
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    ms.setActionHandler('play', () => { if (Drive.started) { if (Narrator.paused) Narrator.resume(); else Player.play(); Drive.render(); } });
    ms.setActionHandler('pause', () => { if (Drive.started) { if (Narrator.speaking) Narrator.pause(); else Player.pause(); Drive.render(); } });
    ms.setActionHandler('nexttrack', () => Drive.next());
    ms.setActionHandler('previoustrack', () => Drive.prev());
  }
} catch(e){}

// 유튜브는 휴대폰에서 화면을 벗어나면 재생을 멈춥니다(유튜브 정책). 잠시 다시 재생을 시도하고,
// 돌아오면 멈췄던 곳부터 자동으로 이어서 재생합니다.
document.addEventListener('visibilitychange', () => {

});

const Drive = {
  active: false, started: false, list: [], i: 0, label: '', needTap: false, lock: null,
  mode: 'lists', pick: null, queue: false, depth: 0, key: '',
  lists(){ return driveSections().flatMap(s => s.items); },
  find(k){ return this.lists().find(x => x.k === k); },
  // 뒤로가기 버튼과 화면 단계를 맞추기 위한 기록
  push(mode){ this.depth++; if (NAV) history.pushState({ drive: mode, d: this.depth }, ''); },
  pop(){
    if (NAV) { history.back(); return; }
    if (this.queue) this.fromState('play');
    else if (this.mode === 'play') this.fromState(this.pick ? 'pick' : 'lists');
    else this.fromState('lists');
  },
  fromState(m, d){
    if (typeof d === 'number') this.depth = d;
    if (m === 'lists') { this.stopPlay(); this.mode = 'lists'; this.pick = null; this.queue = false; }
    else if (m === 'pick') { this.stopPlay(); this.mode = 'pick'; this.queue = false; }
    else if (m === 'play') { this.queue = false; if (!this.started) { this.mode = this.pick ? 'pick' : 'lists'; } }
    this.render();
  },
  stopPlay(){ if (this.started) { this.save(); Narrator.stop(); Player.pause(); } this.started = false; },
  open(){
    if (Narrator.busy()) Narrator.stop();
    this.active = true; this.mode = 'lists'; this.pick = null; this.queue = false; this.depth = 0;
    if (SET.fs !== false) FS.enter();
    this.push('lists');
    document.body.classList.add('drive');
    dock.classList.remove('hidden','min');
    this.render();
    Player.ensure().then(() => this.render());
    this.wake();
  },
  close(fromPop){
    if (NAV && !fromPop && this.depth > 0) { history.go(-this.depth); return; }
    if (this.started) this.save();
    Narrator.stop(); Keep.off();
    this.active = false; this.started = false; this.needTap = false; this.mode = 'lists'; this.pick = null; this.queue = false; this.depth = 0;
    document.body.classList.remove('drive','dv-playing','dv-queue');
    if (Player.piece) { showDock(); setDockInfo(Player.piece); }
    else { dock.classList.add('hidden'); document.body.classList.remove('docked'); }
    try { this.lock && this.lock.release(); } catch(e){}
    this.lock = null;
    FS.exit();
    render();
  },
  async wake(){
    try { if ('wakeLock' in navigator) this.lock = await navigator.wakeLock.request('screen'); } catch(e){}
  },
  choose(k){
    const L = this.find(k); if (!L || !L.ids.length) return;
    if (L.random) return this.start(k, 0);
    this.pick = { k, label: L.label, ids: L.ids };
    this.mode = 'pick'; this.push('pick');
    this.render();
    const el = document.getElementById('drive'); if (el) el.scrollTop = 0;
  },
  start(k, idx){
    if (!Player.ready) return;
    let ids, label, key = k;
    if (k === '__pick' && this.pick) { ids = this.pick.ids; label = this.pick.label; key = this.pick.k; }
    else { const L = this.find(k); if (!L) return; ids = L.random ? shuffle(L.ids) : L.ids; label = L.label; }
    this._begin(ids, label, key, idx || 0, 0);
  },
  _begin(ids, label, key, idx, at){
    this.list = ids; this.label = label; this.key = key; this.i = Math.max(0, Math.min(idx, ids.length - 1));
    this.started = true; this.mode = 'play'; this.queue = false;
    document.body.classList.add('dv-playing');
    this.push('play');
    Narrator.unlock(); Keep.on();
    this.step(true, at);
  },
  // 지난번 듣던 곳 (목록 · 몇 번째 곡 · 몇 초)
  saved(){
    const r = LS.get('drive', null);
    if (!r || !Array.isArray(r.list)) return null;
    const ids = r.list.filter(id => PIECE[id]); if (!ids.length) return null;
    return Object.assign({}, r, { list: ids, i: Math.max(0, Math.min(r.i || 0, ids.length - 1)) });
  },
  save(t){
    if (!this.started || !this.list.length) return;
    const p = Player.piece, cur = this.list[this.i];
    if (t === undefined) t = (p && p.id === cur && !Player.pre) ? Player.cur : 0;
    LS.set('drive', { k: this.key, label: this.label, list: this.list, i: this.i, t: Math.floor(t || 0), ts: Date.now() });
  },
  resume(){
    const r = this.saved(); if (!r || !Player.ready) return;
    this._begin(r.list, r.label, r.k, r.i, r.t > 5 ? Math.max(0, r.t - 3) : 0);
  },
  openQueue(){ if (!this.started) return; this.queue = true; this.push('queue'); this.render(); const q = document.querySelector('.dv-q .cur'); if (q) q.scrollIntoView({ block: 'center' }); },
  closeQueue(){ if (!this.queue) return; this.pop(); },
  jump(idx){
    if (!this.started) return;
    this.i = idx; this.queue = false;
    this.step(false);
    if (NAV) history.back();
  },
  step(first, at){
    const p = PIECE[this.list[this.i]];
    Narrator.stop(); this.needTap = false;
    at = at || 0;
    this.save(at);
    // 해설이 나오는 동안 영상을 소리 없이 미리 틀어 광고를 지나가게 해 둡니다 (Player.preroll 참고)
    const narr = SET.narr && !at;
    if (narr || SET.admute !== false) Player.preroll(p, at); else Player.load(p, true, at);
    mediaMeta(p);
    if (narr) {
      Narrator.say(pieceClips(p, SET.len, first ? 'start' : 'next'), () => Player.play(), 'drive');
    } else {
      Player.play();
      if (at) toast('지난번 듣던 곳부터 이어서 재생해요');
      else if (first && SET.narr === false) Narrator.speak([clean(COMP[p.c].full + '의 ' + p.t + '입니다.')], null, 'drive');
    }
    const np = PIECE[this.list[this.i + 1]];
    if (SET.narr && np && hasAI(np)) setTimeout(() => Clips.prefetch(pieceClips(np, SET.len, 'next').map(c => c.k)), 4000);
    this.render();
  },
  next(){
    if (!this.started) return;
    if (this.i < this.list.length - 1) { this.i++; this.step(false); }
    else { Player.pause(); LS.set('drive', null); const lp = PIECE[this.list[this.i]], v = voiceOf(lp.c); Narrator.say(hasAI(lp) ? [{ k: 'g_' + v + '_done', t: NARR.g.done }] : [{ t: '선택하신 목록을 모두 들었어요. 오늘도 좋은 음악과 함께해 주셔서 감사합니다.' }], null, 'drive'); this.render(); }
  },
  prev(){ if (!this.started) return; if (this.i > 0) this.i--; this.step(false); },
  toggle(){
    Keep.on();
    if (Narrator.speaking) Narrator.pause();
    else if (Narrator.paused) Narrator.resume();
    else if (Player.isPlaying()) Player.pause();
    else { Player.play(); }
    this.needTap = false;
    this.render();
  },
  replay(){
    const p = PIECE[this.list[this.i]]; if (!p) return;
    Player.pause();
    Narrator.say(pieceClips(p, SET.len, ''), () => Player.play(), 'drive');
  },
  skipNarr(){ if (Narrator.busy()) { Narrator.stop(); Player.play(); this.render(); } },
  toggleNarr(){ SET.narr = !SET.narr; saveSet(); if (!SET.narr && Narrator.busy()) { Narrator.stop(); Player.play(); } this.render(); },
  cycleLen(){ const o = ['short','mid','long']; SET.len = o[(o.indexOf(SET.len) + 1) % 3]; saveSet(); this.render(); },
  toggleFS(){ const on = FS.on(); SET.fs = !on; saveSet(); (on ? FS.exit() : FS.enter()).then(() => this.render()); },
  cycleOrient(){ const o = ['any','landscape','portrait']; SET.orient = o[(o.indexOf(SET.orient || 'any') + 1) % 3]; saveSet(); FS.applyOrient(true).then(() => this.render()); },
  toggleAI(){ SET.ai = !SET.ai; saveSet(); this.render(); },
  toggleAd(){ SET.admute = SET.admute === false; saveSet(); if (SET.admute === false && Player.adMuted) { Player.adMuted = false; Player.cmd('unMute'); } this.render(); },
  toggleGap(){ SET.navgap = SET.navgap === false; saveSet(); this.render(); },
  seekAt(e){
    const bar = e.currentTarget.querySelector('.bar'); if (!bar || !Player.dur || Player.pre) return;
    const r = bar.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    Player.seek(f * Player.dur); this.prog();
  },
  // 진행 막대만 가볍게 갱신 (화면 전체를 다시 그리지 않음)
  prog(){
    const b = document.getElementById('dvBar'), t = document.getElementById('dvTime'); if (!b || !t) return;
    const d = Player.dur, c = Player.piece && Player.piece.id === this.list[this.i] ? Math.min(Player.cur, d || Player.cur) : 0;
    b.style.width = d ? (c / d * 100).toFixed(1) + '%' : '0%';
    t.textContent = fmtT(c) + ' / ' + (d ? fmtT(d) : '--:--');
  },
  cycleRate(){ const o = [0.9, 1, 1.15]; SET.rate = o[(o.indexOf(SET.rate) + 1) % 3] || 1; saveSet(); this.render(); },
  backToLists(){ if (this.started) this.pop(); },
  status(){
    if (Narrator.loading) return ['⏳ 해설 불러오는 중', 'idle'];
    if (Narrator.speaking) return [Narrator.mode === 'tts' && SET.ai ? '🔊 해설 중 · 기기 음성' : '🔊 해설 중', ''];
    if (Player.adWaiting()) return ['📺 광고 중 · 소리 끔', 'ad'];
    if (Player.adMuted) return ['🔇 광고 소리 끔', 'ad'];
    if (Narrator.paused) return ['⏸ 해설 일시정지', 'idle'];
    const st = Player.state();
    if (st === 1) return ['▶ 음악 재생 중', 'play'];
    if (st === 3) return ['⏳ 불러오는 중', 'idle'];
    if (this.needTap) return ['👆 가운데 버튼을 눌러 재생', ''];
    return ['⏸ 일시정지', 'idle'];
  },
  topBar(title, back, stat){
    const fsBtn = FS.ok() ? `<button class="dv-ic" onclick="Drive.toggleFS()" aria-label="전체화면">${FS.on() ? '⤡' : '⛶'}</button>` : '';
    const rot = FS.ok() ? `<button class="dv-ic" onclick="Drive.cycleOrient()" aria-label="화면 방향">${{ any: '🔄', landscape: '↔️', portrait: '↕️' }[SET.orient || 'any']}</button>` : '';
    return `<div class="dv-top">${back ? `<button class="dv-back" onclick="${back}" aria-label="뒤로">←</button>` : ''}<b>${title}</b>${stat || ''}<div class="dv-topbtns">${rot}${fsBtn}<button class="dv-exit" onclick="Drive.close()">나가기</button></div></div>`;
  },
  render(){
    const el = document.getElementById('drive'); if (!el || !this.active) return;
    document.body.classList.toggle('dv-playing', this.mode === 'play' && this.started);
    document.body.classList.toggle('dv-queue', this.mode === 'play' && this.started && this.queue);
    document.body.classList.toggle('dv-gap', SET.navgap !== false);
    const sets = `<div class="dv-sets">
        <button class="dv-set" onclick="Drive.toggleNarr()"><small>해설</small>${SET.narr ? '켜짐' : '꺼짐'}</button>
        <button class="dv-set" onclick="Drive.cycleLen()"><small>해설 길이</small>${LEN_LABEL[SET.len]}</button>
        <button class="dv-set" onclick="Drive.cycleRate()"><small>읽기 속도</small>${RATE_LABEL[SET.rate] || '보통'}</button>
        <button class="dv-set" onclick="Drive.toggleAI()"><small>해설 목소리</small>${SET.ai ? 'AI 성우' : '기기 기본'}</button>
        <button class="dv-set" onclick="Drive.toggleAd()"><small>광고 소리</small>${SET.admute !== false ? '자동으로 끄기' : '그대로'}</button>
        <button class="dv-set" onclick="Drive.toggleGap()"><small>가로 화면 오른쪽 위</small>${SET.navgap !== false ? '내비용으로 비우기' : '비우지 않기'}</button>
      </div>`;
    if (this.mode === 'lists' || (!this.started && this.mode !== 'pick')) {
      const r = this.saved(), rp = r && PIECE[r.list[r.i]];
      const resume = rp ? `<button class="dv-resume" ${Player.ready ? '' : 'disabled'} onclick="Drive.resume()"><small>지난번에 듣던 곳에서 이어 듣기</small><b>▶ ${esc(rp.t)}</b><span>${esc(r.label)} · ${r.i + 1}/${r.list.length}번째 곡${r.t > 5 ? ' · ' + fmtT(r.t) + '부터' : ''}</span></button>` : '';
      el.innerHTML = `${this.topBar('🚗 드라이브 모드')}
        ${resume}
        <p class="dv-note">${Player.ready ? '들을 코스를 고르면 곡 목록이 나와요. 원하는 곡부터 시작할 수 있어요.' : '플레이어 준비 중…'}</p>
        ${driveSections().map(s => `<h4 class="dv-head">${esc(s.head)}</h4><div class="dv-lists">${s.items.map(l => `<button class="dv-list ${l.primary ? 'primary' : ''} ${l.like ? 'like' : ''}" ${l.ids.length ? '' : 'disabled'} onclick="Drive.choose('${l.k}')"><b>${esc(l.label)}</b><small>${esc(l.sub)}</small></button>`).join('')}</div>`).join('')}
        <h4 class="dv-head">설정</h4>${sets}
        <p class="dv-note">⚠️ 운전 중에는 화면 조작을 최소화하세요. 출발 전에 코스를 골라 두고, 화면은 거치대에 켜둔 채 사용하세요.</p>`;
      return;
    }
    if (this.mode === 'pick' && this.pick) {
      const ids = this.pick.ids;
      el.innerHTML = `${this.topBar(esc(this.pick.label), 'Drive.pop()')}
        <button class="dv-startall" ${Player.ready ? '' : 'disabled'} onclick="Drive.start('__pick', 0)">▶ 처음부터 전부 듣기 <small>${ids.length}곡</small></button>
        <p class="dv-note">곡을 누르면 그 곡부터 이어서 들어요.</p>
        <div class="dv-q">${ids.map((id, n) => { const p = PIECE[id]; return `<button class="dv-qi" ${Player.ready ? '' : 'disabled'} onclick="Drive.start('__pick', ${n})"><span class="n">${S.listened[id] ? '✓' : n + 1}</span><span class="t"><b>${isLiked(id) ? '❤️ ' : ''}${esc(p.t)}</b><small>${esc(COMP[p.c].name)} · ${esc(p.dur)}</small></span><span class="go">▶</span></button>`; }).join('')}</div>`;
      return;
    }
    const p = PIECE[this.list[this.i]], c = COMP[p.c];
    if (this.queue) {
      el.innerHTML = `${this.topBar('곡 목록 · ' + (this.i + 1) + '/' + this.list.length, 'Drive.closeQueue()')}
        <div class="dv-side dv-qwrap"><div class="dv-q">${this.list.map((id, n) => { const q = PIECE[id]; return `<button class="dv-qi ${n === this.i ? 'cur' : ''}" onclick="Drive.jump(${n})"><span class="n">${n === this.i ? '♪' : (S.listened[id] ? '✓' : n + 1)}</span><span class="t"><b>${isLiked(id) ? '❤️ ' : ''}${esc(q.t)}</b><small>${esc(COMP[q.c].name)} · ${esc(q.dur)}</small></span><span class="go">▶</span></button>`; }).join('')}</div></div>`;
      return;
    }
    const [st, cls] = this.status();
    const playing = Narrator.speaking || Player.isPlaying();
    const cap = Narrator.speaking || Narrator.paused ? esc(Narrator.cur)
      : Player.adWaiting() ? '광고가 끝나면 소리를 켜고 바로 음악을 이어서 틀어요. 영상에 ‘건너뛰기’가 보이면 눌러서 넘겨도 돼요.'
      : Player.adMuted ? '중간 광고가 나와 소리를 꺼 두었어요. 음악이 다시 나오면 소리가 자동으로 켜져요.' : '';
    el.innerHTML = `${this.topBar('🚗 ' + esc(this.label), 'Drive.backToLists()', `<span class="dv-status dv-tstat ${cls}">${st}</span>`)}
      <div class="dv-side">
      <div class="dv-info">
        <div class="dv-hd">
        <div class="dv-meta"><span class="dv-status ${cls}">${st}</span><span class="dv-count">${this.i + 1} / ${this.list.length} · ${esc(ERA[c.era].name)} · ${esc(p.form)}</span></div>
        <h2 class="dv-title">${esc(p.t)}</h2>
        <div class="dv-comp">${esc(c.full)}</div>
        </div>
        <div class="dv-caption">${cap}</div>
      </div>
      <div class="dv-bottom">
        <div class="dv-prog" onclick="Drive.seekAt(event)"><div class="bar"><i id="dvBar"></i></div><span id="dvTime">0:00 / --:--</span></div>
        <div class="dv-ctrl">
          <button onclick="Drive.prev()" aria-label="이전 곡">⏮</button>
          <button class="main ${this.needTap ? 'tap' : ''}" onclick="Drive.toggle()" aria-label="재생/일시정지">${playing ? '⏸' : '▶'}</button>
          <button onclick="Drive.next()" aria-label="다음 곡">⏭</button>
        </div>
        <div class="dv-row">
          ${Narrator.busy() ? '<button onclick="Drive.skipNarr()">⏩ 건너뛰기</button>' : '<button onclick="Drive.replay()">🔁 해설 다시</button>'}
          <button class="dv-like ${isLiked(p.id) ? 'on' : ''}" onclick="toggleLike('${p.id}')" aria-label="좋아요">${isLiked(p.id) ? '❤️ 좋아요' : '♡ 좋아요'}</button>
          <button onclick="Drive.openQueue()">🎵 목록</button>
          <button onclick="Drive.toggleNarr()">해설 ${SET.narr ? '끄기' : '켜기'}</button>
        </div>
      </div>
      </div>`;
    this.prog();
  }
};
window.Drive = Drive;
let saveTick = 0;
setInterval(() => {
  if (!Drive.active || !Drive.started) return;
  if (Drive.mode === 'play' && !Drive.queue) Drive.prog();
  if (++saveTick % 10 === 0 && Player.isPlaying()) Drive.save();
}, 500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Drive.active && !Drive.lock) Drive.wake(); });

/* ---------- 휴대폰 앱 연결 ---------- */
function connectCard(){
  if (BACKEND === 'gas') {
    return `<h2 class="sec-title">📱 휴대폰 앱</h2>
    <div class="card" style="font-size:14px">
      휴대폰에서 이 사이트를 앱처럼 설치해 쓸 수 있어요. 아래 링크를 휴대폰에서 열면 기록이 자동으로 연결됩니다.
      <div class="actions" style="margin-top:12px"><button class="btn" onclick="showPhoneLink()">휴대폰 연결 링크 보기</button></div>
      <div id="phoneLink"></div>
    </div>`;
  }
  if (BACKEND === 'api') return `<h2 class="sec-title">📱 기록 연결</h2><div class="card" style="font-size:14px">✅ PC와 감상 기록이 연결되어 있어요. 어디서 듣든 같은 기록이 쌓입니다.</div>`;
  return `<h2 class="sec-title">📱 기록 연결</h2><div class="card" style="font-size:14px">지금은 이 기기에만 기록이 저장돼요. PC(또는 휴대폰 크롬)에서 클래식 산책 사이트를 열고 <b>내 기록 → 휴대폰 연결 링크 보기</b>의 링크를 이 기기에서 열면 PC와 기록이 합쳐집니다.</div>`;
}
window.showPhoneLink = function(){
  const box = document.getElementById('phoneLink'); if (!box) return;
  box.innerHTML = '<p class="muted">링크 만드는 중…</p>';
  call('getPhoneLink').then(link => {
    box.innerHTML = `<div style="margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center">
        <div id="qrBox" style="background:#fff;padding:8px;border-radius:12px;border:1px solid var(--line)"></div>
        <div style="flex:1;min-width:220px">
          <b>휴대폰 카메라로 QR을 찍거나</b>, 링크를 휴대폰으로 보내 열어주세요.<br>
          <span class="muted">열린 페이지에서 크롬 메뉴 ⋮ → <b>홈 화면에 추가 / 앱 설치</b>를 누르면 앱으로 설치됩니다. (아이폰은 사파리 공유 버튼 → 홈 화면에 추가)</span>
          <div class="actions" style="margin-top:10px"><button class="btn ghost" id="copyLink">링크 복사</button><a class="btn ghost" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none">이 기기에서 열기</a></div>
          <p class="muted" style="font-size:12px;margin-top:8px">이 링크에는 기록 연결 코드가 들어 있어요. 다른 사람에게 보내지 마세요.</p>
        </div></div>`;
    document.getElementById('copyLink').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('링크를 복사했어요'), () => prompt('아래 링크를 복사하세요', link)); };
    const s = document.createElement('script');
    s.src = 'https:/' + '/cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload = () => { try { const q = window.qrcode(0, 'M'); q.addData(link); q.make(); document.getElementById('qrBox').innerHTML = q.createSvgTag(5, 0); } catch(e){} };
    document.head.appendChild(s);
  }).catch(e => { box.innerHTML = '<p class="muted">링크를 만들지 못했어요: ' + esc(e.message || e) + '</p>'; });
};

/* ---------- 해설 목소리 설정 ---------- */
function ttsCard(){
  const n = Object.keys(NARR.p).length;
  return `<h2 class="sec-title">🎙 해설 목소리</h2>
  <div class="card" style="font-size:14px">
    ${n ? `${n}곡의 해설을 AI 성우(구글 Chirp 3 HD, 여성 4명)가 읽어요. 작곡가마다 같은 성우가 맡고, 한 번 들은 해설은 기기에 저장돼 다음부터 바로 나와요.` : 'AI 성우 해설이 아직 준비되지 않았어요.'}
    <div class="actions" style="margin-top:12px"><button class="btn ${SET.ai ? '' : 'ghost'}" onclick="setAI(true)">AI 성우</button><button class="btn ${SET.ai ? 'ghost' : ''}" onclick="setAI(false)">기기 기본 음성</button></div>
  </div>`;
}
window.setAI = function(on){ SET.ai = on; saveSet(); render(); };

/* ---------- 앱 설치 안내 ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (route.v === 'home') render(); });
window.installApp = function(){ if (!installEvt) return; installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); };
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;

/* ---------- 내 기록 ---------- */
function vMe(){
  const ids = Object.keys(S.listened).filter(id => PIECE[id]).sort((a,b) => S.listened[b].localeCompare(S.listened[a]));
  const noteIds = Object.keys(S.notes).filter(id => PIECE[id]);
  const byEra = DATA.eras.map(e => {
    const ps = DATA.pieces.filter(p => COMP[p.c].era === e.id);
    return { e, n: doneCount(ps.map(p=>p.id)), t: ps.length };
  });
  return `<h1 class="serif" style="margin:0 0 14px">내 기록</h1>
  <div class="grid g3">
    <div class="card"><div class="muted">감상한 곡</div><b class="serif" style="font-size:30px">${ids.length}</b><span class="muted"> / ${DATA.pieces.length}</span></div>
    <div class="card"><div class="muted">좋아요</div><b class="serif" style="font-size:30px">${likedIds().length}</b></div>
    <div class="card"><div class="muted">만난 작곡가</div><b class="serif" style="font-size:30px">${new Set(ids.map(id=>PIECE[id].c)).size}</b><span class="muted"> / ${DATA.composers.length}</span></div>
  </div>

  <h2 class="sec-title">시대별 진행</h2>
  <div class="card">${byEra.map(x => `
    <div style="margin:8px 0"><span class="era-dot" style="background:${x.e.color}"></span>${esc(x.e.name)} <span class="muted">${x.n}/${x.t}</span>
    <div style="background:#eee5d7;border-radius:6px;height:7px;margin-top:4px"><div style="width:${x.t?x.n/x.t*100:0}%;height:100%;background:${x.e.color};border-radius:6px"></div></div></div>`).join('')}
  </div>

  ${noteIds.length ? `<h2 class="sec-title">감상 메모</h2>
  <div class="grid g2">${noteIds.map(id => `<div class="card" style="cursor:pointer" onclick="go('piece','${id}')">
    <b>${esc(PIECE[id].t)}</b> <small class="muted">${esc(COMP[PIECE[id].c].name)}</small>
    <p style="margin:8px 0 0;white-space:pre-wrap;font-size:14px">${esc(S.notes[id].slice(0,160))}${S.notes[id].length>160?'…':''}</p></div>`).join('')}</div>` : ''}

  <h2 class="sec-title">❤️ 좋아요한 곡</h2>
  ${likedIds().length ? `<button class="btn" style="margin-bottom:10px" onclick="Drive.open();Drive.choose('liked')">🚗 좋아요한 곡 드라이브 모드로 듣기</button>
  <div class="plist">${likedIds().map(id => pieceRow(PIECE[id])).join('')}</div>` : '<p class="muted">음악을 듣다가 마음에 들면 곡 화면이나 드라이브 모드에서 ♡ 좋아요를 눌러 보세요. 여기에 모아 둘게요.</p>'}

  <h2 class="sec-title">들은 곡</h2>
  ${ids.length ? `<div class="plist">${ids.map(id => pieceRow(PIECE[id])).join('')}</div>` : '<p class="muted">아직 기록이 없어요. 입문 코스 1주차부터 시작해 보세요.</p>'}

  ${connectCard()}

  ${ttsCard()}

  <h2 class="sec-title">재생 · 해설 설정</h2>
  <div class="card" style="font-size:14px">
    곡마다 기본 연주 영상이 연결되어 있고, 재생이 안 되는 영상은 자동으로 다음 후보로 넘어갑니다. 곡 화면의 “다른 연주로 바꾸기”로 원하는 연주를 지정할 수 있어요.<br>
    직접 지정한 영상: ${Object.keys(S.videos).length}곡<br>
    해설 음성: ${Narrator.ok ? (Narrator.voice ? esc(Narrator.voice.name) : '한국어 음성을 찾는 중 (기기 설정의 텍스트 음성 변환에서 한국어를 설치하면 더 자연스러워요)') : '이 브라우저는 음성 읽기를 지원하지 않아요'}
  </div>`;
}

/* ---------- 시작 ---------- */
if (APP_MODE && 'serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
window.__cw = { pieceClips, composerClips, Narrator, Mock, PIECE, Clips, Player };
view.innerHTML = '<p class="muted" style="text-align:center;padding:60px 0">불러오는 중…</p>';
call('getState').then(st => { Object.assign(S, st); render(); })
  .catch(e => { toast('기록을 불러오지 못했어요'); render(); });
})();
</script>

</body>
</html>
