이름으로 펴냈어요. 백조는 죽기 직전에 가장 아름답게 노래한다는 전설에서 온 제목이에요. 이 세레나데는 밤에 연인의 창가에서 부르는 사랑 노래로, 노래로도, 악기 편곡으로도 사랑받아요.","b":"들으실 때는 피아노의 기타 같은 반주, 밤에 창가에서 튕기는 류트 소리를 상상해 보세요. 노래가 끝날 때마다 피아노가 메아리처럼 따라 불러요. 단조와 장조를 오가는 애틋함도 느껴 보세요."},"schubert-ave":{"c":"schubert","a":"슈베르트의 아베 마리아예요. 원래는 월터 스콧의 서사시 호수의 여인을 독일어로 옮긴 시에 붙인 가곡으로, 주인공 엘렌이 성모 마리아에게 기도하는 장면이에요. 첫 마디가 아베 마리아라서 나중에 라틴어 기도문을 붙여 부르게 됐고, 지금은 결혼식과 장례식의 단골 곡이 됐어요.","b":"들으실 때는 피아노의 하프 같은 분산화음을 느껴 보세요. 그 위로 길게 숨을 쉬며 이어지는 기도 선율이 흘러요. 같은 선율이 세 번 되풀이되는 소박한 구조랍니다."},"schubert-lindenbaum":{"c":"schubert","a":"슈베르트의 보리수예요. 실연한 청년이 한겨울에 정처 없이 떠도는 이야기를 담은 가곡집, 겨울 나그네의 다섯 번째 곡이에요. 슈베르트가 친구들에게 이 가곡집을 처음 들려줬을 때 다들 너무 어둡다며 당황했는데, 그는 언젠가 여러분도 좋아하게 될 거라고 말했대요. 그리고 이듬해 세상을 떠났죠.","b":"들으실 때는 피아노가 나뭇잎을 스치는 바람 소리를 그린다는 걸 느껴 보세요. 따뜻한 장조의 추억과 차가운 단조의 현실이 엇갈려요. 여기서 쉬어 가라는 나무의 속삭임과, 그래도 떠나는 나그네를 그려 보세요."},"schubert-great":{"c":"schubert","a":"슈베르트의 교향곡 9번, 그레이트예요. 슈베르트가 살아 있을 때는 연주되지 못한 교향곡이에요. 그가 세상을 떠나고 십 년 뒤, 슈만이 빈의 슈베르트 형 집에서 악보 더미 속에 묻혀 있던 이 곡을 발견했어요. 1839년 멘델스존의 지휘로 초연됐고, 슈만은 이 곡의 길이를 천상의 길이라고 표현했죠.","b":"들으실 때는 1악장 시작에서 호른 두 대가 조용히 부르는 주제를 기억해 두세요. 같은 리듬이 끝없이 되풀이되며 거대한 흐름을 만들어요. 4악장은 숨 쉴 틈 없이 달려가는 피날레랍니다."},"schubert-moment":{"c":"schubert","a":"슈베르트의 악흥의 순간 3번이에요. 악흥의 순간은 여섯 곡으로 된 짧은 피아노 소품집인데, 3번은 그중 가장 유명해요. 러시아 춤곡 같은 분위기라, 출판 때 러시아의 노래라는 제목이 붙기도 했어요. 집에서 친구들과 연주하며 즐기던 그 시절 빈의 음악 문화를 보여 주는 곡이에요.","b":"들으실 때는 왼손의 일정하게 톡톡 끊어지는 반주를 느껴 보세요. 오른손은 장난스러우면서도 쓸쓸한 선율을 불러요. 이 분 남짓한 짧은 곡 안에서 단조와 장조가 엇갈린답니다."},"schubert-trio2":{"c":"schubert","a":"슈베르트의 피아노 삼중주 2번이에요. 슈베르트가 살아 있을 때 출판된 몇 안 되는 큰 실내악곡이에요. 2악장의 첼로 선율은 스웨덴 민요에서 영감을 받았다고 알려져 있어요. 영화 배리 린든에 이 2악장이 쓰이면서 널리 알려졌답니다.","b":"들으실 때는 2악장에서 피아노의 행진하는 반주 위로 첼로가 부르는 쓸쓸한 노래를 느껴 보세요. 바이올린이 선율을 이어받으며 감정이 쌓여 가요. 그리고 4악장에서 그 2악장 선율이 다시 돌아오는 순간을 기다려 보세요."},"mendelssohn-wedding":{"c":"mendelssohn","a":"멘델스존의 결혼 행진곡이에요. 셰익스피어의 희곡 한여름 밤의 꿈 공연을 위해 쓴 음악 가운데 한 곡이에요. 극 속 세 쌍의 결혼식 장면에서 연주되죠. 1858년 영국 빅토리아 여왕의 딸이 결혼식 퇴장곡으로 쓰면서, 전 세계 결혼식의 대표곡이 됐어요. 입장곡은 보통 바그너의 혼례의 합창이랍니다.","b":"들으실 때는 시작의 트럼펫 팡파르를 느껴 보세요. 이어서 당당한 행진 주제가 나오고요. 중간에는 부드럽고 우아한 선율이 흘러요."},"mendelssohn-midsummer":{"c":"mendelssohn","a":"멘델스존의 한여름 밤의 꿈 서곡이에요. 열일곱 살의 멘델스존이 누나 파니와 셰익스피어를 읽고 쓴 곡이에요. 십칠 년 뒤 같은 극을 위한 음악을 쓸 때도 이 서곡을 그대로 썼대요. 요정의 숲, 연인들, 서툰 직공들, 당나귀 머리가 된 보텀까지 극의 장면이 모두 담겨 있어요.","b":"들으실 때는 시작에서 관악기가 연주하는 네 개의 마법 같은 화음에 귀 기울여 보세요. 바이올린의 아주 작고 빠른 음들은 날아다니는 요정들이에요. 당나귀 울음소리를 흉내 내는 관악기도 찾아보세요."},"mendelssohn-vc":{"c":"mendelssohn","a":"멘델스존의 바이올린 협주곡 마단조예요. 절친한 바이올리니스트 페르디난트 다비트를 위해 육 년 넘게 고민하며 쓴 곡이에요. 베토벤, 브람스, 차이콥스키와 함께 사대 바이올린 협주곡으로 꼽히죠. 오케스트라 서주 없이 바이올린이 곧바로 주제를 부르며 시작하고, 세 악장이 쉬지 않고 이어지는 등 새로운 시도가 많아요.","b":"들으실 때는 시작하자마자 바이올린이 부르는 애절한 주제를 느껴 보세요. 1악장에서 바이올린 혼자 연주하는 부분이 끝나고 오케스트라가 주제를 다시 받는 순간도 멋져요. 3악장은 요정처럼 가볍고 빠르게 달려요."},"mendelssohn-italian":{"c":"mendelssohn","a":"멘델스존의 교향곡 4번, 이탈리아예요. 이십 대 초반 이탈리아를 여행하며 받은 인상을 담은 교향곡이에요. 멘델스존은 편지에 지금까지 쓴 곡 가운데 가장 즐거운 곡이라고 적었죠. 그런데 정작 본인은 끝까지 만족하지 못해서, 살아 있을 때 출판하지 않았대요.","b":"들으실 때는 1악장에서 햇살 같은 바이올린의 첫 주제를 느껴 보세요. 2악장은 순례자 행렬 같은 느린 걸음이에요. 4악장에서는 이탈리아 춤 살타렐로가 질주한답니다."},"mendelssohn-hebrides":{"c":"mendelssohn","a":"멘델스존의 핑갈의 동굴이에요. 스무 살에 스코틀랜드를 여행하다, 헤브리디스 제도의 핑갈의 동굴을 보고 쓴 서곡이에요. 동굴을 본 날 누나에게 보낸 편지에 첫 마디 선율을 적어 보냈대요. 바그너는 멘델스존을 일류 풍경화가라고 불렀죠.","b":"들으실 때는 첫 선율에서 동굴 입구에 출렁이는 파도를 떠올려 보세요. 첼로가 넓고 따뜻한 두 번째 주제를 불러요. 중간에는 폭풍이 이는 듯한 부분도 있답니다."},"mendelssohn-spring":{"c":"mendelssohn","a":"멘델스존의 봄노래예요. 멘델스존은 가사 없는 노래 같은 피아노 소품집, 무언가를 여덟 권, 마흔여덟 곡이나 남겼어요. 봄노래는 그중 가장 유명한 곡이에요. 제목은 출판하는 과정에서 붙었다고 알려져 있어요.","b":"들으실 때는 노래하는 선율과 반짝이는 장식음을 느껴 보세요. 반주는 부드럽게 통통 튀어요. 짧은 곡 안에 담긴 상쾌한 봄기운을 즐겨 보세요."},"mendelssohn-octet":{"c":"mendelssohn","a":"멘델스존의 현악 팔중주예요. 열여섯 살에 쓴 곡인데, 모차르트도 그 나이에 이만한 곡은 쓰지 못했다는 말이 나올 정도의 걸작이에요. 현악사중주 두 팀이 나란히 앉는 게 아니라, 여덟 명 모두가 교향곡처럼 하나의 큰 소리를 만들어요. 3악장은 괴테의 파우스트 속 장면에서 영감을 받았대요.","b":"들으실 때는 1악장에서 높이 솟구치는 바이올린의 첫 주제를 느껴 보세요. 3악장에서는 바람처럼 가볍게 스쳐 가는 요정의 소리가 들려요. 4악장은 첼로부터 시작하는 숨 가쁜 푸가랍니다."},"mendelssohn-scottish":{"c":"mendelssohn","a":"멘델스존의 교향곡 3번, 스코틀랜드예요. 1829년 에든버러의 오래된 궁전 폐허를 보고 첫 선율을 떠올렸지만, 완성까지 십삼 년이 걸렸어요. 안개 낀 스코틀랜드의 쓸쓸한 풍경에서 시작해, 장엄한 승리의 노래로 끝나요. 영국 빅토리아 여왕에게 바친 곡이에요.","b":"들으실 때는 1악장 서주에서 안개 낀 폐허의 쓸쓸함을 느껴 보세요. 2악장에서는 클라리넷이 스코틀랜드 민요 같은 선율을 불러요. 마지막에는 장엄한 찬가가 울려 퍼진답니다."},"mendelssohn-elijah":{"c":"mendelssohn","a":"멘델스존의 엘리야예요. 구약 성경의 예언자 엘리야 이야기를 그린 오라토리오예요. 영국 버밍엄 음악제를 위해 썼고, 초연 때 큰 성공을 거뒀어요. 헨델의 메시아와 함께 영국에서 가장 사랑받는 오라토리오가 됐고, 멘델스존이 세상을 떠나기 일 년 전에 남긴 마지막 대작이에요.","b":"들으실 때는 서곡보다 먼저 나오는 엘리야의 엄숙한 선언에 귀 기울여 보세요. 바알 신의 예언자들과 대결하는 장면의 합창도 극적이에요. 천사들이 노래하는 고요한 부분도 놓치지 마세요."},"mendelssohn-gondola":{"c":"mendelssohn","a":"멘델스존의 베네치아 곤돌라의 노래예요. 이탈리아 여행 중 베네치아의 곤돌라 사공들의 노래를 떠올리며 쓴 곡이에요. 이 제목은 멘델스존이 직접 붙였어요. 살랑살랑 흔들리는 리듬이 물 위를 떠가는 배를 그리죠.","b":"들으실 때는 왼손의 흔들리는 반주에서 출렁이는 물결을 느껴 보세요. 그 위로 단조의 쓸쓸한 노래가 흘러요. 마지막에는 멀어져 가는 배처럼 소리가 사라진답니다."},"chopin-nocturne2":{"c":"chopin","a":"쇼팽의 녹턴 2번이에요. 녹턴은 밤의 노래라는 뜻인데, 아일랜드 작곡가 존 필드가 만든 장르를 쇼팽이 완성했어요. 이 곡은 고국을 떠난 직후 이십 대 초반에 쓴, 쇼팽을 대표하는 곡이에요. 쇼팽은 오페라, 특히 벨리니의 아름다운 노래를 사랑했는데, 오른손 선율은 오페라 가수의 장식적인 노래를 피아노로 옮겨 온 것 같아요.","b":"들으실 때는 왼손의 흔들리는 왈츠풍 반주 위로 오른손이 노래하는 걸 느껴 보세요. 선율이 돌아올 때마다 장식음이 점점 화려해져요. 끝부분에서는 높은 음역에서 빠른 음들이 반짝인답니다."},"chopin-ballade1":{"c":"chopin","a":"쇼팽의 발라드 1번이에요. 문학의 서사시를 피아노로 옮긴 장르로, 쇼팽이 처음 만들었어요. 폴란드 시인 미츠키에비치의 시에서 영감을 받았다고 알려져 있죠. 2002년 영화 피아니스트에서, 폐허가 된 바르샤바에서 주인공이 독일 장교 앞에서 이 곡을 연주하는 장면으로 많은 사람의 마음에 새겨졌어요.","b":"들으실 때는 이야기를 시작하듯 느리게 질문을 던지는 도입부를 느껴 보세요. 왈츠처럼 흔들리는 첫 주제와 꿈결 같은 둘째 주제가 이어져요. 그리고 마지막, 모든 것이 무너지듯 질주하는 폭풍 같은 결말을 기다려 보세요."},"chopin-revolutionary":{"c":"chopin","a":"쇼팽의 에튀드, 혁명이에요. 에튀드는 연습곡이라는 뜻이지만, 쇼팽은 연습곡을 예술 작품으로 끌어올렸어요. 1831년 독일 슈투트가르트에 머물던 쇼팽은, 바르샤바가 러시아군에 함락됐다는 소식을 들었어요. 가족이 살아 있는지도 모른 채 절망하던 그는 일기에 분노를 쏟아 냈고, 이 곡이 그 무렵의 감정과 이어져 혁명이라는 별명을 얻었답니다.","b":"들으실 때는 왼손이 쉬지 않고 휘몰아치는 빠른 음들을 느껴 보세요. 이 곡이 왼손 연습곡인 이유예요. 그 위에서 오른손은 외치듯 선율을 불러요. 마지막에 내리꽂는 화음까지 숨죽이고 들어 보세요."},"chopin-waltz":{"c":"chopin","a":"쇼팽의 강아지 왈츠예요. 연인 조르주 상드의 강아지가 자기 꼬리를 쫓아 빙글빙글 도는 모습을 보고 썼다고 전해져요. 그래서 강아지 왈츠라는 별명이 붙었죠. 영어로는 미닛 왈츠라고 하는데, 일 분 왈츠가 아니라 작은 왈츠라는 뜻이에요. 실제로 일 분 안에 연주하는 경우는 드물답니다.","b":"들으실 때는 처음에 빙글빙글 도는 오른손, 꼬리를 쫓는 강아지를 떠올려 보세요. 가운데 부분에서는 느긋하고 우아하게 쉬어 가요. 그리고 다시 돌아오는 회전과 반짝이는 마무리를 즐겨 보세요."},"chopin-heroic":{"c":"chopin","a":"쇼팽의 폴로네즈, 영웅이에요. 폴로네즈는 폴란드 귀족들의 당당한 행진 춤곡이에요. 고국을 떠나 파리에 살던 쇼팽은 폴로네즈로 폴란드의 자존심을 표현했죠. 조르주 상드는 이 곡을 듣고 영감, 힘, 생명력이라며 감탄하는 편지를 썼다고 전해져요. 영웅이라는 별명은 나중에 붙었어요.","b":"들으실 때는 서주에서 긴장감 넘치게 올라가는 부분을 느껴 보세요. 이어서 당당하게 걸어가는 폴로네즈 주제가 나와요. 중간에는 왼손이 말발굽처럼 몰아치는 장면이 있답니다."},"chopin-pc1":{"c":"chopin","a":"쇼팽의 피아노 협주곡 1번이에요. 스무 살의 쇼팽이 바르샤바를 떠나기 직전, 고별 연주회에서 직접 초연한 곡이에요. 그 뒤로 그는 다시는 고국에 돌아가지 못했죠. 실제로는 2번보다 나중에 썼지만 먼저 출판돼서 1번이 됐어요. 2악장은 짝사랑하던 성악가를 생각하며 썼다고 편지에 적었대요.","b":"들으실 때는 1악장에서 오케스트라 서주 뒤 피아노가 등장하는 순간을 기다려 보세요. 2악장 로망스는 달빛 같은 꿈결의 노래예요. 3악장에서는 폴란드 민속춤의 경쾌한 리듬이 흘러요."},"chopin-fantaisie":{"c":"chopin","a":"쇼팽의 즉흥환상곡이에요. 쇼팽은 이 곡을 살아 있을 때 출판하지 않았고, 출판하지 않은 원고는 없애 달라는 유언까지 남겼어요. 그런데 친구 폰타나가 그가 세상을 떠난 뒤 출판했죠. 왜 감추려 했는지는 분명하지 않지만, 지금은 쇼팽의 가장 유명한 곡 가운데 하나가 됐어요.","b":"들으실 때는 처음과 끝에서 두 손이 서로 다른 리듬으로 달리는 걸 느껴 보세요. 중간에는 느리고 달콤한 노래가 나오는데, 이 선율은 나중에 미국 대중가요로도 만들어졌어요. 마지막에는 낮은 음역에서 조용히 사라진답니다."},"chopin-raindrop":{"c":"chopin","a":"쇼팽의 전주곡 15번, 빗방울이에요. 쇼팽이 조르주 상드와 지중해의 마요르카섬에 머물던 겨울, 비 내리는 수도원에서 완성한 스물네 곡의 전주곡 가운데 하나예요. 상드는 회고록에, 폭우 속에 외출했다 돌아오니 쇼팽이 빗방울 소리 같은 곡을 치며 두려움에 떨고 있었다고 썼어요. 별명은 이 이야기에서 왔답니다.","b":"들으실 때는 곡 내내 되풀이되는 한 음, 떨어지는 빗방울에 귀 기울여 보세요. 중간에는 단조로 바뀌며 빗소리가 무겁고 어두워져요. 그리고 다시 평화로운 선율이 돌아온답니다."},"chopin-funeral":{"c":"chopin","a":"쇼팽의 장송 행진곡이에요. 쇼팽은 이 행진곡을 먼저 쓰고, 이 년 뒤 다른 악장들을 붙여 피아노 소나타 2번을 완성했어요. 이 행진곡은 세계에서 가장 유명한 장례 음악이 됐죠. 1849년 쇼팽 자신의 장례식에서도 이 곡이 오케스트라로 연주됐답니다.","b":"들으실 때는 왼손의 무겁게 흔들리는, 종소리 같은 화음을 느껴 보세요. 중간에는 꿈처럼 아름다운 노래가 나와요. 추억 같기도 하고 천국 같기도 하죠. 그리고 다시 장송 행렬이 돌아와요."},"chopin-nocturne20":{"c":"chopin","a":"쇼팽의 녹턴 20번이에요. 쇼팽이 누나에게 협주곡을 연습하라며 보낼 때 함께 쓴 곡으로, 세상을 떠난 뒤에 출판됐어요. 영화 피아니스트의 첫 장면, 폭격 속 라디오 방송국에서 주인공이 연주하던 곡이 바로 이 녹턴이에요.","b":"들으실 때는 처음 몇 마디의 고요한 화음에 귀 기울여 보세요. 오른손이 슬프고 자유롭게 노래해요. 끝부분에서는 높은 음역에서 빠른 음들이 흩어진답니다."},"schumann-traumerei":{"c":"schumann","a":"슈만의 트로이메라이예요. 이 곡이 들어 있는 어린이 정경은 어린이를 위한 곡이 아니라, 어른이 어린 시절을 떠올리며 쓴 열세 곡의 피아노 소품집이에요. 슈만은 클라라에게, 당신이 언젠가 내가 아직 어린아이 같다고 했던 말이 떠올라 썼다고 편지했어요. 꿈이라는 뜻의 트로이메라이는 그중 가장 유명해서, 피아니스트 호로비츠가 앙코르로 즐겨 연주했답니다.","b":"들으실 때는 같은 선율이 여러 번 돌아오며 조금씩 색이 바뀌는 걸 느껴 보세요. 선율이 위로 뻗었다가 천천히 내려오는 곡선도 아름다워요. 마지막에 멈칫하는 쉼표, 꿈에서 깨어나는 순간을 기다려 보세요."},"schumann-dichterliebe":{"c":"schumann","a":"슈만의 시인의 사랑이에요. 클라라와 결혼한 1840년, 가곡의 해에 하이네의 시 열여섯 편으로 쓴 연가곡이에요. 사랑의 설렘에서 시작해 실연의 아픔으로 이어지죠. 피아노는 반주에 머물지 않고, 노래가 끝난 뒤에도 긴 연주로 말하지 못한 감정을 이어 가요.","b":"들으실 때는 첫 곡이 풀리지 않는 화음으로 끝나는 오월의 설렘을 느껴 보세요. 중간에는 쓰라림을 꾹 누르는 듯한 노래들이 이어져요. 그리고 마지막 곡 뒤의 긴 피아노 연주가, 모든 것을 감싸 안는 위로처럼 흐른답니다."},"schumann-pc":{"c":"schumann","a":"슈만의 피아노 협주곡 가단조예요. 처음에는 한 악장짜리 환상곡으로 썼다가, 클라라의 권유로 악장을 더해 협주곡으로 완성했어요. 초연 독주자도 클라라였죠. 화려한 기교 대결보다, 피아노와 오케스트라가 대화하듯 주고받는 시적인 협주곡이에요. 그리그의 피아노 협주곡이 이 곡의 영향을 크게 받았답니다.","b":"들으실 때는 시작에서 오케스트라가 한 번 내리친 뒤 쏟아지는 피아노 화음을 느껴 보세요. 오보에가 애틋한 첫 주제를 부르고 피아노가 이어받아요. 3악장은 춤추듯 밝은 왈츠풍으로 마무리돼요."},"schumann-widmung":{"c":"schumann","a":"슈만의 헌정이에요. 결혼식 전날 클라라에게 선물한 가곡집 미르테의 꽃의 첫 곡이에요. 미르테는 신부의 화관에 쓰던 꽃이에요. 뤼케르트의 시에 붙인 열정적인 사랑 고백으로, 리스트가 피아노 독주곡으로 편곡한 버전도 유명하답니다.","b":"들으실 때는 힘차게 솟구치는 첫 선율을 느껴 보세요. 중간에는 조용히 가라앉는 경건한 부분이 나와요. 그리고 마지막에 슈베르트의 아베 마리아 선율이 피아노에 살짝 비친답니다."},"schumann-spring":{"c":"schumann","a":"슈만의 교향곡 1번, 봄이에요. 결혼 이듬해, 단 나흘 만에 스케치를 끝낸 첫 교향곡이에요. 시인 뵈트거의 봄에 관한 시에서 영감을 받았고, 초연은 멘델스존이 라이프치히에서 지휘했어요. 겨울에서 봄으로 깨어나는 생명력이 넘치는 곡이에요.","b":"들으실 때는 시작의 트럼펫과 호른 팡파르, 봄을 깨우는 소리를 느껴 보세요. 1악장 빠른 부분에서는 새싹이 돋는 듯한 활기가 넘쳐요. 4악장은 우아하고 경쾌하게 마무리된답니다."},"schumann-carnaval":{"c":"schumann","a":"슈만의 사육제예요. 가면무도회에 나오는 인물 스물한 명을 짧은 피아노곡으로 그린 작품이에요. 열정적인 플로레스탄과 몽상가 오이제비우스라는 슈만 자신의 두 얼굴, 그리고 쇼팽, 파가니니, 클라라까지 등장하죠. 당시 약혼녀의 고향 이름 철자를 음 이름으로 바꿔 곡 전체에 숨겨 놓기도 했어요.","b":"들으실 때는 쇼팽이라는 곡에서 쇼팽의 녹턴을 흉내 낸 분위기를 찾아보세요. 파가니니라는 곡에서는 바이올린 기교를 피아노로 옮겨요. 마지막 행진곡은 속물들을 물리치는 승리의 행진이랍니다."},"schumann-kreisleriana":{"c":"schumann","a":"슈만의 크라이슬레리아나예요. 작가 호프만의 소설 속 괴짜 음악가 크라이슬러에서 이름을 따온 여덟 곡의 환상곡이에요. 슈만은 클라라에게 이 곡의 주인공은 당신이라고 썼어요. 격정적인 곡과 몽상적인 곡이 번갈아 나오며, 슈만 마음속의 두 극단을 그대로 보여 주죠. 쇼팽에게 바친 곡이에요.","b":"들으실 때는 첫 곡의 폭풍처럼 몰아치는 시작을 느껴 보세요. 두 번째 곡은 가장 길고 다정한 노래예요. 그리고 마지막 곡은 유령처럼 사라지는 기묘한 마무리랍니다."},"schumann-quintet":{"c":"schumann","a":"슈만의 피아노 오중주예요. 실내악에 몰두하던 1842년, 몇 주 만에 완성한 곡이에요. 피아노와 현악사중주를 합친 피아노 오중주라는 장르를 대표하는 작품이 됐죠. 클라라에게 바쳤는데, 처음 연주될 때 몸이 아픈 클라라 대신 멘델스존이 즉석에서 피아노를 맡았다고 전해져요.","b":"들으실 때는 1악장에서 다섯 악기가 함께 내딛는 당당한 첫 주제를 느껴 보세요. 2악장은 장송 행진곡 같은 무거운 걸음이에요. 4악장에서는 1악장 주제가 돌아오며 장대하게 마무리돼요."},"schumann-fantasie":{"c":"schumann","a":"슈만의 환상곡 다장조예요. 베토벤 기념비를 세울 기금을 모으려고 구상한 곡인데, 클라라와 억지로 떨어져 지내던 시기에 썼어요. 슈만은 1악장을 클라라를 향한 깊은 탄식이라고 불렀죠. 1악장 끝에는 베토벤의 가곡, 멀리 있는 연인에게의 선율을 살짝 인용해서 떨어진 연인을 향한 마음을 담았어요.","b":"들으실 때는 1악장에서 소용돌이치는 반주 위의 열정적인 선율을 느껴 보세요. 2악장은 행진곡 같은 화려함과 끝부분의 아찔한 도약이 있어요. 3악장은 느리게 떠오르는 기도처럼 마무리된답니다."},"schumann-rhenish":{"c":"schumann","a":"슈만의 교향곡 3번, 라인이에요. 라인강 근처 뒤셀도르프의 음악감독이 된 뒤 쓴 교향곡이에요. 라인 지방의 풍경과 사람들의 활기를 담았죠. 쾰른 대성당에서 대주교 서임식을 본 인상으로 쓴 4악장에서는, 장엄한 트롬본 화음이 성당 안의 울림처럼 퍼져요.","b":"들으실 때는 1악장에서 강물처럼 힘차게 밀려드는 첫 주제를 느껴 보세요. 2악장은 느긋한 라인 지방의 민속 춤이에요. 4악장에서는 쾰른 대성당의 엄숙한 트롬본에 귀 기울여 보세요."},"liszt-campanella":{"c":"liszt","a":"리스트의 라 캄파넬라예요. 작은 종이라는 뜻이에요. 원래는 바이올리니스트 파가니니의 바이올린 협주곡 마지막 악장 주제인데, 리스트가 피아노로 옮겼어요. 스무 살 무렵 파가니니의 초인적인 연주에 충격을 받은 리스트가, 피아노로 그걸 해내겠다며 몇 년을 매달린 결과물이에요. 지금도 손꼽히는 어려운 곡이죠.","b":"들으실 때는 오른손이 넓게 뛰어 높은 음을 콕콕 찍는 소리, 작은 종소리를 찾아보세요. 같은 주제가 돌아올 때마다 더 어렵고 화려해져요. 마지막 폭발적인 클라이맥스까지 함께 달려 보세요."},"liszt-liebestraum":{"c":"liszt","a":"리스트의 사랑의 꿈 3번이에요. 원래는 사랑할 수 있는 한 사랑하라는 시에 붙인 가곡이었는데, 리스트가 피아노곡으로 바꿨어요. 사랑하는 사람이 떠나기 전에 사랑하라는, 다정하면서도 쓸쓸한 내용이에요. 화려한 연주로 유명한 리스트가 얼마나 서정적인 작곡가였는지 보여 주는 곡이랍니다.","b":"들으실 때는 가운데 음역에서 노래하는 선율을 양손이 나눠 연주하는 걸 느껴 보세요. 중간에는 빠르게 쏟아지는 화려한 장식이 나와요. 선율이 높은 음역으로 옮겨 가며 감정이 고조되는 부분도 놓치지 마세요."},"liszt-hr2":{"c":"liszt","a":"리스트의 헝가리 광시곡 2번이에요. 리스트는 어린 시절 들은 헝가리 집시 악단의 음악을 바탕으로 열아홉 곡의 헝가리 광시곡을 썼어요. 2번은 그중 가장 유명하죠. 1947년 톰과 제리 만화에서 톰이 이 곡을 연주하면서 대중에게도 친숙해졌어요.","b":"들으실 때는 느리고 장중한 앞부분에서 집시 악단의 애수를 느껴 보세요. 뒷부분은 빠르고 신나는 춤이 점점 빨라져요. 피아노로 흉내 낸 집시 악기 침발롬 소리도 찾아보세요."},"liszt-consolation3":{"c":"liszt","a":"리스트의 위로 3번이에요. 화려한 기교로 유명한 리스트가 쓴 조용하고 서정적인 소품이에요. 바이마르 시절, 연인이었던 카롤리네 공작부인과 함께하던 무렵에 썼어요. 쇼팽의 녹턴을 떠올리게 하는 분위기로, 리스트의 부드러운 얼굴을 보여 주죠.","b":"들으실 때는 왼손의 잔잔한 물결 같은 반주를 느껴 보세요. 오른손은 길고 평온한 노래를 불러요. 숨 쉬듯 여유로운 빠르기에 몸을 맡겨 보세요."},"liszt-mazeppa":{"c":"liszt","a":"리스트의 초절기교 연습곡 4번, 마제파예요. 빅토르 위고의 시를 바탕으로, 야생마에 묶인 채 초원을 달리는 우크라이나 영웅 마제파의 이야기를 그렸어요. 초절기교라는 이름 그대로, 피아노 기교의 한계를 넘으려 한 열두 곡 가운데서도 가장 어려운 곡 중 하나예요.","b":"들으실 때는 두 손이 번갈아 내리치는 질주, 미친 듯이 달리는 말을 느껴 보세요. 중간에는 지친 듯한 서정적인 부분이 나와요. 그리고 마지막은 마제파가 왕이 되는 승리의 행진이랍니다."},"liszt-sonata":{"c":"liszt","a":"리스트의 피아노 소나타 나단조예요. 슈만이 자신의 환상곡을 리스트에게 바친 데 대한 답례로 슈만에게 바친 곡이에요. 하지만 그때 슈만은 이미 요양원에 있었죠. 삼십 분 동안 쉬지 않고 이어지는 한 악장 안에 소나타 전체를 담은 혁신적인 곡이에요. 클라라 슈만과 브람스는 이 곡을 싫어했다고 전해져요.","b":"들으실 때는 처음에 낮게 떨어지는 음계, 수수께끼 같은 시작을 느껴 보세요. 몇 개의 주제가 모습을 바꿔 계속 돌아와요. 그리고 마지막은 폭발 대신 조용히 사라지는 끝이랍니다."},"liszt-preludes":{"c":"liszt","a":"리스트의 교향시, 전주곡이에요. 리스트는 시나 그림의 내용을 한 악장짜리 관현악곡으로 그리는 교향시라는 장르를 만들었는데, 이 곡이 그 대표작이에요. 인생은 죽음으로 향하는 전주곡의 연속이라는 시인의 말을 곡의 주제로 삼았어요.","b":"들으실 때는 처음에 질문하듯 나오는 세 음을 기억해 두세요. 곡 전체의 씨앗이에요. 그 주제가 사랑, 폭풍, 전원, 전투로 모습을 바꿔 가요. 마지막은 금관악기의 장대한 마무리랍니다."},"liszt-mephisto":{"c":"liszt","a":"리스트의 메피스토 왈츠 1번이에요. 파우스트 이야기에서, 악마 메피스토펠레스가 시골 주막에서 바이올린을 들고 사람들을 홀려 춤추게 하는 장면을 그렸어요. 처음엔 오케스트라 곡으로 썼는데, 지금은 피아노 버전이 더 자주 연주돼요.","b":"들으실 때는 처음에 바이올린을 조율하는 듯한 소리를 느껴 보세요. 왈츠가 점점 미쳐 가며 소용돌이쳐요. 중간에는 유혹적인 느린 왈츠가 흐른답니다."},"liszt-sonetto104":{"c":"liszt","a":"리스트의 페트라르카 소네트 104번이에요. 이탈리아를 여행하며 받은 인상을 피아노곡으로 그린 순례의 해 가운데 한 곡이에요. 십사 세기 시인 페트라르카가 사랑하는 라우라에게 바친 시를 바탕으로 했어요. 원래는 가곡으로 썼다가 피아노 독주곡으로 다시 만들었죠.","b":"들으실 때는 노래하듯 흐르는 사랑의 선율을 느껴 보세요. 점점 고조되다가 열정이 터져요. 그리고 끝의 고요한 여운에 잠겨 보세요."},"liszt-pc1":{"c":"liszt","a":"리스트의 피아노 협주곡 1번이에요. 1855년 바이마르에서 리스트가 직접 피아노를 치고, 베를리오즈가 지휘해 초연했어요. 네 악장이 쉬지 않고 이어져요. 3악장에서 트라이앵글이 눈에 띄게 활약해서, 한 비평가가 트라이앵글 협주곡이라고 비꼬기도 했대요.","b":"들으실 때는 시작에서 오케스트라의 강렬한 주제와 피아노의 폭발적인 대답을 느껴 보세요. 3악장에서는 반짝이는 트라이앵글을 찾아보시고요. 마지막에는 처음 주제들이 행진곡으로 모습을 바꿔 돌아온답니다."},"verdi-nabucco":{"c":"verdi","a":"베르디의 히브리 노예들의 합창이에요. 바빌론에 끌려간 히브리 사람들이 유프라테스 강가에서 잃어버린 조국을 그리워하며 부르는 합창이에요. 베르디를 다시 일으켜 세운 오페라 나부코의 대표곡이죠. 오스트리아의 지배를 받던 이탈리아 사람들은 이 노래에 자신들의 처지를 겹쳐 보았다고 해요. 베르디의 장례 행렬 때도 사람들이 이 노래를 불렀다고 전해진답니다.","b":"들으실 때는 조용하고 부드럽게 시작하는 합창을 느껴 보세요. 모두가 한목소리로 단순한 선율을 불러요. 그리고 중간에 터져 나오는 간절한 외침에 귀 기울여 보세요."},"verdi-donna":{"c":"verdi","a":"베르디의 여자의 마음이에요. 오페라 리골레토에서, 바람둥이 만토바 공작이 여자의 마음은 바람에 날리는 깃털처럼 변덕스럽다고 노래하는 아리아예요. 베르디는 이 선율이 초연 전에 퍼질까 봐, 리허설 직전까지 테너에게도 악보를 주지 않았대요. 그리고 초연 다음 날, 베네치아 거리 곳곳에서 이 노래가 들렸다고 해요.","b":"들으실 때는 오케스트라의 경쾌한 전주를 느껴 보세요. 테너가 가볍고 흥겨운 선율을 불러요. 마지막에는 높은 음으로 한껏 뽐내며 끝난답니다."},"verdi-brindisi":{"c":"verdi","a":"베르디의 축배의 노래예요. 오페라 라 트라비아타에서, 파리 사교계 파티에 온 청년 알프레도와 비올레타가 함께 부르는 노래예요. 두 사람의 사랑이 시작되는 장면이죠. 라 트라비아타는 뒤마의 소설 동백꽃 여인이 원작이고, 이 곡은 신년 음악회의 단골 곡이에요.","b":"들으실 때는 세 박자의 흥겨운 왈츠 리듬을 느껴 보세요. 테너와 소프라노가 노래를 주고받아요. 그리고 마지막엔 모든 사람이 함께 잔을 들며 합창한답니다."},"verdi-aida":{"c":"verdi","a":"베르디의 아이다 개선 행진곡이에요. 이집트 카이로 오페라 극장을 위해 쓴 오페라 아이다의 한 장면이에요. 이집트 장군 라다메스가 전쟁에서 이기고 돌아오는 모습이죠. 이 장면을 위해 특별히 만든 긴 아이다 트럼펫이 쓰여요. 축구 응원가로도 자주 들으셨을 거예요.","b":"들으실 때는 긴 트럼펫이 부는 장엄한 행진 선율을 느껴 보세요. 합창과 함께 축제 분위기가 점점 커져요. 중간에는 발레 음악이 화려하게 이어진답니다."},"verdi-dies":{"c":"verdi","a":"베르디의 레퀴엠 가운데 진노의 날이에요. 이탈리아의 존경받는 작가 만초니를 추모하기 위해 쓴 진혼곡이에요. 오페라 극장처럼 극적이라, 교회 옷을 입은 오페라라는 평을 들었죠. 진노의 날은 최후의 심판 날을 그린 부분으로, 영화와 광고에서 공포나 긴장감을 표현할 때 자주 쓰여요.","b":"들으실 때는 오케스트라의 네 번의 거대한 타격에 놀라 보세요. 큰북이 박자와 엇갈리며 엄청나게 강타해요. 그리고 폭풍처럼 몰아치는 합창이 이어진답니다."},"verdi-forza":{"c":"verdi","a":"베르디의 운명의 힘 서곡이에요. 러시아 상트페테르부르크 극장의 의뢰로 쓴 오페라 운명의 힘의 서곡이에요. 지금의 서곡은 몇 년 뒤 고쳐 쓸 때 만들어졌어요. 처음 금관이 울리는 세 번의 음이 운명을 나타내고, 오페라의 주요 선율이 모두 담겨 있어서 따로 자주 연주돼요.","b":"들으실 때는 시작에서 금관이 울리는 세 번의 운명의 음을 기억해 두세요. 현악기가 계속 되풀이하는 불안한 운명의 주제도 느껴 보시고요. 관악기의 기도하는 듯한 선율 뒤에 화려하게 마무리된답니다."},"verdi-traviata-prelude":{"c":"verdi","a":"베르디의 라 트라비아타 1막 전주곡이에요. 오페라의 막이 오르기 전에 연주되는 짧은 곡이에요. 병으로 죽어 가는 비올레타를 먼저 보여 주듯 아주 여리게 시작하죠. 이어서 비올레타가 알프레도에게 사랑을 고백하는 선율이 흘러요.","b":"들으실 때는 시작에서 아주 높은 바이올린의 여린 화음, 병든 비올레타를 느껴 보세요. 이어서 현악기가 따뜻한 사랑의 선율을 불러요. 그 선율이 다시 나올 때 바이올린의 장식이 춤추듯 감싼답니다."},"verdi-anvil":{"c":"verdi","a":"베르디의 대장간의 합창이에요. 오페라 일 트로바토레에서, 스페인 산속의 집시들이 새벽에 일을 시작하며 망치로 모루를 두드리며 부르는 합창이에요. 실제 무대에서도 쇠망치로 모루를 두드리는 소리가 들어가요.","b":"들으실 때는 쾅쾅 울리는 모루 소리를 느껴 보세요. 힘찬 남성 합창이 이어지고요. 모두가 함께 일하는 리듬감을 즐겨 보세요."},"verdi-otello":{"c":"verdi","a":"베르디의 오텔로 가운데 버들의 노래와 아베 마리아예요. 칠십 대의 베르디가 셰익스피어의 오셀로로 쓴 오페라예요. 질투에 눈이 먼 오텔로의 손에 죽기 직전, 데스데모나가 부르는 노래들이죠. 하녀에게서 배운 슬픈 버들의 노래를 부른 뒤, 조용히 성모에게 기도를 드려요.","b":"들으실 때는 잉글리시 호른의 쓸쓸한 전주를 느껴 보세요. 버들의 노래가 슬프게 되풀이돼요. 그리고 아베 마리아는 거의 속삭이듯 부르는 기도랍니다."},"verdi-falstaff":{"c":"verdi","a":"베르디의 팔스타프 마지막 장면이에요. 여든 살의 베르디가 쓴 마지막 오페라이자, 그의 두 번째 희극 오페라예요. 셰익스피어 희극에 나오는 뚱뚱한 기사 팔스타프가 주인공이죠. 마지막 장면에서 등장인물 모두가 세상 모든 것은 농담이라고 노래하며 막을 내려요. 오페라 인생의 마지막을 웃음으로 끝낸 셈이에요.","b":"들으실 때는 팔스타프가 먼저 부르는 주제를 기억해 두세요. 열 명의 가수가 차례로 들어오며 노래가 겹겹이 쌓여요. 그리고 모두가 웃으며 맺는 유쾌한 마지막 화음을 즐겨 보세요."},"brahms-hungarian5":{"c":"brahms","a":"브람스의 헝가리 무곡 5번이에요. 젊은 시절 헝가리 출신 바이올리니스트와 함께 연주 여행을 다니며 들은 집시 음악을 바탕으로 한 곡이에요. 원래는 두 사람이 피아노 한 대를 함께 치는 곡이었는데, 큰 인기를 얻어 브람스의 생활을 든든하게 해 줬죠. 재미있게도 브람스는 이 5번 선율을 민요라고 생각했지만, 사실은 같은 시대 다른 작곡가가 쓴 곡이었대요.","b":"들으실 때는 느렸다가 갑자기 빨라지는 집시 음악 특유의 빠르기 변화를 느껴 보세요. 단조의 정열적인 주제와 장조의 경쾌한 가운데 부분이 대비를 이뤄요. 연주자마다 밀고 당기는 맛이 달라서, 여러 연주를 비교해 들어도 재미있어요."},"brahms-sym3":{"c":"brahms","a":"브람스의 교향곡 3번이에요. 첫 교향곡에 이십 년 넘게 걸렸던 브람스가 쉰 살에 쓴 교향곡이에요. 특히 3악장은 브람스 음악 가운데 가장 애틋한 선율로 꼽혀요. 1961년 영화 이수에 쓰이면서 널리 알려졌는데, 이 영화의 원작이 사강의 소설, 브람스를 좋아하세요예요.","b":"들으실 때는 3악장에서 첼로가 처음 부르는 그리움 가득한 선율을 느껴 보세요. 같은 선율을 호른과 오보에가 이어받을 때 색깔이 바뀌어요. 그리고 크게 터지지 않고 조용히 사그라지는 끝, 브람스다운 절제를 느껴 보세요."},"brahms-sym1":{"c":"brahms","a":"브람스의 교향곡 1번이에요. 베토벤이라는 거인의 발소리를 늘 의식했던 브람스가 이십 년 넘게 매달려 완성한 첫 교향곡이에요. 지휘자 한스 폰 뷜로는 이 곡을 베토벤의 교향곡 10번이라고 불렀죠. 4악장의 주제가 베토벤의 환희의 송가와 닮았다는 말에, 브람스는 그건 바보라도 알아챈다고 퉁명스럽게 답했대요.","b":"들으실 때는 시작에서 팀파니가 쿵쿵 박는 가운데 고통스럽게 올라가는 서주를 느껴 보세요. 4악장에서는 알프스의 호른 선율이 구름을 걷어 내는 장면이 나와요. 그리고 현악기가 부르는, 환희의 송가를 닮은 주제를 기다려 보세요."},"brahms-lullaby":{"c":"brahms","a":"브람스의 자장가예요. 젊은 시절 합창단에서 함께 노래했던 친구가 둘째 아들을 낳자, 축하 선물로 써 준 곡이에요. 피아노 반주에는 그녀가 예전에 즐겨 부르던 왈츠 선율을 몰래 숨겨 넣었죠. 그리고 세계에서 가장 유명한 자장가가 됐답니다.","b":"들으실 때는 흔들리는 요람 같은 반주를 느껴 보세요. 단순하고 다정한 선율이 흘러요. 반주에 숨겨진 옛 왈츠도 한번 찾아보세요."},"brahms-violin":{"c":"brahms","a":"브람스의 바이올린 협주곡 라장조예요. 평생의 친구이자 바이올리니스트 요제프 요아힘을 위해 썼고, 요아힘의 조언을 받으며 완성했어요. 바이올린이 오케스트라와 대등하게 맞서는 교향곡 같은 협주곡이라, 바이올린에 맞선 협주곡이라는 말을 듣기도 했죠.","b":"들으실 때는 1악장에서 긴 오케스트라 서주 뒤 바이올린이 격렬하게 등장하는 순간을 기다려 보세요. 2악장에서는 오보에가 먼저 아름다운 선율을 불러요. 3악장은 헝가리 집시풍의 춤곡이랍니다."},"brahms-pc2":{"c":"brahms","a":"브람스의 피아노 협주곡 2번이에요. 협주곡으로는 드물게 네 악장으로 된 거대한 곡이에요. 브람스는 친구에게 작은 스케르초가 딸린 아주 작은 피아노 협주곡을 썼다고 농담했대요. 이탈리아 여행에서 받은 밝은 인상이 곳곳에 배어 있어요.","b":"들으실 때는 시작에서 호른이 부르는 평화로운 주제에 피아노가 대답하는 걸 느껴 보세요. 3악장에서는 첼로 독주가 깊은 노래를 불러요. 4악장은 가볍고 우아한 춤 같은 피날레랍니다."},"brahms-academic":{"c":"brahms","a":"브람스의 대학 축전 서곡이에요. 브레슬라우 대학이 브람스에게 명예 박사 학위를 주자, 감사의 뜻으로 쓴 곡이에요. 근엄한 축하곡 대신, 그때 대학생들이 술자리에서 부르던 노래들을 엮어 넣었죠. 마지막은 대학가의 노래 가우데아무스, 그러니 즐기자로 장식했어요.","b":"들으실 때는 곡 곳곳에 나오는 대학생 노래 메들리를 찾아보세요. 바순이 익살스럽게 부르는 신입생 환영 노래도 나와요. 그리고 마지막에 오케스트라 전체가 가우데아무스를 웅장하게 울린답니다."},"brahms-requiem":{"c":"brahms","a":"브람스의 독일 레퀴엠이에요. 라틴어 미사문 대신, 루터가 독일어로 옮긴 성경에서 직접 가사를 골라 쓴 레퀴엠이에요. 죽은 이를 위한 기도보다, 남은 사람들을 위로하는 데 마음을 모았죠. 어머니의 죽음과 스승 슈만의 죽음이 작곡의 계기가 됐다고 여겨져요.","b":"들으실 때는 첫 곡이 바이올린 없이 시작해서 어둡고 따뜻한 소리를 내는 걸 느껴 보세요. 두 번째 곡은 무겁게 걷는 장송 행진이에요. 다섯 번째 곡에서는 소프라노가 어머니가 위로하듯이라는 노래를 부른답니다."},"brahms-intermezzo":{"c":"brahms","a":"브람스의 인터메초 가장조예요. 예순 살 무렵 작곡을 그만두려다 다시 쓴 말년의 피아노 소품 가운데 하나로, 평생의 벗 클라라 슈만에게 바쳤어요. 화려함 대신 쓸쓸하고 다정한 회상이 담겨 있어서, 브람스 피아노곡 가운데 가장 사랑받는 곡이에요.","b":"들으실 때는 처음 세 음의 부드러운 질문을 느껴 보세요. 중간에는 단조로 바뀌며 그리움이 짙어져요. 그리고 첫 선율이 다시 돌아와 위로해 준답니다."},"brahms-sym4":{"c":"brahms","a":"브람스의 교향곡 4번이에요. 브람스의 마지막 교향곡이에요. 4악장은 바흐 칸타타의 한 주제를 바탕으로, 같은 여덟 마디 위에 서른 번의 변주를 쌓는 바로크 시대의 옛 형식으로 만들었어요. 낭만주의 한복판에서 바로크의 형식을 되살린, 참 브람스다운 작품이죠.","b":"들으실 때는 1악장에서 한숨처럼 내려오고 올라가는 첫 주제를 느껴 보세요. 4악장에서는 관악기가 제시하는 여덟 마디 주제를 기억해 두세요. 그 주제 위로 서른 개의 변주가 쌓여 간답니다."},"saintsaens-swan":{"c":"saintsaens","a":"생상스의 백조예요. 동물의 사육제 열네 곡 가운데, 생상스가 살아 있을 때 출판을 허락한 유일한 곡이에요. 1905년 발레리나 안나 파블로바가 이 곡에 맞춰 빈사의 백조를 춰서 세계적인 명작이 됐답니다.","b":"들으실 때는 첼로의 길고 우아한 선율, 물 위를 미끄러지는 백조를 떠올려 보세요. 피아노가 잔잔한 물결을 그려요. 마지막에는 첼로가 고요히 사라진답니다."},"saintsaens-carnival":{"c":"saintsaens","a":"생상스의 동물의 사육제예요. 사육제 기간에 친구들과 즐기려고 쓴 열네 곡의 유머러스한 모음곡이에요. 생상스는 진지한 작곡가로서의 체면 때문에 살아 있을 때 출판을 막았대요. 사자, 암탉, 코끼리, 캥거루, 수족관, 거북이 같은 동물부터, 피아니스트까지 나와요. 거북이에서는 오펜바흐의 캉캉을 아주 느리게 연주하죠.","b":"들으실 때는 거북이에서 엄청 느리게 연주하는 캉캉을 찾아보세요. 코끼리에서는 콘트라베이스가 무거운 왈츠를 춰요. 그리고 수족관의 반짝이는 물속 세상도 즐겨 보세요."},"saintsaens-danse":{"c":"saintsaens","a":"생상스의 죽음의 무도예요. 자정이 되면 죽음의 신이 바이올린을 켜고, 해골들이 무덤에서 나와 춤추다가, 새벽닭이 울면 사라진다는 이야기를 그린 곡이에요. 실로폰으로 해골들의 뼈 부딪히는 소리를 냈고, 동물의 사육제에서는 이 선율을 스스로 패러디하기도 했어요.","b":"들으실 때는 시작에서 하프가 열두 번 울리는 자정의 종소리를 세어 보세요. 바이올린의 일부러 어긋나게 조율한 소리가 죽음의 신의 바이올린이에요. 그리고 끝에서 오보에의 닭 울음과 함께 해골들이 사라진답니다."},"saintsaens-organ":{"c":"saintsaens","a":"생상스의 교향곡 3번, 오르간이에요. 런던 필하모닉 협회의 의뢰로 쓴 곡으로, 생상스는 내가 쏟아부을 수 있는 모든 것을 담았다고 말했어요. 이 해 세상을 떠난 리스트에게 바쳤죠. 오케스트라에 오르간과 피아노까지 더한 거대한 편성이에요. 영화 꼬마 돼지 베이브에서 마지막 부분의 선율이 노래로 쓰이기도 했어요.","b":"들으실 때는 앞부분 후반에서 오르간이 아주 낮게 받쳐 주는 고요한 기도를 느껴 보세요. 그리고 뒷부분이 시작될 때 오르간이 터뜨리는 거대한 화음! 피아노 네 손이 반짝이는 장식을 더하는 피날레도 놓치지 마세요."},"saintsaens-introrondo":{"c":"saintsaens","a":"생상스의 서주와 론도 카프리치오소예요. 스페인 출신의 천재 바이올리니스트 사라사테를 위해 쓴 곡이에요. 사라사테는 이 곡을 자신의 대표곡으로 즐겨 연주했죠. 나중에 비제가 피아노 반주로 편곡하기도 했어요.","b":"들으실 때는 서주의 우수에 찬 스페인풍 선율을 느껴 보세요. 이어서 스페인 춤처럼 튀는 리듬이 나와요. 마지막은 숨 막히는 기교의 질주랍니다."},"saintsaens-delilah":{"c":"saintsaens","a":"생상스의 그대 음성에 내 마음 열리고예요. 구약 성경의 삼손과 데릴라 이야기를 그린 오페라의 아리아예요. 그때 프랑스에서는 성경 이야기를 무대에 올리는 걸 꺼려서, 초연은 독일 바이마르에서 리스트의 도움으로 열렸어요. 데릴라가 삼손을 유혹해 힘의 비밀을 알아내려고 부르는 노래로, 메조소프라노의 가장 유명한 아리아 가운데 하나예요.","b":"들으실 때는 메조소프라노의 깊고 부드러운 음색을 느껴 보세요. 현악기가 물결처럼 감싸 줘요. 후반에는 삼손이 함께 부르며 뜨겁게 고조된답니다."},"saintsaens-cello1":{"c":"saintsaens","a":"생상스의 첼로 협주곡 1번이에요. 세 부분이 쉬지 않고 이어지는 한 악장짜리 협주곡이에요. 첼리스트 카살스와 로스트로포비치가 특히 사랑한 곡이고, 젊은 쇼스타코비치와 라흐마니노프도 첼로 협주곡 가운데 최고로 꼽았다고 전해져요.","b":"들으실 때는 시작에서 오케스트라가 화음을 한 번 울리자마자 달려 나가는 첼로를 느껴 보세요. 중간에는 약음기 낀 현악기가 우아한 미뉴에트를 연주해요. 그리고 처음 주제가 돌아오며 극적으로 마무리된답니다."},"saintsaens-pc2":{"c":"saintsaens","a":"생상스의 피아노 협주곡 2번이에요. 단 삼 주 만에 쓴 곡으로, 초연 때 생상스가 직접 피아노를 쳤어요. 당시 한 피아니스트는 이 곡을 두고 바흐로 시작해 오펜바흐로 끝난다고 했대요. 엄숙한 시작이 점점 경쾌하게 변해 가거든요.","b":"들으실 때는 1악장에서 바흐의 즉흥곡 같은 피아노 혼자의 시작을 느껴 보세요. 2악장은 팀파니로 시작하는 장난스러운 악장이에요. 3악장은 빠른 춤 리듬으로 질주한답니다."},"saintsaens-havanaise":{"c":"saintsaens","a":"생상스의 하바네라예요. 쿠바 출신 바이올리니스트를 위해 쓴 곡이에요. 연주 여행 중 숙소에 불이 난 뒤, 벽난로 앞에서 몸을 녹이며 떠올린 리듬이라고 전해져요. 쿠바에서 온 느릿한 춤 리듬 하바네라를 바이올린으로 우아하게 그렸어요.","b":"들으실 때는 되풀이되는 하바네라 리듬을 느껴 보세요. 그 위로 바이올린이 나른하고 관능적인 선율을 불러요. 중간에는 빠르고 화려한 기교가 펼쳐진답니다."},"saintsaens-vc3":{"c":"saintsaens","a":"생상스의 바이올린 협주곡 3번이에요. 이 곡도 사라사테를 위해 썼고, 생상스의 바이올린 협주곡 가운데 가장 많이 연주돼요. 열정적인 1악장, 뱃노래 같은 2악장, 찬가가 등장하는 3악장으로 이루어져 있어요.","b":"들으실 때는 1악장에서 바이올린이 낮은 음으로 힘차게 시작하는 주제를 느껴 보세요. 2악장 끝에서는 바이올린과 클라리넷이 함께 뱃노래를 맺어요. 3악장에서는 금관과 함께 찬가 같은 선율이 울려 퍼진답니다."},"tchai-swan":{"c":"tchaikovsky","a":"차이콥스키의 백조의 호수예요. 저주에 걸려 낮에는 백조, 밤에만 사람이 되는 공주 오데트와 왕자 지크프리트의 이야기예요. 1877년 초연은 형편없는 안무와 무대 때문에 실패했고, 차이콥스키는 살아서 이 작품의 성공을 보지 못했어요. 그가 세상을 떠난 뒤 새로운 안무로 다시 공연되면서, 세계에서 가장 유명한 발레가 됐답니다.","b":"들으실 때는 오보에가 부르는 유명한 백조의 테마, 쓸쓸하고 신비로운 그 선율을 느껴 보세요. 작은 백조들의 춤에서는 네 명이 팔짱을 끼고 귀엽게 춤을 춰요. 그리고 왈츠에서는 차이콥스키가 왜 왈츠의 대가인지 알 수 있어요."},"tchai-pc1":{"c":"tchaikovsky","a":"차이콥스키의 피아노 협주곡 1번이에요. 차이콥스키가 존경하던 피아니스트 루빈시테인에게 들려줬다가, 쓸모없고 연주할 수도 없다는 혹평을 들었어요. 상처받은 그는 한 음도 고치지 않겠다고 했대요. 결국 독일의 한스 폰 뷜로가 미국 보스턴에서 초연해 대성공을 거뒀고, 루빈시테인도 나중에 생각을 바꿔 이 곡을 연주했답니다.","b":"들으실 때는 호른의 웅장한 신호와 함께 피아노가 거대한 화음을 내리치는 도입을 느껴 보세요. 그런데 이 유명한 도입 선율은 곡에서 다시는 나오지 않아요! 3악장에서는 우크라이나 민요에서 가져온 춤곡 리듬이 신나게 흘러요."},"tchai-sym6":{"c":"tchaikovsky","a":"차이콥스키의 교향곡 6번, 비창이에요. 차이콥스키는 이 곡을 내 모든 작품 가운데 최고라고 했어요. 직접 지휘해 초연했는데, 아흐레 뒤 갑자기 세상을 떠났죠. 사인은 콜레라로 알려졌지만 지금도 여러 이야기가 있어요. 보통 교향곡은 빠르고 화려하게 끝나는데, 이 곡은 느리고 어둡게, 꺼져 가듯 끝나요. 그 자체가 그때는 충격이었답니다.","b":"들으실 때는 1악장의 두 번째 주제, 차이콥스키가 쓴 가장 아름다운 선율 가운데 하나를 느껴 보세요. 3악장은 승리의 행진처럼 끝나서 많은 청중이 여기서 박수를 쳐요. 함정이죠. 그리고 4악장은 깊은 절망 속으로 가라앉다가 콘트라베이스만 남아 사라진답니다."},"tchai-nutcracker":{"c":"tchaikovsky","a":"차이콥스키의 호두까기 인형이에요. 크리스마스이브에 선물 받은 호두까기 인형이 왕자로 변해, 소녀 클라라를 과자의 나라로 데려가는 발레예요. 차이콥스키는 파리에서 첼레스타라는 새 악기를 보고 몰래 러시아로 들여왔대요. 다른 작곡가가 먼저 쓸까 봐 비밀로 했다고 하고요. 그리고 사탕 요정의 춤에서 처음 선보였죠.","b":"들으실 때는 사탕 요정의 춤에서 첼레스타의 영롱한 소리를 느껴 보세요. 러시아 춤은 신나는 에너지로 가득해요. 그리고 꽃의 왈츠에서는 하프의 화려한 연주 뒤에 아름다운 왈츠가 펼쳐진답니다."},"tchai-sleeping":{"c":"tchaikovsky","a":"차이콥스키의 잠자는 숲속의 미녀 왈츠예요. 페로의 동화를 바탕으로 한 발레로, 차이콥스키의 세 발레 가운데 살아 있을 때 가장 크게 성공한 작품이에요. 1959년 디즈니 애니메이션 잠자는 숲속의 공주도 이 발레 음악을 바탕으로 만들어졌어요.","b":"들으실 때는 화려한 도입 뒤에 펼쳐지는 우아한 왈츠를 느껴 보세요. 디즈니 노래로 익숙한 선율도 찾아보시고요. 마지막에는 오케스트라 전체가 소용돌이친답니다."},"tchai-1812":{"c":"tchaikovsky","a":"차이콥스키의 1812년 서곡이에요. 1812년 나폴레옹이 러시아를 침공했다가 물러난 이야기를 그린 곡으로, 프랑스 국가와 러시아 제국 찬가가 맞부딪쳐요. 악보에 진짜 대포 소리와 교회 종소리가 적혀 있는 것으로 유명하죠. 정작 차이콥스키는 이 곡을 시끄럽고 요란하다며 그다지 좋아하지 않았대요.","b":"들으실 때는 시작에서 비올라와 첼로가 부르는 러시아 정교회 성가를 느껴 보세요. 프랑스 국가가 점점 커지다가 밀려나는 전투 장면이 이어져요. 그리고 마지막, 대포 소리와 종소리 속의 승리를 즐겨 보세요."},"tchai-vc":{"c":"tchaikovsky","a":"차이콥스키의 바이올린 협주곡 라장조예요. 불행한 결혼 생활에서 도망쳐 스위스 제네바 호숫가에 머물며 한 달 만에 쓴 곡이에요. 바치려던 바이올리니스트가 연주할 수 없다고 거절해서 초연이 늦어졌고, 초연 뒤에는 한 비평가가 악취 나는 음악이라고 혹평했죠. 그런데 지금은 가장 사랑받는 바이올린 협주곡 가운데 하나랍니다.","b":"들으실 때는 1악장에서 바이올린이 부르는 따뜻하고 넓은 주제를 느껴 보세요. 2악장은 약음기를 낀 슬픈 노래예요. 3악장은 러시아 시골 축제 같은 신나는 춤이랍니다."},"tchai-serenade":{"c":"tchaikovsky","a":"차이콥스키의 현을 위한 세레나데예요. 존경하던 모차르트에게 바치는 마음으로 쓴 현악 합주곡이에요. 차이콥스키 스스로 진심으로 느끼며 썼다며 무척 아꼈죠. 2악장 왈츠는 따로 연주될 만큼 사랑받아요.","b":"들으실 때는 1악장 시작에서 현악기 전체가 부르는 장엄한 화음을 느껴 보세요. 2악장은 우아한 왈츠예요. 4악장은 러시아 민요를 바탕으로 한 활기찬 피날레랍니다."},"tchai-sym5":{"c":"tchaikovsky","a":"차이콥스키의 교향곡 5번이에요. 클라리넷이 처음 부르는 어두운 운명의 주제가, 네 악장 모두에 모습을 바꿔 가며 나와요. 차이콥스키는 초연 직후 이 곡이 실패작이라며 괴로워했지만, 연주가 거듭되면서 대표작으로 자리 잡았어요.","b":"들으실 때는 1악장 시작에서 클라리넷 두 대가 부르는 무거운 운명의 주제를 기억해 두세요. 2악장에서는 호른 독주가 감미로운 노래를 불러요. 그리고 4악장, 그 운명의 주제가 장조의 승리 행진으로 바뀌는 순간을 기다려 보세요."},"tchai-june":{"c":"tchaikovsky","a":"차이콥스키의 사계 가운데 6월, 뱃노래예요. 상트페테르부르크의 한 음악 잡지가 일 년 동안 매달 그 달에 어울리는 피아노 소품을 한 곡씩 실었는데, 그 열두 곡을 모은 게 사계예요. 6월은 강 위를 떠가는 배와 여름밤의 정취를 그린 곡으로, 열두 곡 가운데 가장 유명해요.","b":"들으실 때는 흔들리는 배 같은 반주를 느껴 보세요. 그 위로 단조의 그리운 선율이 흘러요. 중간에는 밝아지면서 물결이 커지는 장면이 나온답니다."},"dvorak-nw":{"c":"dvorak","a":"드보르자크의 교향곡 9번, 신세계로부터예요. 뉴욕 음악원 원장으로 일하던 드보르자크가 미국에서 쓴 교향곡이에요. 흑인 영가와 원주민 음악에서 받은 인상, 그리고 고향 보헤미아를 향한 그리움이 함께 담겼죠. 1893년 뉴욕 카네기홀 초연은 대성공이었어요. 2악장의 잉글리시 호른 선율은 나중에 가사가 붙어 고잉 홈이라는 노래가 됐고, 우리나라에서는 꿈속의 고향으로도 알려져 있어요.","b":"들으실 때는 2악장에서 잉글리시 호른이 부르는 향수 어린 선율을 느껴 보세요. 4악장 도입에서는 점점 빨라지다가 금관이 강렬한 주제를 터뜨려요. 앞 악장들의 주제가 4악장에 다시 나오는 것도 찾아보세요."},"dvorak-cello":{"c":"dvorak","a":"드보르자크의 첼로 협주곡 나단조예요. 미국에 머물던 마지막 해에 쓴 곡이에요. 작곡하던 중 젊은 시절 사랑했던 처형이 위독하다는 소식을 듣고, 그녀가 좋아하던 자신의 가곡 선율을 2악장에 넣었어요. 브람스는 이 곡을 보고, 첼로로 이런 협주곡을 쓸 수 있는 줄 알았다면 내가 진작 썼을 거라고 말했대요.","b":"들으실 때는 1악장에서 호른이 부르는 고향 같은 두 번째 주제를 느껴 보세요. 2악장 중간에는 처형이 좋아하던 노래가 숨어 있어요. 마지막 악장 끝에서는 조용한 회상 뒤에 힘차게 마무리된답니다."},"dvorak-slavonic":{"c":"dvorak","a":"드보르자크의 슬라브 무곡 마단조예요. 브람스의 헝가리 무곡이 크게 성공하자, 출판사가 드보르자크에게 비슷한 곡을 의뢰해서 탄생한 시리즈예요. 첫 곡집으로 하룻밤 사이에 유명해졌고, 팔 년 뒤 두 번째 곡집을 썼죠. 이 곡은 두 번째 곡집 가운데 가장 애틋한 곡이에요.","b":"들으실 때는 우수에 찬 단조 선율을 느껴 보세요. 중간에는 장조로 바뀌며 밝게 춤을 춰요. 그리고 처음 선율이 돌아오며 여운을 남긴답니다."},"dvorak-humoresque":{"c":"dvorak","a":"드보르자크의 유모레스크예요. 미국에 살던 중 여름 휴가로 고향 체코에 돌아갔을 때 쓴 피아노 소품 여덟 곡 가운데 일곱 번째 곡이에요. 미국에서 적어 둔 스케치를 바탕으로 했죠. 유모레스크는 유머러스한 소품이라는 뜻인데, 바이올린 편곡으로 더 유명해졌어요.","b":"들으실 때는 깡충거리는 리듬의 장난스러운 선율을 느껴 보세요. 중간에는 단조로 바뀌며 쓸쓸한 노래가 나와요. 그리고 다시 밝은 주제가 돌아온답니다."},"dvorak-american":{"c":"dvorak","a":"드보르자크의 현악사중주 12번, 아메리카예요. 미국 아이오와주의 체코 이민자 마을에서 여름을 보내며, 단 이 주 만에 쓴 곡이에요. 흑인 영가와 원주민 음악에서 받은 인상, 새소리, 그리고 고향 체코의 정서가 함께 담겨 있어요.","b":"들으실 때는 1악장에서 비올라가 부르는 넓은 대지 같은 주제를 느껴 보세요. 3악장에서는 바이올린이 새소리를 흉내 내요. 단순하고 친근한 선율들이 마음을 편하게 해 준답니다."},"dvorak-rusalka":{"c":"dvorak","a":"드보르자크의 달에게 바치는 노래예요. 인간 왕자를 사랑하게 된 물의 요정 루살카가, 달에게 자신의 사랑을 왕자에게 전해 달라고 비는 아리아예요. 드보르자크의 오페라 가운데 가장 성공한 작품이고, 이 아리아는 소프라노의 대표곡이에요.","b":"들으실 때는 하프와 현악기가 그리는 달빛 비친 호수를 떠올려 보세요. 루살카가 길고 간절한 선율을 불러요. 그리움이 점점 고조되어 간답니다."},"dvorak-sym8":{"c":"dvorak","a":"드보르자크의 교향곡 8번이에요. 체코 시골 별장에서 자연을 벗 삼아 쓴 교향곡으로, 새소리와 민요, 춤이 가득한 밝은 곡이에요. 드보르자크는 평소와 다른 방식으로 쓰고 싶었다고 말했는데, 정해진 틀보다 자유롭게 흘러가는 구성이 특징이에요.","b":"들으실 때는 1악장에서 첼로의 어두운 서주 뒤에 들려오는 플루트의 새소리를 느껴 보세요. 3악장은 보헤미아 왈츠 같은 우아한 춤이에요. 4악장은 트럼펫 팡파르로 시작하는 변주곡이랍니다."},"dvorak-quintet2":{"c":"dvorak","a":"드보르자크의 피아노 오중주 2번이에요. 피아노와 현악사중주를 위한 곡으로, 브람스와 슈만의 피아노 오중주와 함께 이 장르의 대표작으로 꼽혀요. 2악장은 둠카라는 체코 민요 장르로, 슬픔과 기쁨이 번갈아 나타나는 게 특징이에요.","b":"들으실 때는 1악장에서 첼로가 부르는 따뜻한 첫 주제를 느껴 보세요. 2악장에서는 우울함과 활기가 갑자기 바뀌어요. 3악장은 체코의 빠른 민속춤이랍니다."},"dvorak-gypsy":{"c":"dvorak","a":"드보르자크의 어머니가 가르쳐 주신 노래예요. 체코 시인의 집시 시에 붙인 가곡집, 집시의 노래 일곱 곡 가운데 네 번째 곡이에요. 어머니가 눈물을 흘리며 가르쳐 준 노래를, 이제는 내가 아이들에게 가르치며 눈물짓는다는 내용이에요. 바이올린 편곡으로도 많이 연주돼요.","b":"들으실 때는 피아노의 부드러운 흔들림을 느껴 보세요. 단순하고 그리운 선율이 흘러요. 짧지만 깊은 여운으로 끝난답니다."},"dvorak-serenade":{"c":"dvorak","a":"드보르자크의 현을 위한 세레나데예요. 아직 무명이던 서른네 살에, 단 열하루 만에 쓴 곡이에요. 결혼하고 첫아들을 얻고 국가 장학금도 받던 행복한 시기였죠. 밝고 따뜻한 분위기 덕분에 드보르자크의 곡 가운데 가장 친근한 작품이에요.","b":"들으실 때는 1악장에서 첼로와 바이올린이 주고받는 포근한 선율을 느껴 보세요. 2악장은 쓸쓸한 왈츠예요. 마지막 악장은 활기차게 달리다가 1악장 선율을 다시 떠올린답니다."},"grieg-morning":{"c":"grieg","a":"그리그의 아침 기분이에요. 입센의 희곡 페르 귄트 공연을 위해 쓴 음악 가운데 한 곡이에요. 노르웨이의 아침 같지만, 실제 극에서는 페르 귄트가 북아프리카 모로코의 사막에서 아침을 맞는 장면이에요. 플루트와 오보에가 주고받는 선율은, 광고와 영화에서 아침을 상징하는 음악으로 쓰이죠.","b":"들으실 때는 플루트와 오보에가 주고받는 아침 선율을 느껴 보세요. 점점 밝아지며 오케스트라 전체로 햇살이 퍼져요. 새소리 같은 목관악기의 장식도 찾아보세요."},"grieg-hall":{"c":"grieg","a":"그리그의 산 속 마왕의 궁전에서예요. 페르 귄트가 산속 트롤 왕궁에 몰래 들어갔다가 트롤들에게 쫓기는 장면이에요. 그리그 본인은 이 곡을 쓰며 듣기 싫을 정도로 노르웨이 시골 냄새가 난다고 투덜댔다지만, 지금은 가장 유명한 곡 가운데 하나가 됐어요.","b":"들으실 때는 시작에서 첼로와 바순이 살금살금 걷는 주제를 느껴 보세요. 같은 주제가 계속 빨라지고 커져요. 마지막에는 트롤들이 몰려드는 폭발적인 끝이 기다린답니다."},"grieg-pc":{"c":"grieg","a":"그리그의 피아노 협주곡 가단조예요. 스물네 살에 덴마크에서 쓴 곡으로, 그리그가 남긴 유일한 협주곡이에요. 슈만의 피아노 협주곡과 같은 조성이고 영향을 크게 받았죠. 리스트가 악보를 처음 보고 즉석에서 쳐 보며 극찬했다고 전해져요.","b":"들으실 때는 시작에서 팀파니가 떨린 뒤 피아노가 위에서 아래로 쏟아지는 화음을 느껴 보세요. 2악장은 약음기 낀 현악기의 고요한 노래예요. 3악장에서는 노르웨이 민속춤 리듬이 흐르다가 장엄하게 마무리된답니다."},"grieg-holberg":{"c":"grieg","a":"그리그의 홀베르그 모음곡이에요. 베르겐 출신 극작가 홀베르그의 탄생 이백 주년을 기념해 쓴 곡이에요. 홀베르그가 살던 십팔 세기 바로크 춤곡 형식을 빌렸죠. 처음엔 피아노곡으로 썼다가 현악 오케스트라로 편곡했어요.","b":"들으실 때는 첫 곡에서 말발굽처럼 경쾌하게 튀는 현악기를 느껴 보세요. 네 번째 곡 아리아에서는 첼로가 깊고 애잔한 노래를 불러요. 마지막 곡에서는 바이올린과 비올라 독주가 춤추듯 마무리한답니다."},"grieg-wedding":{"c":"grieg","a":"그리그의 트롤하우겐의 결혼식날이에요. 그리그와 아내 니나의 결혼 이십오 주년을 축하하며 쓴 곡이에요. 트롤하우겐은 부부가 살던 집 이름이에요. 그리그가 평생 예순여섯 곡을 남긴 피아노 소품집, 서정 소품 가운데 한 곡이에요.","b":"들으실 때는 시작에서 결혼식 하객들이 다가오는 듯한 행진을 느껴 보세요. 중간에는 부부의 추억처럼 조용하고 다정한 부분이 나와요. 그리고 다시 축제의 행진이 돌아온답니다."},"grieg-solveig":{"c":"grieg","a":"그리그의 솔베이지의 노래예요. 페르 귄트가 세상을 떠돌며 방황하는 동안, 고향의 연인 솔베이지가 그를 기다리며 부르는 노래예요. 노르웨이 민요풍의 단조 선율과 밝은 후렴이 번갈아 나와요. 노래로도, 오케스트라 편곡으로도 자주 연주돼요.","b":"들으실 때는 짧은 서주 뒤에 시작되는 쓸쓸한 단조 선율을 느껴 보세요. 후렴에서는 가사 없이 맑은 노래가 흘러요. 기다림이 계속되듯 조용히 끝난답니다."},"grieg-butterfly":{"c":"grieg","a":"그리그의 나비예요. 서정 소품 3권의 첫 곡으로, 꽃 사이를 팔랑팔랑 날아다니는 나비를 그렸어요. 같은 곡집에 고독한 방랑자, 고향에서, 작은 새, 봄에게 같은 곡들이 있어서 자연을 담은 소품집처럼 들려요.","b":"들으실 때는 손가락이 건반 위를 날듯이 움직이는 빠른 음들을 느껴 보세요. 올라갔다 내려가는 음들이 나비의 날갯짓이에요. 마지막엔 나비가 살짝 날아가 버린답니다."},"grieg-lastspring":{"c":"grieg","a":"그리그의 마지막 봄이에요. 원래는 시인 비녜의 시에 붙인 가곡이에요. 병든 사람이 아마도 마지막일 봄을 바라보는 내용이죠. 그리그가 이 노래를 현악 오케스트라곡으로 편곡하면서 더 널리 알려졌어요.","b":"들으실 때는 현악기만으로 부르는 느린 선율을 느껴 보세요. 같은 선율이 두 번 나오며 더 짙어져요. 마지막 화음은 고요하게 가라앉는답니다."},"grieg-vs3":{"c":"grieg","a":"그리그의 바이올린 소나타 3번이에요. 그리그가 쓴 세 곡의 바이올린 소나타 가운데 가장 극적인 곡이에요. 초연 때는 그리그가 직접 피아노를 맡았죠. 서정적인 그리그의 다른 얼굴, 강렬하고 격정적인 모습을 보여 줘요.","b":"들으실 때는 1악장이 바이올린의 거센 외침으로 시작하는 걸 느껴 보세요. 2악장에서는 피아노가 먼저 노르웨이 민요풍 노래를 불러요. 3악장은 민속춤 리듬의 힘찬 피날레랍니다."},"grieg-norwegian":{"c":"grieg","a":"그리그의 노르웨이 춤곡이에요. 노르웨이 민요 선율을 바탕으로 두 사람이 함께 치는 피아노곡으로 썼다가, 나중에 오케스트라로 편곡됐어요. 브람스의 헝가리 무곡처럼, 민족의 춤을 연주회장으로 옮긴 곡이에요.","b":"들으실 때는 1번에서 낮은 현악기의 투박한 민속춤을 느껴 보세요. 2번에서는 오보에가 귀여운 춤 선율을 불러요. 가장 유명한 곡이죠. 빠른 부분과 느린 부분이 번갈아 나오는 대비도 즐겨 보세요."},"puccini-babbino":{"c":"puccini","a":"푸치니의 오 사랑하는 나의 아버지예요. 푸치니의 유일한 희극 오페라 잔니 스키키에 나오는 아리아예요. 딸 라우레타가 아버지에게 연인과 결혼하게 해 달라고 조르는 노래죠. 선율은 무척 아름답지만, 극 속에서는 허락해 주지 않으면 강에 뛰어들겠다고 투정하는 귀여운 협박이 담겨 있어요. 영화 전망 좋은 방에도 쓰였답니다.","b":"들으실 때는 짧고 단순하지만 가슴을 울리는 선율을 느껴 보세요. 현악기가 선율을 함께 노래해요. 마지막에는 높은 음으로 올라가며 간절하게 부탁한답니다."},"puccini-nessun":{"c":"puccini","a":"푸치니의 아무도 잠들지 마라예요. 얼음 같은 공주 투란도트가, 수수께끼를 푼 왕자의 이름을 알아낼 때까지 아무도 잠들지 말라고 명령해요. 왕자 칼라프는 새벽이 오면 자신이 이길 거라고 노래하죠. 1990년 이탈리아 월드컵 중계 주제곡으로 파바로티가 부르면서 세계적으로 유명해졌어요. 푸치니는 이 오페라를 끝내지 못하고 세상을 떠났답니다.","b":"들으실 때는 조용히 시작하는 테너의 노래를 느껴 보세요. 중간에 여성 합창이 멀리서 신비롭게 노래해요. 그리고 마지막, 이기리라라는 뜻의 빈체로에서 길게 뻗는 고음을 기다려 보세요."},"puccini-gelida":{"c":"puccini","a":"푸치니의 그대의 찬 손이에요. 파리의 가난한 시인 로돌포가, 크리스마스이브에 촛불을 빌리러 온 이웃 미미의 차가운 손을 잡고 자신을 소개하는 아리아예요. 라 보엠은 젊은 예술가들의 가난한 사랑과 이별을 그린 오페라로, 지금도 세계에서 가장 많이 공연되는 오페라 가운데 하나예요.","b":"들으실 때는 부드럽게 말을 건네는 듯한 시작을 느껴 보세요. 자신이 시인이라고 소개하며 노래가 점점 커져요. 그리고 테너의 높은 음이 터지는 클라이맥스를 기다려 보세요."},"puccini-musetta":{"c":"puccini","a":"푸치니의 무제타의 왈츠예요. 라 보엠에서, 카페에 나타난 화려한 무제타가 옛 연인 마르첼로의 관심을 끌려고 부르는 노래예요. 길을 걸으면 모두가 자신을 쳐다본다고 자랑을 늘어놓는, 유쾌하고 매혹적인 노래죠.","b":"들으실 때는 느리고 우아하게 흔들리는 왈츠 리듬을 느껴 보세요. 점점 다른 사람들의 노래가 겹쳐져요. 그리고 마르첼로가 결국 마음을 빼앗기는 순간, 노래가 크게 고조된답니다."},"puccini-vissi":{"c":"puccini","a":"푸치니의 노래에 살고 사랑에 살고예요. 오페라 토스카에서, 가수 토스카가 연인을 살려 주는 대가를 요구하는 악당 앞에서 신에게 탄식하며 부르는 아리아예요. 나는 예술과 사랑에 살았을 뿐인데, 왜 이런 시련을 주시나요 하고 묻는 노래죠.","b":"들으실 때는 조용한 혼잣말처럼 시작하는 노래를 느껴 보세요. 기도가 점점 간절해져요. 클라이맥스의 높은 음 뒤에 무너지듯 끝나는 마무리에 귀 기울여 보세요."},"puccini-stars":{"c":"puccini","a":"푸치니의 별은 빛나건만이에요. 토스카에서, 처형을 앞둔 화가 카바라도시가 새벽 감옥에서 토스카와의 추억을 떠올리며 부르는 아리아예요. 클라리넷의 슬픈 선율이 먼저 노래를 들려주고, 테너가 이어받아요.","b":"들으실 때는 시작의 쓸쓸한 클라리넷 독주를 느껴 보세요. 테너가 회상하듯 조용히 노래를 시작해요. 그리고 마지막에는 삶에 대한 절규가 터져 나온답니다."},"puccini-unbel":{"c":"puccini","a":"푸치니의 어떤 갠 날이에요. 일본 나가사키를 배경으로 한 오페라 나비부인의 아리아예요. 미국으로 떠난 해군 장교를 삼 년째 기다리는 나비부인이 부르는 노래죠. 어느 갠 날, 수평선 위로 그의 배가 보일 거라며 그가 돌아올 날을 그려요. 하지만 결말은 비극이에요.","b":"들으실 때는 조용히 꿈꾸듯 시작하는 노래를 느껴 보세요. 배를 기다리는 장면을 상상하며 감정이 점점 커져요. 클라이맥스의 강렬한 고음도 놓치지 마세요."},"puccini-humming":{"c":"puccini","a":"푸치니의 허밍 코러스예요. 나비부인이 기다리던 배가 항구에 들어온 걸 보고, 밤새 그를 기다리는 장면에서 흐르는 음악이에요. 무대 뒤의 합창단이 입을 다문 채 허밍으로 불러요. 가사가 없어서 오히려 기다림의 고요함이 더 깊게 전해지죠.","b":"들으실 때는 입을 다문 합창의 부드러운 허밍을 느껴 보세요. 현을 톡톡 뜯는 반주가 받쳐 줘요. 밤이 깊어 가듯 조용히 사라진답니다."},"puccini-manon":{"c":"puccini","a":"푸치니의 마농 레스코 간주곡이에요. 푸치니에게 첫 큰 성공을 안겨 준 오페라의 간주곡이에요. 같은 이야기를 마스네가 이미 오페라로 썼는데도, 푸치니는 나는 이탈리아 사람의 열정으로 쓰겠다고 했대요. 붙잡혀 끌려가는 마농을 따라가는 연인의 절망을 그린 곡이에요.","b":"들으실 때는 첼로와 비올라의 어두운 독주로 시작하는 부분을 느껴 보세요. 열정적인 선율이 오케스트라 전체로 번져요. 절정 뒤에는 지쳐 가라앉듯 마무리된답니다."},"puccini-doretta":{"c":"puccini","a":"푸치니의 도레타의 아름다운 꿈이에요. 오페라 제비에서, 파리 사교계의 여인 마그다가 모임에서 부르는 아리아예요. 돈보다 사랑을 택한 소녀 도레타의 이야기를 노래로 들려주죠. 오페라 자체는 자주 공연되지 않지만, 이 아리아는 독창회의 단골곡이에요.","b":"들으실 때는 피아노 반주로 시작하는 살롱 분위기를 느껴 보세요. 소프라노의 선율이 꿈꾸듯 떠올라요. 마지막에 높이 뻗는 고음이 아름답답니다."},"mahler-adagietto":{"c":"mahler","a":"말러의 교향곡 5번 가운데 아다지에토예요. 현악기와 하프만으로 연주하는 느린 악장이에요. 나중에 아내가 될 알마에게 보낸 사랑의 편지라는 이야기가 유명하죠. 영화 베니스에서의 죽음에 쓰이면서, 말러의 가장 유명한 곡이 됐어요.","b":"들으실 때는 하프의 고요한 분산화음을 느껴 보세요. 현악기가 숨을 길게 이어 가며 노래해요. 중간에는 간절한 클라이맥스가 찾아온답니다."},"mahler-titan":{"c":"mahler","a":"말러의 교향곡 1번, 거인이에요. 이십 대 후반에 완성한 첫 교향곡이에요. 거인이라는 제목은 한 소설에서 따왔다가 나중에 말러 스스로 지웠어요. 자신의 가곡 선율이 곳곳에 쓰였고, 3악장에는 우리에게도 익숙한 동요 선율을 단조로 바꾼 장송 행진곡이 나와요.","b":"들으실 때는 1악장 시작에서 아주 높게 이어지는 현악기 소리, 새벽 안개와 뻐꾸기 소리를 느껴 보세요. 3악장은 콘트라베이스 독주로 시작하는 단조의 동요 행진이에요. 4악장은 폭풍처럼 시작해서, 호른 연주자들이 일어서는 승리로 끝난답니다."},"mahler-resurrection":{"c":"mahler","a":"말러의 교향곡 2번, 부활이에요. 한 지휘자의 장례식에서 부활이라는 찬가가 합창으로 불리는 걸 듣고, 마지막 악장의 실마리를 얻었대요. 1악장의 장례식에서 시작해, 마지막에는 합창과 오르간이 부활을 노래하는 거대한 구원의 이야기예요.","b":"들으실 때는 1악장에서 첼로와 베이스의 거친 외침, 장례식의 시작을 느껴 보세요. 4악장에서는 알토 독창이 고요한 기도를 불러요. 그리고 마지막, 합창과 오르간과 종소리가 함께 터지는 부활의 순간을 기다려 보세요."},"mahler-erde":{"c":"mahler","a":"말러의 대지의 노래예요. 당나라 시인 이백, 맹호연, 왕유 같은 시인들의 시를 독일어로 옮긴 시집에서 가사를 가져온, 노래로 된 교향곡이에요. 딸을 잃고 심장병 진단을 받은 해에 썼죠. 아홉 번째 교향곡을 쓰면 죽는다는 징크스를 두려워해서 번호를 붙이지 않았다는 이야기도 전해져요.","b":"들으실 때는 첫 곡에서 테너가 부르는 술 노래의 격정을 느껴 보세요. 네 번째 곡에서는 젊은 여인들과 말 타고 달리는 젊은이들이 그려져요. 그리고 마지막 고별에서는, 영원히라는 말이 끝없이 되풀이되며 사라진답니다."},"mahler-sym4":{"c":"mahler","a":"말러의 교향곡 4번이에요. 말러 교향곡 가운데 가장 짧고 밝아서 입문곡으로 자주 추천돼요. 썰매 방울 소리로 시작하죠. 마지막 악장에서는 소프라노가 아이의 눈으로 본 천국의 모습을 노래해요.","b":"들으실 때는 시작의 썰매 방울 소리를 느껴 보세요. 2악장에서는 일부러 음을 높게 맞춘 바이올린이 죽음의 신이 켜는 바이올린처럼 들려요. 4악장에서는 소프라노가 천국의 소박한 풍경을 그려 준답니다."},"mahler-rueckert":{"c":"mahler","a":"말러의 나는 세상에서 잊혀지고예요. 뤼케르트의 시에 붙인 가곡 다섯 곡 가운데 하나예요. 세상의 소란에서 벗어나 나만의 고요한 세계로 들어가는 마음을 노래하죠. 말러는 이 곡을 두고 바로 나 자신이라고 말했다고 전해져요. 같은 무렵 쓴 교향곡 5번의 아다지에토와 분위기가 닮았어요.","b":"들으실 때는 잉글리시 호른이 여는 고요한 서주를 느껴 보세요. 노래가 느리게 숨 쉬듯 이어져요. 마지막에는 모든 소리가 사라지는 평화가 찾아온답니다."},"mahler-sym9":{"c":"mahler","a":"말러의 교향곡 9번이에요. 말러가 완성한 마지막 교향곡이에요. 초연은 그가 세상을 떠난 뒤, 제자 브루노 발터의 지휘로 이루어졌어요. 삶과의 이별을 그렸다는 해석이 많고, 지휘자 번스타인은 이 곡을 깊이 사랑해서 여러 번 녹음했죠.","b":"들으실 때는 1악장이 불규칙한 심장 박동 같은 리듬으로 시작하는 걸 느껴 보세요. 3악장은 비틀거리는 듯 격렬해요. 그리고 4악장 끝, 현악기가 거의 들리지 않을 만큼 사라지는 마지막을 숨죽이고 들어 보세요."},"mahler-wayfarer":{"c":"mahler","a":"말러의 방랑하는 젊은이의 노래예요. 이십 대 중반, 한 소프라노 가수와의 실연을 겪고 직접 쓴 시에 붙인 네 곡의 연가곡이에요. 두 번째 곡과 네 번째 곡의 선율은 교향곡 1번에 그대로 옮겨져 쓰였어요.","b":"들으실 때는 두 번째 곡에서 아침 들판을 걷는 상쾌한 선율을 느껴 보세요. 교향곡 1번 1악장과 같은 선율이에요. 세 번째 곡은 가슴에 칼이 박힌 듯한 격정이고요. 네 번째 곡은 보리수 아래 잠드는 고요한 마무리랍니다."},"mahler-tragic":{"c":"mahler","a":"말러의 교향곡 6번, 비극적이에요. 말러의 삶이 가장 행복하던 시기에 쓴, 가장 어두운 교향곡이에요. 아내 알마는 1악장의 두 번째 주제가 자신을 그린 거라고 회고했어요. 마지막 악장에는 커다란 나무망치로 내려치는 소리가 나오는데, 말러는 이를 운명의 타격이라고 불렀다고 알려져 있어요.","b":"들으실 때는 1악장의 군대 행진 같은 단호한 시작을 느껴 보세요. 팀파니 리듬과 함께 장조에서 단조로 꺾이는 화음이 곡 전체에 나와요. 그리고 4악장, 나무망치의 충격적인 타격을 기다려 보세요."},"mahler-kindertoten":{"c":"mahler","a":"말러의 죽은 아이를 그리는 노래예요. 두 아이를 잃은 시인 뤼케르트가 쓴 시에 붙인 다섯 곡의 연가곡이에요. 말러는 이 곡을 쓰고 몇 년 뒤, 실제로 큰딸을 잃었어요. 알마는 이 곡이 불운을 불러왔다고 여겼대요. 깊은 슬픔을 절제된 소리로 담은 곡이에요.","b":"들으실 때는 첫 곡에서 해가 다시 떠오르는 아침의 담담한 슬픔을 느껴 보세요. 관악기 몇 개만 남는 투명한 오케스트라 소리도 인상적이에요. 마지막 곡은 폭풍이 지나간 뒤 자장가처럼 끝난답니다."},"debussy-clair":{"c":"debussy","a":"드뷔시의 달빛이에요. 프랑스 시인 베를렌의 시 달빛에서 제목을 가져왔어요. 1890년쯤 쓰기 시작했지만 드뷔시가 오랫동안 고쳐서, 십오 년 뒤에야 출판했죠. 베토벤의 월광이 달빛 속의 슬픔이라면, 드뷔시의 달빛은 달빛 그 자체예요. 빛이 물에 번지는 장면을 소리로 그린 그림 같답니다.","b":"들으실 때는 처음에 박자가 흐릿하게 느껴질 만큼 자유롭게 떠다니는 화음을 느껴 보세요. 중간에는 물결치는 분산화음 위로 선율이 떠올라요. 소리가 커질 때보다 작아질 때의 아름다움에 귀 기울여 보세요."},"debussy-faune":{"c":"debussy","a":"드뷔시의 목신의 오후에의 전주곡이에요. 시인 말라르메의 시를 바탕으로, 더운 여름 오후에 반쯤 졸며 요정들을 꿈꾸는 숲의 신, 목신의 몽롱한 상태를 그린 곡이에요. 작곡가 피에르 불레즈는 현대 음악은 이 곡의 플루트 소리와 함께 깨어났다고 말했죠. 이십 세기 음악의 출발점으로 꼽히는 곡이에요.","b":"들으실 때는 첫 소절, 반주 없이 혼자 나른하게 미끄러지는 플루트를 느껴 보세요. 하프와 호른이 아지랑이 같은 소리를 만들어요. 뚜렷한 클라이맥스 없이 꿈처럼 왔다가 사라지는 흐름에 몸을 맡겨 보세요."},"debussy-arabesque1":{"c":"debussy","a":"드뷔시의 아라베스크 1번이에요. 이십 대의 드뷔시가 쓴 초기 피아노곡이에요. 아라베스크는 이슬람 건축의 덩굴무늬 장식을 뜻하는데, 드뷔시는 흐르는 곡선 같은 선율을 그 무늬에 빗댔어요. 아직 드뷔시 특유의 화성은 덜 드러나지만, 물 흐르듯 부드러운 피아노 소리에서 이미 그만의 색이 보여요.","b":"들으실 때는 두 손이 주고받는 물결 같은 음들을 느껴 보세요. 선율이 덩굴처럼 위아래로 감겨요. 중간에는 살짝 느려지는 몽환적인 부분이 나온답니다."},"debussy-children":{"c":"debussy","a":"드뷔시의 어린이 차지예요. 드뷔시가 세 살배기 딸 슈슈를 위해 쓴 여섯 곡의 피아노 모음곡이에요. 악보에는 아빠의 다정한 사과와 함께라는 헌사를 적었죠. 지겨운 피아노 연습곡을 놀리는 곡, 코끼리 인형의 자장가, 눈송이의 춤처럼 아이 방의 장면들을 그렸어요.","b":"들으실 때는 첫 곡에서 지겨운 피아노 연습을 흉내 내다 점점 딴청 피우는 장면을 느껴 보세요. 네 번째 곡에서는 창밖에 눈송이가 흩날려요. 마지막 곡은 재즈의 래그타임 리듬으로 장난스럽게 끝난답니다."},"debussy-lamer":{"c":"debussy","a":"드뷔시의 바다예요. 바다의 새벽부터 정오까지, 파도의 유희, 바람과 바다의 대화라는 세 장면으로 바다를 그린 교향적 스케치예요. 처음 출판된 악보 표지에는 일본 화가 호쿠사이의 유명한 파도 그림이 실렸어요. 드뷔시는 바다를 무척 사랑해서, 선원이 되고 싶었다고 말하기도 했대요.","b":"들으실 때는 첫 장면에서 어둠 속에 서서히 빛이 퍼지는 새벽을 느껴 보세요. 두 번째 장면에서는 하프와 목관악기가 반짝이는 물결을 그려요. 그리고 세 번째 장면에서는 바람과 파도가 폭풍처럼 대결한답니다."},"debussy-flaxen":{"c":"debussy","a":"드뷔시의 아마빛 머리의 소녀예요. 드뷔시는 전주곡 스물네 곡의 제목을 곡 맨 끝에 적어서, 먼저 소리를 듣고 나중에 제목을 떠올리게 했어요. 한 시인의 시에서 제목을 가져온 이 곡은, 소박하고 맑은 선율로 순수한 소녀를 그려요.","b":"들으실 때는 반주 없이 혼자 시작하는 단순한 선율을 느껴 보세요. 부드럽게 미끄러지는 화음이 이어져요. 짧은 곡 안에 담긴 투명하고 고요한 분위기를 즐겨 보세요."},"debussy-cathedral":{"c":"debussy","a":"드뷔시의 가라앉은 성당이에요. 프랑스 브르타뉴 지방의 전설 속 도시를 그린 곡이에요. 바다에 가라앉은 성당이, 맑은 날 아침이면 물 위로 떠올라 종소리와 성가가 들린다는 이야기죠. 드뷔시는 피아노의 가장 낮은 음과 높은 음을 함께 울려서, 물속에서 울리는 종소리를 표현했어요.","b":"들으실 때는 안개 속에서 떠오르는 듯한 처음의 화음을 느껴 보세요. 성당이 물 위로 솟아오를 때 장엄한 종소리가 울려요. 그리고 다시 물속으로 가라앉으며 소리가 희미해진답니다."},"debussy-reverie":{"c":"debussy","a":"드뷔시의 꿈이에요. 젊은 시절 돈이 필요해서 출판사에 판 초기 피아노 소품이에요. 드뷔시 본인은 나중에 이 곡을 대수롭지 않게 여겼다고 전해지지만, 꿈결 같은 선율 덕분에 지금은 드뷔시의 가장 사랑받는 피아노곡 가운데 하나가 됐어요.","b":"들으실 때는 왼손의 잔잔한 분산화음을 느껴 보세요. 그 위로 멀리서 들려오는 듯한 아련한 선율이 흘러요. 중간에 고조됐다가 다시 고요해진답니다."},"debussy-fetes":{"c":"debussy","a":"드뷔시의 녹턴 가운데 축제예요. 오케스트라를 위한 녹턴 세 곡, 구름, 축제, 사이렌 가운데 두 번째 곡이에요. 드뷔시는 휘슬러의 그림 녹턴에서 영감을 받았다고 했어요. 대기 속에서 춤추는 축제의 빛과 리듬, 그리고 그 사이를 지나가는 행렬을 그린 곡이라고 설명했죠.","b":"들으실 때는 현악기의 들뜬 리듬으로 시작하는 축제를 느껴 보세요. 멀리서 약음기를 낀 트럼펫이 행렬처럼 다가와요. 그리고 행렬이 축제와 섞이며 크게 고조된답니다."},"debussy-pagodes":{"c":"debussy","a":"드뷔시의 판화 가운데 탑이에요. 파리 만국박람회에서 들은 인도네시아 자바의 가믈란 음악의 영향이 가장 직접적으로 드러난 곡이에요. 피아노로 동양의 탑과 징의 울림, 이국적인 음계의 분위기를 그렸어요.","b":"들으실 때는 피아노의 검은 건반 같은 다섯 음 음계로 된 선율을 느껴 보세요. 징처럼 길게 울리는 낮은 음도 들려요. 여러 겹의 리듬이 겹치는 가믈란 같은 짜임을 즐겨 보세요."},"ravel-bolero":{"c":"ravel","a":"라벨의 볼레로예요. 무용가 이다 루빈시테인의 발레를 위해 쓴 곡이에요. 작은북이 처음부터 끝까지 같은 리듬을 되풀이하고, 두 개의 선율이 악기만 바꿔 가며 계속 반복되면서 소리가 점점 커져요. 라벨 본인은 이 곡을 음악이 없는 오케스트라 작품이라고 부르며 일종의 실험이라고 했는데, 정작 그의 가장 유명한 곡이 됐답니다.","b":"들으실 때는 작은북의 같은 리듬이 십오 분 내내 이어지는 걸 느껴 보세요. 같은 선율을 플루트, 클라리넷, 바순 하고 악기가 바뀔 때마다 색깔이 달라져요. 그리고 마지막 순간, 계속되던 조성이 갑자기 바뀌며 모든 것이 무너지는 결말을 기다려 보세요."},"ravel-pavane":{"c":"ravel","a":"라벨의 죽은 왕녀를 위한 파반느예요. 파리 음악원 학생 시절에 쓴 피아노곡으로, 나중에 오케스트라로도 편곡했어요. 파반느는 옛 궁정의 느린 춤이에요. 제목 때문에 슬픈 사연이 있을 것 같지만, 라벨은 그저 프랑스어 제목의 소리가 좋아서 지었다고 말했대요. 옛 스페인 궁정에서 어린 공주가 추었을 법한 춤을 떠올린 곡이에요.","b":"들으실 때는 느리고 우아한 춤의 걸음걸이를 느껴 보세요. 첫 선율이 세 번 돌아오며 조금씩 다른 옷을 입어요. 오케스트라 버전이라면 호른이 부르는 첫 선율도 들어 보세요."},"ravel-concerto-g":{"c":"ravel","a":"라벨의 피아노 협주곡 사장조예요. 미국 연주 여행 때 재즈에 반한 라벨이 그 영향을 담아 쓴 협주곡이에요. 시작을 알리는 채찍 소리부터 블루스 화음까지 재즈의 색이 가득하죠. 라벨은 이 곡을 모차르트와 생상스의 정신으로 썼다고 말했어요. 2악장은 피아노 혼자 긴 선율을 이어 가는 아름다운 악장이에요.","b":"들으실 때는 1악장 시작의 채찍 소리와 피콜로의 경쾌한 주제를 느껴 보세요. 2악장에서는 피아노 혼자 삼 분 가까이 고요한 노래를 불러요. 3악장은 서커스처럼 신나게 질주한답니다."},"ravel-lefthand":{"c":"ravel","a":"라벨의 왼손을 위한 피아노 협주곡이에요. 일차 세계대전에서 오른팔을 잃은 피아니스트 파울 비트겐슈타인의 의뢰로 쓴 곡이에요. 그는 유명한 철학자 비트겐슈타인의 형이에요. 왼손 하나로 두 손처럼 들리게 하는 놀라운 기법이 담겨 있죠. 비트겐슈타인이 처음에는 곡을 마음대로 고쳐 연주해서 라벨과 다투기도 했대요.","b":"들으실 때는 시작에서 콘트라바순이 가장 낮은 곳에서 기어오르는 서주를 느껴 보세요. 왼손 혼자 연주하는 장엄한 독주 부분이 있어요. 중간에는 재즈풍 행진도 나온답니다."},"ravel-jeux":{"c":"ravel","a":"라벨의 물의 유희예요. 파리 음악원 학생 시절에 쓴 곡으로, 스승 포레에게 바쳤어요. 분수와 폭포, 시냇물의 반짝임을 피아노로 그렸죠. 리스트의 에스테 별장의 분수에서 영향을 받았고, 드뷔시의 대표적인 피아노곡들보다 먼저 나와서 새로운 피아노 음악의 문을 열었어요.","b":"들으실 때는 높은 음역의 반짝이는 물방울 같은 소리를 느껴 보세요. 건반 위를 쓸어내리는 소리는 쏟아지는 물줄기예요. 물소리 속에서 떠오르는 선율도 찾아보세요."},"ravel-couperin":{"c":"ravel","a":"라벨의 쿠프랭의 무덤이에요. 십팔 세기 프랑스 작곡가 쿠프랭과 바로크 춤곡에 바치는 모음곡이에요. 일차 세계대전 때 운전병으로 참전했던 라벨은, 각 곡을 전사한 친구들에게 한 곡씩 바쳤어요. 슬픈 헌사와 달리 음악은 밝고 우아하답니다.","b":"들으실 때는 첫 곡에서 쉬지 않고 흐르는 빠른 음표들을 느껴 보세요. 네 번째 곡은 경쾌한 바로크 춤이에요. 마지막 곡에서는 손가락이 끊임없이 달리며 화려하게 마무리돼요."},"ravel-daphnis":{"c":"ravel","a":"라벨의 다프니스와 클로에 모음곡 2번이에요. 디아길레프의 발레단을 위해 쓴 발레 음악으로, 고대 그리스 목동 다프니스와 클로에의 사랑 이야기를 그렸어요. 모음곡 2번의 첫 곡 해돋이는, 오케스트라로 그린 가장 아름다운 새벽으로 꼽힌답니다.","b":"들으실 때는 해돋이에서 시냇물 소리 위로 떠오르는 해와 새소리를 느껴 보세요. 이어서 긴 플루트 독주가 흘러요. 마지막 춤에서는 합창까지 더해져 열광적으로 마무리돼요."},"ravel-rapsodie":{"c":"ravel","a":"라벨의 스페인 광시곡이에요. 라벨의 어머니는 스페인 국경 가까운 바스크 지방 출신으로, 어린 라벨에게 스페인 노래를 불러 줬대요. 이 곡은 라벨의 첫 관현악 대작이에요. 실제로 스페인에 가 본 적 없이 썼는데도, 스페인 작곡가 파야가 놀랍도록 스페인답다고 감탄했죠.","b":"들으실 때는 첫 곡에서 네 음짜리 신비로운 반복을 느껴 보세요. 세 번째 곡은 나른한 하바네라 춤이에요. 그리고 마지막 축제에서는 캐스터네츠와 탬버린이 신나게 터진답니다."},"ravel-lavalse":{"c":"ravel","a":"라벨의 라 발스예요. 원래 디아길레프의 발레를 위해 썼는데, 디아길레프는 걸작이지만 발레가 아니라 발레의 초상화라며 거절했어요. 십구 세기 빈 왈츠에 바치는 곡이지만, 일차 세계대전 직후에 쓰인 만큼 우아한 왈츠가 점점 일그러지며 파국으로 치달아요.","b":"들으실 때는 시작에서 안개 속으로 왈츠 조각들이 들려오는 걸 느껴 보세요. 화려한 무도회장이 펼쳐지다가, 마지막에는 왈츠가 소용돌이치며 무너지는 충격적인 끝을 맞는답니다."},"ravel-pictures":{"c":"ravel","a":"라벨이 편곡한 무소륵스키의 전람회의 그림이에요. 원곡은 러시아 작곡가 무소륵스키가 친구인 화가의 유작 전시회를 보고 쓴 피아노곡이에요. 지휘자 쿠세비츠키의 의뢰로 라벨이 오케스트라로 편곡하면서 세계적인 명곡이 됐죠. 오케스트라의 마술사 라벨의 솜씨가 가장 잘 드러나는 작품이에요.","b":"들으실 때는 그림 사이를 걸어가는 트럼펫의 프롬나드 주제를 기억해 두세요. 소달구지에서는 튜바 독주가 무겁게 걸어가요. 그리고 마지막 키예프의 대문에서는 종소리와 함께 장엄하게 마무리된답니다."},"rach-pc2":{"c":"rachmaninoff","a":"라흐마니노프의 피아노 협주곡 2번이에요. 교향곡 1번이 처참하게 실패한 뒤 우울에 빠져 작곡을 하지 못하던 라흐마니노프는, 한 의사에게 치료를 받았어요. 의사는 당신은 훌륭한 협주곡을 쓰게 될 거라는 말을 되풀이해 들려줬다고 해요. 자신감을 되찾고 완성한 이 곡은 대성공을 거뒀고, 라흐마니노프는 이 곡을 그 의사에게 바쳤어요. 수많은 영화와 대중음악에 쓰인 곡이에요.","b":"들으실 때는 도입에서 피아노 혼자 종소리처럼 점점 커지는 여덟 개의 화음을 느껴 보세요. 1악장에서는 오케스트라가 거대한 주제를 노래하고, 피아노가 물결처럼 감싸요. 2악장에서는 플루트와 클라리넷이 꿈결 같은 선율을 부른답니다."},"rach-paganini":{"c":"rachmaninoff","a":"라흐마니노프의 파가니니 주제에 의한 랩소디예요. 리스트의 라 캄파넬라처럼, 이 곡도 파가니니의 바이올린 곡에서 주제를 가져왔어요. 미국 망명 중 스위스 별장에서 쓴 곡으로, 스물네 개의 변주로 이루어져 있죠. 가장 유명한 18변주는 파가니니의 주제를 거꾸로 뒤집고 느리게 늘린 거예요. 라흐마니노프는 이건 내 매니저를 위한 변주라고 농담했대요. 청중이 좋아할 줄 알았던 거죠.","b":"들으실 때는 18변주 첫 소절, 피아노가 혼자 조용히 꺼내는 뒤집힌 주제를 느껴 보세요. 같은 선율을 오케스트라 전체가 이어받아 부풀어 올라요. 처음 주제와 비교해 들어 보면, 같은 재료라는 게 신기하답니다."},"rach-prelude-c#":{"c":"rachmaninoff","a":"라흐마니노프의 전주곡 올림다단조예요. 열아홉 살의 라흐마니노프가 쓴 곡으로, 발표되자마자 세계적인 인기를 얻었어요. 하지만 판권을 출판사에 헐값에 넘겨서 인세는 거의 받지 못했죠. 연주회마다 청중이 이 곡을 앙코르로 청해서, 라흐마니노프는 이 곡에 질려 버렸대요.","b":"들으실 때는 시작에서 크렘린 종소리 같은 세 개의 무거운 음을 느껴 보세요. 중간에는 폭풍처럼 몰아치는 빠른 부분이 나와요. 마지막에는 네 단으로 펼친 거대한 화음이 울린답니다."},"rach-vocalise":{"c":"rachmaninoff","a":"라흐마니노프의 보칼리제예요. 가사 없이 아 같은 모음 하나로만 부르는 노래예요. 한 소프라노 가수에게 바친 곡이죠. 가사가 없어서 바이올린, 첼로, 오케스트라처럼 수많은 악기로 편곡되어 연주돼요.","b":"들으실 때는 말 대신 목소리 자체로만 부르는, 끝없이 이어지는 선율을 느껴 보세요. 아래에서는 화음이 느리게 내려앉아요. 마지막에 길게 숨을 이어 가는 높은 음이 아름답답니다."},"rach-pc3":{"c":"rachmaninoff","a":"라흐마니노프의 피아노 협주곡 3번이에요. 첫 미국 연주 여행을 위해 쓴 곡이에요. 미국으로 가는 배 위에서 소리가 나지 않는 연습용 건반으로 연습했대요. 피아노 협주곡 가운데 가장 어려운 곡 중 하나로 꼽히고, 영화 샤인의 소재가 되기도 했어요. 초연 몇 달 뒤에는 말러의 지휘로 뉴욕에서 다시 연주됐답니다.","b":"들으실 때는 시작에서 피아노가 조용히 부르는 러시아 성가 같은 선율을 느껴 보세요. 1악장 독주 부분에서는 거대한 화음이 쏟아져요. 그리고 3악장 끝, 모든 주제가 모이는 승리의 클라이맥스를 기다려 보세요."},"rach-sym2":{"c":"rachmaninoff","a":"라흐마니노프의 교향곡 2번이에요. 교향곡 1번의 처참한 실패 뒤, 십 년 만에 쓴 교향곡으로 이번에는 큰 성공을 거뒀어요. 3악장에서 클라리넷이 길게 부르는 선율은, 라흐마니노프의 가장 아름다운 선율 가운데 하나로 꼽혀요.","b":"들으실 때는 1악장에서 어둠 속에서 서서히 깨어나는 서주를 느껴 보세요. 3악장에서는 클라리넷 독주가 끝없이 노래해요. 4악장은 축제처럼 밝게 마무리된답니다."},"rach-isle":{"c":"rachmaninoff","a":"라흐마니노프의 죽음의 섬이에요. 스위스 화가 뵈클린의 그림 죽음의 섬을 흑백 복제화로 보고 쓴 교향시예요. 뱃사공이 관을 실은 배를 저어 어두운 섬으로 향하는 장면이죠. 라흐마니노프는 나중에 색이 있는 원화를 보고, 색이 있었다면 이 곡을 쓰지 않았을 거라고 말했대요.","b":"들으실 때는 다섯 박자로 흔들리는 노 젓는 리듬을 느껴 보세요. 중세 장례 성가인 진노의 날 선율이 숨어 있어요. 중간에는 삶을 돌아보는 듯한 격정이 일어난답니다."},"rach-vespers":{"c":"rachmaninoff","a":"라흐마니노프의 철야 기도 가운데 다섯 번째 곡이에요. 러시아 정교회 철야 예배를 위한 무반주 합창곡으로, 일차 세계대전 중 모스크바에서 초연됐어요. 라흐마니노프는 이 다섯 번째 곡을 자신의 장례식에서 불러 주길 바랐대요. 마지막에 베이스가 아주아주 낮은 음까지 내려가는 것으로 유명해요.","b":"들으실 때는 악기 없이 사람 목소리만으로 만드는 깊은 울림을 느껴 보세요. 테너 독창이 따뜻한 기도를 불러요. 그리고 마지막, 베이스의 아주 낮은 하강을 기다려 보세요."},"rach-dances":{"c":"rachmaninoff","a":"라흐마니노프의 교향적 무곡이에요. 미국 롱아일랜드에서 쓴 라흐마니노프의 마지막 작품이에요. 망명 뒤 작곡이 크게 줄었던 그가 남긴 마지막 대작이죠. 1악장에서 알토 색소폰이 향수 어린 선율을 부르고, 마지막에는 실패했던 교향곡 1번의 주제를 조용히 인용해요.","b":"들으실 때는 1악장에서 알토 색소폰의 쓸쓸한 러시아풍 선율을 느껴 보세요. 2악장은 유령 같은 왈츠예요. 3악장에서는 진노의 날 선율과 러시아 성가가 맞서 싸운답니다."},"rach-prelude-g":{"c":"rachmaninoff","a":"라흐마니노프의 전주곡 사단조예요. 피아노 협주곡 2번으로 다시 일어선 무렵에 쓴 전주곡으로, 군대 행진곡 같은 리듬으로 유명해요. 라흐마니노프는 결국 모든 장조와 단조로 스물네 곡의 전주곡을 완성했답니다.","b":"들으실 때는 행진곡 같은 날카로운 리듬을 느껴 보세요. 중간에는 갑자기 꿈결 같은 서정이 펼쳐져요. 그리고 행진이 다시 힘차게 돌아온답니다."},"sibelius-finlandia":{"c":"sibelius","a":"시벨리우스의 핀란디아예요. 러시아의 언론 탄압에 항의하는 행사를 위해 쓴 곡이에요. 검열을 피하려고 다른 제목으로 연주되기도 했다고 전해져요. 중간의 찬가 선율은 나중에 가사가 붙어 핀란디아 찬가로 불리며, 핀란드의 두 번째 국가처럼 사랑받고 있어요.","b":"들으실 때는 시작에서 금관악기의 무겁고 위협적인 화음, 억압을 느껴 보세요. 빠른 부분에서는 투쟁의 리듬이 이어져요. 그리고 중간에 목관악기가 부르는 고요하고 경건한 찬가에 귀 기울여 보세요."},"sibelius-vc":{"c":"sibelius","a":"시벨리우스의 바이올린 협주곡이에요. 젊은 시절 바이올리니스트를 꿈꿨던 시벨리우스가 남긴 유일한 협주곡이에요. 초연이 좋지 않아서 크게 고쳐 썼고, 지금은 그 고친 버전이 연주돼요. 이십 세기에 쓰인 바이올린 협주곡 가운데 가장 많이 연주되는 곡 중 하나랍니다.","b":"들으실 때는 시작에서 얼음 같은 현악기의 떨림 위로 떠오르는 바이올린을 느껴 보세요. 1악장 한가운데에는 긴 독주 부분이 있어요. 3악장은 팀파니와 함께 쿵쿵 울리는 리듬이 북극곰의 춤 같다는 별명을 얻었답니다."},"sibelius-sym2":{"c":"sibelius","a":"시벨리우스의 교향곡 2번이에요. 이탈리아에 머물며 쓰기 시작한 교향곡이에요. 시벨리우스 본인은 아니라고 했지만, 핀란드 사람들은 이 곡을 독립을 향한 민족의 노래로 받아들였어요. 조각난 짧은 동기들이 모여 점점 거대한 선율로 자라나는 방식이 특징이에요.","b":"들으실 때는 1악장에서 현악기가 되풀이하는 물결 같은 화음과 목관악기의 짧은 선율을 느껴 보세요. 3악장에서 쉬지 않고 4악장으로 넘어가는 순간이 있어요. 그리고 4악장 끝, 금관이 울리는 장엄한 승리의 주제를 기다려 보세요."},"sibelius-valse":{"c":"sibelius","a":"시벨리우스의 슬픈 왈츠예요. 처남이 쓴 연극 죽음을 위해 만든 곡이에요. 병상에 누운 여인이 꿈속에서 유령들과 왈츠를 추다가, 죽음이 문을 두드리는 장면이죠. 시벨리우스는 이 곡의 판권을 헐값에 넘겨서, 큰 인기를 얻고도 돈은 거의 벌지 못했대요.","b":"들으실 때는 약음기를 낀 현악기의 희미한 왈츠를 느껴 보세요. 춤이 점점 빨라지며 열광해요. 그리고 갑자기 멈추는 춤, 문을 두드리는 죽음의 순간을 기다려 보세요."},"sibelius-karelia":{"c":"sibelius","a":"시벨리우스의 카렐리야 모음곡이에요. 핀란드 동쪽 카렐리야 지방의 역사를 담은 연극을 위해 쓴 음악이에요. 카렐리야는 핀란드 서사시 칼레발라의 고향으로 여겨지는 곳이에요. 세 곡으로 된 모음곡인데, 특히 마지막 행진곡이 유명해요.","b":"들으실 때는 첫 곡에서 멀리서 다가오는 호른과 행렬을 느껴 보세요. 두 번째 곡에서는 잉글리시 호른이 쓸쓸한 노래를 불러요. 마지막 곡은 경쾌하고 당당한 행진이랍니다."},"sibelius-swan":{"c":"sibelius","a":"시벨리우스의 투오넬라의 백조예요. 핀란드 서사시 칼레발라에서 가져온 이야기예요. 저승 투오넬라를 둘러싼 검은 강 위를, 신성한 백조가 노래하며 떠다니죠. 잉글리시 호른이 백조의 노래를 맡아 처음부터 끝까지 길게 이어 가요.","b":"들으실 때는 잉글리시 호른의 독주, 백조의 노래를 따라가 보세요. 현악기의 어둡고 넓은 화음은 검은 강이에요. 첼로 독주가 백조와 대화하는 장면도 놓치지 마세요."},"sibelius-sym5":{"c":"sibelius","a":"시벨리우스의 교향곡 5번이에요. 쉰 살 생일을 위해 썼다가 두 번이나 고쳐서 1919년에야 완성했어요. 일차 세계대전과 핀란드 독립의 시기였죠. 시벨리우스는 일기에 백조 열여섯 마리가 날아가는 걸 보고 크게 감동했다고 적었는데, 그 장면이 4악장의 백조의 찬가가 됐어요.","b":"들으실 때는 1악장이 호른의 부드러운 부름으로 열리는 걸 느껴 보세요. 4악장에서는 호른이 큰 종을 흔들 듯 백조의 찬가를 울려요. 그리고 마지막, 사이를 두고 내리치는 여섯 번의 화음을 세어 보세요."},"sibelius-festivo":{"c":"sibelius","a":"시벨리우스의 안단테 페스티보예요. 원래 한 공장의 이십오 주년 기념행사를 위해 현악사중주로 쓴 곡이에요. 나중에 현악 오케스트라와 팀파니로 다시 편성했죠. 1939년 시벨리우스가 직접 지휘해 라디오로 방송한 녹음이 남아 있는데, 그가 지휘한 몇 안 되는 녹음이에요. 핀란드에서는 나라의 추모 행사 때 자주 연주된답니다.","b":"들으실 때는 느리고 장엄한 현악기의 찬가를 느껴 보세요. 성가처럼 경건한 화음이 흘러가요. 마지막에는 팀파니와 함께 화음이 부풀어 오른답니다."},"sibelius-sym7":{"c":"sibelius","a":"시벨리우스의 교향곡 7번이에요. 시벨리우스의 마지막 교향곡으로, 악장 구분 없이 하나로 이어지는 단악장 교향곡이에요. 처음에는 교향적 환상곡이라는 이름으로 초연했어요. 이십 분 남짓한 시간 안에 교향곡 전체가 압축되어 있고, 이후 그는 교향곡을 더 발표하지 않았어요.","b":"들으실 때는 시작에서 팀파니와 현악기가 계단처럼 올라가는 음계를 느껴 보세요. 트롬본의 장엄한 주제가 곡 안에서 세 번 등장해요. 마지막에는 거대한 화음으로 모든 것이 풀린답니다."},"sibelius-tapiola":{"c":"sibelius","a":"시벨리우스의 타피올라예요. 칼레발라에 나오는 숲의 신 타피오의 세계를 그린 교향시로, 시벨리우스의 마지막 대규모 관현악곡이에요. 짧은 동기 하나가 곡 전체를 끌고 가면서, 끝없이 이어진 북쪽 숲의 어둡고 신비로운 기운을 만들어 내요.","b":"들으실 때는 시작에서 현악기의 낮은 동기, 깊은 숲을 느껴 보세요. 숲의 정령들이 목관악기로 속삭여요. 그리고 폭풍이 숲을 휘감는 현악기의 거대한 소용돌이를 기다려 보세요."},"stravinsky-firebird":{"c":"stravinsky","a":"스트라빈스키의 불새 모음곡이에요. 러시아 민담 속 불새와 왕자 이반, 악당 마왕 카셰이의 이야기를 그린 발레예요. 원래 다른 작곡가에게 맡겼던 작품이 스물여덟 살의 스트라빈스키에게 넘어왔죠. 1910년 파리 초연으로 스트라빈스키는 하룻밤 사이에 유명해졌어요. 그는 이 곡을 여러 번 모음곡으로 엮었는데, 1919년판이 가장 많이 연주돼요.","b":"들으실 때는 카셰이의 지옥의 춤에서 큰 타격으로 시작하는 격렬한 춤을 느껴 보세요. 자장가에서는 바순이 신비로운 선율을 불러요. 그리고 피날레에서 호른의 선율이 점점 커지며 장엄하게 마무리된답니다."},"stravinsky-rite":{"c":"stravinsky","a":"스트라빈스키의 봄의 제전이에요. 고대 러시아의 부족이 봄의 신에게 처녀를 제물로 바치는 의식을 그린 발레예요. 1913년 파리 초연 때, 불협화음과 거친 리듬, 낯선 안무에 객석에서 야유와 고함이 터져 소동이 벌어졌어요. 지금은 이십 세기 음악의 가장 중요한 작품 가운데 하나로 꼽혀요.","b":"들으실 때는 시작에서 바순이 아주 높은 음역에서 부르는 낯선 선율을 느껴 보세요. 이어서 같은 화음을 엇박으로 계속 내리치는 현악기가 나와요. 마지막 희생의 춤에서는 박자가 계속 바뀌며 격렬하게 몰아친답니다."},"stravinsky-petrushka":{"c":"stravinsky","a":"스트라빈스키의 페트루슈카예요. 상트페테르부르크의 겨울 축제 시장에서, 마술사가 꼭두각시 인형 셋에게 생명을 불어넣는 이야기예요. 페트루슈카는 슬픈 광대 인형이죠. 두 개의 조성을 동시에 울리는 화음이 유명하고, 원래 피아노 협주곡으로 구상했던 곡이라 피아노가 크게 활약해요.","b":"들으실 때는 첫 장면에서 축제 시장의 시끌벅적한 군중을 느껴 보세요. 두 번째 장면에서는 클라리넷 두 대가 서로 다른 조로 페트루슈카의 화음을 불러요. 마지막 장면에서는 유모의 춤, 곰 조련사 같은 축제의 장면들이 펼쳐진답니다."},"stravinsky-soldier":{"c":"stravinsky","a":"스트라빈스키의 병사의 이야기예요. 일차 세계대전과 러시아 혁명으로 수입이 끊긴 시기, 작은 극단이 돌아다니며 공연할 수 있도록 일곱 명의 연주자와 해설자를 위해 쓴 음악극이에요. 고향으로 가던 병사가 바이올린을 악마에게 넘기는 러시아 민담이죠. 재즈와 탱고, 래그타임의 영향이 보여요.","b":"들으실 때는 병사의 행진에서 콘트라베이스와 트롬본의 행진을 느껴 보세요. 탱고, 왈츠, 래그타임, 세 춤곡이 이어지는 장면도 재미있어요. 마지막 악마의 승리 행진은 타악기만 남으며 끝난답니다."},"stravinsky-pulcinella":{"c":"stravinsky","a":"스트라빈스키의 풀치넬라 모음곡이에요. 디아길레프가 십팔 세기 이탈리아 음악을 가져와 발레로 편곡해 달라고 맡긴 작품이에요. 옛 음악에 현대적인 화음과 리듬을 입히면서, 스트라빈스키의 신고전주의 시대가 시작됐죠. 그는 이 곡을 두고 과거의 발견이라고 말했어요.","b":"들으실 때는 첫 곡이 바로크 음악처럼 시작하는 걸 느껴 보세요. 세레나타에서는 오보에가 우아하게 노래해요. 그리고 트롬본과 콘트라베이스가 익살스럽게 주고받는 이중주도 찾아보세요."},"stravinsky-psalms":{"c":"stravinsky","a":"스트라빈스키의 시편 교향곡이에요. 보스턴 교향악단 창립 오십 주년을 위해 쓴 곡이에요. 스트라빈스키는 악보에 하느님의 영광과 보스턴 교향악단에 바친다고 적었어요. 구약 성경의 시편을 라틴어로 노래하는 합창 교향곡인데, 오케스트라에서 바이올린과 비올라를 빼서 차갑고 투명한 소리를 만들었어요.","b":"들으실 때는 첫 악장에서 쿵 하고 울리는 화음을 느껴 보세요. 두 번째 악장에서는 목관악기가 촘촘한 대위법을 펼쳐요. 마지막 악장 끝에서는 거의 멈춘 듯한 할렐루야와 찬양이 이어진답니다."},"stravinsky-sym3":{"c":"stravinsky","a":"스트라빈스키의 3악장의 교향곡이에요. 이차 세계대전 중 미국에서 쓴 교향곡이에요. 스트라빈스키는 이 곡에 전쟁 뉴스 영상 속 장면들이 반영되어 있다고 말했어요. 피아노와 하프가 각각 협주곡처럼 활약하는 독특한 교향곡이에요.","b":"들으실 때는 1악장에서 피아노가 강하게 리듬을 이끄는 걸 느껴 보세요. 2악장은 하프가 중심이 되는 고요한 간주예요. 3악장에서는 행진과 대위법이 섞여 격렬하게 마무리된답니다."},"stravinsky-ebony":{"c":"stravinsky","a":"스트라빈스키의 에보니 협주곡이에요. 재즈 클라리네티스트 우디 허먼과 그의 빅밴드를 위해 쓴 곡이에요. 에보니는 클라리넷을 만드는 나무, 흑단을 뜻해요. 클래식 작곡가가 재즈 빅밴드를 위해 정식으로 쓴 협주곡이라 특별하죠.","b":"들으실 때는 1악장에서 클라리넷과 빅밴드의 재즈 리듬을 느껴 보세요. 2악장은 블루스풍의 느린 선율이에요. 3악장은 주제와 변주로 경쾌하게 마무리된답니다."},"stravinsky-dumbarton":{"c":"stravinsky","a":"스트라빈스키의 덤바턴 오크스 협주곡이에요. 미국 워싱턴의 덤바턴 오크스 저택에 사는 부부가 결혼 삼십 주년을 기념해 의뢰한 곡이에요. 열다섯 명 정도의 작은 오케스트라를 위한 곡으로, 스트라빈스키는 바흐의 브란덴부르크 협주곡을 즐겨 연구하던 중에 이 곡을 썼다고 말했어요.","b":"들으실 때는 1악장에서 바흐 협주곡 같은 끊임없는 리듬을 느껴 보세요. 2악장에서는 악기들이 섬세하게 대화해요. 3악장은 현악기가 되풀이하는 경쾌한 화음으로 끝난답니다."},"stravinsky-circus":{"c":"stravinsky","a":"스트라빈스키의 서커스 폴카예요. 안무가 발란신의 의뢰로 쓴 곡이에요. 미국의 한 서커스에서 코끼리 오십 마리가 발레복을 입고 춤추는 공연에 쓰였대요. 곡 마지막에는 슈베르트의 군대 행진곡 선율을 비틀어 넣어 웃음을 주죠.","b":"들으실 때는 어색하게 엇갈리는 폴카 리듬, 코끼리의 발걸음을 느껴 보세요. 관악기가 익살스러운 선율을 불러요. 그리고 마지막에 슈베르트 군대 행진곡의 우스꽝스러운 인용을 찾아보세요."},"gershwin-rhapsody":{"c":"gershwin","a":"조지 거슈윈의 랩소디 인 블루예요. 1924년 겨울, 거슈윈은 신문을 보다가 깜짝 놀랐다고 해요. 밴드 리더 폴 화이트먼의 음악회에서 자기가 새 곡을 발표한다는 기사가 실려 있었거든요. 남은 시간은 고작 몇 주. 그런데 보스턴으로 가는 기차 안에서, 덜컹거리는 바퀴 소리를 듣다가 곡 전체가 머릿속에 그려졌다고 합니다. 그렇게 재즈가 처음으로 연주회장 한가운데에 당당히 들어서게 되죠.","b":"들으실 때 세 가지만 기억해 주세요. 첫째, 맨 처음 클라리넷이 낮은 음에서 쭈욱 미끄러지듯 올라가는 소리. 둘째, 피아노 혼자 재즈 리듬으로 신나게 달리는 부분. 그리고 셋째, 중간쯤 오케스트라 전체가 넓고 낭만적인 선율을 펼치는 순간이에요. 마치 뉴욕의 밤하늘 같은 장면이죠."},"gershwin-american":{"c":"gershwin","a":"거슈윈의 파리의 아메리칸이에요. 파리를 여행하며 쓴 곡으로, 파리 거리를 걸어 다니는 미국인의 하루를 그렸어요. 거슈윈은 파리에서 진짜 택시 경적을 사 와서 오케스트라에 넣었대요. 1951년에는 같은 제목의 뮤지컬 영화가 아카데미 작품상을 받았어요.","b":"들으실 때는 시작의 경쾌하게 걷는 산책 주제를 느껴 보세요. 택시 경적이 울리는 혼잡한 거리도 나와요. 그리고 트럼펫이 부르는 블루스에서, 고향이 그리운 마음을 느껴 보세요."},"gershwin-summertime":{"c":"gershwin","a":"거슈윈의 서머타임이에요. 미국 남부 흑인 마을을 배경으로 한 오페라 포기와 베스의 첫 곡이에요. 클래라라는 젊은 엄마가 아기에게 불러 주는 자장가죠. 오페라 아리아이면서 재즈 명곡이 되어서, 엘라 피츠제럴드, 마일스 데이비스 같은 수많은 음악가가 다시 불렀어요.","b":"들으실 때는 나른한 여름날 같은 느린 블루스를 느껴 보세요. 흑인 영가와 재즈의 색이 섞인 화음이 흘러요. 부드럽게 흔들리는 자장가 리듬에 몸을 맡겨 보세요."},"gershwin-concerto":{"c":"gershwin","a":"거슈윈의 피아노 협주곡 바장조예요. 랩소디 인 블루가 성공한 뒤 뉴욕의 한 오케스트라의 의뢰로 쓴 곡이에요. 이번에는 오케스트라 편곡까지 거슈윈이 직접 했죠. 클래식 협주곡의 세 악장 형식에, 찰스턴 같은 재즈 춤 리듬과 블루스를 담았어요.","b":"들으실 때는 1악장에서 팀파니로 시작하는 찰스턴 리듬을 느껴 보세요. 2악장에서는 약음기 낀 트럼펫이 블루스를 불러요. 3악장은 기관총처럼 빠른 리듬으로 달리는 피날레랍니다."},"gershwin-preludes":{"c":"gershwin","a":"거슈윈의 피아노를 위한 세 개의 전주곡이에요. 거슈윈이 직접 연주회에서 초연한 짧은 피아노곡 세 곡이에요. 쇼팽의 전주곡처럼 짧은 곡 안에 하나의 분위기를 담았죠. 재즈와 블루스, 라틴 리듬이 섞여 있어서 클래식 피아니스트와 재즈 피아니스트 모두가 즐겨 연주해요.","b":"들으실 때는 첫 곡에서 탱고 같은 리듬의 경쾌함을 느껴 보세요. 두 번째 곡은 느릿한 블루스예요. 거슈윈은 블루스 자장가라고 불렀대요. 세 번째 곡은 짧고 화끈하게 끝난답니다."},"gershwin-cuban":{"c":"gershwin","a":"거슈윈의 쿠바 서곡이에요. 쿠바 아바나에서 이 주 동안 휴가를 보내며 들은 룸바 음악에 반해서 쓴 곡이에요. 악보에는 마라카스, 클라베스, 봉고 같은 쿠바 타악기를 지휘자 바로 앞에 놓으라고 적어 두었대요.","b":"들으실 때는 쿠바 타악기들이 만드는 룸바 리듬을 느껴 보세요. 중간에는 느리고 관능적인 부분이 나와요. 그리고 다시 축제의 리듬이 돌아온답니다."},"gershwin-rhythm":{"c":"gershwin","a":"거슈윈의 아이 갓 리듬 변주곡이에요. 거슈윈의 뮤지컬 히트곡 아이 갓 리듬의 선율을 주제로, 피아노와 오케스트라를 위해 쓴 변주곡이에요. 형 아이라에게 바쳤죠. 이 노래의 화음 진행은 재즈 음악가들 사이에서 리듬 체인지라고 불리며, 수많은 재즈 곡의 뼈대가 됐어요.","b":"들으실 때는 시작에서 클라리넷이 제시하는 짧은 주제를 기억해 두세요. 왈츠, 중국풍, 재즈처럼 다양한 모습으로 변주돼요. 마지막에는 피아노와 오케스트라가 함께 신나게 질주한답니다."},"gershwin-someone":{"c":"gershwin","a":"거슈윈의 섬원 투 워치 오버 미예요. 거슈윈이 작곡하고 형 아이라가 가사를 쓴 뮤지컬 노래예요. 처음엔 빠른 곡으로 썼다가 느리게 바꿨더니 훨씬 좋아졌대요. 나를 지켜 줄 누군가를 기다리는 노래로, 프랭크 시나트라 같은 수많은 가수가 불러서 재즈 명곡이 됐어요.","b":"들으실 때는 느리고 부드러운 발라드 선율을 느껴 보세요. 블루스 화음의 따뜻한 반주가 감싸 줘요. 마지막 구절에 담긴 그리움에 귀 기울여 보세요."},"gershwin-manilove":{"c":"gershwin","a":"거슈윈의 더 맨 아이 러브예요. 원래 뮤지컬에 넣었다가 몇 번이나 빠진 노래예요. 그런데도 영국과 미국에서 따로 인기를 얻어서 거슈윈의 대표곡이 됐죠. 선율 아래에서 화음이 한 칸씩 내려가며 되풀이되고, 사랑할 사람을 기다리는 마음을 그려요.","b":"들으실 때는 조용히 되풀이되는 단순한 선율을 느껴 보세요. 그 아래에서 화음이 한 칸씩 내려가요. 연주자마다 다르게 바꾸는 즉흥의 재미도 즐겨 보세요."},"gershwin-lullaby":{"c":"gershwin","a":"거슈윈의 현악사중주를 위한 자장가예요. 이십 대 초반, 화성학을 공부하던 시절 연습 삼아 쓴 곡이에요. 살아 있을 때는 출판되지 않고 친구들 사이에서만 연주되다가, 그가 세상을 떠난 뒤 알려졌어요. 거슈윈이 클래식 작곡을 진지하게 공부했다는 걸 보여 주는 작품으로, 블루스의 화음이 부드럽게 스며 있어요.","b":"들으실 때는 약음기 낀 현악기의 부드러운 소리를 느껴 보세요. 유리처럼 맑은 높은 음으로 첫 화음이 울려요. 블루스 느낌의 선율이 은은하게 흐르는 중간부도 놓치지 마세요."}},"c":{"vivaldi":{"s":"안토니오 비발디. 붉은 머리의 사제이자, 협주곡의 대가예요. 비발디는 베네치아의 신부였는데, 머리카락이 붉어서 빨간 머리 신부라고 불렸어요. 몸이 약해서 미사를 드리는 대신, 피에타라는 고아원에서 소녀들에게 음악을 가르쳤죠. 그런데 이 소녀 오케스트라가 얼마나 훌륭했던지, 유럽의 여행객들이 일부러 찾아와 들을 정도였다고 해요. 비발디는 협주곡을 오백 곡 넘게 썼지만, 말년에는 유행에서 밀려나 빈에서 쓸쓸하게 세상을 떠났어요. 그러다 이십 세기에 악보가 무더기로 발견되면서 다시 사랑받게 됐답니다. 왜 이런 음악이 나올 수 있었을까요? 그때는 독주 악기가 오케스트라와 주고받는 협주곡이라는 형식이 막 꽃피던 시기였어요. 매주 공연해야 하는 고아원 오케스트라라는 실험실이 있었기에, 비발디는 수백 곡을 쓰면서 협주곡의 모양을 다듬어 갈 수 있었죠.","w":"그 무렵 비발디 이야기를 조금 더 해 볼게요. 그때는 독주 악기가 오케스트라와 주고받는 협주곡이 막 꽃피던 시기였어요. 비발디에게는 매주 공연하는 고아원 오케스트라라는 실험실이 있었고, 덕분에 수백 곡의 협주곡을 쓰며 형식을 다듬을 수 있었답니다."},"bach":{"s":"요한 제바스티안 바흐. 음악의 아버지, 서양 음악의 문법책을 쓴 사람이에요. 바흐는 대대로 음악가인 집안에서 태어나, 평생 독일 밖으로 거의 나가지 않았어요. 궁정 음악가로 일하다가 1723년부터는 라이프치히 토마스 교회의 음악감독이 되어, 세상을 떠날 때까지 매주 교회 칸타타를 써야 했죠. 자녀가 무려 스무 명이었대요. 살아 있을 때는 작곡가보다 뛰어난 오르간 연주자로 더 유명했고, 세상을 떠난 뒤에는 구식이라며 거의 잊혔어요. 그러다 1829년, 스무 살의 멘델스존이 마태수난곡을 다시 무대에 올리면서 재발견됐죠. 지금은 모든 음악가가 공부하는 교과서가 됐어요. 왜 이런 음악이 나왔을까요? 교회와 궁정이 음악을 주문하던 시대, 바흐는 신의 영광을 위해 매주 새 곡을 써야 했어요. 그 엄청난 작업량 속에서, 여러 선율을 수학처럼 정교하게 엮는 대위법을 끝까지 밀어붙였죠. 신앙과 직업과 장인정신이 한 사람 안에서 만난 거예요.","w":"그 무렵 바흐 이야기를 조금 더 해 볼게요. 교회와 궁정이 음악을 주문하던 시대, 바흐는 매주 새 곡을 써야 했어요. 그 엄청난 작업량 속에서 여러 선율을 정교하게 엮는 대위법을 끝까지 밀어붙였죠. 신앙과 직업과 장인정신이 한 사람 안에서 만난 결과랍니다."},"handel":{"s":"게오르크 프리드리히 헨델. 바흐와 같은 해에 태어난, 국제적인 흥행 작곡가예요. 헨델은 바흐와 같은 1685년 독일에서 태어났지만, 두 사람은 끝내 한 번도 만나지 못했어요. 이탈리아에서 오페라를 배운 뒤 런던으로 건너가 영국 사람이 되었고, 이탈리아 오페라 사업으로 큰돈을 벌기도, 크게 잃기도 했죠. 오페라 인기가 시들자 영어로 부르는 오라토리오로 방향을 바꿔 대성공을 거뒀어요. 묘하게도 말년에는 바흐와 같은 안과 의사에게 눈 수술을 받고, 두 사람 모두 시력을 잃었답니다. 왜 이런 음악이 나왔을까요? 바흐가 교회에 고용된 장인이었다면, 헨델은 시장에서 표를 팔아야 하는 사업가였어요. 런던이라는 대도시의 청중을 상대했기에, 그의 음악은 더 극적이고 웅장하고, 듣자마자 귀에 쏙 들어온답니다.","w":"그 무렵 헨델 이야기를 조금 더 해 볼게요. 바흐가 교회에 고용된 장인이었다면, 헨델은 표를 팔아야 하는 사업가였어요. 런던이라는 대도시의 청중을 상대했기에, 그의 음악은 더 극적이고 웅장하고, 듣자마자 귀에 들어온답니다."},"haydn":{"s":"프란츠 요제프 하이든. 교향곡의 아버지, 유머 넘치는 파파 하이든이에요. 하이든은 가난한 수레바퀴 장인의 아들로 태어났어요. 삼십 년 가까이 헝가리 귀족 에스테르하지 가문의 궁정 악장으로 일하며 시골 궁전에 고립되어 지냈는데, 본인은 그래서 독창적일 수밖에 없었다고 돌아봤죠. 후원자가 세상을 떠난 뒤에는 예순의 나이에 런던으로 건너가 대스타가 됐어요. 교향곡 백네 곡, 현악사중주 예순여덟 곡을 남겼고, 모차르트와는 나이를 뛰어넘은 친구, 베토벤에게는 스승이었답니다. 왜 이런 음악이 나왔을까요? 외딴 궁전에 전속 오케스트라가 있었기에, 하이든은 매일 새로운 실험을 하고 바로 들어볼 수 있었어요. 그 삼십 년의 실험이 교향곡과 현악사중주라는 형식을 완성했죠.","w":"그 무렵 하이든 이야기를 조금 더 해 볼게요. 외딴 궁전에 전속 오케스트라가 있었기에, 하이든은 매일 새로운 실험을 하고 바로 들어볼 수 있었어요. 그 삼십 년의 실험이 교향곡과 현악사중주라는 형식을 완성했답니다."},"mozart":{"s":"볼프강 아마데우스 모차르트. 서른다섯 해를 산 천재, 어떤 장르든 완벽했던 사람이에요. 모차르트는 다섯 살에 작곡을 시작했고, 어린 시절 대부분을 아버지를 따라 유럽 곳곳을 돌며 연주하면서 보냈어요. 잘츠부르크 대주교 밑에서 일하다 갈등 끝에 1781년 쫓겨나듯 나와서, 빈에서 자유로운 음악가로 살았죠. 오페라, 교향곡, 협주곡, 실내악까지 모든 장르에서 걸작을 남겼지만 수입은 늘 불안했고, 서른다섯 살에 레퀴엠을 다 끝내지 못한 채 세상을 떠났어요. 왜 이런 음악이 나왔을까요? 궁정에 묶여 있던 하이든과 달리, 모차르트는 고용된 음악가에서 독립 예술가로 넘어가는 경계에 선 첫 세대였어요. 빈의 시민들을 상대로 직접 연주회를 열어야 했기에, 피아노 협주곡처럼 자신이 직접 빛날 수 있는 곡을 많이 썼답니다.","w":"그 무렵 모차르트 이야기를 조금 더 해 볼게요. 모차르트는 고용된 음악가에서 독립 예술가로 넘어가는 경계에 선 첫 세대였어요. 빈의 시민들을 상대로 직접 연주회를 열어야 했기에, 자신이 직접 빛날 수 있는 피아노 협주곡 같은 곡을 많이 썼답니다."},"beethoven":{"s":"루트비히 판 베토벤. 귀가 들리지 않는 작곡가, 고전에서 낭만으로 건너가는 다리 같은 사람이에요. 베토벤은 독일 본에서 태어나, 술에 기대 살던 아버지 밑에서 혹독하게 피아노를 배웠어요. 스물두 살에 빈으로 가서 하이든에게 배우고, 격정적인 즉흥 연주로 이름을 날렸죠. 그런데 이십 대 후반부터 귀가 들리지 않기 시작했고, 1802년에는 하일리겐슈타트에서 동생들에게 유서까지 썼어요. 하지만 예술이 나를 붙잡았다며 다시 일어섰고, 완전히 들리지 않게 된 뒤에도 교향곡 9번 같은 걸작을 남겼답니다. 왜 이런 음악이 나왔을까요? 프랑스 혁명과 나폴레옹의 시대, 개인의 자유와 의지가 새로운 가치가 됐어요. 베토벤은 귀족의 하인이 아니라 귀족과 대등한 예술가로 행동한 첫 작곡가였고, 고통을 이겨 내는 투쟁의 이야기를 음악에 담았죠. 그래서 그의 음악은 고전의 형식 안에 낭만의 감정이 끓고 있어요.","w":"그 무렵 베토벤 이야기를 조금 더 해 볼게요. 프랑스 혁명과 나폴레옹의 시대, 개인의 자유와 의지가 새로운 가치가 됐어요. 베토벤은 귀족과 대등한 예술가로 행동한 첫 작곡가였고, 고통을 이겨 내는 투쟁의 이야기를 음악에 담았답니다."},"schubert":{"s":"프란츠 슈베르트. 가곡의 왕, 서른한 해의 짧은 생애를 산 사람이에요. 슈베르트는 빈의 학교 선생님 아들로 태어나, 평생 빈을 거의 떠나지 않았어요. 가곡을 육백 곡 넘게 썼지만 살아 있을 때는 크게 유명하지 않았고, 친구들 집에 모여 그의 노래를 듣는 슈베르티아데라는 작은 모임이 그의 무대였죠. 평생 가난했고, 서른한 살에 세상을 떠났어요. 존경하던 베토벤의 장례식에서 횃불을 들었고, 이듬해 그 가까이에 묻혔답니다. 왜 이런 음악이 나왔을까요? 나폴레옹 전쟁이 끝난 뒤 빈은 검열과 감시가 심했어요. 사람들은 정치 대신 집 안의 작은 모임으로 숨어들었고, 그 친밀한 공간에서 시를 노래로 만드는 가곡이 꽃폈죠. 슈베르트는 그 시대 사람들의 속마음을 노래한 작곡가예요.","w":"그 무렵 슈베르트 이야기를 조금 더 해 볼게요. 나폴레옹 전쟁 뒤 빈은 검열과 감시가 심했어요. 사람들은 집 안의 작은 모임으로 숨어들었고, 그 친밀한 공간에서 시를 노래로 만드는 가곡이 꽃폈죠. 슈베르트는 그 시대의 속마음을 노래한 작곡가랍니다."},"mendelssohn":{"s":"펠릭스 멘델스존. 모든 것을 가진 신동이자, 바흐를 다시 살려 낸 사람이에요. 멘델스존은 베를린의 부유한 은행가 집안에서 태어나 최고의 교육을 받았어요. 할아버지는 유명한 철학자 모제스 멘델스존이었죠. 열일곱 살에 쓴 한여름 밤의 꿈 서곡은 지금도 천재의 상징처럼 이야기돼요. 스무 살에는 백 년 가까이 잊혀 있던 바흐의 마태수난곡을 무대에 올려 바흐 부활의 계기를 만들었고요. 라이프치히의 오케스트라를 이끌고 음악원까지 세웠지만, 가장 가까웠던 누나 파니가 세상을 떠난 지 반년 만에 서른여덟 살로 숨을 거뒀어요. 왜 이런 음악이 나왔을까요? 멘델스존은 낭만주의 시대를 살았지만 바흐와 모차르트의 균형 감각을 사랑했어요. 그래서 그의 음악은 감정이 넘치기보다 맑고 우아하고, 여행에서 본 풍경을 수채화처럼 그려 낸답니다.","w":"그 무렵 멘델스존 이야기를 조금 더 해 볼게요. 멘델스존은 낭만주의 시대를 살았지만 바흐와 모차르트의 균형 감각을 사랑했어요. 그래서 그의 음악은 맑고 우아하고, 여행에서 본 풍경을 수채화처럼 그려 낸답니다."},"chopin":{"s":"프레데리크 쇼팽. 피아노의 시인, 돌아가지 못한 조국을 평생 그리워한 사람이에요. 쇼팽은 폴란드 바르샤바 근처에서 태어난 신동이었어요. 스무 살에 유학길에 올랐는데, 떠나자마자 바르샤바에서 러시아에 맞선 봉기가 일어났다가 실패했고, 그는 다시는 고국에 돌아가지 못했죠. 파리에 자리 잡아 살롱의 스타가 됐고, 작가 조르주 상드와 구 년을 함께했어요. 결핵으로 서른아홉 살에 세상을 떠났는데, 유언에 따라 심장만은 바르샤바로 옮겨져 지금도 그곳 성당에 모셔져 있답니다. 왜 이런 음악이 나왔을까요? 이 무렵 피아노는 기계적으로 크게 발전해서, 노래하듯 길게 울리고 아주 섬세하게 강약을 조절할 수 있게 됐어요. 쇼팽은 거의 피아노곡만 썼는데, 이 새로운 악기의 가능성과 조국을 잃은 사람의 그리움이 만나 그만의 시적인 음악이 태어났죠.","w":"그 무렵 쇼팽 이야기를 조금 더 해 볼게요. 이 무렵 피아노는 크게 발전해서, 노래하듯 길게 울리고 섬세하게 강약을 조절할 수 있게 됐어요. 그 새로운 악기의 가능성과, 조국을 잃은 사람의 그리움이 만나 쇼팽만의 시적인 음악이 태어났답니다."},"schumann":{"s":"로베르트 슈만. 문학을 사랑한 피아노의 시인, 그리고 클라라와의 사랑으로 기억되는 사람이에요. 슈만은 원래 법학을 공부했지만, 피아니스트가 되겠다며 음악으로 돌아섰어요. 손가락을 다쳐 연주자의 꿈을 접은 뒤로는 작곡과 음악 평론에 몰두했죠. 직접 만든 음악 잡지에서 젊은 쇼팽을, 여러분 모자를 벗으십시오, 천재입니다라는 말로 소개하기도 했어요. 스승의 딸이자 당대 최고의 피아니스트 클라라와 사랑에 빠졌지만, 그녀의 아버지가 결혼을 반대해서 소송 끝에 1840년에야 결혼했어요. 그해에만 가곡을 백 곡 넘게 쏟아냈대요. 말년에는 마음의 병에 시달리다 마흔여섯 살에 요양원에서 세상을 떠났어요. 왜 이런 음악이 나왔을까요? 낭만주의는 음악과 문학이 가장 가까웠던 시대였어요. 시와 소설을 사랑한 슈만은 음악에 이야기와 인물, 암호까지 숨겨 넣었고, 짧은 피아노 소품 하나에도 한 편의 시 같은 마음을 담았답니다.","w":"그 무렵 슈만 이야기를 조금 더 해 볼게요. 낭만주의는 음악과 문학이 가장 가까웠던 시대였어요. 시와 소설을 사랑한 슈만은 음악에 이야기와 인물, 암호까지 숨겨 넣었고, 짧은 소품 하나에도 한 편의 시 같은 마음을 담았답니다."},"liszt":{"s":"프란츠 리스트. 최초의 슈퍼스타 피아니스트예요. 리스트는 역사상 가장 뛰어난 피아니스트로 꼽혀요. 그의 연주회에서는 여성들이 기절하고, 그가 벗어 둔 장갑을 두고 다툼이 벌어졌대요. 시인 하이네는 이 열풍을 리스토마니아라고 불렀죠. 혼자 무대에서 연주회를 여는 리사이틀이라는 형식도 그가 자리 잡게 했어요. 그런데 정작 삼십 대 중반에 순회 연주를 그만두고 작곡과 후배 양성에 힘썼고, 말년에는 성직자의 길을 걸었어요. 쇼팽의 친구이자 바그너의 장인이기도 하답니다. 왜 이런 음악이 나왔을까요? 악마의 바이올리니스트라 불린 파가니니의 연주를 보고 충격을 받은 리스트는, 피아노의 파가니니가 되겠다고 결심했어요. 철도가 생겨 유럽을 돌기 쉬워지고, 신문이 스타를 만들어 내던 시대였기에, 그는 음악계 최초의 아이돌이 될 수 있었죠.","w":"그 무렵 리스트 이야기를 조금 더 해 볼게요. 파가니니의 연주에 충격을 받은 리스트는 피아노의 파가니니가 되겠다고 결심했어요. 철도가 생기고 신문이 스타를 만들던 시대였기에, 그는 음악계 최초의 아이돌이 될 수 있었답니다."},"verdi":{"s":"주세페 베르디. 이탈리아 오페라의 왕이자, 이탈리아 통일 운동의 상징이에요. 베르디는 시골 여관집 아들로 태어났고, 밀라노 음악원 입학시험에는 떨어졌어요. 젊은 시절 아내와 두 아이를 잇달아 잃고 작곡을 그만두려 했는데, 우연히 펼쳐 본 나부코의 대본에 마음이 움직여 다시 일어섰다고 전해져요. 스물여섯 편이 넘는 오페라를 썼고, 여든 살에 마지막 오페라 팔스타프를 완성했죠. 그가 세상을 떠났을 때 밀라노 거리에는 수많은 사람이 모여 그를 배웅했답니다. 왜 이런 음악이 나왔을까요? 이탈리아가 여러 나라로 쪼개져 오스트리아의 지배를 받던 시절, 오페라 극장은 사람들의 마음이 모이는 광장이었어요. 베르디의 합창과 극적인 선율은 통일을 꿈꾸던 이탈리아 사람들의 마음과 겹쳐졌죠.","w":"그 무렵 베르디 이야기를 조금 더 해 볼게요. 이탈리아가 여러 나라로 쪼개져 지배받던 시절, 오페라 극장은 사람들의 마음이 모이는 광장이었어요. 베르디의 합창과 극적인 선율은 통일을 꿈꾸던 사람들의 마음과 겹쳐졌답니다."},"brahms":{"s":"요하네스 브람스. 베토벤의 그림자와 싸운 고전주의자예요. 브람스는 함부르크의 가난한 음악가 집에서 태어나, 십 대 때는 술집에서 피아노를 치며 돈을 벌었어요. 스무 살에 슈만 부부를 만나 슈만에게 새로운 길이라는 극찬을 받았고, 슈만이 쓰러진 뒤에는 그의 아내 클라라 곁을 지켰죠. 클라라와의 깊은 우정은 평생 이어졌고, 그는 결혼하지 않았어요. 베토벤이라는 거인을 너무 의식한 나머지, 첫 교향곡을 완성하는 데 이십 년 넘게 걸렸답니다. 왜 이런 음악이 나왔을까요? 모두가 리스트와 바그너처럼 새로운 형식을 외치던 시대에, 브람스는 바흐와 베토벤의 전통 형식 안에 낭만의 감정을 담는 길을 택했어요. 그래서 그의 음악에는 단단한 구조 속에 억눌린 그리움이 흐른답니다.","w":"그 무렵 브람스 이야기를 조금 더 해 볼게요. 모두가 새로운 형식을 외치던 시대에, 브람스는 바흐와 베토벤의 전통 형식 안에 낭만의 감정을 담는 길을 택했어요. 그래서 그의 음악에는 단단한 구조 속에 억눌린 그리움이 흐른답니다."},"saintsaens":{"s":"카미유 생상스. 모차르트에 견줄 만한 신동이자, 여든여섯 해를 산 프랑스 음악의 기둥이에요. 생상스는 두 살에 피아노를 치고, 열 살에 데뷔 연주회를 연 신동이었어요. 파리 마들렌 성당의 오르가니스트로 이십 년을 일했고, 리스트는 그를 세계 최고의 오르가니스트라고 칭찬했죠. 음악뿐 아니라 천문학, 고고학, 시, 철학에도 조예가 깊었어요. 여든여섯 살까지 살며 낭만주의부터 드뷔시와 스트라빈스키의 시대까지 지켜봤지만, 새로운 음악에는 끝까지 비판적이었답니다. 왜 이런 음악이 나왔을까요? 1870년 프로이센과의 전쟁에서 진 뒤, 프랑스 음악가들은 독일 음악에 맞서 프랑스다운 음악을 세우려 했어요. 생상스는 국민음악협회를 함께 세우고, 명료한 형식과 우아한 색채를 갖춘 프랑스 기악 음악의 기틀을 다졌죠.","w":"그 무렵 생상스 이야기를 조금 더 해 볼게요. 전쟁에서 진 뒤 프랑스 음악가들은 독일 음악에 맞서 프랑스다운 음악을 세우려 했어요. 생상스는 명료한 형식과 우아한 색채를 갖춘 프랑스 기악 음악의 기틀을 다졌답니다."},"tchaikovsky":{"s":"표트르 일리치 차이콥스키. 눈물과 선율의 작곡가, 발레 음악의 왕이에요. 차이콥스키는 법률학교를 나와 공무원으로 일하다가, 이십 대에 음악으로 진로를 바꿨어요. 예민하고 우울한 성격이라 평생 고뇌했죠. 부유한 미망인 폰 메크 부인이 십삼 년 동안 그를 후원했는데, 두 사람은 천 통이 넘는 편지를 주고받으면서도 절대 만나지 않는다는 약속을 지켰대요. 마지막 교향곡 비창을 초연하고 아흐레 뒤, 그는 세상을 떠났어요. 왜 이런 음악이 나왔을까요? 러시아가 서유럽 음악을 배우며 자기 목소리를 찾아가던 시기였어요. 차이콥스키는 독일식 교육을 받았지만, 러시아의 정서와 극적인 선율을 결합해 가장 대중적인 낭만 음악을 만들어 냈답니다.","w":"그 무렵 차이콥스키 이야기를 조금 더 해 볼게요. 러시아가 서유럽 음악을 배우며 자기 목소리를 찾던 시기였어요. 차이콥스키는 러시아의 정서와 극적인 선율을 결합해, 가장 대중적인 낭만 음악을 만들어 냈답니다."},"dvorak":{"s":"안토닌 드보르자크. 보헤미아 시골의 소리를 세계로 가져간 사람이에요. 드보르자크는 체코 시골의 여관 겸 정육점 집 아들로 태어나, 가업을 이을 뻔했어요. 오랫동안 무명이었다가, 국가 장학금 심사위원이던 브람스의 눈에 띄어 출판사를 소개받으면서 이름을 알리기 시작했죠. 1892년에는 뉴욕 음악원 원장으로 초대받아 미국에서 삼 년을 살았어요. 기차와 증기기관차를 보러 다닐 만큼 철도를 좋아했대요. 왜 이런 음악이 나왔을까요? 유럽 곳곳에서 자기 민족의 정체성을 음악에 담으려는 움직임이 일어나던 때였어요. 드보르자크는 보헤미아 민요의 선율과 리듬을 교향곡이라는 큰 그릇에 담았고, 미국에서는 흑인 영가와 원주민 음악에도 귀를 기울였죠.","w":"그 무렵 드보르자크 이야기를 조금 더 해 볼게요. 유럽 곳곳에서 민족의 정체성을 음악에 담으려는 움직임이 일어나던 때였어요. 드보르자크는 보헤미아 민요의 선율과 리듬을 교향곡이라는 큰 그릇에 담았답니다."},"grieg":{"s":"에드바르 그리그. 노르웨이의 피오르와 민요를 노래한 서정 시인이에요. 그리그는 노르웨이 베르겐에서 태어나 독일 라이프치히에서 공부했어요. 키가 백오십 센티미터 남짓으로 작았고, 젊은 시절 늑막염을 앓아 폐 한쪽이 거의 기능하지 않아서 평생 몸이 약했죠. 스물네 살에 쓴 피아노 협주곡을 리스트가 처음 보자마자 쳐 보고 극찬했다는 이야기가 유명해요. 사촌이자 가수였던 니나와 결혼했고, 베르겐 근처 트롤하우겐이라는 집에서 작곡하며 노르웨이 음악의 얼굴이 됐답니다. 왜 이런 음악이 나왔을까요? 덴마크와 스웨덴의 지배를 오래 받아 온 노르웨이에서, 십구 세기 후반 민족의 정체성을 찾으려는 움직임이 커졌어요. 그리그는 노르웨이 민요의 선율과 춤 리듬을 소박하고 서정적인 음악으로 다듬어 냈죠.","w":"그 무렵 그리그 이야기를 조금 더 해 볼게요. 오랜 지배를 받아 온 노르웨이에서 민족의 정체성을 찾으려는 움직임이 커지던 때였어요. 그리그는 노르웨이 민요의 선율과 춤 리듬을 소박하고 서정적인 음악으로 다듬었답니다."},"puccini":{"s":"자코모 푸치니. 가슴을 울리는 선율, 오페라의 마지막 거장이에요. 푸치니는 대대로 교회 음악가인 집안에서 태어났어요. 십 대 시절 베르디의 아이다를 보려고 수십 킬로미터를 걸어갔다가, 오페라 작곡가가 되기로 마음먹었다고 전해져요. 라 보엠, 토스카, 나비부인으로 세계적인 인기를 얻었고, 사냥과 자동차를 무척 좋아했죠. 마지막 오페라 투란도트를 다 끝내지 못한 채, 치료를 받던 중 세상을 떠났어요. 왜 이런 음악이 나왔을까요? 베르디 이후 이탈리아 오페라는 신화나 왕의 이야기 대신, 평범한 사람들의 사실적인 삶을 다루는 쪽으로 흘러갔어요. 푸치니는 가난한 예술가, 버려진 여인 같은 인물의 감정을, 영화음악처럼 생생한 선율로 그려 냈답니다.","w":"그 무렵 푸치니 이야기를 조금 더 해 볼게요. 베르디 이후 이탈리아 오페라는 평범한 사람들의 사실적인 삶을 다루는 쪽으로 흘러갔어요. 푸치니는 가난한 예술가, 버려진 여인 같은 인물의 감정을 영화음악처럼 생생한 선율로 그려 냈답니다."},"mahler":{"s":"구스타프 말러. 교향곡 하나에 세상 전부를 담으려 한 사람이에요. 말러는 보헤미아의 유대인 가정에서 태어났고, 어린 나이에 형제 여럿을 잃었어요. 당대 최고의 지휘자로 이름을 날려 빈 궁정 오페라 극장을 십 년 동안 이끌었고, 작곡은 주로 여름휴가 때 호숫가의 작은 오두막에서 했죠. 살아 있을 때는 작곡가보다 지휘자로 더 유명했고, 그의 교향곡은 너무 길고 복잡하다는 말을 들었어요. 본인은 언젠가 나의 시대가 올 거라고 말했다고 전해지는데, 실제로 이십 세기 후반에 큰 인기를 얻었답니다. 왜 이런 음악이 나왔을까요? 십구 세기가 끝나고 이십 세기가 시작되던 무렵, 낭만주의는 거대하게 부풀어 오른 마지막 단계에 있었어요. 말러는 커다란 오케스트라에 민요, 행진곡, 새소리, 합창까지 넣어서, 삶과 죽음, 자연과 구원이라는 큰 질문을 교향곡에 담았죠.","w":"그 무렵 말러 이야기를 조금 더 해 볼게요. 십구 세기가 끝나 가던 무렵, 낭만주의는 거대하게 부풀어 오른 마지막 단계에 있었어요. 말러는 커다란 오케스트라에 민요와 행진곡, 합창까지 넣어, 삶과 죽음이라는 큰 질문을 교향곡에 담았답니다."},"debussy":{"s":"클로드 드뷔시. 소리로 그림을 그린 인상주의 작곡가예요. 드뷔시는 파리 음악원 시절부터 규칙을 거부하는 학생이었어요. 1889년 파리 만국박람회에서 인도네시아 자바의 가믈란 음악을 듣고 큰 충격을 받았고, 그때부터 서양 화성의 규칙에서 벗어난 새로운 소리를 찾기 시작했죠. 모네 같은 인상주의 화가들과 묶여 인상주의 음악이라고 불렸지만, 정작 본인은 그 말을 싫어했고, 오히려 상징주의 시인들과 더 가까웠어요. 왜 이런 음악이 나왔을까요? 독일 음악, 특히 바그너의 영향이 유럽을 뒤덮던 시기, 프랑스 작곡가들은 우리만의 음악을 원했어요. 드뷔시는 무거운 드라마 대신 빛과 물과 바람 같은 순간의 분위기를 소리의 색채로 그려 내서, 이십 세기 음악의 문을 열었답니다.","w":"그 무렵 드뷔시 이야기를 조금 더 해 볼게요. 바그너의 영향이 유럽을 뒤덮던 시기, 프랑스 작곡가들은 우리만의 음악을 원했어요. 드뷔시는 빛과 물과 바람 같은 순간의 분위기를 소리의 색채로 그려 내서, 이십 세기 음악의 문을 열었답니다."},"ravel":{"s":"모리스 라벨. 스위스 시계공처럼 정밀한, 오케스트라의 마술사예요. 라벨은 스위스 출신 기술자였던 아버지에게서 기계를 사랑하는 마음을 물려받았어요. 스트라빈스키가 그를 스위스 시계공이라고 불렀을 만큼, 한 음 한 음을 정밀하게 다듬었죠. 권위 있는 로마 대상에 여러 번 떨어져서 큰 스캔들이 나기도 했어요. 오케스트라의 색채를 다루는 솜씨는 누구도 따라오지 못했고, 무소륵스키의 전람회의 그림을 오케스트라로 편곡한 것으로도 유명하답니다. 왜 이런 음악이 나왔을까요? 라벨은 드뷔시와 같은 프랑스 새 음악의 흐름에 있었지만, 흐릿한 분위기보다 또렷한 윤곽과 고전적인 형식미를 좋아했어요. 재즈와 스페인 음악까지 받아들인 이십 세기 초 파리의 다채로운 분위기가 그의 음악에 녹아 있죠.","w":"그 무렵 라벨 이야기를 조금 더 해 볼게요. 라벨은 드뷔시와 같은 흐름에 있었지만, 흐릿한 분위기보다 또렷한 윤곽과 고전적인 형식미를 좋아했어요. 재즈와 스페인 음악까지 받아들인 그 시절 파리의 다채로운 분위기가 그의 음악에 녹아 있답니다."},"rachmaninoff":{"s":"세르게이 라흐마니노프. 낭만주의의 마지막 거장, 우울을 이겨 낸 피아니스트예요. 라흐마니노프는 러시아 귀족 집안에서 태어났고, 손이 무척 커서 다른 피아니스트는 닿지 않는 화음도 쉽게 짚었어요. 스물네 살 때 교향곡 1번 초연이 처참하게 실패하자 깊은 우울에 빠져, 삼 년 가까이 거의 작곡을 하지 못했죠. 한 의사의 치료로 회복해 피아노 협주곡 2번을 썼고, 1917년 러시아 혁명 뒤에는 가족과 함께 고국을 떠나 미국에서 피아니스트로 살았어요. 고향을 잃은 뒤로는 작곡이 크게 줄었답니다. 왜 이런 음악이 나왔을까요? 이십 세기 초 많은 작곡가가 새로운 실험으로 나아갈 때, 라흐마니노프는 차이콥스키에게서 이어받은 넓고 서정적인 러시아 낭만주의를 끝까지 지켰어요. 그래서 그의 음악은 할리우드 영화음악의 원형처럼 들리죠.","w":"그 무렵 라흐마니노프 이야기를 조금 더 해 볼게요. 많은 작곡가가 새로운 실험으로 나아갈 때, 라흐마니노프는 넓고 서정적인 러시아 낭만주의를 끝까지 지켰어요. 그래서 그의 음악은 할리우드 영화음악의 원형처럼 들린답니다."},"sibelius":{"s":"장 시벨리우스. 핀란드의 숲과 호수, 그리고 민족의 목소리예요. 시벨리우스는 원래 바이올리니스트를 꿈꿨지만 작곡가로 방향을 바꿨어요. 러시아의 지배를 받던 핀란드에서 그의 음악은 민족의 자부심이 됐고, 나라에서는 그에게 평생 연금을 줬죠. 교향곡 일곱 곡을 남긴 뒤, 예순 살 무렵부터 삼십 년 가까이 거의 작품을 발표하지 않았어요. 여덟 번째 교향곡을 썼다가 불태웠다고 알려져서, 이 시기를 야르벤페의 침묵이라고 불러요. 왜 이런 음악이 나왔을까요? 러시아 제국이 핀란드의 언어와 문화를 억누르던 시대, 핀란드 사람들은 서사시 칼레발라와 자연에서 민족의 정체성을 찾았어요. 시벨리우스는 그 숲과 호수의 차갑고 넓은 공기를 소리로 옮겨 냈답니다.","w":"그 무렵 시벨리우스 이야기를 조금 더 해 볼게요. 러시아 제국이 핀란드의 언어와 문화를 억누르던 시대, 사람들은 서사시와 자연에서 민족의 정체성을 찾았어요. 시벨리우스는 그 숲과 호수의 차갑고 넓은 공기를 소리로 옮겨 냈답니다."},"stravinsky":{"s":"이고르 스트라빈스키. 이십 세기 음악을 뒤흔든 카멜레온이에요. 스트라빈스키는 림스키코르사코프에게 배운 뒤, 파리의 발레단을 이끌던 디아길레프에게 발탁되어 불새로 단숨에 스타가 됐어요. 1913년 봄의 제전 초연은, 객석이 야유와 고함으로 뒤집힌 음악사의 사건이 됐죠. 러시아 혁명 이후 고국을 떠나 프랑스와 미국에서 살았고, 평생 스타일을 여러 번 바꿔 카멜레온이라고 불렸어요. 여든여덟 살까지 살았답니다. 왜 이런 음악이 나왔을까요? 일차 세계대전을 전후해 유럽의 낡은 질서가 무너지던 시대였어요. 스트라빈스키는 낭만주의의 넘치는 감정 대신 날카로운 리듬과 불협화음, 차가운 형식미로 새로운 시대의 소리를 만들었죠.","w":"그 무렵 스트라빈스키 이야기를 조금 더 해 볼게요. 일차 세계대전을 전후해 유럽의 낡은 질서가 무너지던 시대였어요. 스트라빈스키는 넘치는 감정 대신 날카로운 리듬과 불협화음으로 새로운 시대의 소리를 만들었답니다."},"gershwin":{"s":"조지 거슈윈. 재즈와 클래식을 이은 뉴욕의 천재예요. 거슈윈은 뉴욕 브루클린의 이민자 가정에서 태어났어요. 십 대에 악보 가게에서 신곡을 피아노로 쳐 주는 일을 하며, 형 아이라와 함께 브로드웨이 뮤지컬 히트곡을 만들었죠. 랩소디 인 블루로 클래식 무대에 나서면서 재즈를 연주회장으로 데려왔어요. 라벨 같은 유럽 작곡가에게 배우고 싶어 했지만, 뇌종양으로 서른여덟 살에 갑자기 세상을 떠났답니다. 왜 이런 음악이 나왔을까요? 1920년대 미국은 재즈의 시대였어요. 흑인 음악에서 태어난 재즈의 리듬과 블루스 화음이 도시의 활기와 만나던 때, 거슈윈은 그것을 오케스트라와 오페라라는 유럽의 그릇에 담아 미국의 소리를 만들었죠.","w":"그 무렵 거슈윈 이야기를 조금 더 해 볼게요. 1920년대 미국은 재즈의 시대였어요. 재즈의 리듬과 블루스 화음이 도시의 활기와 만나던 때, 거슈윈은 그것을 오케스트라라는 유럽의 그릇에 담아 미국의 소리를 만들었답니다."}}};
</script>

<script>
(function(){
const ERA = {}; DATA.eras.forEach(e => ERA[e.id] = e);
const COMP = {}; DATA.composers.forEach(c => COMP[c.id] = c);
const PIECE = {}; DATA.pieces.forEach(p => PIECE[p.id] = p);
const COURSE_ORDER = DATA.course.flatMap(w => w.ids);

const S = { videos:{}, listened:{}, liked:{}, notes:{}, hasApiKey:false };
const view = document.getElementById('view');
const dock = document.getElementById('dock');
let route = { v:'home' }, stack = [], libFilter = { q:'', era:'', form:'', lv:'' };

/* ---------- 서버 호출 (GAS 밖에서 열면 브라우저 저장소로 동작) ---------- */
const isGAS = typeof google !== 'undefined' && google.script && google.script.run;
const LS = {
  get(k, d){ try { const v = localStorage.getItem('cw_'+k); return v ? JSON.parse(v) : (d === undefined ? {} : d); } catch(e){ return d === undefined ? {} : d; } },
  set(k,v){ try { localStorage.setItem('cw_'+k, JSON.stringify(v)); } catch(e){} }
};
const Mock = {
  getState(){ return { videos:LS.get('videos'), listened:LS.get('listened'), liked:LS.get('liked'), notes:LS.get('notes'), hasApiKey:false }; },
  setLiked(id,on){ const m=LS.get('liked'); if(on){ const d=new Date(), z=n=>String(n).padStart(2,'0'); m[id]=d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes()); } else delete m[id]; LS.set('liked',m); return m; },
  setListened(id,on){ const m=LS.get('listened'); if(on) m[id]=new Date().toISOString().slice(0,10); else delete m[id]; LS.set('listened',m); return m; },
  saveNote(id,t){ const m=LS.get('notes'); if(t) m[id]=t; else delete m[id]; LS.set('notes',m); return true; },
  saveVideo(id,u){ const v=parseId(u); if(!v) throw new Error('유튜브 링크를 인식하지 못했어요.'); const m=LS.get('videos'); m[id]=v; LS.set('videos',m); return v; },
  clearVideo(id){ const m=LS.get('videos'); delete m[id]; LS.set('videos',m); return true; },
  findVideo(id){ return LS.get('videos')[id] || null; }
};
function parseId(s){ s=String(s||'').trim(); if(/^[\w-]{11}$/.test(s)) return s; const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/); return m?m[1]:null; }
/* 휴대폰 앱(설치형)에서는 Apps Script API로 기록을 주고받음 */
const API_ID = (typeof window.CW_API === 'string' && window.CW_API) || '';
const API_URL = 'https:/' + '/script.google.com/macros/s/' + API_ID + '/exec';
const APP_MODE = !isGAS;
let KEY = APP_MODE ? LS.get('key', '') : '';
if (APP_MODE) {
  const km = (location.hash || '').match(/k=([A-Za-z0-9]+)/);
  if (km) { KEY = km[1]; LS.set('key', KEY); try { history.replaceState(null, '', location.pathname); } catch(e){} }
}
const BACKEND = isGAS ? 'gas' : (KEY && API_ID ? 'api' : 'local');
function call(fn, ...args){
  if (BACKEND === 'gas') return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  if (BACKEND === 'api') {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: KEY, fn, args }) })
      .then(r => r.json())
      .then(j => { if (!j.ok) throw new Error(j.error || '서버 오류'); return j.data; });
  }
  return new Promise((res, rej) => { try { res(Mock[fn](...args)); } catch(e){ rej(e); } });
}

/* ---------- 유틸 ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars = n => '★'.repeat(n) + '☆'.repeat(3-n);
const LV = {1:'입문',2:'중급',3:'도전'};
const YTB = 'https:/' + '/www.youtube.com';
const ytSearch = p => YTB + '/results?search_query=' + encodeURIComponent(p.q);
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2400); }
function doneCount(ids){ return ids.filter(id => S.listened[id]).length; }
function markListened(id){
  if (S.listened[id]) return;
  call('setListened', id, true).then(m => { S.listened = m; if (!Drive.active) refreshMarks(); }).catch(()=>{});
}
/* 좋아요 */
const isLiked = id => !!(S.liked && S.liked[id]);
