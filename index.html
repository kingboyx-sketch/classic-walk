<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#7b2d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="클래식 산책">
  <title>클래식 산책</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f7f3ec; --paper:#fffdf8; --ink:#2b2622; --muted:#7a7068; --line:#e6ddd0;
  --gold:#a8792f; --wine:#7b2d3a; --shadow:0 2px 14px rgba(60,40,20,.08);
  --baroque:#a8792f; --classical:#3f6e8c; --romantic:#8e3446; --modern:#4d7a62;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
body.docked{padding-bottom:280px}
h1,h2,h3,.serif{font-family:'Noto Serif KR',serif}
button{font-family:inherit;cursor:pointer}
a{color:var(--wine)}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(247,243,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand b{font-family:'Noto Serif KR',serif;font-size:19px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;font-size:18px}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav button{border:0;background:none;padding:8px 12px;border-radius:20px;color:var(--muted);font-size:14px;white-space:nowrap}
nav button.on{background:var(--ink);color:#fff}

main{max-width:980px;margin:0 auto;padding:24px 16px 60px}

/* common */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:#efe7da;color:var(--muted);margin-right:4px}
.era-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.muted{color:var(--muted)}
.sec-title{font-family:'Noto Serif KR',serif;font-size:22px;margin:34px 0 12px}
.back{border:0;background:none;color:var(--muted);padding:0;margin-bottom:12px;font-size:14px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:24px;padding:9px 18px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.done{background:var(--modern);border-color:var(--modern)}
.btn:disabled{opacity:.5}

/* hero */
.hero{background:linear-gradient(135deg,#2b2622,#5b2530);color:#f7efe2;border-radius:18px;padding:30px 26px;position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:28px;line-height:1.35}
.hero p{margin:0;opacity:.85;max-width:560px}
.hero:after{content:"𝄞";position:absolute;right:18px;bottom:-30px;font-size:180px;opacity:.08;line-height:1}
.progress{margin-top:20px;background:rgba(255,255,255,.15);border-radius:8px;height:8px;overflow:hidden}
.progress i{display:block;height:100%;background:#e7c27d;border-radius:8px;transition:width .4s}
.progress-label{font-size:13px;margin-top:6px;opacity:.85}

/* course */
.week{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.week-no{font-family:'Noto Serif KR',serif;font-size:13px;color:var(--muted);text-align:center;padding-top:4px}
.week-no b{display:block;font-size:26px;color:var(--ink);line-height:1.1}
.week h3{margin:0 0 2px;font-size:17px}
.week p{margin:0 0 10px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:22px;padding:6px 14px 6px 8px;font-size:14px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--ink)}
.chip .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff;flex-shrink:0}
.chip.done .ck{background:var(--modern);border-color:var(--modern)}
.chip small{color:var(--muted)}

/* next up */
.next{display:flex;gap:16px;align-items:center;cursor:pointer}
.next .big{font-size:40px}

/* eras */
.timeline{position:relative;padding-left:26px}
.timeline:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.era{position:relative;margin-bottom:22px}
.era:before{content:"";position:absolute;left:-24px;top:26px;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--bg)}
.era h2{margin:0;font-size:22px;color:var(--c)}
.era .yrs{font-size:13px;color:var(--muted)}
.era ul{margin:8px 0 12px;padding-left:18px}
.era li{margin:2px 0}

/* composer */
.comp{cursor:pointer;border-top:4px solid var(--c)}
.comp h3{margin:0;font-size:18px}
.comp .en{font-size:12px;color:var(--muted)}
.comp p{font-size:14px;margin:8px 0 0}
.portrait{width:58px;height:58px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:'Noto Serif KR',serif;font-size:24px;flex-shrink:0}
.head-row{display:flex;gap:16px;align-items:center}
.why{background:#f3ece0;border-left:4px solid var(--c);border-radius:0 12px 12px 0;padding:16px 18px;margin-top:16px}
.why b{font-family:'Noto Serif KR',serif}

/* piece list */
.prow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--paper)}
.prow:hover{background:#fff}
.prow:first-child{border-radius:14px 14px 0 0}.prow:last-child{border-radius:0 0 14px 14px;border-bottom:0}
.plist{border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.prow .t{flex:1;min-width:0}
.prow .t b{display:block;font-weight:500}
.prow .t small{color:var(--muted)}
.prow .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff;flex-shrink:0}
.prow .ck.on{background:var(--modern);border-color:var(--modern)}
.lv{font-size:12px;color:var(--gold);letter-spacing:1px;white-space:nowrap}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:22px;padding:9px 16px;font-size:15px;background:#fff;font-family:inherit}
.filters select{border:1px solid var(--line);border-radius:22px;padding:8px 12px;background:#fff;font-family:inherit;font-size:14px}

/* piece detail */
.phead{border-top:5px solid var(--c)}
.phead h1{margin:6px 0 2px;font-size:26px;line-height:1.35}
.phead .alias{color:var(--c);font-family:'Noto Serif KR',serif;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin:12px 0 16px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.story p{margin:0 0 12px}
.points{counter-reset:pt;list-style:none;padding:0;margin:0}
.points li{counter-increment:pt;position:relative;padding:10px 0 10px 44px;border-bottom:1px dashed var(--line)}
.points li:last-child{border-bottom:0}
.points li:before{content:counter(pt);position:absolute;left:0;top:10px;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:'Noto Serif KR',serif;font-size:14px}
.finder{margin-top:14px;background:#fff8ea;border:1px solid #ecd9b4;border-radius:12px;padding:14px 16px;font-size:14px}
.finder .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.finder input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-family:inherit}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:15px;background:#fff;resize:vertical}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.pager button{flex:1;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font-size:14px}
.pager button:last-child{text-align:right}
.pager small{display:block;color:var(--muted)}

/* dock */
.dock{position:fixed;right:16px;bottom:16px;width:380px;max-width:calc(100vw - 32px);background:#1f1b18;color:#f3eadc;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.35);z-index:30;overflow:hidden}
.dock.hidden{display:none}
.dock-head{display:flex;align-items:center;gap:8px;padding:10px 12px}
.dock-title{flex:1;min-width:0}
.dock-title b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-title small{opacity:.65;font-size:12px}
.dock-btns{display:flex;gap:4px}
.dock-btns a,.dock-btns button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:14px}
.dock-video{position:relative;padding-top:56.25%}
.dock-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.dock.min{width:300px}
.dock.min .dock-video{padding-top:0;height:0}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  .top{padding:8px 12px}
  .hero h1{font-size:23px}
  .phead h1{font-size:22px}
  .week{grid-template-columns:44px 1fr}
  .dock{left:8px;right:8px;bottom:8px;width:auto;max-width:none}
  .dock.min{width:auto}
  body.docked{padding-bottom:300px}
}

/* ---------- 헤더 드라이브 버튼 ---------- */
.drive-btn{border:0;background:var(--wine);color:#fff;border-radius:22px;padding:9px 16px;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap}
nav button i{font-style:normal}
@media (min-width:721px){ nav button i{display:none} .top{flex-wrap:nowrap} nav{margin-left:auto} }
.actions .btn{min-height:44px}
.narr-btn.on{background:var(--wine);border-color:var(--wine);color:#fff}
.hero-drive{margin-top:18px;border:0;background:#e7c27d;color:#2b2622;border-radius:26px;padding:12px 20px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.swap-link{font-size:13px;margin-top:12px;color:var(--muted)}

/* ---------- 모바일 기본 레이아웃 ---------- */
@media (max-width:720px){
  body{font-size:16px}
  .top{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));flex-wrap:nowrap}
  .brand small{display:none}
  .logo{width:32px;height:32px;font-size:16px}
  .drive-btn{padding:10px 14px;font-size:14px}
  .drive-btn span{display:inline}
  nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;max-width:none;background:rgba(255,253,248,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);justify-content:space-around;gap:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom));overflow:visible}
  nav#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:6px 2px;border-radius:12px;min-height:52px;justify-content:center}
  nav#nav button i{font-size:21px;line-height:1.1}
  nav#nav button.on{background:none;color:var(--wine);font-weight:700}
  main{padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
  body.docked{padding-bottom:0}
  body.docked main{padding-bottom:calc(96px + 56.25vw + 70px)}
  body.docked.dock-min main{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
  .dock{left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));width:auto;max-width:none}
  .dock.min{width:auto}
  .card{padding:16px}
  .hero{padding:24px 20px}
  .hero h1{font-size:22px}
  .sec-title{font-size:20px;margin:28px 0 10px}
  .btn{padding:12px 18px;font-size:15px}
  .actions .btn{flex:1 1 40%}
  .prow{padding:15px 14px;gap:10px}
  .chip{padding:9px 14px 9px 9px}
  .filters input,.filters select{font-size:16px;padding:11px 14px}
  .filters select{flex:1}
  .phead h1{font-size:22px}
  .pager{flex-direction:column}
  .pager button,.pager button:last-child{text-align:left}
  .week{grid-template-columns:40px 1fr;gap:10px}
  .g3{grid-template-columns:1fr 1fr}
  .comp p{display:none}
  .comp p.muted{display:block}
  .head-row .portrait{width:48px;height:48px;font-size:20px}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}

/* ---------- 드라이브 모드 ---------- */
#drive{display:none}
body.drive{overflow:hidden}
body.drive nav#nav,body.drive .top{display:none}
body.drive .dock,body.drive .dock.min{position:fixed;inset:0;left:0;right:0;bottom:0;width:auto;max-width:none;border-radius:0;display:flex;flex-direction:column;z-index:60;background:#14110f}
body.drive .dock-head{display:none}
body.drive .dock-video,body.drive .dock.min .dock-video{flex:none;padding-top:0;height:clamp(200px,56.25vw,34vh)}
body.drive #drive{display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom));color:#f3eadc;gap:12px}
.dv-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dv-top b{font-size:18px}
.dv-exit{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:22px;padding:11px 18px;font-size:15px;font-family:inherit}
.dv-note{margin:0;font-size:14px;opacity:.7}
.dv-lists{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dv-list{text-align:left;border:0;border-radius:18px;padding:16px;background:rgba(255,255,255,.1);color:#fff;font-family:inherit;min-height:84px}
.dv-list b{display:block;font-size:17px}
.dv-list small{opacity:.7;font-size:13px}
.dv-list.primary{grid-column:1/-1;background:#e7c27d;color:#2b2622}
.dv-list:disabled{opacity:.4}
.dv-head{grid-column:1/-1;margin:10px 0 0;font-size:14px;opacity:.75;font-weight:600}
.dv-sets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dv-set{border:1px solid rgba(255,255,255,.2);background:none;color:#fff;border-radius:16px;padding:10px 6px;font-family:inherit;font-size:14px;min-height:60px}
.dv-set small{display:block;opacity:.6;font-size:12px}
.dv-status{align-self:flex-start;background:#e7c27d;color:#2b2622;border-radius:20px;padding:6px 14px;font-weight:700;font-size:15px}
.dv-status.play{background:#7fc49a}
.dv-status.idle{background:rgba(255,255,255,.2);color:#fff}
.dv-count{opacity:.65;font-size:14px}
.dv-title{font-family:'Noto Serif KR',serif;font-size:27px;line-height:1.3;margin:0}
.dv-comp{font-size:17px;opacity:.85;margin-top:-6px}
.dv-caption{font-size:15px;opacity:.7;line-height:1.6;min-height:3.2em}
.dv-ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px;margin-top:auto}
.dv-ctrl button{height:96px;border-radius:24px;border:0;background:rgba(255,255,255,.13);color:#fff;font-size:34px;font-family:inherit}
.dv-ctrl button.main{background:#e7c27d;color:#2b2622;font-size:42px}
.dv-ctrl button.main.tap{animation:dvpulse 1s ease-in-out infinite}
@keyframes dvpulse{50%{transform:scale(1.05);box-shadow:0 0 0 8px rgba(231,194,125,.3)}}
.dv-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dv-row button{min-height:64px;border-radius:18px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:15px;font-family:inherit}
@media (min-width:721px){ body.drive #drive{max-width:640px;width:100%;margin:0 auto} }
</style>

</head>
<body>
  <header class="top">
    <div class="brand" onclick="go('home')">
      <span class="logo">♪</span>
      <div><b>클래식 산책</b><small>이야기와 함께 듣는 클래식</small></div>
    </div>
    <nav id="nav">
      <button data-v="home"><i>🏠</i><span>코스</span></button>
      <button data-v="eras"><i>🕰️</i><span>시대</span></button>
      <button data-v="composers"><i>🎼</i><span>작곡가</span></button>
      <button data-v="library"><i>🔍</i><span>곡 찾기</span></button>
      <button data-v="me"><i>📒</i><span>기록</span></button>
    </nav>
    <button class="drive-btn" onclick="Drive.open()">🚗 <span>드라이브 모드</span></button>
  </header>

  <main id="view"></main>

  <aside id="dock" class="dock hidden">
    <div class="dock-head">
      <div class="dock-title"><b id="dockTitle"></b><small id="dockSub"></small></div>
      <div class="dock-btns">
        <button id="dockNarr" title="해설 듣기">🔊</button>
        <button id="dockMin" title="접기">–</button>
        <button id="dockClose" title="닫기">✕</button>
      </div>
    </div>
    <div class="dock-video"><div id="ytPlayer"></div></div>
    <section id="drive" class="drive"></section>
  </aside>

  <div id="toast"></div>

  <script src="config.js"></script>
<script>
const DATA = {
eras: [
  {"id":"baroque","name":"바로크","years":"1600 – 1750","color":"var(--baroque)","desc":"음악은 교회와 궁정을 위해 만들어졌습니다. 작곡가는 예술가라기보다 귀족과 교회에 고용된 장인이었죠. 여러 선율이 동시에 얽히는 대위법, 쉬지 않고 흐르는 저음(통주저음), 화려한 장식이 특징입니다.","listen":["여러 선율이 동시에 대화하듯 얽히는 것을 따라가 보세요","한 곡 안에서 감정이 크게 바뀌지 않고 하나의 정서가 유지됩니다","쳄발로(하프시코드)의 찰랑이는 소리가 자주 들립니다"]},
  {"id":"classical","name":"고전","years":"1750 – 1820","color":"var(--classical)","desc":"계몽주의 시대. 복잡함보다 균형과 명료함이 미덕이 됩니다. 교향곡·현악4중주·소나타 형식이 이때 완성되고, 귀족 살롱을 넘어 시민이 표를 사서 듣는 공공 음악회가 늘어납니다.","listen":["선율 하나 + 반주라는 또렷한 구조","주제가 제시 → 발전 → 재현되는 소나타 형식","질문과 대답처럼 딱 맞아떨어지는 프레이즈"]},
  {"id":"romantic","name":"낭만","years":"1820 – 1900","color":"var(--romantic)","desc":"프랑스 혁명 이후 “개인”의 시대. 작곡가는 후원자를 위한 장인이 아니라 자기 감정을 표현하는 예술가가 됩니다. 피아노가 크게 발전해 거장 연주자가 스타가 되고, 조국의 민요를 담은 민족주의 음악도 등장합니다.","listen":["감정의 진폭이 큽니다 — 아주 여리다가 폭발하듯 커집니다","시·이야기·풍경을 음악으로 그리는 표제음악","템포를 자유롭게 밀고 당기는 루바토"]},
  {"id":"modern","name":"후기낭만·근대","years":"1890 – 1950","color":"var(--modern)","desc":"전통적인 장·단조의 규칙이 흔들립니다. 말러는 교향곡을 거대한 세계로 부풀렸고, 드뷔시와 라벨은 색채와 분위기로 그림 그리듯 작곡했습니다. 시벨리우스는 북유럽의 자연을, 푸치니는 평범한 사람들의 사랑을 노래했고, 스트라빈스키는 리듬으로 낡은 질서를 깨뜨렸으며, 거슈윈은 재즈를 연주회장으로 데려왔습니다.","listen":["뚜렷한 선율보다 소리의 “색깔”과 분위기","어디로 갈지 모르게 떠다니는 화음","영화음악의 뿌리가 된 넓고 서정적인 선율"]}
],

composers: [
  {"id":"vivaldi","name":"비발디","full":"안토니오 비발디","en":"Antonio Vivaldi","era":"baroque","years":"1678–1741","country":"이탈리아","tagline":"붉은 머리의 사제, 협주곡의 대가","story":["베네치아의 사제였지만 붉은 머리 때문에 “빨간 머리 신부”로 불렸습니다. 건강 문제로 미사 집전 대신 피에타 고아원에서 소녀들에게 음악을 가르쳤는데, 이 소녀 오케스트라가 유럽 여행객들이 일부러 찾아올 만큼 유명했습니다.","500곡이 넘는 협주곡을 썼지만 말년엔 유행에서 밀려나 빈에서 가난하게 죽었습니다. 20세기에 악보가 대량 발견되며 다시 사랑받게 되었죠."],"why":"솔로 악기가 오케스트라와 주고받는 “협주곡”이 막 꽃피던 시기였습니다. 매주 공연해야 하는 고아원 오케스트라라는 실험실이 있었기에, 비발디는 수백 곡의 협주곡으로 형식을 다듬을 수 있었습니다."},
  {"id":"bach","name":"바흐","full":"요한 제바스티안 바흐","en":"Johann Sebastian Bach","era":"baroque","years":"1685–1750","country":"독일","tagline":"음악의 아버지. 모든 서양 음악의 문법책을 쓴 사람","story":["대대로 음악가 집안에서 태어나 평생 독일을 거의 벗어나지 않았습니다. 궁정 음악가로 일하다 1723년부터 라이프치히 토마스 교회의 음악감독(칸토르)으로 죽을 때까지 일하며 매주 교회 칸타타를 써야 했죠. 자녀가 20명이나 됐습니다.","살아있을 땐 작곡가보다 뛰어난 오르간 연주자로 유명했고, 죽은 뒤엔 “구식”이라며 거의 잊혔습니다. 1829년 20세의 멘델스존이 마태수난곡을 다시 무대에 올리면서 재발견되었고, 지금은 모든 음악가가 공부하는 교과서가 되었습니다."],"why":"교회와 궁정이 음악의 주문자였던 시대, 바흐는 “신의 영광을 위해” 매주 새 곡을 써야 했습니다. 그 엄청난 작업량 속에서 여러 선율을 수학처럼 정교하게 엮는 대위법을 극한까지 밀어붙였죠. 신앙과 직업과 장인정신이 한 사람 안에서 만난 결과입니다."},
  {"id":"handel","name":"헨델","full":"게오르크 프리드리히 헨델","en":"George Frideric Handel","era":"baroque","years":"1685–1759","country":"독일 → 영국","tagline":"바흐와 같은 해 태어난, 국제적인 흥행 작곡가","story":["바흐와 같은 1685년 독일에서 태어났지만 둘은 끝내 만나지 못했습니다. 이탈리아에서 오페라를 배운 뒤 런던으로 건너가 영국으로 귀화했고, 이탈리아 오페라 사업으로 큰돈을 벌기도 잃기도 했습니다.","오페라 인기가 시들자 영어 가사로 된 오라토리오로 방향을 틀어 대성공을 거두었습니다. 묘하게도 말년에 바흐와 같은 안과의사에게 눈 수술을 받고 둘 다 실명했습니다."],"why":"바흐가 교회에 고용된 장인이었다면, 헨델은 시장에서 표를 팔아야 하는 사업가였습니다. 런던이라는 대도시의 청중을 상대했기에 그의 음악은 더 극적이고 웅장하며 즉각적으로 귀에 들어옵니다."},
  {"id":"haydn","name":"하이든","full":"프란츠 요제프 하이든","en":"Joseph Haydn","era":"classical","years":"1732–1809","country":"오스트리아","tagline":"교향곡의 아버지, 유머 넘치는 “파파 하이든”","story":["가난한 수레바퀴 장인의 아들로 태어났습니다. 약 30년 동안 헝가리 귀족 에스테르하지 가문의 궁정 악장으로 일하며 시골 궁전에 고립되어 있었는데, 본인은 “그래서 독창적일 수밖에 없었다”고 회고했습니다.","후원자가 죽은 뒤 60세에 런던으로 가서 대스타가 되었습니다. 교향곡 104곡, 현악4중주 68곡을 남겼고 모차르트와는 나이를 초월한 친구, 베토벤에겐 스승이었습니다."],"why":"외딴 궁전에 전속 오케스트라가 있었기에 하이든은 매일 새로운 실험을 하고 바로 들어볼 수 있었습니다. 그 30년의 실험이 교향곡과 현악4중주라는 형식을 완성했습니다."},
  {"id":"mozart","name":"모차르트","full":"볼프강 아마데우스 모차르트","en":"Wolfgang Amadeus Mozart","era":"classical","years":"1756–1791","country":"오스트리아","tagline":"35년을 산 천재, 어떤 장르든 완벽했던 사람","story":["다섯 살에 작곡을 시작했고, 아버지 레오폴트를 따라 어린 시절 대부분을 유럽 순회 연주로 보냈습니다. 잘츠부르크 대주교 밑에서 일하다 갈등 끝에 1781년 해고당하듯 나와 빈에서 프리랜서 음악가가 되었죠.","오페라·교향곡·협주곡·실내악 모든 장르에서 걸작을 남겼지만 수입은 불안정했고, 35세에 레퀴엠을 완성하지 못한 채 세상을 떠났습니다. 600곡이 넘는 작품에 쾨헬 번호(K.)가 붙어 있습니다."],"why":"궁정에 묶인 하이든과 달리 모차르트는 “고용된 음악가”에서 “독립 예술가”로 넘어가는 경계에 선 첫 세대였습니다. 빈의 시민 청중을 상대로 연주회를 열어야 했기에 피아노 협주곡처럼 자신이 직접 빛날 수 있는 곡을 많이 썼습니다."},
  {"id":"beethoven","name":"베토벤","full":"루트비히 판 베토벤","en":"Ludwig van Beethoven","era":"classical","years":"1770–1827","country":"독일 → 오스트리아","tagline":"귀가 들리지 않는 작곡가, 고전에서 낭만으로 가는 다리","story":["독일 본에서 태어나 술에 의존하는 아버지 밑에서 혹독하게 피아노를 배웠습니다. 22세에 빈으로 가서 하이든에게 배우고, 격정적인 즉흥 연주로 이름을 날렸습니다.","20대 후반부터 청력을 잃기 시작했고, 1802년 하일리겐슈타트에서 동생들에게 유서를 썼습니다. 하지만 “예술이 나를 붙잡았다”며 살아남았고, 완전히 들리지 않게 된 뒤에도 교향곡 9번 같은 걸작을 썼습니다."],"why":"프랑스 혁명과 나폴레옹의 시대, “개인의 자유와 의지”가 새로운 가치가 되었습니다. 베토벤은 귀족의 하인이 아니라 귀족과 대등한 예술가로 행동한 첫 작곡가였고, 고통을 이겨내는 투쟁의 서사를 음악에 담았습니다. 그래서 그의 음악은 고전의 형식에 낭만의 감정을 담고 있습니다."},
  {"id":"schubert","name":"슈베르트","full":"프란츠 슈베르트","en":"Franz Schubert","era":"romantic","years":"1797–1828","country":"오스트리아","tagline":"가곡의 왕, 31년의 짧은 생애","story":["빈의 학교 교사 아들로 태어나 평생 빈을 거의 떠나지 않았습니다. 600곡이 넘는 가곡을 썼지만 생전엔 대중적 명성이 크지 않았고, 친구들 집에 모여 그의 노래를 듣는 “슈베르티아데”라는 작은 모임이 그의 무대였습니다.","평생 가난했고 31세에 세상을 떠났습니다. 베토벤을 존경해 그의 장례식에서 횃불을 들었고, 이듬해 그 근처에 묻혔습니다."],"why":"나폴레옹 전쟁 후 빈은 검열과 감시가 심했습니다. 사람들은 정치 대신 집 안의 작은 모임으로 숨어들었고, 그 친밀한 공간에서 시를 노래로 만드는 가곡이 꽃폈습니다. 슈베르트는 그 시대의 내면을 노래한 작곡가입니다."},
  {"id":"mendelssohn","name":"멘델스존","full":"펠릭스 멘델스존","en":"Felix Mendelssohn","era":"romantic","years":"1809–1847","country":"독일","tagline":"모든 것을 가진 신동, 바흐를 다시 살려낸 사람","story":["베를린의 부유한 은행가 집안에서 태어나 최고의 교육을 받았습니다. 할아버지는 유명한 철학자 모제스 멘델스존입니다. 17세에 쓴 “한여름 밤의 꿈 서곡”은 지금도 천재의 상징처럼 이야기됩니다.","20세 때 100년 가까이 잊혀 있던 바흐의 “마태수난곡”을 무대에 올려 바흐 부활의 계기를 만들었습니다. 라이프치히 게반트하우스 관현악단을 이끌고 음악원을 세웠지만, 가장 가까웠던 누나 파니가 세상을 떠난 지 반년 만에 38세로 숨졌습니다."],"why":"멘델스존은 낭만주의 시대를 살았지만 바흐와 모차르트의 균형 감각을 사랑했습니다. 그래서 그의 음악은 감정이 넘치기보다 맑고 우아하며, 여행에서 본 풍경을 수채화처럼 그려냅니다."},
  {"id":"chopin","name":"쇼팽","full":"프레데리크 쇼팽","en":"Frédéric Chopin","era":"romantic","years":"1810–1849","country":"폴란드 → 프랑스","tagline":"피아노의 시인, 돌아가지 못한 조국을 그리워한 사람","story":["폴란드 바르샤바 근교에서 태어난 신동이었습니다. 20세에 유학길에 올랐는데 직후 바르샤바에서 러시아에 맞선 봉기가 일어나 실패했고, 그는 다시는 고국에 돌아가지 못했습니다.","파리에 정착해 살롱의 스타가 되었고, 작가 조르주 상드와 9년간 함께했습니다. 결핵으로 39세에 세상을 떠났고, 유언에 따라 심장만은 바르샤바로 옮겨져 성십자가 성당에 안치되어 있습니다."],"why":"이 시기 피아노는 기계적으로 크게 발전해 노래하듯 길게 울리고 섬세한 강약이 가능해졌습니다. 쇼팽은 거의 피아노곡만 썼는데, 이 새 악기의 가능성과 조국을 잃은 망명자의 그리움이 만나 그만의 시적인 음악이 탄생했습니다."},
  {"id":"schumann","name":"슈만","full":"로베르트 슈만","en":"Robert Schumann","era":"romantic","years":"1810–1856","country":"독일","tagline":"문학을 사랑한 피아노 시인, 클라라와의 사랑","story":["원래는 법학을 공부했지만 피아니스트가 되겠다며 음악으로 돌아섰습니다. 손가락을 다쳐 연주자의 꿈을 접은 뒤에는 작곡과 음악 평론에 몰두했고, 직접 창간한 음악 잡지에서 젊은 쇼팽을 “여러분, 모자를 벗으십시오, 천재입니다”라는 말로 소개했습니다.","스승의 딸이자 당대 최고의 피아니스트 클라라와 사랑에 빠졌지만, 그녀의 아버지가 결혼을 반대해 소송 끝에 1840년에야 결혼했습니다. 그해에만 100곡이 넘는 가곡을 쏟아냈습니다. 말년에는 정신 질환에 시달리다 46세에 요양원에서 세상을 떠났습니다."],"why":"낭만주의는 음악과 문학이 가장 가까웠던 시대였습니다. 시와 소설을 사랑한 슈만은 음악에 이야기와 인물, 암호를 숨겨 넣었고, 짧은 피아노 소품 하나에도 한 편의 시 같은 내면 세계를 담았습니다."},
  {"id":"liszt","name":"리스트","full":"프란츠 리스트","en":"Franz Liszt","era":"romantic","years":"1811–1886","country":"헝가리","tagline":"최초의 슈퍼스타 피아니스트","story":["역사상 가장 뛰어난 피아니스트로 꼽힙니다. 그의 연주회에선 여성들이 기절하고 그가 버린 장갑을 두고 다툼이 벌어졌는데, 시인 하이네는 이를 “리스토마니아”라고 불렀습니다. 혼자 무대에서 연주회를 여는 “리사이틀”이라는 형식도 그가 정착시켰습니다.","정작 30대 중반에 순회 연주를 그만두고 작곡과 후배 양성에 집중했으며, 말년엔 성직자(신부)의 길을 걸었습니다. 쇼팽의 친구이자 바그너의 장인이기도 합니다."],"why":"악마의 바이올리니스트 파가니니의 연주를 보고 충격받은 리스트는 “피아노의 파가니니”가 되겠다고 결심했습니다. 철도가 생겨 유럽 순회가 쉬워지고 신문이 스타를 만들던 시대였기에, 그는 음악계 최초의 아이돌이 될 수 있었습니다."},
  {"id":"verdi","name":"베르디","full":"주세페 베르디","en":"Giuseppe Verdi","era":"romantic","years":"1813–1901","country":"이탈리아","tagline":"이탈리아 오페라의 왕, 통일 운동의 상징","story":["시골 여관집 아들로 태어나 밀라노 음악원 입학 시험에 떨어졌습니다. 젊은 시절 아내와 두 아이를 잇달아 잃고 작곡을 그만두려 했으나, 우연히 펼쳐 본 “나부코” 대본에 마음이 움직여 재기했다고 전해집니다.","26편이 넘는 오페라를 썼고, 80세에 마지막 오페라 “팔스타프”를 완성했습니다. 그가 세상을 떠났을 때 밀라노 거리에는 수많은 사람이 모여 그를 배웅했습니다."],"why":"이탈리아가 여러 나라로 쪼개져 오스트리아의 지배를 받던 시절, 오페라 극장은 사람들의 감정이 모이는 광장이었습니다. 베르디의 합창과 극적인 선율은 통일을 꿈꾸던 이탈리아 사람들의 마음과 겹쳐졌습니다."},
  {"id":"brahms","name":"브람스","full":"요하네스 브람스","en":"Johannes Brahms","era":"romantic","years":"1833–1897","country":"독일","tagline":"베토벤의 그림자와 싸운 고전주의자","story":["함부르크의 가난한 음악가 집에서 태어나 10대 때 술집에서 피아노를 치며 돈을 벌었습니다. 20세에 슈만 부부를 만나 슈만에게 “새로운 길”이라는 극찬을 받았고, 슈만이 쓰러진 뒤엔 그의 아내 클라라 곁을 지켰습니다. 클라라와의 깊은 우정은 평생 이어졌고 그는 결혼하지 않았습니다.","베토벤이라는 거인을 너무 의식한 나머지 첫 교향곡을 완성하는 데 20년 넘게 걸렸습니다."],"why":"모두가 리스트와 바그너처럼 새로운 형식을 외치던 시대에, 브람스는 바흐와 베토벤의 전통 형식 안에서 낭만의 감정을 담는 길을 택했습니다. 그래서 그의 음악은 단단한 구조 속에 억눌린 그리움이 흐릅니다."},
  {"id":"saintsaens","name":"생상스","full":"카미유 생상스","en":"Camille Saint-Saëns","era":"romantic","years":"1835–1921","country":"프랑스","tagline":"모차르트에 견줄 신동, 86년을 산 프랑스 음악의 기둥","story":["두 살에 피아노를 치고 열 살에 데뷔 연주회를 연 신동이었습니다. 파리의 마들렌 성당 오르가니스트로 20년을 일했고, 리스트는 그를 세계 최고의 오르가니스트라고 칭찬했습니다.","음악뿐 아니라 천문학, 고고학, 시, 철학에도 조예가 깊었습니다. 86세까지 살며 낭만주의부터 드뷔시와 스트라빈스키의 시대까지 지켜봤지만, 새로운 음악에는 끝까지 비판적이었습니다."],"why":"1870년 보불전쟁 패배 후 프랑스 음악가들은 독일 음악에 맞서 “프랑스다운 음악”을 세우려 했습니다. 생상스는 국민음악협회를 함께 세우고, 명료한 형식과 우아한 색채를 갖춘 프랑스 기악 음악의 기틀을 다졌습니다."},
  {"id":"tchaikovsky","name":"차이콥스키","full":"표트르 일리치 차이콥스키","en":"Pyotr Ilyich Tchaikovsky","era":"romantic","years":"1840–1893","country":"러시아","tagline":"눈물과 선율의 작곡가, 발레 음악의 왕","story":["법률학교를 나와 법무성 공무원으로 일하다 20대에 음악으로 진로를 바꿨습니다. 예민하고 우울한 성격으로 평생 고뇌했습니다.","부유한 미망인 폰 메크 부인이 13년간 그를 후원했는데, 두 사람은 1,000통이 넘는 편지를 주고받으면서도 “만나지 않는다”는 약속을 지켰습니다. 마지막 교향곡 “비창”을 초연하고 9일 뒤 세상을 떠났습니다."],"why":"러시아가 서유럽 음악을 배우며 자기 목소리를 찾던 시기였습니다. 차이콥스키는 독일식 교육을 받았지만 러시아의 정서와 극적인 선율을 결합해 가장 대중적인 낭만 음악을 만들었습니다."},
  {"id":"dvorak","name":"드보르자크","full":"안토닌 드보르자크","en":"Antonín Dvořák","era":"romantic","years":"1841–1904","country":"체코","tagline":"보헤미아 시골의 소리를 세계로 가져간 사람","story":["체코 시골 여관 겸 정육점 집 아들로 태어나 가업을 이을 뻔했습니다. 오래 무명이었다가 국가 장학금 심사위원이던 브람스의 눈에 띄어 출판사를 소개받으면서 이름을 알렸습니다.","1892년 뉴욕 음악원 원장으로 초빙되어 미국에서 3년을 살았습니다. 열차와 증기기관차를 보러 다닐 만큼 철도 마니아였다고 합니다."],"why":"유럽 각지에서 자기 민족의 정체성을 음악에 담으려는 민족주의가 일어나던 때였습니다. 드보르자크는 보헤미아 민요의 선율과 리듬을 교향곡이라는 큰 그릇에 담았고, 미국에선 흑인 영가와 원주민 음악에 귀를 기울였습니다."},
  {"id":"grieg","name":"그리그","full":"에드바르 그리그","en":"Edvard Grieg","era":"romantic","years":"1843–1907","country":"노르웨이","tagline":"노르웨이의 피오르와 민요를 노래한 서정 시인","story":["노르웨이 베르겐에서 태어나 독일 라이프치히에서 공부했습니다. 키가 150cm 남짓으로 작았고, 젊은 시절 늑막염으로 폐 한쪽이 거의 기능하지 않아 평생 병약했습니다.","24세에 쓴 피아노 협주곡을 리스트가 처음 보자마자 쳐 보고 극찬한 일화가 유명합니다. 사촌이자 가수인 니나와 결혼했고, 베르겐 근교 집 “트롤하우겐”에서 작곡하며 노르웨이 음악의 얼굴이 되었습니다."],"why":"덴마크와 스웨덴의 지배를 오래 받아온 노르웨이에서 19세기 후반 민족의 정체성을 찾으려는 움직임이 커졌습니다. 그리그는 노르웨이 민요의 선율과 춤 리듬을 소박하고 서정적인 음악으로 다듬었습니다."},
  {"id":"puccini","name":"푸치니","full":"자코모 푸치니","en":"Giacomo Puccini","era":"modern","years":"1858–1924","country":"이탈리아","tagline":"가슴을 울리는 선율, 오페라의 마지막 거장","story":["대대로 교회 음악가 집안에서 태어났습니다. 10대 시절 베르디의 “아이다”를 보려고 수십 km를 걸어갔다가 오페라 작곡가가 되기로 결심했다고 전해집니다.","“라 보엠”, “토스카”, “나비부인”으로 세계적인 인기를 얻었고 사냥과 자동차를 좋아했습니다. 마지막 오페라 “투란도트”를 완성하지 못한 채 후두암 치료 중 세상을 떠났습니다."],"why":"베르디 이후 이탈리아 오페라는 신화나 왕의 이야기 대신 평범한 사람들의 사실적인 삶을 다루는 “베리스모(사실주의)”로 흘러갔습니다. 푸치니는 가난한 예술가, 버려진 여인 같은 인물의 감정을 영화음악처럼 생생한 선율로 그렸습니다."},
  {"id":"mahler","name":"말러","full":"구스타프 말러","en":"Gustav Mahler","era":"modern","years":"1860–1911","country":"보헤미아 → 오스트리아","tagline":"교향곡 하나에 세상 전부를 담으려 한 사람","story":["보헤미아의 유대인 가정에서 태어났고, 형제 여럿을 어린 나이에 잃었습니다. 당대 최고의 지휘자로 이름을 날려 빈 궁정 오페라 극장 감독을 10년간 맡았고, 작곡은 주로 여름 휴가 때 호숫가 작은 오두막에서 했습니다.","생전에는 작곡가보다 지휘자로 더 유명했고 그의 교향곡은 너무 길고 복잡하다는 평을 들었습니다. 본인은 “언젠가 나의 시대가 올 것”이라고 말했다고 전해지며, 실제로 20세기 후반에 큰 인기를 얻었습니다."],"why":"19세기가 끝나고 20세기가 시작되던 시기, 낭만주의는 거대하게 부풀어 오른 마지막 단계에 있었습니다. 말러는 거대한 오케스트라에 민요, 행진곡, 새소리, 합창까지 넣어 삶과 죽음, 자연과 구원이라는 큰 질문을 교향곡에 담았습니다."},
  {"id":"debussy","name":"드뷔시","full":"클로드 드뷔시","en":"Claude Debussy","era":"modern","years":"1862–1918","country":"프랑스","tagline":"소리로 그림을 그린 인상주의 작곡가","story":["파리 음악원 시절부터 규칙을 거부하는 학생이었습니다. 1889년 파리 만국박람회에서 인도네시아 자바의 가믈란 음악을 듣고 큰 충격을 받았고, 서양 화성의 규칙에서 벗어난 새로운 소리를 찾기 시작했습니다.","모네 같은 인상주의 화가들과 묶여 “인상주의 음악”이라 불렸지만 정작 본인은 그 말을 싫어했고, 오히려 상징주의 시인들과 가까웠습니다."],"why":"독일 음악, 특히 바그너의 영향이 유럽을 뒤덮던 시기, 프랑스 작곡가들은 “우리만의 음악”을 원했습니다. 드뷔시는 무거운 드라마 대신 빛·물·바람 같은 순간의 분위기를 소리의 색채로 표현해 20세기 음악의 문을 열었습니다."},
  {"id":"sibelius","name":"시벨리우스","full":"장 시벨리우스","en":"Jean Sibelius","era":"modern","years":"1865–1957","country":"핀란드","tagline":"핀란드의 숲과 호수, 그리고 민족의 목소리","story":["원래 바이올리니스트를 꿈꿨지만 작곡가로 방향을 바꿨습니다. 러시아의 지배를 받던 핀란드에서 그의 음악은 민족의 자부심이 되었고, 국가는 그에게 평생 연금을 주었습니다.","교향곡 7곡을 남긴 뒤 60세 무렵부터 30년 가까이 거의 작품을 발표하지 않았습니다. 8번 교향곡을 썼다가 불태웠다고 알려져 있어 “야르벤페의 침묵”이라 불립니다."],"why":"러시아 제국이 핀란드의 언어와 문화를 억누르던 시대, 핀란드 사람들은 서사시 “칼레발라”와 자연에서 민족의 정체성을 찾았습니다. 시벨리우스는 그 숲과 호수의 차갑고 넓은 공기를 소리로 옮겼습니다."},
  {"id":"rachmaninoff","name":"라흐마니노프","full":"세르게이 라흐마니노프","en":"Sergei Rachmaninoff","era":"modern","years":"1873–1943","country":"러시아 → 미국","tagline":"낭만주의의 마지막 거장, 우울을 이겨낸 피아니스트","story":["러시아 귀족 집안에서 태어났고, 손이 무척 커서 다른 피아니스트는 닿지 않는 화음을 쉽게 짚었습니다. 24세 때 교향곡 1번 초연이 처참하게 실패하자 깊은 우울증에 빠져 3년 가까이 거의 작곡을 하지 못했습니다.","정신과 의사 니콜라이 달의 치료로 회복해 피아노 협주곡 2번을 썼고, 1917년 러시아 혁명 이후 가족과 함께 망명해 미국에서 피아니스트로 살았습니다. 고향을 잃은 뒤엔 작곡이 크게 줄었습니다."],"why":"20세기 초 많은 작곡가가 무조음악 같은 실험으로 나아갈 때, 라흐마니노프는 차이콥스키에게서 이어받은 넓고 서정적인 러시아 낭만주의를 끝까지 지켰습니다. 그래서 그의 음악은 할리우드 영화음악의 원형처럼 들립니다."},
  {"id":"ravel","name":"라벨","full":"모리스 라벨","en":"Maurice Ravel","era":"modern","years":"1875–1937","country":"프랑스","tagline":"스위스 시계공처럼 정밀한 오케스트라의 마술사","story":["스위스 출신 기술자 아버지에게서 기계에 대한 애정을 물려받았습니다. 작곡가 스트라빈스키는 그를 “스위스 시계공”이라 불렀을 정도로 한 음 한 음을 정밀하게 다듬었습니다.","권위 있는 로마 대상에 여러 번 떨어져 “라벨 사건”이라는 스캔들이 나기도 했습니다. 오케스트라의 색채를 다루는 솜씨는 누구도 따라오지 못했고, 무소륵스키의 “전람회의 그림” 관현악 편곡으로도 유명합니다."],"why":"드뷔시와 같은 프랑스 새 음악의 흐름에 있었지만, 라벨은 흐릿한 분위기보다 또렷한 윤곽과 고전적인 형식미를 좋아했습니다. 재즈와 스페인 음악까지 흡수한 20세기 초 파리의 다문화적 분위기가 그의 음악에 녹아 있습니다."},
  {"id":"stravinsky","name":"스트라빈스키","full":"이고르 스트라빈스키","en":"Igor Stravinsky","era":"modern","years":"1882–1971","country":"러시아 → 프랑스 → 미국","tagline":"20세기 음악을 뒤흔든 카멜레온","story":["림스키코르사코프에게 배운 뒤, 파리의 발레단 “발레 뤼스”의 디아길레프에게 발탁되어 “불새”로 단숨에 스타가 되었습니다. 1913년 “봄의 제전” 초연은 객석이 야유와 고함으로 뒤집힌 음악사의 사건이 되었습니다.","러시아 혁명 이후 고국을 떠나 프랑스와 미국에서 살았습니다. 원시주의, 신고전주의, 12음 기법까지 평생 스타일을 여러 번 바꿔 “카멜레온”이라 불렸고 88세까지 살았습니다."],"why":"1차 세계대전을 전후해 유럽의 낡은 질서가 무너지던 시대였습니다. 스트라빈스키는 낭만주의의 감정 과잉 대신 날카로운 리듬과 불협화음, 차가운 형식미로 새로운 시대의 소리를 만들었습니다."},
  {"id":"gershwin","name":"거슈윈","full":"조지 거슈윈","en":"George Gershwin","era":"modern","years":"1898–1937","country":"미국","tagline":"재즈와 클래식을 이은 뉴욕의 천재","story":["뉴욕 브루클린의 러시아계 유대인 이민자 가정에서 태어났습니다. 10대에 악보 가게에서 신곡을 피아노로 쳐 주는 “송 플러거”로 일하며 형 아이라와 함께 브로드웨이 뮤지컬 히트곡을 만들었습니다.","“랩소디 인 블루”로 클래식 무대에 진출해 재즈를 연주회장으로 가져왔습니다. 라벨 같은 유럽 작곡가에게 배우고 싶어 했지만, 뇌종양으로 38세에 갑자기 세상을 떠났습니다."],"why":"1920년대 미국은 재즈의 시대였습니다. 흑인 음악에서 태어난 재즈의 리듬과 블루스 화성이 도시의 활기와 만나던 때, 거슈윈은 그것을 오케스트라와 오페라라는 유럽의 그릇에 담아 “미국의 소리”를 만들었습니다."}
],

pieces: [
  {"id":"vivaldi-seasons","c":"vivaldi","t":"사계","alias":"봄 · 여름 · 가을 · 겨울","y":"1725 출판","form":"협주곡","dur":"약 40분(전곡)","lv":1,"q":"Vivaldi Four Seasons complete","story":["바이올린 협주곡 4개로 이루어진 곡으로, 각 협주곡 앞에 계절을 묘사한 소네트(시)가 붙어 있습니다. 악보에 “새들의 노래”, “잠든 양치기”, “짖는 개” 같은 설명까지 적혀 있어, 음악으로 장면을 그리는 표제음악의 선구로 꼽힙니다.","비발디 사후 오랫동안 잊혔다가 20세기 중반 녹음 시대에 폭발적인 인기를 얻어, 지금은 가장 많이 녹음된 클래식 곡 중 하나입니다."],"points":["봄 1악장: 바이올린들이 새소리를 흉내 내며 지저귑니다","여름 3악장: 폭풍우와 번개 — 현악기들이 몰아칩니다","겨울 2악장: 밖은 비가 오는데 난롯가에서 쉬는 평화로운 장면(피치카토가 빗소리)"]},
  {"id":"vivaldi-op3-6","c":"vivaldi","t":"바이올린 협주곡 a단조","alias":"“조화의 영감” Op.3-6 · RV 356","y":"1711","form":"협주곡","dur":"약 8분","lv":1,"q":"Vivaldi Violin Concerto A minor RV 356","story":["협주곡집 “조화의 영감”에 실린 곡으로, 이 곡집은 유럽 전역에 퍼져 바흐도 여러 곡을 건반악기용으로 편곡하며 공부했습니다.","a단조 협주곡은 지금도 바이올린을 배우는 학생들이 가장 먼저 만나는 협주곡 중 하나입니다."],"points":["오케스트라 합주(리토르넬로)와 독주가 번갈아 나오는 구조","2악장: 단순한 반주 위 바이올린의 노래","3악장 독주의 빠른 음형 — 학생 연주회의 단골 장면"]},
  {"id":"vivaldi-mandolin","c":"vivaldi","t":"만돌린 협주곡","alias":"C장조 · RV 425","y":"1725년경","form":"협주곡","dur":"약 8분","lv":1,"q":"Vivaldi Mandolin Concerto C major RV 425","story":["비발디는 바이올린뿐 아니라 만돌린, 류트, 리코더 같은 다양한 악기를 위한 협주곡을 썼습니다. 이 곡은 만돌린 협주곡의 대표작입니다.","작고 찰랑이는 만돌린 소리가 들리도록 오케스트라는 피치카토(현을 뜯는 주법)로 조용히 받쳐 줍니다."],"points":["1악장: 경쾌하게 튀는 만돌린의 리듬","2악장: 오케스트라 피치카토 위의 섬세한 노래","만돌린의 트레몰로(빠른 반복)가 만드는 반짝임"]},
  {"id":"vivaldi-2cello","c":"vivaldi","t":"두 대의 첼로를 위한 협주곡","alias":"g단조 · RV 531","y":"1720년경","form":"협주곡","dur":"약 10분","lv":2,"q":"Vivaldi Concerto for Two Cellos G minor RV 531","story":["비발디가 남긴 유일한 두 대의 첼로 협주곡입니다. 두 첼로가 경쟁하고 대화하며 저음 악기의 매력을 보여 줍니다.","피에타 고아원 오케스트라에 실력 있는 첼로 연주자가 있었기에 이런 곡이 가능했을 것으로 추측됩니다."],"points":["1악장 시작: 두 첼로가 하나씩 들어오는 긴장감","같은 선율을 시차를 두고 주고받는 대화","3악장의 몰아치는 단조 에너지"]},
  {"id":"vivaldi-gloria","c":"vivaldi","t":"글로리아","alias":"D장조 · RV 589","y":"1715년경","form":"성악","dur":"약 30분","lv":1,"q":"Vivaldi Gloria RV 589","story":["미사의 “대영광송” 가사에 붙인 합창곡으로, 피에타 고아원 여성 합창단을 위해 썼을 가능성이 큽니다.","200년 넘게 잊혔다가 1939년 이탈리아 시에나의 비발디 음악제에서 다시 연주되며 비발디 부흥의 상징이 되었습니다."],"points":["첫 합창: 옥타브로 튀는 현악기와 트럼펫의 축제 분위기","느린 “지상에는 평화”의 고요한 대비","마지막 푸가 — 합창이 겹겹이 쌓이는 장대한 마무리"]},
  {"id":"vivaldi-goldfinch","c":"vivaldi","t":"플루트 협주곡 “홍방울새”","alias":"D장조 Op.10-3 · RV 428","y":"1728","form":"협주곡","dur":"약 10분","lv":1,"q":"Vivaldi Flute Concerto Il Gardellino RV 428","story":["사계처럼 표제가 붙은 협주곡으로, 플루트가 작은 새 홍방울새의 지저귐을 흉내 냅니다.","플루트 협주곡 6곡을 묶어 출판한 곡집 Op.10은 플루트 독주를 위한 최초의 협주곡집 중 하나로 꼽힙니다."],"points":["플루트의 트릴과 빠른 장식음 = 새의 지저귐","바이올린이 새소리에 답하는 장면","2악장의 시칠리아노풍 흔들리는 리듬"]},
  {"id":"vivaldi-4violins","c":"vivaldi","t":"네 대의 바이올린을 위한 협주곡","alias":"b단조 Op.3-10 · RV 580","y":"1711","form":"협주곡","dur":"약 10분","lv":2,"q":"Vivaldi Concerto for 4 Violins B minor RV 580","story":["바이올린 독주자 네 명이 번갈아 주인공이 되는 화려한 협주곡입니다.","바흐가 이 곡을 네 대의 쳄발로 협주곡(BWV 1065)으로 편곡했을 만큼, 비발디의 음악은 당시 독일 작곡가들에게도 교과서였습니다."],"points":["네 바이올린이 차례로 솔로를 이어받는 릴레이","2악장 중간의 신비로운 분산화음 효과","바흐 편곡판(쳄발로 4대)과 비교해 들어보기"]},
  {"id":"vivaldi-stabat","c":"vivaldi","t":"스타바트 마테르","alias":"f단조 · RV 621","y":"1712","form":"성악","dur":"약 20분","lv":2,"q":"Vivaldi Stabat Mater RV 621","story":["십자가 아래 아들을 바라보는 성모 마리아의 슬픔을 노래한 중세 시에 붙인 곡입니다. 알토 독창과 현악 합주를 위한 곡입니다.","1712년 브레시아의 성당 축일을 위해 쓴 것으로 보이며, 비발디의 초기 대표 성악곡입니다."],"points":["첫 곡: 느리게 반복되는 현악기의 한숨 같은 음형","알토 목소리의 어둡고 깊은 음색","마지막 “아멘”의 짧고 강렬한 마무리"]},
  {"id":"vivaldi-bassoon","c":"vivaldi","t":"바순 협주곡","alias":"e단조 · RV 484","y":"1720년대","form":"협주곡","dur":"약 11분","lv":2,"q":"Vivaldi Bassoon Concerto E minor RV 484","story":["비발디는 바순 협주곡을 무려 39곡이나 썼습니다. 다른 바로크 작곡가들이 거의 관심을 두지 않은 악기였습니다.","낮고 둥근 바순이 바이올린처럼 빠르게 뛰어다니는 모습이 이 곡의 매력입니다."],"points":["바순의 큰 음역 도약 — 높은음과 낮은음을 오가는 재치","2악장: 바순이 부르는 의외로 서정적인 노래","3악장의 경쾌한 단조 리듬"]},
  {"id":"vivaldi-lute","c":"vivaldi","t":"류트 협주곡","alias":"D장조 · RV 93","y":"1730년경","form":"협주곡","dur":"약 10분","lv":1,"q":"Vivaldi Lute Concerto D major RV 93 guitar","story":["보헤미아의 백작을 위해 쓴 것으로 알려진 류트 협주곡입니다. 지금은 기타로 가장 많이 연주됩니다.","2악장 라르고는 수많은 광고와 영화에 쓰인 아름다운 선율입니다."],"points":["1악장: 기타(류트)의 맑고 가벼운 소리","2악장 라르고: 단순하고 고요한 선율","3악장의 춤추는 듯한 마무리"]},
  {"id":"bach-goldberg","c":"bach","t":"골드베르크 변주곡","alias":"BWV 988","y":"1741","form":"건반","dur":"약 40–80분","lv":3,"q":"Bach Goldberg Variations Glenn Gould 1981","story":["불면증에 시달리던 백작을 위해 그의 전속 연주자 골드베르크가 밤마다 연주했다는 일화에서 이름이 붙었습니다. 이 이야기는 바흐 사후 전기에 처음 나와 사실인지는 확실하지 않지만, 덕분에 “잠을 위한 음악”으로 널리 알려졌습니다.","조용한 아리아로 시작해 30개의 변주를 거친 뒤 같은 아리아로 돌아오며 끝납니다. 1955년 캐나다의 젊은 피아니스트 글렌 굴드의 데뷔 음반이 이 곡을 대중적인 명곡으로 만들었고, 그는 세상을 떠나기 직전인 1981년에 다시 녹음했습니다."],"points":["처음 아리아의 저음 선을 기억해 두세요. 30개 변주 모두가 이 저음 위에 지어집니다","세 번째 변주마다 같은 선율이 시차를 두고 따라오는 “카논”이 숨어 있습니다","마지막에 처음 아리아가 그대로 돌아올 때, 똑같은 음인데 전혀 다르게 들리는 경험을 해보세요"]},
  {"id":"bach-cello1","c":"bach","t":"무반주 첼로 모음곡 1번","alias":"프렐류드 · BWV 1007","y":"1720년경","form":"독주","dur":"약 2분 30초(프렐류드)","lv":1,"q":"Bach Cello Suite No 1 Prelude","story":["반주 없이 첼로 한 대로만 연주하는 6개 모음곡 중 첫 곡입니다. 오랫동안 연습곡 정도로 여겨져 잊혀 있었는데, 13살의 스페인 첼리스트 파블로 카살스가 바르셀로나의 중고 악보 가게에서 악보를 우연히 발견했습니다.","카살스는 10년 넘게 혼자 연습한 뒤에야 이 곡을 무대에 올렸고, 그 뒤 첼리스트라면 누구나 연주하는 성전이 되었습니다."],"points":["첼로 한 대인데 저음과 화음과 선율이 동시에 들리는 착각 — 분산화음의 마법입니다","중간부터 점점 높이 올라가며 긴장이 쌓이는 흐름을 따라가 보세요","끝 직전, 가장 높은 곳에서 터지는 화음이 클라이맥스입니다"]},
  {"id":"bach-air","c":"bach","t":"G선상의 아리아","alias":"관현악 모음곡 3번 중 Air · BWV 1068","y":"1730년경","form":"관현악","dur":"약 5분","lv":1,"q":"Bach Air on the G String orchestral suite 3","story":["원래는 관현악 모음곡 3번의 두 번째 곡으로, 춤곡들 사이에 놓인 느린 노래(Air)입니다.","“G선상의”라는 이름은 바흐가 붙인 것이 아닙니다. 1871년 독일 바이올리니스트 빌헬미가 이 곡을 바이올린의 가장 낮은 G현 하나로만 연주할 수 있게 편곡하면서 생긴 별명입니다."],"points":["위에서 길게 늘어지는 선율과, 아래에서 한 걸음씩 걷는 저음의 대비","선율이 긴 음을 끌다가 장식음으로 풀려나는 순간들","두 부분이 각각 반복되는 단순한 구조 — 두 번째 들을 때 더 잘 들립니다"]},
  {"id":"bach-brandenburg3","c":"bach","t":"브란덴부르크 협주곡 3번","alias":"G장조 · BWV 1048","y":"1721","form":"협주곡","dur":"약 11분","lv":1,"q":"Bach Brandenburg Concerto No 3 BWV 1048","story":["바흐가 브란덴부르크의 크리스티안 루트비히 변경백에게 헌정한 협주곡 6곡 중 하나입니다. 일자리를 구하려는 일종의 포트폴리오였지만, 변경백이 실제로 연주했다는 기록은 없고 악보는 서고에 묻혀 있었습니다.","3번은 바이올린·비올라·첼로가 각각 세 대씩, 아홉 대의 현악기가 서로 주고받는 독특한 편성입니다."],"points":["첫 주제가 여러 악기 사이를 탁구공처럼 오가는 모습","2악장은 화음 두 개뿐 — 연주자가 즉흥으로 채우기도 합니다","3악장: 숨 쉴 틈 없이 달려가는 춤곡의 에너지"]},
  {"id":"bach-toccata","c":"bach","t":"토카타와 푸가","alias":"d단조 · BWV 565","y":"1704년경?","form":"오르간","dur":"약 9분","lv":1,"q":"Bach Toccata and Fugue in D minor BWV 565 organ","story":["오르간 음악 하면 누구나 떠올리는 첫 소절, “빠라라~ 빠라라라라~”의 곡입니다. 공포 영화와 만화에 하도 많이 쓰여서 “드라큘라 음악”처럼 여겨지기도 합니다.","흥미롭게도 바흐의 친필 악보가 남아 있지 않아, 정말 바흐가 썼는지 의심하는 학자들도 있습니다."],"points":["첫 세 음 — 높은 곳에서 떨어지는 장식음과 깊은 저음의 울림","토카타(즉흥적인 화려함)에서 푸가(질서 있는 대화)로 넘어가는 순간","오르간 발 건반이 내는 바닥을 울리는 저음"]},
  {"id":"bach-matthew","c":"bach","t":"마태수난곡","alias":"“주여, 불쌍히 여기소서” · BWV 244","y":"1727","form":"성악","dur":"약 7분(아리아)","lv":2,"q":"Bach St Matthew Passion Erbarme dich","story":["마태복음의 예수 수난 이야기를 3시간 가까운 음악으로 그린 대작으로, 라이프치히 토마스 교회의 성금요일 예배를 위해 쓰였습니다.","바흐 사후 거의 잊혔다가 1829년 20세의 멘델스존이 다시 무대에 올리면서 “바흐 부활”의 신호탄이 되었습니다. “주여, 불쌍히 여기소서”는 예수를 세 번 부인한 베드로가 통곡하는 장면의 아리아입니다."],"points":["독주 바이올린이 흐느끼듯 길게 노래하는 도입","알토 가수와 바이올린이 서로의 슬픔에 답하는 이중창 같은 짜임","바닥에서 한 걸음씩 무겁게 걷는 저음 — 베드로의 무너진 마음"]},
  {"id":"bach-wtc1","c":"bach","t":"평균율 클라비어곡집 1권 1번 전주곡","alias":"C장조 · BWV 846","y":"1722","form":"건반","dur":"약 2분","lv":1,"q":"Bach Prelude in C major BWV 846 Well Tempered Clavier","story":["평균율 클라비어곡집은 24개의 모든 조성으로 전주곡과 푸가를 한 쌍씩 쓴 곡집으로, “피아노 음악의 구약성서”라고 불립니다.","1번 전주곡은 같은 모양의 분산화음만으로 이루어진 단순한 곡인데, 100여 년 뒤 구노가 이 위에 선율을 얹어 그 유명한 “아베 마리아”를 만들었습니다."],"points":["한 마디마다 화음 하나 — 화음이 바뀌는 색깔에만 집중해 보세요","긴장이 쌓이다가 마지막에 C장조로 돌아오는 안도감","이 곡 위로 구노의 “아베 마리아” 선율을 상상해 보세요"]},
  {"id":"bach-chaconne","c":"bach","t":"샤콘느","alias":"무반주 바이올린 파르티타 2번 · BWV 1004","y":"1720","form":"독주","dur":"약 14분","lv":3,"q":"Bach Chaconne Partita No 2 BWV 1004 violin","story":["바이올린 한 대로 14분 넘게 이어지는 거대한 변주곡입니다. 브람스는 이 곡에 대해 “한 사람이 깊은 생각과 강렬한 감정의 세계 전체를 담아냈다”는 취지의 편지를 클라라 슈만에게 썼습니다.","바흐가 여행에서 돌아왔을 때 아내 마리아 바르바라가 이미 세상을 떠나 묻힌 뒤였는데, 그 무렵 쓴 곡이라 아내를 위한 추모곡이라는 해석도 있습니다(확실한 증거는 없습니다)."],"points":["처음 네 마디의 무거운 화음 — 이 주제가 64번 변주됩니다","중간에 d단조가 D장조로 바뀌며 빛이 드는 순간","바이올린 한 대에서 동시에 여러 성부가 들리는 기적"]},
  {"id":"bach-coffee","c":"bach","t":"커피 칸타타","alias":"BWV 211","y":"1734년경","form":"성악","dur":"약 25분","lv":2,"q":"Bach Coffee Cantata BWV 211","story":["엄숙한 교회 음악가 바흐의 유쾌한 면을 보여주는 세속 칸타타입니다. 커피에 빠진 딸과 커피를 끊게 하려는 아버지의 실랑이를 그린 작은 코미디입니다.","라이프치히의 치머만 커피하우스에서 바흐가 이끄는 대학생 음악 모임이 공연했을 것으로 여겨집니다. 당시 커피는 새로운 유행이었습니다."],"points":["딸이 부르는 “커피는 천 번의 키스보다 달콤해” 아리아의 경쾌함","아버지의 투덜거리는 저음 레치타티보","마지막 합창 — 결국 커피를 이길 수 없다는 결론"]},
  {"id":"bach-jesu","c":"bach","t":"예수, 인간 소망의 기쁨","alias":"칸타타 147번 중 · BWV 147","y":"1723","form":"성악","dur":"약 3분","lv":1,"q":"Bach Jesu Joy of Man s Desiring","story":["칸타타 147번 “마음과 입과 행동과 삶으로”의 두 곳에 나오는 코랄(찬송)입니다. 영어 제목으로 결혼식 음악으로 유명해졌습니다.","코랄 선율 자체는 다른 작곡가의 찬송이고, 바흐는 그 주위를 감싸는 셋잇단 음표의 흐르는 선율을 붙였습니다."],"points":["끊임없이 흐르는 셋잇단 음표 — 바흐가 덧붙인 부분","그 위로 천천히 등장하는 찬송 선율","두 선율이 겹치며 만드는 평온한 행렬"]},
  {"id":"handel-messiah","c":"handel","t":"메시아","alias":"할렐루야 합창","y":"1741","form":"오라토리오","dur":"약 4분(할렐루야)","lv":1,"q":"Handel Messiah Hallelujah Chorus","story":["예수의 탄생·수난·부활을 다룬 오라토리오(종교적 내용의 극음악, 연기 없이 노래만)입니다. 헨델은 2시간이 넘는 이 대작을 약 24일 만에 완성했고, 1742년 아일랜드 더블린의 자선 공연에서 초연했습니다.","런던 공연 때 할렐루야 합창에서 국왕 조지 2세가 감동해 일어섰고 모두 따라 일어났다는 이야기가 전합니다. 근거는 확실하지 않지만, 지금도 이 대목에서 청중이 일어서는 전통이 남아 있습니다."],"points":["“할렐루야” 한 단어를 여러 리듬으로 외치는 합창의 힘","“King of Kings”에서 음이 한 단계씩 계속 올라가며 쌓이는 긴장","트럼펫과 팀파니가 터져 나오는 순간들"]},
  {"id":"handel-water","c":"handel","t":"수상음악","alias":"HWV 348–350","y":"1717","form":"관현악","dur":"약 50분(전곡)","lv":2,"q":"Handel Water Music Suite","story":["1717년 여름, 영국 왕 조지 1세가 템스강에서 뱃놀이를 하며 들은 음악입니다. 50여 명의 연주자가 따로 배를 타고 왕의 배를 따라가며 연주했고, 왕이 너무 좋아해 세 번이나 반복 연주를 시켰다는 기록이 남아 있습니다.","야외에서, 그것도 강 위에서 울려야 했기에 호른과 트럼펫 같은 금관악기가 활약하는 밝고 화려한 음악이 되었습니다."],"points":["야외용 음악답게 호른이 앞에 나서는 장면들","미뉴에트·부레·혼파이프 같은 여러 춤곡을 비교해 보세요","유명한 “알라 혼파이프”의 당당한 리듬"]},
  {"id":"handel-fireworks","c":"handel","t":"왕궁의 불꽃놀이 음악","alias":"HWV 351","y":"1749","form":"관현악","dur":"약 20분","lv":1,"q":"Handel Music for the Royal Fireworks","story":["오스트리아 왕위 계승 전쟁의 종전을 기념해 런던 그린파크에서 열린 불꽃놀이를 위해 쓴 곡입니다. 공개 리허설에만 1만 명이 넘는 사람이 몰려 교통이 마비됐다고 합니다.","정작 본 행사 날에는 불꽃놀이용 무대에 불이 붙는 사고가 났습니다. 원래 국왕은 현악기 없이 관악기와 타악기만 쓰길 원했습니다."],"points":["서곡: 트럼펫과 호른, 팀파니의 당당한 축제","“평화” 악장의 부드러운 대비","“환희” 악장 — 같은 선율이 악기를 바꿔 반복"]},
  {"id":"handel-sarabande","c":"handel","t":"사라방드","alias":"하프시코드 모음곡 d단조 · HWV 437","y":"1703–06년경","form":"건반","dur":"약 4분","lv":1,"q":"Handel Sarabande HWV 437","story":["사라방드는 느리고 장중한 3박자 춤곡입니다. 헨델은 이 짧은 선율을 다른 작품에서도 재활용했습니다.","1975년 스탠리 큐브릭 감독의 영화 “배리 린든”에 관현악 편곡으로 쓰이며 큰 인기를 얻었습니다."],"points":["둘째 박에 무게가 실리는 사라방드 특유의 걸음걸이","같은 주제가 변주되며 점점 장식이 많아집니다","단조의 엄숙하고 비극적인 분위기"]},
  {"id":"handel-lascia","c":"handel","t":"울게 하소서","alias":"오페라 “리날도” 중 · HWV 7","y":"1711","form":"성악","dur":"약 5분","lv":1,"q":"Handel Lascia ch io pianga Rinaldo","story":["헨델이 런던에서 처음 성공을 거둔 오페라 “리날도”의 아리아입니다. 적에게 붙잡힌 여인 알미레나가 자신의 운명을 슬퍼하며 부릅니다.","영화 “파리넬리”(1994)에 쓰이며 다시 유명해졌습니다. 헨델은 이 선율을 이전 작품에서 가져와 다듬었습니다."],"points":["단순한 3박자 위의 느리고 고귀한 선율","반복되는 부분에서 가수가 덧붙이는 장식","중간 부분의 짧은 격정과 다시 돌아오는 체념"]},
  {"id":"handel-ombra","c":"handel","t":"옴브라 마이 푸","alias":"오페라 “세르세” 중 · HWV 40","y":"1738","form":"성악","dur":"약 4분","lv":1,"q":"Handel Ombra mai fu Xerxes","story":["페르시아 왕 세르세가 플라타너스 나무 그늘을 찬미하며 부르는 노래입니다. 나무에게 바치는 사랑 노래라는 점이 재미있습니다.","“헨델의 라르고”라는 이름으로 기악 편곡이 널리 연주되며, 오페라 자체보다 훨씬 유명해졌습니다."],"points":["현악기의 짧은 도입 후 목소리가 길게 이어지는 첫 음","넓게 흐르는 선율의 평화로움","원래 카스트라토(남성 고음 가수)를 위한 곡 — 지금은 카운터테너나 메조소프라노가 부릅니다"]},
  {"id":"handel-zadok","c":"handel","t":"사제 자독","alias":"대관식 앤섬 · HWV 258","y":"1727","form":"성악","dur":"약 6분","lv":1,"q":"Handel Zadok the Priest","story":["영국 왕 조지 2세의 대관식을 위해 쓴 곡으로, 그 뒤 거의 300년 동안 모든 영국 대관식에서 연주되었습니다.","UEFA 챔피언스리그 주제곡은 이 곡을 바탕으로 만들어졌습니다."],"points":["현악기의 잔물결이 점점 커지며 긴장을 쌓는 긴 도입","합창이 한꺼번에 터져 나오는 순간","“신이여 왕을 보호하소서”의 환호"]},
  {"id":"handel-harp","c":"handel","t":"하프 협주곡","alias":"B♭장조 Op.4-6 · HWV 294","y":"1736","form":"협주곡","dur":"약 14분","lv":1,"q":"Handel Harp Concerto B flat Op 4 No 6","story":["오라토리오 공연 막간에 헨델 자신이나 다른 연주자가 연주하도록 쓴 오르간 협주곡 중 하나로, 하프로도 연주하도록 했습니다.","당시 런던 청중은 오라토리오 사이에 나오는 이런 협주곡을 무척 즐겼습니다."],"points":["하프의 맑게 튕기는 분산화음","약음기를 낀 현악기와 하프의 부드러운 대화","3악장의 밝고 가벼운 춤곡"]},
  {"id":"handel-blacksmith","c":"handel","t":"즐거운 대장장이","alias":"하프시코드 모음곡 5번 E장조 · HWV 430","y":"1720","form":"건반","dur":"약 4분","lv":1,"q":"Handel Harmonious Blacksmith HWV 430","story":["단순한 주제와 다섯 개의 변주로 된 곡입니다. “즐거운 대장장이”라는 별명은 헨델이 붙인 것이 아니라 그가 죽은 뒤 출판업자가 붙였습니다.","헨델이 비를 피해 들어간 대장간에서 망치 소리를 듣고 영감을 받았다는 이야기가 있지만, 후대에 지어낸 이야기로 보입니다."],"points":["소박한 주제 선율 — 노래 부르듯 단순합니다","변주마다 음표가 점점 빨라지며 망치질처럼 바빠집니다","마지막 변주의 화려한 손놀림"]},
  {"id":"handel-sheba","c":"handel","t":"시바 여왕의 도착","alias":"오라토리오 “솔로몬” 중 · HWV 67","y":"1749","form":"관현악","dur":"약 3분","lv":1,"q":"Handel Arrival of the Queen of Sheba","story":["솔로몬 왕을 찾아온 시바 여왕의 화려한 행렬을 그린 오라토리오 3막의 짧은 기악곡입니다.","두 대의 오보에가 현악기와 활기차게 주고받는 이 곡은 오라토리오에서 떨어져 나와 결혼식과 기념식의 단골 음악이 되었습니다."],"points":["현악기의 쉴 새 없이 반짝이는 16분음표","오보에 두 대가 대화하듯 주고받는 선율","3분 안에 끝나는 짧고 화려한 행렬"]},
  {"id":"haydn-surprise","c":"haydn","t":"교향곡 94번 “놀람”","alias":"Hob. I:94","y":"1791","form":"교향곡","dur":"약 23분","lv":1,"q":"Haydn Symphony 94 Surprise","story":["런던 청중을 위해 쓴 교향곡입니다. 2악장은 아주 조용하고 단순한 선율로 시작하는데, 반복되던 중 갑자기 오케스트라 전체가 “쾅!” 하고 큰 소리를 냅니다.","음악회에서 조는 귀부인들을 깨우려 했다는 일화가 유명하지만, 하이든 본인은 “청중을 놀라게 해서 새로운 것으로 주목받고 싶었다”고 말했다고 합니다. 런던의 경쟁 음악회와 인기 경쟁 중이었거든요."],"points":["2악장: 소곤소곤 반복되는 선율에 방심하다가 — 쾅!","같은 선율이 이후 여러 방식으로 변주되는 것도 들어보세요","4악장: 빠르고 경쾌한 마무리, 하이든 특유의 유머"]},
  {"id":"haydn-farewell","c":"haydn","t":"교향곡 45번 “고별”","alias":"Hob. I:45","y":"1772","form":"교향곡","dur":"약 25분","lv":2,"q":"Haydn Symphony 45 Farewell","story":["에스테르하지 공작이 여름 별궁에 너무 오래 머무는 바람에 단원들은 몇 달째 가족을 보지 못하고 있었습니다. 하이든은 이 마음을 음악으로 전하기로 했습니다.","마지막 악장에서 연주자들이 자기 부분을 마치면 한 명씩 악보대의 촛불을 끄고 무대를 떠나, 결국 바이올린 두 명만 남습니다. 뜻을 알아챈 공작은 다음 날 모두에게 휴가를 주었다고 합니다."],"points":["당시로는 드문 f#단조 — 불안하고 격한 1악장","마지막 악장이 끝나는가 싶다가 갑자기 느려지는 반전","악기가 하나씩 사라지며 소리가 점점 얇아지는 과정(영상으로 보면 더 재미있어요)"]},
  {"id":"haydn-trumpet","c":"haydn","t":"트럼펫 협주곡","alias":"E♭장조 · Hob.VIIe:1","y":"1796","form":"협주곡","dur":"약 15분","lv":1,"q":"Haydn Trumpet Concerto E flat","story":["당시 트럼펫은 자연 배음만 낼 수 있어 선율을 연주하기 어려웠습니다. 빈의 트럼펫 연주자 바이딩거가 구멍과 키를 단 새 트럼펫을 개발하자, 하이든이 그를 위해 이 곡을 썼습니다.","하이든의 마지막 관현악 작품 중 하나이며, 지금도 트럼펫 연주자들의 필수 레퍼토리입니다."],"points":["1악장: 당시로서는 놀라웠던 트럼펫의 반음계 선율","2악장 안단테: 트럼펫이 부르는 부드러운 노래","3악장 론도의 밝고 당당한 주제"]},
  {"id":"haydn-emperor","c":"haydn","t":"현악4중주 “황제”","alias":"C장조 Op.76-3 · Hob.III:77","y":"1797","form":"실내악","dur":"약 25분","lv":2,"q":"Haydn String Quartet Emperor Op 76 No 3","story":["나폴레옹 전쟁 중 하이든은 오스트리아 황제를 위한 찬가 “신이여 프란츠 황제를 지켜주소서”를 작곡했습니다. 영국 국가에 감동받아 쓴 곡이라고 합니다.","이 4중주의 2악장은 그 찬가 선율을 주제로 한 변주곡입니다. 이 선율은 훗날 독일 국가의 선율이 되었습니다."],"points":["2악장: 제1바이올린이 부르는 찬가 선율","변주마다 선율이 첼로, 비올라 등 다른 악기로 옮겨 갑니다","네 악기만으로 만드는 꽉 찬 화음"]},
  {"id":"haydn-cello1","c":"haydn","t":"첼로 협주곡 1번","alias":"C장조 · Hob.VIIb:1","y":"1761–65년경","form":"협주곡","dur":"약 24분","lv":2,"q":"Haydn Cello Concerto No 1 C major","story":["에스테르하지 궁정 오케스트라의 첼로 수석을 위해 쓴 것으로 보이는 곡입니다. 200년 가까이 사라졌다가 1961년 프라하의 박물관에서 필사 악보가 발견되었습니다.","발견 이듬해부터 다시 연주되기 시작해, 지금은 가장 사랑받는 첼로 협주곡 중 하나가 되었습니다."],"points":["1악장: 바로크풍의 당당한 리듬","2악장: 첼로가 높은 음역에서 부르는 따뜻한 노래","3악장: 손가락이 쉴 틈 없는 고난도 빠른 악장"]},
  {"id":"haydn-creation","c":"haydn","t":"천지창조","alias":"오라토리오 · Hob.XXI:2","y":"1798","form":"성악","dur":"약 7분(도입부)","lv":2,"q":"Haydn The Creation Representation of Chaos Let there be light","story":["런던에서 헨델의 오라토리오를 듣고 깊은 감명을 받은 하이든이 60대에 쓴 대작입니다. 성경 창세기의 천지창조를 음악으로 그렸습니다.","하이든의 마지막 공개 행사는 1808년 이 곡의 공연이었습니다. 청중이 열광하자 하이든은 “내가 아니라 저 위에서 온 것”이라며 하늘을 가리켰다고 전해집니다."],"points":["도입 “혼돈의 묘사”: 형체 없이 떠다니는 화음","“빛이 있으라” — 합창과 오케스트라가 C장조로 폭발하는 순간","새, 사자, 벌레 등을 흉내 내는 오케스트라의 묘사"]},
  {"id":"haydn-clock","c":"haydn","t":"교향곡 101번 “시계”","alias":"D장조 · Hob.I:101","y":"1794","form":"교향곡","dur":"약 28분","lv":1,"q":"Haydn Symphony 101 The Clock","story":["두 번째 런던 방문 때 쓴 교향곡 중 하나입니다. 2악장에서 바순과 현악기의 피치카토가 시계추처럼 똑딱이는 반주를 들려 주어 “시계”라는 별명이 붙었습니다.","별명은 하이든이 붙인 것이 아니라 19세기에 생겼습니다."],"points":["2악장: “똑-딱” 하는 반주 위로 흐르는 우아한 선율","중간에 갑자기 단조로 바뀌는 극적인 부분","4악장의 활기찬 푸가풍 마무리"]},
  {"id":"haydn-london","c":"haydn","t":"교향곡 104번 “런던”","alias":"D장조 · Hob.I:104","y":"1795","form":"교향곡","dur":"약 28분","lv":2,"q":"Haydn Symphony 104 London","story":["하이든이 쓴 마지막 교향곡입니다. 런던 청중을 위해 쓴 12곡의 “런던 교향곡” 중 마지막 곡이라 이 곡에만 “런던”이라는 별명이 남았습니다.","하이든은 런던에서의 성공으로 큰돈을 벌었고, 런던 공연 수익이 에스테르하지 궁정에서 받은 연봉 수십 년치에 맞먹었다고 합니다."],"points":["1악장 서주: 엄숙한 단조 화음으로 시작","4악장: 크로아티아 민요로 알려진 소박한 주제","하이든 교향곡 100여 곡의 집대성이라 할 탄탄한 구성"]},
  {"id":"haydn-lark","c":"haydn","t":"현악4중주 “종달새”","alias":"D장조 Op.64-5 · Hob.III:63","y":"1790","form":"실내악","dur":"약 18분","lv":1,"q":"Haydn String Quartet The Lark Op 64 No 5","story":["1악장에서 제1바이올린이 높은 음역에서 날아오르듯 노래하는 모습이 종달새 같다고 해서 붙은 별명입니다.","하이든은 현악4중주라는 장르를 사실상 만든 사람으로, 이 곡은 그의 4중주 중 가장 사랑받는 작품 중 하나입니다."],"points":["1악장: 다른 악기들의 반주 위로 솟아오르는 바이올린","2악장 아다지오: 차분한 기도 같은 노래","4악장: 쉬지 않고 달리는 바이올린의 무궁동"]},
  {"id":"haydn-military","c":"haydn","t":"교향곡 100번 “군대”","alias":"G장조 · Hob.I:100","y":"1794","form":"교향곡","dur":"약 24분","lv":1,"q":"Haydn Symphony 100 Military","story":["2악장과 4악장에 트라이앵글, 심벌즈, 큰북 같은 “터키 군악대” 악기와 트럼펫 신호가 등장해 “군대”라는 별명이 붙었습니다.","런던 초연 때 큰 화제가 되어 신문에 “전쟁의 지옥 같은 굉음”이라는 평까지 실렸습니다."],"points":["2악장: 우아한 선율 뒤에 갑자기 등장하는 군악 타악기","트럼펫의 군대 신호 나팔","오스만 제국 군악대에서 유행한 “터키풍” 음악의 분위기"]},
  {"id":"mozart-eine","c":"mozart","t":"아이네 클라이네 나흐트무지크","alias":"세레나데 13번 · K.525","y":"1787","form":"실내악","dur":"약 18분","lv":1,"q":"Mozart Eine kleine Nachtmusik K 525","story":["독일어로 “작은 밤의 음악”이라는 뜻으로, 모차르트가 자기 작품 목록에 적어둔 평범한 이름이 그대로 제목이 되었습니다.","오페라 “돈 조반니”를 작곡하던 바쁜 시기에 쓴 곡인데, 왜 썼는지 누구를 위해 썼는지는 알려져 있지 않습니다. 생전엔 출판되지도 않았지만 지금은 모차르트를 상징하는 곡이 되었습니다."],"points":["1악장 첫 소절: 위로 솟아오르는 “빰-빠빰” — 들으면 바로 아는 그 선율","고전 시대 소나타 형식의 교과서: 제1주제 → 제2주제 → 발전 → 재현","2악장 로망스의 다정하고 노래하는 선율"]},
  {"id":"mozart-pc21","c":"mozart","t":"피아노 협주곡 21번","alias":"2악장 안단테 · K.467","y":"1785","form":"협주곡","dur":"약 7분(2악장)","lv":1,"q":"Mozart Piano Concerto 21 K 467 Andante","story":["빈에서 자신이 직접 피아노를 치는 예약 연주회를 위해 쓴 곡입니다. 이 시기 모차르트는 빈 최고의 인기 피아니스트였고, 몇 주 간격으로 새 협주곡을 써서 직접 초연했습니다.","2악장은 1967년 스웨덴 영화 “엘비라 마디간”에 쓰이면서 크게 유명해졌고, 지금도 “엘비라 마디간”이라는 별명으로 불립니다."],"points":["약음기를 낀 현악기들의 꿈꾸는 듯한 반주 위로 피아노가 노래합니다","피아노가 성악가처럼 길게 노래하는 선율 — 모차르트가 오페라 작곡가였음을 느껴보세요","중간에 잠깐 그늘이 지는 단조 화음들"]},
  {"id":"mozart-sym40","c":"mozart","t":"교향곡 40번","alias":"g단조 · K.550","y":"1788","form":"교향곡","dur":"약 30분","lv":2,"q":"Mozart Symphony 40 G minor K 550","story":["1788년 여름, 모차르트는 약 6주 만에 마지막 세 교향곡(39·40·41번)을 연달아 썼습니다. 빚에 시달리던 시기였고, 이 곡들이 생전에 연주되었는지도 확실하지 않습니다.","모차르트의 교향곡 41곡 중 단조는 단 두 곡뿐인데, 그중 하나입니다. 밝은 모차르트와 다른 불안하고 비극적인 얼굴을 볼 수 있습니다."],"points":["1악장: 반주가 먼저 술렁인 뒤 바이올린이 한숨 쉬듯 시작하는 첫 주제","단조가 주는 쫓기는 듯한 긴장감","4악장: 위로 튀어 오르는 주제와 격렬한 마무리"]},
  {"id":"mozart-requiem","c":"mozart","t":"레퀴엠","alias":"라크리모사 · K.626","y":"1791","form":"성악","dur":"약 3분(라크리모사)","lv":2,"q":"Mozart Requiem Lacrimosa","story":["1791년, 신원을 밝히지 않은 사람이 레퀴엠(죽은 자를 위한 미사곡)을 의뢰했습니다. 의뢰인은 아내를 잃고 이 곡을 자기 작품인 척하려던 발제크 백작이었지만, 병든 모차르트는 이 곡을 자기 장례를 위한 음악처럼 느꼈다고 합니다.","모차르트는 곡을 완성하지 못하고 세상을 떠났고, 제자 쥐스마이어가 나머지를 완성했습니다. 라크리모사(“눈물의 날”)는 모차르트가 처음 8마디를 쓰고 멈춘 곳으로 알려져 있습니다."],"points":["처음 8마디 — 모차르트가 남긴 마지막 음들일지도 모르는 부분","흐느끼듯 끊어지는 현악기의 리듬","마지막 “아멘”의 장엄한 화음"]},
  {"id":"mozart-queen","c":"mozart","t":"밤의 여왕 아리아","alias":"오페라 “마술피리” 중 “지옥의 복수가 내 마음에 끓어오르고” · K.620","y":"1791","form":"성악","dur":"약 3분","lv":1,"q":"Mozart Queen of the Night aria Der Holle Rache","story":["모차르트가 세상을 떠나기 두 달 전 초연한 오페라 “마술피리”의 아리아입니다. 밤의 여왕이 딸에게 원수를 죽이라고 명령하며 분노를 터뜨립니다.","소프라노가 낼 수 있는 가장 높은 음역 중 하나인 높은 F음까지 올라가, 소프라노들에게는 넘기 힘든 산 같은 곡입니다. 모차르트의 처형 요제파 호퍼를 위해 썼습니다."],"points":["스타카토로 튀어 오르는 초고음 — 분노가 폭발하는 장면","오케스트라의 긴박한 단조 반주","“들어라, 복수의 신들이여”로 끝나는 위협"]},
  {"id":"mozart-turkish","c":"mozart","t":"피아노 소나타 11번 “터키 행진곡”","alias":"A장조 · K.331","y":"1783년경","form":"피아노","dur":"약 22분(전곡)","lv":1,"q":"Mozart Piano Sonata No 11 K 331 Rondo alla Turca","story":["3악장 “알라 투르카(터키풍으로)”가 너무 유명해 소나타 전체가 “터키 행진곡”으로 불립니다.","오스만 제국 군악대 음악이 빈에서 유행하던 시절, 모차르트는 피아노로 큰북과 심벌즈 소리를 흉내 냈습니다. 1악장은 행진곡이 아니라 잔잔한 변주곡입니다."],"points":["1악장: 단순한 주제와 6개의 변주","3악장: 왼손의 쿵짝쿵짝 반주 = 군악대 북소리","장조로 바뀌며 행진하는 당당한 부분"]},
  {"id":"mozart-clarinet","c":"mozart","t":"클라리넷 협주곡","alias":"A장조 · K.622","y":"1791","form":"협주곡","dur":"약 28분","lv":1,"q":"Mozart Clarinet Concerto K 622","story":["모차르트가 세상을 떠나기 두 달 전 완성한 마지막 협주곡입니다. 친구이자 클라리넷 연주자 안톤 슈타틀러를 위해 썼습니다.","원래는 일반 클라리넷보다 낮은 음까지 나는 특수 클라리넷(바셋 클라리넷)을 위한 곡이었습니다. 2악장은 영화 “아웃 오브 아프리카”(1985)에 쓰였습니다."],"points":["2악장 아다지오: 클라리넷이 부르는 투명한 노래","클라리넷의 낮은 음과 높은 음 사이를 오가는 음색 변화","3악장 론도의 밝은 주제"]},
  {"id":"mozart-figaro","c":"mozart","t":"피가로의 결혼 서곡","alias":"K.492","y":"1786","form":"관현악","dur":"약 4분","lv":1,"q":"Mozart The Marriage of Figaro Overture","story":["귀족을 풍자해 금지되기도 했던 보마르셰의 연극을 오페라로 만든 작품의 서곡입니다. 하인 피가로가 백작의 꾀를 이겨내는 하루 동안의 소동을 다룹니다.","서곡은 오페라의 선율을 쓰지 않고, 바쁘게 돌아가는 하루의 분위기만으로 4분을 숨 가쁘게 달립니다."],"points":["처음 현악기의 소곤거림 — 바쁜 하루가 시작됩니다","갑자기 터지는 오케스트라 전체의 포르테","쉬지 않고 달리는 템포와 경쾌한 마무리"]},
  {"id":"mozart-jupiter","c":"mozart","t":"교향곡 41번 “주피터”","alias":"C장조 · K.551","y":"1788","form":"교향곡","dur":"약 33분","lv":2,"q":"Mozart Symphony 41 Jupiter K 551","story":["1788년 여름, 6주 사이에 쓴 마지막 세 교향곡 중 마지막 곡입니다. “주피터”라는 별명은 모차르트가 죽은 뒤 런던의 공연기획자가 붙인 것으로 알려져 있습니다.","4악장은 다섯 개의 주제를 동시에 겹쳐 쌓아 올리는 대위법의 기적으로, 교향곡 역사상 가장 위대한 피날레 중 하나로 꼽힙니다."],"points":["1악장: 당당한 C장조 팡파르","4악장 처음 네 음 “도-레-파-미” 주제를 기억하세요","4악장 끝: 다섯 주제가 한꺼번에 겹쳐지는 코다"]},
  {"id":"mozart-ave","c":"mozart","t":"아베 베룸 코르푸스","alias":"K.618","y":"1791","form":"성악","dur":"약 3분","lv":1,"q":"Mozart Ave verum corpus K 618","story":["모차르트가 세상을 떠나기 반년 전, 아내 콘스탄체가 요양하던 바덴의 성가대 지휘자 안톤 슈톨을 위해 쓴 46마디의 짧은 성가입니다.","짧지만 모차르트가 남긴 가장 순수하고 평온한 음악으로 꼽힙니다."],"points":["현악기의 부드러운 도입","합창이 천천히 쌓는 맑은 화음","중간에 잠시 지나가는 슬픈 화음 — 죽음을 묵상하는 부분"]},
  {"id":"beet-moonlight","c":"beethoven","t":"피아노 소나타 14번 “월광”","alias":"Op.27-2","y":"1801","form":"피아노","dur":"약 15분","lv":1,"q":"Beethoven Moonlight Sonata complete","story":["베토벤이 피아노를 가르치던 젊은 백작 영애 줄리에타 귀차르디에게 헌정한 곡입니다. 청력 이상을 느끼기 시작하던 무렵이었죠.","“월광”이라는 이름은 베토벤이 붙인 것이 아닙니다. 그가 세상을 떠난 뒤 시인 렐슈타프가 1악장을 “루체른 호수에 비친 달빛 위의 조각배” 같다고 표현한 데서 굳어졌습니다. 베토벤 본인은 “환상곡풍 소나타”라고만 적었습니다."],"points":["1악장: 끊임없이 흔들리는 셋잇단 반주 위로 떠오르는 슬픈 선율","2악장: 짧고 밝은 막간 — 리스트는 “두 심연 사이의 꽃”이라 불렀습니다","3악장: 폭풍처럼 몰아치는 반전. 1악장만 알던 사람은 깜짝 놀랍니다"]},
  {"id":"beet-sym5","c":"beethoven","t":"교향곡 5번","alias":"c단조 · Op.67","y":"1808","form":"교향곡","dur":"약 32분","lv":1,"q":"Beethoven Symphony 5 complete","story":["“빠바바밤!” 서양 음악에서 가장 유명한 네 음으로 시작합니다. 비서 쉰들러가 베토벤이 이 동기를 “운명은 이렇게 문을 두드린다”고 설명했다고 전했는데, 쉰들러의 증언은 신뢰도가 낮은 편입니다. 이 별명은 주로 한국과 일본에서 쓰입니다.","1808년 난방도 안 되는 추운 극장에서 4시간짜리 연주회로 교향곡 6번 “전원”과 함께 초연되었습니다. 청력을 잃어가던 베토벤의 투쟁이 그대로 담긴 곡으로 들립니다."],"points":["네 음 동기가 곡 전체에 리듬으로 계속 숨어 나옵니다 — 찾아보세요","3악장에서 4악장으로 쉬지 않고 이어지는 순간: 어둠(c단조)이 빛(C장조)으로 터집니다","4악장 끝없이 반복되는 승리의 화음"]},
  {"id":"beet-sym9","c":"beethoven","t":"교향곡 9번 “합창”","alias":"d단조 · Op.125","y":"1824","form":"교향곡","dur":"약 65분","lv":3,"q":"Beethoven Symphony 9 complete","story":["교향곡에 처음으로 성악(합창과 독창)을 넣은 혁명적인 작품입니다. 4악장에서 실러의 시 “환희의 송가”를 노래하며 “모든 인간은 형제가 된다”고 외칩니다.","1824년 빈 초연 때 베토벤은 이미 완전히 귀가 들리지 않았습니다. 연주가 끝난 뒤에도 박수를 듣지 못하고 악보를 보고 있자, 알토 가수가 그를 돌려세워 열광하는 청중을 보게 했다는 일화가 전합니다. 지금은 유럽연합의 찬가로도 쓰입니다."],"points":["1악장: 안개 속에서 무언가 생겨나듯 시작되는 첫 부분","4악장 첫머리: 앞 악장 주제들을 하나씩 떠올렸다가 “이게 아니야”라며 거부하는 장면","저음 현악기가 조용히 꺼내는 “환희의 송가” 선율이 점점 커져 합창으로 폭발하는 과정"]},
  {"id":"beet-elise","c":"beethoven","t":"엘리제를 위하여","alias":"WoO 59","y":"1810","form":"피아노","dur":"약 3분","lv":1,"q":"Beethoven Fur Elise","story":["베토벤이 살아있을 때는 출판되지 않았고, 그가 죽고 40년 뒤 한 연구자가 악보를 발견해 세상에 알렸습니다. 원본 악보는 그 후 사라졌습니다.","“엘리제”가 누구인지는 지금도 미스터리입니다. 베토벤이 청혼했던 테레제 말파티의 이름을 악필 때문에 잘못 읽었다는 설이 유명하지만, 확실한 답은 없습니다."],"points":["반음을 오가는 “미-레#-미-레#” 첫 선율","중간에 등장하는 밝은 부분과 폭풍 같은 부분 — 생각보다 다양한 얼굴이 있습니다","첫 선율이 세 번 돌아오는 구조(론도)"]},
  {"id":"beet-eroica","c":"beethoven","t":"교향곡 3번 “영웅”","alias":"E♭장조 · Op.55","y":"1804","form":"교향곡","dur":"약 50분","lv":2,"q":"Beethoven Symphony 3 Eroica","story":["베토벤은 처음 이 곡을 나폴레옹에게 헌정하려 했습니다. 그러나 나폴레옹이 황제에 즉위했다는 소식에 “그도 결국 평범한 인간”이라며 표지를 찢었다는 이야기를 제자 리스가 전했습니다.","당시 교향곡보다 두 배 가까이 길고 규모가 커서, 교향곡의 역사를 바꾼 작품으로 평가받습니다."],"points":["시작: 오케스트라가 내리치는 두 번의 화음","2악장 장송 행진곡의 비장함","4악장: 하나의 주제가 끝없이 변주되며 커지는 피날레"]},
  {"id":"beet-pastoral","c":"beethoven","t":"교향곡 6번 “전원”","alias":"F장조 · Op.68","y":"1808","form":"교향곡","dur":"약 40분","lv":1,"q":"Beethoven Symphony 6 Pastoral","story":["교향곡 5번과 같은 날 초연된 곡입니다. 산책을 좋아한 베토벤이 빈 근교 시골에서 받은 느낌을 담았고, 다섯 악장마다 “시골에 도착했을 때의 즐거운 기분” 같은 제목을 붙였습니다.","베토벤은 이 곡이 “그림이라기보다 느낌의 표현”이라고 적었습니다."],"points":["2악장 끝: 플루트(나이팅게일), 오보에(메추라기), 클라리넷(뻐꾸기)의 새소리","4악장: 갑자기 몰아치는 폭풍우","5악장: 폭풍이 지나간 뒤 목동의 감사 노래"]},
  {"id":"beet-sym7","c":"beethoven","t":"교향곡 7번","alias":"A장조 · Op.92","y":"1813","form":"교향곡","dur":"약 38분","lv":1,"q":"Beethoven Symphony 7","story":["리듬이 곡 전체를 끌고 가는 교향곡이라 바그너는 “춤의 신격화”라고 불렀습니다.","초연 당시 2악장 알레그레토가 큰 인기를 얻어 앙코르로 다시 연주되었습니다. 지금도 영화와 드라마에 자주 쓰입니다."],"points":["2악장: “따-따따 따-따” 리듬이 낮은 현악기에서 시작해 점점 쌓입니다","1악장의 춤추는 듯한 6/8박자","4악장: 거의 광란에 가까운 폭발적 에너지"]},
  {"id":"beet-emperor","c":"beethoven","t":"피아노 협주곡 5번 “황제”","alias":"E♭장조 · Op.73","y":"1809","form":"협주곡","dur":"약 38분","lv":2,"q":"Beethoven Piano Concerto 5 Emperor","story":["나폴레옹 군대가 빈을 포위하고 포격하던 1809년에 쓴 곡입니다. 베토벤은 포성이 귀를 상하게 할까 봐 지하실에서 베개로 귀를 막았다고 전해집니다.","“황제”라는 별명은 베토벤이 붙인 것이 아니며, 웅장한 분위기 때문에 영국 출판업자가 붙였다는 설이 있습니다. 청력이 나빠진 베토벤은 이 곡을 직접 초연하지 못했습니다."],"points":["시작부터 피아노가 화려한 카덴차로 등장하는 파격","2악장: 꿈결 같은 B장조의 고요한 노래","2악장에서 3악장으로 넘어가는 순간 — 피아노가 몰래 주제를 미리 보여 줍니다"]},
  {"id":"beet-pathetique","c":"beethoven","t":"피아노 소나타 8번 “비창”","alias":"c단조 · Op.13","y":"1798","form":"피아노","dur":"약 19분","lv":1,"q":"Beethoven Piano Sonata 8 Pathetique","story":["28세의 베토벤이 직접 “비창(Grande Sonate pathétique)”이라는 제목을 붙인 드문 곡입니다. 청력 이상이 시작될 무렵이었습니다.","2악장 아다지오 칸타빌레의 선율은 대중음악에도 여러 번 쓰였습니다."],"points":["1악장 서주: 무겁게 내리치는 c단조 화음","2악장: 가곡처럼 노래하는 따뜻한 선율","3악장 론도의 쫓기는 듯한 단조 주제"]},
  {"id":"beet-violin","c":"beethoven","t":"바이올린 협주곡","alias":"D장조 · Op.61","y":"1806","form":"협주곡","dur":"약 42분","lv":2,"q":"Beethoven Violin Concerto Op 61","story":["바이올리니스트 클레멘트를 위해 썼는데, 작곡이 늦어져 클레멘트가 초연 무대에서 거의 악보를 처음 보고 연주했다는 이야기가 있습니다.","초연 후 오랫동안 잊혔다가, 1844년 12세의 요아힘이 멘델스존의 지휘로 연주하면서 명곡으로 자리 잡았습니다."],"points":["시작: 팀파니가 혼자 두드리는 다섯 번의 조용한 음","바이올린이 높은 음역에서 부르는 고귀한 선율","3악장: 사냥 노래 같은 경쾌한 론도"]},
  {"id":"schubert-erlking","c":"schubert","t":"마왕","alias":"D.328","y":"1815","form":"가곡","dur":"약 4분","lv":2,"q":"Schubert Erlkonig Der Erlkonig","story":["18세의 슈베르트가 괴테의 시를 읽고 단숨에 작곡했다고 전해집니다. 아픈 아이를 안고 밤에 말을 달리는 아버지, 아이를 유혹하는 마왕의 이야기입니다.","가수 한 명이 해설자·아버지·아들·마왕의 네 인물을 목소리 색깔만으로 연기해야 합니다. 피아노는 처음부터 끝까지 쉬지 않고 말발굽 소리를 두드립니다."],"points":["피아노 오른손의 끝없는 셋잇단 연타 = 말이 달리는 소리","아이의 목소리는 점점 높고 다급해지고, 마왕은 달콤하게 속삭입니다","마지막: 말발굽이 멈추고, 음악도 멈춘 뒤 한 문장 — “아이는 죽어 있었다”"]},
  {"id":"schubert-unfinished","c":"schubert","t":"교향곡 8번 “미완성”","alias":"b단조 · D.759","y":"1822","form":"교향곡","dur":"약 25분","lv":2,"q":"Schubert Unfinished Symphony 8","story":["보통 교향곡은 4악장인데, 이 곡은 2악장까지만 완성되고 3악장은 스케치만 남았습니다. 슈베르트는 이후 6년을 더 살았지만 다시 손대지 않았고, 왜 멈췄는지는 아무도 모릅니다.","악보는 친구가 40년 넘게 서랍에 보관하다가 1865년에야 초연되었습니다. 많은 사람이 “두 악장만으로 이미 완벽하다”고 말합니다."],"points":["첼로와 콘트라베이스가 어둠 속에서 조용히 시작하는 첫 소절","첼로가 부르는 유명한 두 번째 주제 — 슬픔 속의 따뜻한 노래","갑자기 터지는 오케스트라의 강타와 침묵의 대비"]},
  {"id":"schubert-impromptu","c":"schubert","t":"즉흥곡 3번","alias":"Op.90-3 · D.899","y":"1827","form":"피아노","dur":"약 6분","lv":1,"q":"Schubert Impromptu Op 90 No 3","story":["죽기 1년 전, 병과 가난 속에서 쓴 피아노 소품입니다. “즉흥곡”이라는 제목은 출판사가 붙인 것으로, 실제로는 매우 정교하게 짜인 곡입니다.","흐르는 물결 같은 반주 위로 노래가 흘러나오는, 피아노로 부르는 가곡 같은 곡입니다."],"points":["오른손이 선율과 잔물결 반주를 동시에 연주합니다","중간에 그림자가 드리우는 단조 부분","다시 돌아오는 평화 — 슈베르트의 “천상의 길이”를 느껴보세요"]},
  {"id":"schubert-trout","c":"schubert","t":"피아노 5중주 “송어”","alias":"A장조 · D.667","y":"1819","form":"실내악","dur":"약 40분","lv":1,"q":"Schubert Trout Quintet D 667","story":["22세의 슈베르트가 친구와 오스트리아 시골 슈타이어로 여름 여행을 갔다가, 그곳의 음악 애호가 파움가르트너의 의뢰로 쓴 곡입니다.","의뢰인이 슈베르트의 가곡 “송어”를 좋아해서, 4악장을 그 선율의 변주곡으로 만들었습니다. 바이올린 대신 콘트라베이스가 들어간 독특한 편성입니다."],"points":["4악장: 가곡 “송어”의 맑은 주제와 변주","피아노 고음이 물방울처럼 반짝이는 장면","콘트라베이스가 받쳐 주는 넉넉한 저음"]},
  {"id":"schubert-serenade","c":"schubert","t":"세레나데","alias":"가곡집 “백조의 노래” 4번 · D.957-4","y":"1828","form":"가곡","dur":"약 4분","lv":1,"q":"Schubert Serenade Standchen D 957","story":["슈베르트가 세상을 떠난 해에 쓴 가곡들을 출판사가 모아 “백조의 노래”라는 이름으로 펴냈습니다. 백조는 죽기 직전에 가장 아름답게 노래한다는 전설에서 온 제목입니다.","렐슈타프의 시에 붙인 이 세레나데는 밤에 연인의 창가에서 부르는 사랑 노래로, 가곡과 기악 편곡 모두 사랑받습니다."],"points":["피아노의 기타 같은 반주 — 밤에 창가에서 튕기는 류트","노래의 끝을 피아노가 메아리처럼 따라 부르는 장면","단조와 장조를 오가는 애틋함"]},
  {"id":"schubert-ave","c":"schubert","t":"아베 마리아","alias":"엘렌의 노래 3번 · D.839","y":"1825","form":"가곡","dur":"약 6분","lv":1,"q":"Schubert Ave Maria D 839","story":["원래는 월터 스콧의 서사시 “호수의 여인”을 독일어로 옮긴 시에 붙인 가곡으로, 주인공 엘렌이 성모 마리아에게 기도하는 장면입니다.","첫 마디 “아베 마리아” 때문에 나중에 라틴어 기도문을 붙여 부르게 되었고, 지금은 결혼식과 장례식의 단골 곡이 되었습니다."],"points":["피아노의 하프 같은 셋잇단 분산화음","길게 숨을 쉬며 이어지는 기도 선율","같은 선율이 세 번 반복되는 소박한 구조"]},
  {"id":"schubert-lindenbaum","c":"schubert","t":"보리수","alias":"가곡집 “겨울 나그네” 중 · D.911-5","y":"1827","form":"가곡","dur":"약 5분","lv":2,"q":"Schubert Der Lindenbaum Winterreise","story":["실연한 청년이 한겨울에 정처 없이 떠도는 내용의 가곡집 “겨울 나그네” 24곡 중 다섯 번째 곡입니다. 시인 빌헬름 뮐러의 시에 붙였습니다.","슈베르트가 친구들에게 이 가곡집을 처음 들려줬을 때 모두 너무 어둡다며 당황했지만, 그는 “언젠가 여러분도 좋아하게 될 것”이라고 말했다고 합니다. 이듬해 그는 세상을 떠났습니다."],"points":["피아노가 나뭇잎을 스치는 바람 소리를 그립니다","따뜻한 장조의 추억과 차가운 단조의 현실이 교차","“여기서 쉬어 가라”는 나무의 속삭임과 떠나는 나그네"]},
  {"id":"schubert-great","c":"schubert","t":"교향곡 9번 “그레이트”","alias":"C장조 · D.944","y":"1825–26","form":"교향곡","dur":"약 55분","lv":3,"q":"Schubert Symphony 9 The Great D 944","story":["슈베르트 생전에 연주되지 못한 교향곡입니다. 그가 죽고 10년 뒤 슈만이 빈의 슈베르트 형 집에서 악보 더미 속에 묻혀 있던 이 곡을 발견했습니다.","1839년 멘델스존의 지휘로 초연되었고, 슈만은 이 곡의 길이를 “천상의 길이”라고 표현했습니다."],"points":["1악장 시작: 호른 두 대가 조용히 부르는 주제","같은 리듬이 끝없이 반복되며 만드는 거대한 흐름","4악장: 숨 쉴 틈 없이 달리는 피날레"]},
  {"id":"schubert-moment","c":"schubert","t":"악흥의 순간 3번","alias":"f단조 · D.780-3","y":"1823","form":"피아노","dur":"약 2분","lv":1,"q":"Schubert Moment Musical No 3 D 780","story":["“악흥의 순간”은 6곡으로 된 짧은 피아노 소품집입니다. 3번은 그중 가장 유명한 곡으로, 러시아풍 춤곡 같은 분위기라 출판 당시 “러시아의 노래”라는 제목이 붙기도 했습니다.","집에서 친구들과 함께 연주하며 즐기던 비더마이어 시대 빈의 음악 문화를 보여 주는 곡입니다."],"points":["왼손의 일정한 스타카토 반주","오른손의 장난스럽고 쓸쓸한 선율","2분 남짓의 짧은 길이에 담긴 단조와 장조의 교차"]},
  {"id":"schubert-trio2","c":"schubert","t":"피아노 3중주 2번","alias":"E♭장조 · D.929","y":"1827","form":"실내악","dur":"약 10분(2악장)","lv":2,"q":"Schubert Piano Trio No 2 D 929 Andante","story":["슈베르트 생전에 출판된 몇 안 되는 큰 실내악곡입니다. 2악장의 첼로 선율은 스웨덴 민요에서 영감을 받았다고 알려져 있습니다.","스탠리 큐브릭 감독의 영화 “배리 린든”(1975)에 이 2악장이 쓰이며 널리 알려졌습니다."],"points":["2악장: 피아노의 행진하는 반주 위로 첼로가 부르는 쓸쓸한 노래","바이올린이 선율을 이어받으며 쌓이는 감정","4악장에서 2악장 선율이 다시 돌아오는 순간"]},
  {"id":"mendelssohn-wedding","c":"mendelssohn","t":"결혼 행진곡","alias":"“한여름 밤의 꿈” 중 · Op.61","y":"1842","form":"관현악","dur":"약 5분","lv":1,"q":"Mendelssohn Wedding March","story":["셰익스피어의 희곡 “한여름 밤의 꿈” 공연을 위해 쓴 부수음악 중 한 곡입니다. 극 속 세 쌍의 결혼식 장면에서 연주됩니다.","1858년 영국 빅토리아 여왕의 딸이 결혼식 퇴장곡으로 쓰면서 전 세계 결혼식의 대표곡이 되었습니다. 입장곡은 보통 바그너의 “혼례의 합창”입니다."],"points":["시작: 트럼펫의 팡파르","당당한 행진 주제","중간: 부드럽고 우아한 선율"]},
  {"id":"mendelssohn-midsummer","c":"mendelssohn","t":"한여름 밤의 꿈 서곡","alias":"Op.21","y":"1826","form":"관현악","dur":"약 12분","lv":1,"q":"Mendelssohn A Midsummer Nights Dream Overture","story":["17세의 멘델스존이 누나 파니와 셰익스피어를 읽고 쓴 곡입니다. 17년 뒤 같은 극을 위한 부수음악을 쓸 때도 이 서곡을 그대로 썼습니다.","요정의 숲, 연인들, 서툰 직공들, 당나귀 머리가 된 보텀까지 극의 장면이 모두 담겨 있습니다."],"points":["시작: 관악기의 네 개의 마법 같은 화음","바이올린의 아주 작고 빠른 음 = 날아다니는 요정들","당나귀 울음소리를 흉내 낸 관악기"]},
  {"id":"mendelssohn-vc","c":"mendelssohn","t":"바이올린 협주곡","alias":"e단조 · Op.64","y":"1844","form":"협주곡","dur":"약 27분","lv":1,"q":"Mendelssohn Violin Concerto in E minor","story":["절친한 바이올리니스트 페르디난트 다비트를 위해 6년 넘게 고민하며 쓴 곡입니다. 베토벤, 브람스, 차이콥스키와 함께 4대 바이올린 협주곡으로 꼽힙니다.","오케스트라 서주 없이 바이올린이 곧바로 주제를 부르며 시작하고, 세 악장이 쉬지 않고 이어지는 등 새로운 시도가 많습니다."],"points":["시작: 1초 만에 등장하는 바이올린의 애절한 주제","1악장 카덴차가 끝나는 지점에서 오케스트라가 주제를 다시 받는 순간","3악장: 요정처럼 가볍고 빠른 피날레"]},
  {"id":"mendelssohn-italian","c":"mendelssohn","t":"교향곡 4번 “이탈리아”","alias":"A장조 · Op.90","y":"1833","form":"교향곡","dur":"약 28분","lv":1,"q":"Mendelssohn Symphony No 4 Italian","story":["20대 초반 이탈리아를 여행하며 받은 인상을 담은 교향곡입니다. 멘델스존은 편지에 “지금까지 쓴 곡 중 가장 즐거운 곡”이라고 적었습니다.","하지만 본인은 끝까지 만족하지 못해 생전에 출판하지 않았습니다."],"points":["1악장: 햇살 같은 바이올린의 첫 주제","2악장: 순례자 행렬 같은 느린 걸음","4악장: 이탈리아 춤 “살타렐로”의 질주"]},
  {"id":"mendelssohn-hebrides","c":"mendelssohn","t":"핑갈의 동굴 (헤브리디스 서곡)","alias":"Op.26","y":"1830","form":"관현악","dur":"약 10분","lv":1,"q":"Mendelssohn Hebrides Overture Fingals Cave","story":["20세에 스코틀랜드를 여행하다 헤브리디스 제도의 “핑갈의 동굴”을 보고 쓴 연주회용 서곡입니다.","동굴을 본 날 누나에게 보낸 편지에 첫 마디 선율을 적어 보냈다고 합니다. 바그너는 멘델스존을 “일류 풍경화가”라고 불렀습니다."],"points":["첫 선율: 동굴 입구에서 출렁이는 파도","첼로의 넓고 따뜻한 두 번째 주제","폭풍이 이는 듯한 중간 부분"]},
  {"id":"mendelssohn-spring","c":"mendelssohn","t":"봄노래","alias":"무언가 Op.62-6","y":"1842","form":"피아노","dur":"약 3분","lv":1,"q":"Mendelssohn Spring Song","story":["멘델스존은 가사 없는 노래 같은 피아노 소품집 “무언가(가사 없는 노래)”를 8권, 48곡 남겼습니다.","“봄노래”는 그중 가장 유명한 곡입니다. 제목은 출판 과정에서 붙은 것으로 알려져 있습니다."],"points":["노래하는 선율과 반짝이는 장식음","부드럽게 튀는 반주","짧은 곡 안의 상쾌한 봄 기운"]},
  {"id":"mendelssohn-octet","c":"mendelssohn","t":"현악 8중주","alias":"E♭장조 · Op.20","y":"1825","form":"실내악","dur":"약 32분","lv":2,"q":"Mendelssohn String Octet Op 20","story":["16세에 쓴 곡으로, 모차르트도 그 나이에 이만한 곡을 쓰지 못했다는 말이 나올 정도의 걸작입니다.","현악4중주 두 팀이 나란히 앉는 것이 아니라 8명 모두가 교향곡처럼 하나의 큰 소리를 만듭니다. 3악장은 괴테의 “파우스트” 속 장면에서 영감을 받았습니다."],"points":["1악장: 높이 솟구치는 바이올린의 첫 주제","3악장 스케르초: 바람처럼 가볍게 스쳐가는 요정의 소리","4악장: 첼로부터 시작하는 숨 가쁜 푸가"]},
  {"id":"mendelssohn-scottish","c":"mendelssohn","t":"교향곡 3번 “스코틀랜드”","alias":"a단조 · Op.56","y":"1842","form":"교향곡","dur":"약 40분","lv":2,"q":"Mendelssohn Symphony No 3 Scottish","story":["1829년 에든버러의 홀리루드 궁전 폐허를 보고 첫 선율을 떠올렸지만, 완성까지 13년이 걸렸습니다.","안개 낀 스코틀랜드의 쓸쓸한 풍경에서 시작해 장엄한 승리의 노래로 끝납니다. 영국 빅토리아 여왕에게 헌정되었습니다."],"points":["1악장 서주: 안개 낀 폐허의 쓸쓸함","2악장: 클라리넷의 스코틀랜드 민요풍 선율","마지막: 6/8박자의 장엄한 찬가"]},
  {"id":"mendelssohn-elijah","c":"mendelssohn","t":"엘리야","alias":"Op.70","y":"1846","form":"성악","dur":"약 2시간 10분","lv":3,"q":"Mendelssohn Elijah oratorio","story":["구약 성경의 예언자 엘리야 이야기를 그린 오라토리오입니다. 영국 버밍엄 음악제를 위해 썼고 초연 때 큰 성공을 거두었습니다.","헨델의 “메시아”와 함께 영국에서 가장 사랑받는 오라토리오가 되었으며, 멘델스존이 세상을 떠나기 1년 전 마지막 대작입니다."],"points":["시작: 서곡보다 먼저 나오는 엘리야의 저주 선언","바알 신 예언자들과의 대결 장면의 합창","천사들의 3중창 같은 고요한 부분"]},
  {"id":"mendelssohn-gondola","c":"mendelssohn","t":"베네치아 곤돌라의 노래","alias":"무언가 Op.30-6","y":"1835","form":"피아노","dur":"약 3분","lv":1,"q":"Mendelssohn Venetian Boat Song Op 30 No 6","story":["이탈리아 여행 중 베네치아의 곤돌라 사공들의 노래를 떠올리며 쓴 곡입니다. “무언가” 중 “베네치아 곤돌라의 노래”라는 제목은 멘델스존 본인이 붙였습니다.","6/8박자의 흔들리는 리듬이 물 위를 떠가는 배를 그립니다."],"points":["왼손의 흔들리는 반주 = 출렁이는 물결","단조의 쓸쓸한 노래","마지막: 멀어져 가는 배처럼 사라지는 끝"]},
  {"id":"chopin-nocturne2","c":"chopin","t":"녹턴 2번","alias":"Op.9-2","y":"1830–32","form":"피아노","dur":"약 4분","lv":1,"q":"Chopin Nocturne Op 9 No 2","story":["녹턴은 “밤의 노래”라는 뜻으로, 아일랜드 작곡가 존 필드가 만든 장르를 쇼팽이 완성했습니다. 이 곡은 고국을 떠난 직후 20대 초반에 쓴, 쇼팽을 대표하는 곡입니다.","쇼팽은 오페라, 특히 벨리니의 아름다운 노래를 사랑했는데, 이 곡의 오른손 선율은 오페라 가수의 장식적인 노래를 피아노로 옮겨온 것 같습니다."],"points":["왼손의 흔들리는 왈츠풍 반주, 오른손의 노래","선율이 돌아올 때마다 점점 화려해지는 장식음","끝부분 높은 음역에서 반짝이는 빠른 음형"]},
  {"id":"chopin-ballade1","c":"chopin","t":"발라드 1번","alias":"g단조 · Op.23","y":"1835","form":"피아노","dur":"약 9분","lv":2,"q":"Chopin Ballade No 1 G minor","story":["문학의 “발라드(서사시)”를 피아노로 옮긴 장르로, 쇼팽이 처음 만들었습니다. 폴란드 시인 미츠키에비치의 시에서 영감을 받았다고 알려져 있습니다.","2002년 영화 “피아니스트”에서 폐허가 된 바르샤바, 주인공이 독일 장교 앞에서 이 곡을 연주하는 장면으로 많은 사람에게 각인되었습니다."],"points":["이야기를 시작하듯 느리게 질문을 던지는 도입부","왈츠처럼 흔들리는 첫 주제, 꿈결 같은 둘째 주제","마지막 코다: 모든 것이 무너지듯 질주하는 폭풍"]},
  {"id":"chopin-revolutionary","c":"chopin","t":"에튀드 “혁명”","alias":"Op.10-12","y":"1831","form":"피아노","dur":"약 3분","lv":2,"q":"Chopin Revolutionary Etude Op 10 No 12","story":["에튀드는 “연습곡”이지만, 쇼팽은 연습곡을 예술 작품으로 끌어올렸습니다.","1831년, 독일 슈투트가르트에 머물던 쇼팽은 바르샤바가 러시아군에 함락되었다는 소식을 들었습니다. 가족의 생사도 모른 채 절망하던 그는 일기에 분노를 쏟아냈고, 이 곡이 그 무렵의 감정과 연결되어 “혁명”이라는 별명을 얻었습니다."],"points":["왼손: 쉬지 않고 휘몰아치는 빠른 음형 — 이 곡이 왼손 연습곡인 이유","오른손: 그 위에서 외치는 듯한 옥타브 선율","마지막 내리꽂는 화음"]},
  {"id":"chopin-waltz","c":"chopin","t":"강아지 왈츠","alias":"Op.64-1 · “Minute Waltz”","y":"1847","form":"피아노","dur":"약 2분","lv":1,"q":"Chopin Minute Waltz Op 64 No 1","story":["연인 조르주 상드의 강아지가 자기 꼬리를 쫓아 빙글빙글 도는 모습을 보고 썼다고 전해집니다. 그래서 “강아지 왈츠”라는 별명이 붙었습니다.","영어 별명 “Minute Waltz”는 “1분 왈츠”가 아니라 “작은(minute) 왈츠”라는 뜻입니다. 실제로 1분 안에 연주하는 경우는 드뭅니다."],"points":["처음 빙글빙글 도는 오른손 — 꼬리를 쫓는 강아지","가운데 부분: 느긋하고 우아하게 쉬어 가는 장면","다시 돌아오는 회전과 반짝이는 마무리"]},
  {"id":"chopin-heroic","c":"chopin","t":"폴로네즈 “영웅”","alias":"A♭장조 · Op.53","y":"1842","form":"피아노","dur":"약 7분","lv":2,"q":"Chopin Polonaise Heroic Op 53","story":["폴로네즈는 폴란드 귀족의 당당한 행진 춤곡입니다. 고국을 떠나 파리에 살던 쇼팽은 폴로네즈로 폴란드의 자존심을 표현했습니다.","조르주 상드는 이 곡을 듣고 “영감! 힘! 생명력!”이라고 감탄하는 편지를 썼다고 전해집니다. “영웅”이라는 별명은 후대에 붙었습니다."],"points":["서주의 긴장감 넘치는 상승","당당하게 걸어가는 폴로네즈 주제","중간부: 왼손 옥타브가 말발굽처럼 몰아치는 장면"]},
  {"id":"chopin-pc1","c":"chopin","t":"피아노 협주곡 1번","alias":"e단조 · Op.11","y":"1830","form":"협주곡","dur":"약 40분","lv":2,"q":"Chopin Piano Concerto No 1 Op 11","story":["20세의 쇼팽이 바르샤바를 떠나기 직전 고별 연주회에서 직접 초연한 곡입니다. 그 뒤로 그는 다시는 고국에 돌아가지 못했습니다.","실제로는 2번보다 나중에 쓰였지만 먼저 출판되어 1번이 되었습니다. 2악장은 짝사랑하던 성악가 콘스탄치아를 생각하며 썼다고 편지에 적었습니다."],"points":["1악장: 오케스트라 서주 뒤 피아노가 등장하는 순간","2악장 로망스: 달빛 같은 꿈결의 노래","3악장: 폴란드 민속춤 크라코비아크 리듬"]},
  {"id":"chopin-fantaisie","c":"chopin","t":"즉흥환상곡","alias":"c#단조 · Op.66","y":"1834","form":"피아노","dur":"약 5분","lv":2,"q":"Chopin Fantaisie Impromptu Op 66","story":["쇼팽은 이 곡을 생전에 출판하지 않았고 유언으로 미출판 원고를 없애 달라고 했지만, 친구 폰타나가 그의 사후에 출판했습니다.","출판하지 않으려 한 이유는 분명하지 않습니다. 지금은 쇼팽의 가장 유명한 곡 중 하나가 되었습니다."],"points":["양손이 서로 다른 리듬(4대3)으로 달리는 처음과 끝","중간부: 느리고 달콤한 노래(대중가요 “I am always chasing rainbows”의 원곡)","마지막 낮은 음역에서 조용히 사라지는 끝"]},
  {"id":"chopin-raindrop","c":"chopin","t":"전주곡 15번 “빗방울”","alias":"D♭장조 · Op.28-15","y":"1838–39","form":"피아노","dur":"약 5분","lv":1,"q":"Chopin Raindrop Prelude Op 28 No 15","story":["쇼팽이 조르주 상드와 지중해 마요르카섬에 머물던 겨울, 비 내리는 수도원에서 완성한 24개의 전주곡 중 하나입니다.","상드는 회고록에서, 폭우 속에 외출했다 돌아오니 쇼팽이 빗방울 소리 같은 곡을 치며 공포에 질려 있었다고 썼습니다. 별명은 이 일화에서 왔습니다."],"points":["곡 내내 반복되는 한 음 = 떨어지는 빗방울","중간부: 단조로 바뀌며 빗소리가 무겁고 어두워집니다","다시 돌아오는 평화로운 선율"]},
  {"id":"chopin-funeral","c":"chopin","t":"장송 행진곡","alias":"피아노 소나타 2번 3악장 · Op.35","y":"1837 / 1839","form":"피아노","dur":"약 9분","lv":2,"q":"Chopin Funeral March Sonata No 2 Op 35","story":["장송 행진곡을 먼저 쓰고 2년 뒤 나머지 악장을 붙여 소나타를 완성했습니다. 이 행진곡은 세계에서 가장 유명한 장례 음악이 되었습니다.","1849년 쇼팽 자신의 장례식에서도 이 곡이 관현악으로 편곡되어 연주되었습니다."],"points":["왼손의 무겁게 흔들리는 종소리 같은 화음","중간부: 꿈처럼 아름다운 장조의 노래 — 추억 또는 천국","다시 돌아오는 장송 행렬"]},
  {"id":"chopin-nocturne20","c":"chopin","t":"녹턴 20번 (유작)","alias":"c#단조 · B.49","y":"1830","form":"피아노","dur":"약 4분","lv":1,"q":"Chopin Nocturne C sharp minor posthumous","story":["쇼팽이 누나 루드비카에게 협주곡 2번을 연습하라고 보내며 함께 쓴 곡으로, 사후 출판되었습니다.","영화 “피아니스트”(2002)의 첫 장면, 폭격 속 라디오 방송국에서 주인공이 연주하던 곡이 바로 이 녹턴입니다."],"points":["처음 몇 마디의 고요한 화음","오른손의 슬프고 자유로운 노래","끝부분 높은 음역에서 흩어지는 빠른 음형"]},
  {"id":"schumann-traumerei","c":"schumann","t":"트로이메라이","alias":"어린이 정경 7번 · Op.15-7","y":"1838","form":"피아노","dur":"약 3분","lv":1,"q":"Schumann Traumerei","story":["“어린이 정경”은 어린이를 위한 곡이 아니라, 어른이 어린 시절을 회상하며 쓴 13곡의 피아노 소품집입니다. 슈만은 클라라에게 “당신이 언젠가 내가 아직 어린아이 같다고 했던 말이 떠올라 썼다”고 편지했습니다.","7번째 곡 “트로이메라이(꿈)”는 그중 가장 유명해, 피아니스트 호로비츠가 앙코르로 즐겨 연주했습니다."],"points":["같은 선율이 여러 번 돌아오며 조금씩 색이 바뀝니다","선율이 위로 뻗었다 천천히 내려오는 곡선","마지막의 멈칫하는 쉼표 — 꿈에서 깨어나는 순간"]},
  {"id":"schumann-dichterliebe","c":"schumann","t":"시인의 사랑","alias":"Op.48","y":"1840","form":"가곡","dur":"약 30분","lv":2,"q":"Schumann Dichterliebe Wunderschonen Monat Mai","story":["클라라와 결혼한 “가곡의 해” 1840년에 하이네의 시 16편으로 쓴 연가곡입니다. 사랑의 설렘에서 시작해 실연의 아픔으로 이어집니다.","피아노가 노래의 반주에 머물지 않고 노래가 끝난 뒤에도 긴 후주로 말하지 못한 감정을 이어갑니다."],"points":["1곡: 해결되지 않는 화음으로 끝나는 5월의 설렘","중간: 쓰라림을 꾹 누르는 듯한 노래들","마지막 곡 뒤 긴 피아노 후주 — 모든 것을 감싸 안는 위로"]},
  {"id":"schumann-pc","c":"schumann","t":"피아노 협주곡","alias":"a단조 · Op.54","y":"1841–45","form":"협주곡","dur":"약 31분","lv":2,"q":"Schumann Piano Concerto in A minor","story":["처음엔 단악장 “환상곡”으로 썼다가 클라라의 권유로 악장을 더해 협주곡으로 완성했습니다. 초연 독주자는 클라라였습니다.","화려한 기교 대결보다 피아노와 오케스트라가 대화하듯 주고받는 시적인 협주곡입니다. 그리그의 피아노 협주곡이 이 곡의 영향을 크게 받았습니다."],"points":["시작: 오케스트라의 한 번의 타격 뒤 쏟아지는 피아노 화음","오보에가 부르는 애틋한 첫 주제 — 피아노가 이어받습니다","3악장: 춤추듯 밝은 왈츠풍 피날레"]},
  {"id":"schumann-widmung","c":"schumann","t":"헌정","alias":"“미르테의 꽃” 1번 · Op.25-1","y":"1840","form":"가곡","dur":"약 3분","lv":1,"q":"Schumann Widmung","story":["결혼식 전날 클라라에게 선물한 가곡집 “미르테의 꽃”의 첫 곡입니다. 미르테(도금양)는 신부의 화관에 쓰던 꽃입니다.","뤼케르트의 시에 붙인 열정적인 사랑 고백으로, 리스트가 피아노 독주곡으로 편곡한 버전도 유명합니다."],"points":["힘차게 솟구치는 첫 선율","중간부: 조용히 가라앉는 경건한 부분","마지막에 슈베르트의 “아베 마리아” 선율이 피아노에 살짝 비칩니다"]},
  {"id":"schumann-spring","c":"schumann","t":"교향곡 1번 “봄”","alias":"B♭장조 · Op.38","y":"1841","form":"교향곡","dur":"약 31분","lv":2,"q":"Schumann Symphony No 1 Spring","story":["결혼 이듬해 단 4일 만에 스케치를 끝낸 첫 교향곡입니다. 시인 뵈트거의 봄에 관한 시에서 영감을 받았습니다.","초연은 멘델스존이 라이프치히에서 지휘했습니다. 겨울에서 봄으로 깨어나는 생명력이 넘칩니다."],"points":["시작: 트럼펫과 호른의 팡파르 — 봄을 깨우는 소리","1악장 빠른 부분: 새싹이 돋는 듯한 활기","4악장: 우아하고 경쾌한 피날레"]},
  {"id":"schumann-carnaval","c":"schumann","t":"사육제","alias":"Op.9","y":"1834–35","form":"피아노","dur":"약 25분","lv":2,"q":"Schumann Carnaval Op 9","story":["가면무도회에 등장하는 인물 21명을 짧은 피아노 곡으로 그린 작품입니다. 슈만 자신의 두 얼굴(열정의 “플로레스탄”, 몽상가 “오이제비우스”), 쇼팽, 파가니니, 클라라까지 나옵니다.","당시 약혼녀 에르네스티네의 고향 “아쉬(ASCH)”의 철자를 음이름으로 바꿔 곡 전체에 숨겨 놓았습니다."],"points":["“쇼팽”: 쇼팽의 녹턴을 흉내 낸 짧은 곡","“파가니니”: 바이올린 기교를 피아노로 옮긴 곡","마지막 “다윗 동맹의 행진”: 속물들을 물리치는 승리의 행진"]},
  {"id":"schumann-kreisleriana","c":"schumann","t":"크라이슬레리아나","alias":"Op.16","y":"1838","form":"피아노","dur":"약 32분","lv":3,"q":"Schumann Kreisleriana","story":["작가 E.T.A. 호프만의 소설 속 괴짜 악장 “크라이슬러”에서 이름을 따온 8곡의 환상곡입니다. 슈만은 클라라에게 “이 곡의 주인공은 당신”이라고 썼습니다.","격정적인 곡과 몽상적인 곡이 번갈아 나오며, 슈만 내면의 양극을 그대로 보여 줍니다. 쇼팽에게 헌정되었습니다."],"points":["1곡: 폭풍처럼 몰아치는 시작","2곡: 가장 길고 다정한 노래","8곡: 유령처럼 사라지는 기묘한 마무리"]},
  {"id":"schumann-quintet","c":"schumann","t":"피아노 5중주","alias":"E♭장조 · Op.44","y":"1842","form":"실내악","dur":"약 30분","lv":2,"q":"Schumann Piano Quintet Op 44","story":["실내악에 몰두한 1842년, 몇 주 만에 완성한 곡으로 피아노와 현악4중주를 결합한 “피아노 5중주”라는 장르를 대표하는 작품이 되었습니다.","클라라에게 헌정했고, 처음 사적으로 연주될 때 몸이 아픈 클라라 대신 멘델스존이 즉석에서 피아노를 맡았다고 전해집니다."],"points":["1악장: 다섯 악기가 함께 내딛는 당당한 첫 주제","2악장: 장송 행진곡 같은 무거운 걸음","4악장: 1악장 주제가 돌아오는 푸가풍 마무리"]},
  {"id":"schumann-fantasie","c":"schumann","t":"환상곡","alias":"C장조 · Op.17","y":"1836–38","form":"피아노","dur":"약 30분","lv":3,"q":"Schumann Fantasie in C Op 17","story":["베토벤 기념비 건립 기금을 위해 구상한 곡으로, 클라라와 강제로 떨어져 지내던 시기에 썼습니다. 슈만은 1악장을 “클라라를 향한 깊은 탄식”이라 불렀습니다.","1악장 끝에 베토벤의 연가곡 “멀리 있는 연인에게”의 선율을 인용해 떨어진 연인을 향한 마음을 담았습니다. 리스트에게 헌정되었습니다."],"points":["1악장: 소용돌이치는 반주 위의 열정적인 선율","2악장: 행진곡 같은 화려함과 끝부분의 아찔한 도약","3악장: 느리게 떠오르는 기도 같은 마무리"]},
  {"id":"schumann-rhenish","c":"schumann","t":"교향곡 3번 “라인”","alias":"E♭장조 · Op.97","y":"1850","form":"교향곡","dur":"약 33분","lv":2,"q":"Schumann Symphony No 3 Rhenish","story":["라인강 근처 뒤셀도르프의 음악감독으로 부임한 뒤 쓴 교향곡입니다. 라인 지방의 풍경과 사람들의 활기를 담았습니다.","쾰른 대성당에서 대주교 서임식을 본 인상으로 쓴 4악장은 장엄한 트롬본 화음이 성당 안의 울림처럼 퍼집니다."],"points":["1악장: 강물처럼 힘차게 밀려드는 첫 주제","2악장: 느긋한 라인 지방의 민속 춤","4악장: 쾰른 대성당의 엄숙한 트롬본"]},
  {"id":"liszt-campanella","c":"liszt","t":"라 캄파넬라","alias":"파가니니 대연습곡 3번 · S.141","y":"1851","form":"피아노","dur":"약 5분","lv":2,"q":"Liszt La Campanella","story":["“작은 종”이라는 뜻입니다. 원래는 바이올리니스트 파가니니의 바이올린 협주곡 마지막 악장 주제인데, 리스트가 이를 피아노로 옮겼습니다.","20살 무렵 파가니니의 초인적인 연주에 충격을 받은 리스트가 “피아노로 그걸 해내겠다”며 수년간 매달린 결과물이고, 지금도 손꼽히는 고난도 곡입니다."],"points":["오른손이 넓게 뛰어 높은 음을 콕콕 찍는 소리 = 작은 종","같은 주제가 돌아올 때마다 더 어렵고 화려해지는 변주","마지막의 폭발적인 클라이맥스"]},
  {"id":"liszt-liebestraum","c":"liszt","t":"사랑의 꿈 3번","alias":"S.541","y":"1850","form":"피아노","dur":"약 5분","lv":1,"q":"Liszt Liebestraum No 3","story":["원래는 “사랑할 수 있는 한 사랑하라”라는 시에 붙인 가곡이었고, 리스트가 피아노곡으로 바꿨습니다. 사랑하는 사람이 떠나기 전에 사랑하라는, 다정하면서도 쓸쓸한 내용입니다.","화려한 연주로 유명한 리스트가 얼마나 서정적인 작곡가였는지 보여주는 곡입니다."],"points":["가운데 음역에서 노래하는 선율을 양손이 나눠 연주합니다","중간의 빠르게 쏟아지는 카덴차(독주 장식)","선율이 높은 음역으로 옮겨가며 감정이 고조되는 부분"]},
  {"id":"liszt-hr2","c":"liszt","t":"헝가리 광시곡 2번","alias":"c#단조 · S.244/2","y":"1847","form":"피아노","dur":"약 10분","lv":2,"q":"Liszt Hungarian Rhapsody No 2","story":["리스트는 어린 시절 들은 헝가리 집시 악단의 음악을 바탕으로 19곡의 헝가리 광시곡을 썼습니다. 2번은 그중 가장 유명합니다.","1947년 톰과 제리 만화 “고양이 협주곡”에서 톰이 이 곡을 연주하며 대중에게도 친숙해졌습니다."],"points":["느리고 장중한 “라산” — 집시 악단의 애수","빠르고 신나는 “프리스카” — 점점 빨라지는 춤","피아노로 흉내 낸 집시 악기 침발롬 소리"]},
  {"id":"liszt-consolation3","c":"liszt","t":"위로 3번","alias":"D♭장조 · S.172-3","y":"1849–50","form":"피아노","dur":"약 4분","lv":1,"q":"Liszt Consolation No 3","story":["화려한 기교로 유명한 리스트가 쓴 조용하고 서정적인 소품입니다. 바이마르 시절 그의 연인 카롤리네 비트겐슈타인 공작부인과 함께하던 무렵에 쓰였습니다.","쇼팽의 녹턴을 떠올리게 하는 분위기로, 리스트의 부드러운 면을 보여 줍니다."],"points":["왼손의 잔잔한 물결 같은 반주","오른손의 길고 평온한 노래","악기가 거의 노래하듯 숨 쉬는 템포"]},
  {"id":"liszt-mazeppa","c":"liszt","t":"초절기교 연습곡 4번 “마제파”","alias":"d단조 · S.139-4","y":"1851","form":"피아노","dur":"약 8분","lv":3,"q":"Liszt Transcendental Etude No 4 Mazeppa","story":["빅토르 위고의 시를 바탕으로, 야생마에 묶여 초원을 달리는 우크라이나 영웅 마제파의 이야기를 그렸습니다.","“초절기교”라는 이름 그대로, 피아노 기교의 한계를 넘으려 한 12곡의 연습곡 중에서도 가장 어려운 곡 중 하나입니다."],"points":["양손이 번갈아 내리치는 질주 — 미친 듯 달리는 말","중간의 지친 듯한 서정적 부분","마지막 승리의 행진: 마제파가 왕이 되는 결말"]},
  {"id":"liszt-sonata","c":"liszt","t":"피아노 소나타","alias":"b단조 · S.178","y":"1853","form":"피아노","dur":"약 30분","lv":3,"q":"Liszt Piano Sonata in B minor","story":["슈만이 자신의 “환상곡”을 리스트에게 헌정한 데 대한 답례로 슈만에게 헌정했습니다. 하지만 그때 슈만은 이미 요양원에 있었습니다.","30분 동안 쉬지 않고 이어지는 단악장 안에 소나타 전체를 담은 혁신적인 형식입니다. 클라라 슈만과 브람스는 이 곡을 싫어했다고 전해집니다."],"points":["처음: 낮게 떨어지는 음계 — 수수께끼 같은 시작","몇 개의 주제가 모습을 바꿔 계속 돌아옵니다","마지막: 폭발 대신 조용히 사라지는 끝"]},
  {"id":"liszt-preludes","c":"liszt","t":"교향시 “전주곡”","alias":"S.97","y":"1854","form":"관현악","dur":"약 16분","lv":2,"q":"Liszt Les Preludes symphonic poem","story":["리스트는 시나 그림의 내용을 단악장 관현악곡으로 그리는 “교향시”라는 장르를 만들었고, 이 곡이 그 대표작입니다.","라마르틴의 시를 인용해 “인생은 죽음으로 향하는 전주곡의 연속”이라는 주제를 서문에 붙였습니다."],"points":["처음의 질문하는 듯한 세 음 — 곡 전체의 씨앗","사랑, 폭풍, 전원, 전투로 모습을 바꾸는 같은 주제","금관악기의 장대한 마무리"]},
  {"id":"liszt-mephisto","c":"liszt","t":"메피스토 왈츠 1번","alias":"S.514","y":"1859–62","form":"피아노","dur":"약 11분","lv":3,"q":"Liszt Mephisto Waltz No 1","story":["레나우의 “파우스트”에서 악마 메피스토펠레스가 시골 주막에서 바이올린을 들고 사람들을 홀려 춤추게 하는 장면을 그렸습니다.","처음엔 관현악곡으로 썼고 피아노판도 함께 만들었는데, 지금은 피아노판이 더 자주 연주됩니다."],"points":["처음: 바이올린을 조율하는 듯한 5도 음정","점점 미쳐 가는 왈츠의 소용돌이","중간의 유혹적인 느린 왈츠"]},
  {"id":"liszt-sonetto104","c":"liszt","t":"페트라르카 소네트 104번","alias":"순례의 해 2년 “이탈리아” 중 · S.161-5","y":"1840년대","form":"피아노","dur":"약 7분","lv":2,"q":"Liszt Petrarch Sonnet 104","story":["이탈리아를 여행하며 받은 인상을 피아노곡으로 그린 “순례의 해” 중 한 곡입니다. 14세기 시인 페트라르카가 라우라에게 바친 사랑의 소네트를 바탕으로 했습니다.","원래 가곡으로 썼다가 피아노 독주곡으로 다시 만들었습니다."],"points":["노래하듯 흐르는 사랑의 선율","점점 고조되어 터지는 열정","끝의 고요한 여운"]},
  {"id":"liszt-pc1","c":"liszt","t":"피아노 협주곡 1번","alias":"E♭장조 · S.124","y":"1855","form":"협주곡","dur":"약 19분","lv":2,"q":"Liszt Piano Concerto No 1","story":["1855년 바이마르에서 리스트가 독주하고 베를리오즈가 지휘해 초연했습니다. 네 악장이 쉬지 않고 이어집니다.","3악장에서 트라이앵글이 두드러지게 활약해 비평가 한슬리크가 “트라이앵글 협주곡”이라고 비꼬았습니다."],"points":["시작: 오케스트라의 강렬한 주제와 피아노의 폭발적 응답","3악장: 반짝이는 트라이앵글","처음 주제들이 행진곡으로 모습을 바꿔 돌아오는 피날레"]},
  {"id":"verdi-nabucco","c":"verdi","t":"히브리 노예들의 합창","alias":"“나부코” 3막","y":"1842","form":"오페라","dur":"약 5분","lv":1,"q":"Verdi Va pensiero Nabucco chorus","story":["바빌론에 끌려간 히브리 사람들이 유프라테스 강가에서 잃어버린 조국을 그리워하며 부르는 합창입니다. 베르디를 재기시킨 오페라 “나부코”의 대표곡입니다.","오스트리아의 지배를 받던 이탈리아 사람들은 이 노래에 자신들의 처지를 겹쳐 보았다고 전해집니다. 베르디의 장례 행렬 때도 사람들이 이 노래를 불렀다고 합니다."],"points":["조용하고 부드럽게 시작하는 합창","모두가 한목소리로 부르는 단순한 선율","중간에 터져 나오는 간절한 외침"]},
  {"id":"verdi-donna","c":"verdi","t":"여자의 마음","alias":"“리골레토” 3막","y":"1851","form":"오페라","dur":"약 3분","lv":1,"q":"Verdi La donna e mobile","story":["바람둥이 만토바 공작이 여자의 마음은 바람에 날리는 깃털처럼 변덕스럽다고 노래하는 아리아입니다.","베르디는 이 선율이 초연 전에 퍼지지 않도록 리허설 직전까지 테너에게도 악보를 주지 않았다고 전해집니다. 초연 다음 날 베네치아 거리 곳곳에서 이 노래가 들렸다고 합니다."],"points":["오케스트라의 경쾌한 전주","가볍고 흥겨운 테너의 선율","마지막 높은 음으로 뽐내는 끝"]},
  {"id":"verdi-brindisi","c":"verdi","t":"축배의 노래","alias":"“라 트라비아타” 1막","y":"1853","form":"오페라","dur":"약 3분","lv":1,"q":"Verdi Libiamo ne lieti calici","story":["파리 사교계의 파티에서 청년 알프레도와 비올레타가 함께 부르는 축배의 노래입니다. 두 사람의 사랑이 시작되는 장면입니다.","“라 트라비아타”는 뒤마 2세의 소설 “동백꽃 여인”이 원작으로, 신년 음악회의 단골 곡입니다."],"points":["3박자의 흥겨운 왈츠 리듬","테너와 소프라노가 주고받는 노래","모든 사람이 함께 잔을 드는 합창"]},
  {"id":"verdi-aida","c":"verdi","t":"개선 행진곡","alias":"“아이다” 2막","y":"1871","form":"오페라","dur":"약 7분","lv":1,"q":"Verdi Aida Triumphal March","story":["이집트 카이로 오페라 극장을 위해 쓴 오페라 “아이다”의 장면입니다. 이집트 장군 라다메스가 에티오피아와의 전쟁에서 이기고 개선하는 모습입니다.","이 장면을 위해 특별히 만든 긴 “아이다 트럼펫”이 쓰입니다. 축구 응원가로도 자주 쓰입니다."],"points":["긴 트럼펫이 부는 장엄한 행진 선율","합창과 함께 커지는 축제 분위기","발레 음악이 이어지는 화려한 중간 부분"]},
  {"id":"verdi-dies","c":"verdi","t":"레퀴엠 중 “진노의 날”","alias":"","y":"1874","form":"성악","dur":"약 2분","lv":2,"q":"Verdi Requiem Dies irae","story":["이탈리아의 존경받는 작가 만초니를 추모하기 위해 쓴 레퀴엠(진혼곡)입니다. 오페라 극장처럼 극적이라 “교회 옷을 입은 오페라”라는 평을 들었습니다.","“진노의 날”은 최후의 심판 날을 그린 부분으로, 영화와 광고에서 공포나 긴장감을 표현할 때 자주 쓰입니다."],"points":["네 번의 거대한 오케스트라 타격","큰북의 엄청난 강타 — 박자와 엇갈려 칩니다","폭풍처럼 몰아치는 합창"]},
