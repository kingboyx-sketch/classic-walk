  {"id":"verdi-forza","c":"verdi","t":"운명의 힘 서곡","alias":"","y":"1862","form":"관현악","dur":"약 8분","lv":2,"q":"Verdi La forza del destino overture","story":["러시아 상트페테르부르크 극장의 의뢰로 쓴 오페라 “운명의 힘”의 서곡입니다. 1869년 개정 때 지금의 서곡이 만들어졌습니다.","처음에 금관이 울리는 세 번의 음이 “운명”을 나타내며, 오페라의 주요 선율이 모두 담겨 있어 단독으로 자주 연주됩니다."],"points":["시작: 금관의 세 번의 “운명” 음","현악기가 계속 반복하는 불안한 “운명의 주제”","관악기의 기도하는 듯한 선율과 화려한 마무리"]},
  {"id":"verdi-traviata-prelude","c":"verdi","t":"라 트라비아타 1막 전주곡","alias":"","y":"1853","form":"오페라","dur":"약 4분","lv":1,"q":"Verdi La traviata Prelude Act 1","story":["오페라의 막이 오르기 전에 연주되는 짧은 전주곡입니다. 병으로 죽어 가는 비올레타를 먼저 보여 주는 듯 아주 여리게 시작합니다.","이어서 비올레타가 알프레도에게 사랑을 고백하는 선율이 나옵니다."],"points":["시작: 아주 높은 바이올린의 여린 화음 = 병든 비올레타","현이 부르는 따뜻한 사랑의 선율","바이올린의 장식이 춤추는 화려한 반복"]},
  {"id":"verdi-anvil","c":"verdi","t":"대장간의 합창","alias":"“일 트로바토레” 2막","y":"1853","form":"오페라","dur":"약 3분","lv":1,"q":"Verdi Anvil Chorus Il trovatore","story":["스페인 산속에서 집시들이 새벽에 일을 시작하며 망치로 모루를 두드리며 부르는 합창입니다.","실제 무대에서 쇠망치로 모루를 두드리는 소리가 들어갑니다."],"points":["쾅쾅 울리는 모루 소리","힘찬 남성 합창","모두가 함께 일하는 리듬감"]},
  {"id":"verdi-otello","c":"verdi","t":"버들의 노래와 아베 마리아","alias":"“오텔로” 4막","y":"1887","form":"오페라","dur":"약 12분","lv":3,"q":"Verdi Otello Willow Song Ave Maria","story":["70대의 베르디가 셰익스피어의 “오셀로”로 쓴 오페라입니다. 질투에 눈이 먼 오텔로의 손에 죽기 직전, 데스데모나가 부르는 노래들입니다.","하녀에게서 배운 슬픈 “버들의 노래”를 부른 뒤, 조용히 성모에게 기도를 드립니다."],"points":["잉글리시 호른의 쓸쓸한 전주","“버들의 노래”의 슬픈 반복","“아베 마리아”: 거의 속삭이듯 부르는 기도"]},
  {"id":"verdi-falstaff","c":"verdi","t":"팔스타프 피날레 푸가","alias":"“팔스타프” 3막","y":"1893","form":"오페라","dur":"약 4분","lv":3,"q":"Verdi Falstaff Tutto nel mondo e burla","story":["80세의 베르디가 쓴 마지막 오페라이자 두 번째 희극 오페라입니다. 셰익스피어의 희극에 나오는 뚱뚱한 기사 팔스타프가 주인공입니다.","마지막 장면에서 등장인물 모두가 “세상 모든 것은 농담”이라고 노래하는 푸가로 막을 내립니다. 오페라 인생의 마지막을 웃음으로 끝낸 셈입니다."],"points":["팔스타프가 먼저 부르는 푸가 주제","10명의 가수가 차례로 들어오며 쌓이는 푸가","모든 사람이 웃으며 맺는 유쾌한 마지막 화음"]},
  {"id":"brahms-hungarian5","c":"brahms","t":"헝가리 무곡 5번","alias":"WoO 1","y":"1869","form":"관현악","dur":"약 3분","lv":1,"q":"Brahms Hungarian Dance No 5 orchestra","story":["젊은 시절 헝가리 출신 바이올리니스트와 함께 순회 연주를 하며 들은 집시 음악을 바탕으로 한 곡입니다. 원래는 피아노 연탄곡(두 사람이 함께 치는 곡)이었고, 큰 인기를 얻어 브람스의 생계를 든든하게 해주었습니다.","재미있게도 이 5번의 선율은 브람스가 민요라고 생각했지만, 실제로는 동시대 작곡가 켈레르가 쓴 곡이었습니다."],"points":["느렸다가 갑자기 빨라지는 집시 음악 특유의 템포 변화","단조의 정열적인 주제와 장조의 경쾌한 가운데 부분","연주자마다 밀고 당기는 템포가 다르니 여러 버전을 비교해 보세요"]},
  {"id":"brahms-sym3","c":"brahms","t":"교향곡 3번","alias":"3악장 포코 알레그레토 · Op.90","y":"1883","form":"교향곡","dur":"약 6분(3악장)","lv":2,"q":"Brahms Symphony 3 third movement Poco allegretto","story":["교향곡 1번에 21년이 걸렸던 브람스가 50세에 쓴 교향곡입니다. 3악장은 브람스 음악 중 가장 애틋한 선율로 꼽힙니다.","1961년 영화 “이수(Goodbye Again)”에 쓰이며 널리 알려졌습니다. 이 영화의 원작은 프랑수아즈 사강의 소설 “브람스를 좋아하세요…”입니다."],"points":["첼로가 처음 부르는 그리움 가득한 선율","같은 선율을 호른과 오보에가 이어받을 때의 색깔 변화","크게 폭발하지 않고 조용히 사그라지는 끝 — 브람스다운 절제"]},
  {"id":"brahms-sym1","c":"brahms","t":"교향곡 1번","alias":"c단조 · Op.68","y":"1876","form":"교향곡","dur":"약 45분","lv":2,"q":"Brahms Symphony No 1","story":["베토벤이라는 거인의 발소리를 늘 의식했던 브람스가 20년 넘게 매달려 완성한 첫 교향곡입니다.","지휘자 한스 폰 뷜로는 이 곡을 “베토벤의 교향곡 10번”이라 불렀습니다. 4악장의 주제가 베토벤 “환희의 송가”와 닮았다는 지적에 브람스는 “그건 바보라도 알아챈다”고 퉁명스럽게 답했다고 합니다."],"points":["시작: 팀파니가 쿵쿵 박는 가운데 고통스럽게 오르는 서주","4악장: 알프스 호른 선율이 구름을 걷어 내는 장면","현악기가 부르는 “환희의 송가”를 닮은 주제"]},
  {"id":"brahms-lullaby","c":"brahms","t":"자장가","alias":"Op.49-4","y":"1868","form":"가곡","dur":"약 2분","lv":1,"q":"Brahms Lullaby Wiegenlied Op 49 No 4","story":["젊은 시절 함께 합창단에서 노래했던 친구 베르타 파버가 둘째 아들을 낳자 축하 선물로 써 준 곡입니다.","피아노 반주에 그녀가 예전에 즐겨 부르던 왈츠 선율을 몰래 숨겨 넣었습니다. 세계에서 가장 유명한 자장가가 되었습니다."],"points":["흔들리는 요람 같은 반주","단순하고 다정한 선율","반주에 숨겨진 옛 왈츠를 찾아보세요"]},
  {"id":"brahms-violin","c":"brahms","t":"바이올린 협주곡","alias":"D장조 · Op.77","y":"1878","form":"협주곡","dur":"약 40분","lv":2,"q":"Brahms Violin Concerto Op 77","story":["평생의 친구이자 바이올리니스트 요제프 요아힘을 위해 썼고, 요아힘의 조언을 받으며 완성했습니다.","바이올린이 오케스트라와 대등하게 맞서는 교향곡 같은 협주곡이라 “바이올린에 맞선 협주곡”이라는 말을 듣기도 했습니다."],"points":["1악장: 긴 오케스트라 서주 뒤 바이올린의 격렬한 등장","2악장: 오보에가 먼저 부르는 아름다운 선율","3악장: 헝가리 집시풍 춤곡"]},
  {"id":"brahms-pc2","c":"brahms","t":"피아노 협주곡 2번","alias":"B♭장조 · Op.83","y":"1881","form":"협주곡","dur":"약 48분","lv":3,"q":"Brahms Piano Concerto No 2","story":["협주곡으로는 드물게 네 악장으로 된 거대한 곡입니다. 브람스는 친구에게 “작은 스케르초가 하나 딸린 아주 작은 피아노 협주곡”을 썼다고 농담했습니다.","이탈리아 여행에서 받은 밝은 인상이 곳곳에 배어 있습니다."],"points":["시작: 호른이 부르는 평화로운 주제에 피아노가 답합니다","3악장: 첼로 독주가 부르는 깊은 노래","4악장: 가볍고 우아한 춤 같은 피날레"]},
  {"id":"brahms-academic","c":"brahms","t":"대학 축전 서곡","alias":"Op.80","y":"1880","form":"관현악","dur":"약 10분","lv":1,"q":"Brahms Academic Festival Overture","story":["브레슬라우 대학이 브람스에게 명예 박사 학위를 주자 감사의 뜻으로 쓴 곡입니다.","근엄한 축하곡 대신 당시 대학생들이 술자리에서 부르던 노래들을 엮어 넣었고, 마지막을 대학가 “가우데아무스(그러니 즐기자)”로 장식했습니다."],"points":["곡 곳곳에 등장하는 대학생 노래 메들리","바순이 익살스럽게 부르는 신입생 환영 노래","마지막: 오케스트라 전체가 부르는 “가우데아무스”"]},
  {"id":"brahms-requiem","c":"brahms","t":"독일 레퀴엠","alias":"Op.45","y":"1868","form":"성악","dur":"약 70분","lv":3,"q":"Brahms A German Requiem","story":["라틴어 미사문 대신 루터의 독일어 성경에서 직접 가사를 골라 쓴 레퀴엠입니다. 죽은 자를 위한 기도보다 남은 사람들을 위로하는 데 초점을 맞췄습니다.","어머니의 죽음과 스승 슈만의 죽음이 작곡의 계기가 된 것으로 여겨집니다."],"points":["1곡 “슬퍼하는 자는 복이 있나니”: 바이올린 없이 시작하는 어둡고 따뜻한 소리","2곡: 무겁게 걷는 장송 행진","5곡: 소프라노가 부르는 “어머니가 위로하듯”"]},
  {"id":"brahms-intermezzo","c":"brahms","t":"인터메초","alias":"A장조 · Op.118-2","y":"1893","form":"피아노","dur":"약 6분","lv":1,"q":"Brahms Intermezzo Op 118 No 2","story":["60세 무렵 작곡을 그만두려다 다시 쓴 말년의 피아노 소품 중 하나로, 평생의 벗 클라라 슈만에게 헌정했습니다.","화려함 대신 쓸쓸하고 다정한 회상이 담겨 있어 브람스 피아노곡 중 가장 사랑받습니다."],"points":["처음 세 음의 부드러운 질문","중간부: 단조로 바뀌며 짙어지는 그리움","다시 돌아오는 첫 선율의 위로"]},
  {"id":"brahms-sym4","c":"brahms","t":"교향곡 4번","alias":"e단조 · Op.98","y":"1885","form":"교향곡","dur":"약 40분","lv":3,"q":"Brahms Symphony No 4","story":["브람스의 마지막 교향곡입니다. 4악장은 바흐 칸타타의 한 주제를 바탕으로 같은 8마디 저음 위에 30번 변주를 쌓는 바로크 형식 “파사칼리아”로 만들었습니다.","낭만주의 한복판에서 바로크의 옛 형식을 되살린 브람스다운 작품입니다."],"points":["1악장: 한숨처럼 내려오고 올라가는 첫 주제","4악장: 관악기가 제시하는 8마디 주제","같은 주제 위로 쌓이는 30개의 변주"]},
  {"id":"saintsaens-swan","c":"saintsaens","t":"백조","alias":"“동물의 사육제” 13번","y":"1886","form":"실내악","dur":"약 3분","lv":1,"q":"Saint Saens The Swan cello","story":["“동물의 사육제” 14곡 중 생상스가 생전에 출판을 허락한 유일한 곡입니다.","1905년 발레리나 안나 파블로바가 이 곡에 맞춰 “빈사의 백조”를 춰 세계적인 명작이 되었습니다."],"points":["첼로의 길고 우아한 선율 = 물 위를 미끄러지는 백조","피아노의 잔잔한 물결","마지막: 고요히 사라지는 첼로"]},
  {"id":"saintsaens-carnival","c":"saintsaens","t":"동물의 사육제","alias":"","y":"1886","form":"실내악","dur":"약 25분","lv":1,"q":"Saint Saens Carnival of the Animals","story":["사육제 기간에 친구들과 즐기려고 쓴 14곡의 유머러스한 모음곡입니다. 생상스는 진지한 작곡가로서의 체면 때문에 생전에 출판을 금지했습니다.","사자, 암탉, 코끼리, 캥거루, 수족관, 거북이 같은 동물부터 “피아니스트”까지 나옵니다. 거북이는 오펜바흐의 “캉캉”을 아주 느리게 연주합니다."],"points":["“거북이”: 엄청 느리게 연주하는 캉캉","“코끼리”: 콘트라베이스가 추는 무거운 왈츠","“수족관”: 반짝이는 물속 세상"]},
  {"id":"saintsaens-danse","c":"saintsaens","t":"죽음의 무도","alias":"Op.40","y":"1874","form":"관현악","dur":"약 7분","lv":1,"q":"Saint Saens Danse Macabre","story":["자정이 되면 죽음의 신이 바이올린을 켜고 해골들이 무덤에서 나와 춤추다 새벽닭이 울면 사라진다는 이야기를 그린 교향시입니다.","실로폰으로 해골들의 뼈 부딪히는 소리를 냈고, “동물의 사육제”의 “화석”에서 이 선율을 스스로 패러디했습니다."],"points":["시작: 하프가 열두 번 울리는 자정의 종","바이올린의 “불협화음” 조율 = 죽음의 신의 바이올린","끝: 오보에의 닭 울음과 함께 사라지는 해골들"]},
  {"id":"saintsaens-organ","c":"saintsaens","t":"교향곡 3번 “오르간”","alias":"c단조 · Op.78","y":"1886","form":"교향곡","dur":"약 36분","lv":2,"q":"Saint Saens Symphony No 3 Organ finale","story":["런던 필하모닉 협회의 의뢰로 쓴 곡으로, 생상스는 “내가 쏟아부을 수 있는 모든 것을 담았다”고 말했습니다. 이 해 세상을 떠난 리스트에게 헌정되었습니다.","오케스트라에 오르간과 피아노를 더한 거대한 편성입니다. 영화 “꼬마 돼지 베이브”(1995)에서 마지막 부분의 선율이 노래로 쓰였습니다."],"points":["1부 후반: 오르간이 아주 낮게 받쳐 주는 고요한 기도","2부 시작: 오르간이 터뜨리는 거대한 C장조 화음","피아노 네 손이 반짝이는 장식을 더하는 피날레"]},
  {"id":"saintsaens-introrondo","c":"saintsaens","t":"서주와 론도 카프리치오소","alias":"Op.28","y":"1863","form":"협주곡","dur":"약 10분","lv":2,"q":"Saint Saens Introduction and Rondo Capriccioso","story":["스페인 출신의 천재 바이올리니스트 사라사테를 위해 쓴 곡입니다. 사라사테는 이 곡을 자신의 대표 레퍼토리로 연주했습니다.","나중에 비제가 피아노 반주로 편곡하기도 했습니다."],"points":["서주: 우수에 찬 스페인풍 선율","론도: 스페인 춤처럼 튀는 리듬","마지막: 숨 막히는 기교의 질주"]},
  {"id":"saintsaens-delilah","c":"saintsaens","t":"그대 음성에 내 마음 열리고","alias":"“삼손과 데릴라” 2막","y":"1877","form":"오페라","dur":"약 6분","lv":2,"q":"Saint Saens Mon coeur s ouvre a ta voix","story":["구약 성경의 삼손과 데릴라 이야기를 그린 오페라입니다. 프랑스에서 성경 이야기를 무대에 올리는 것을 꺼려 초연은 독일 바이마르에서 리스트의 도움으로 열렸습니다.","데릴라가 삼손을 유혹해 힘의 비밀을 알아내려 부르는 아리아로, 메조소프라노의 가장 유명한 아리아 중 하나입니다."],"points":["메조소프라노의 깊고 부드러운 음색","현악기가 물결처럼 감싸는 반주","삼손이 함께 부르는 후반의 뜨거운 고조"]},
  {"id":"saintsaens-cello1","c":"saintsaens","t":"첼로 협주곡 1번","alias":"a단조 · Op.33","y":"1872","form":"협주곡","dur":"약 20분","lv":2,"q":"Saint Saens Cello Concerto No 1","story":["세 부분이 쉬지 않고 이어지는 단악장 형식의 협주곡입니다. 첼리스트 카살스와 로스트로포비치가 특히 사랑한 곡입니다.","젊은 쇼스타코비치와 라흐마니노프도 첼로 협주곡 중 최고로 꼽았다고 전해집니다."],"points":["시작: 오케스트라의 화음 한 번 뒤 바로 달려 나가는 첼로","중간: 약음기 낀 현이 연주하는 미뉴에트","처음의 주제가 돌아오는 극적인 마무리"]},
  {"id":"saintsaens-pc2","c":"saintsaens","t":"피아노 협주곡 2번","alias":"g단조 · Op.22","y":"1868","form":"협주곡","dur":"약 24분","lv":2,"q":"Saint Saens Piano Concerto No 2","story":["단 3주 만에 쓴 곡으로, 초연은 생상스가 직접 피아노를 치고 안톤 루빈시테인이 지휘했습니다.","당시 한 피아니스트는 이 곡을 두고 “바흐로 시작해 오펜바흐로 끝난다”고 했습니다. 엄숙한 시작이 점점 경쾌하게 변합니다."],"points":["1악장: 바흐의 즉흥곡 같은 피아노 혼자의 시작","2악장: 팀파니로 시작하는 장난스러운 스케르초","3악장: 타란텔라 리듬으로 질주하는 피날레"]},
  {"id":"saintsaens-havanaise","c":"saintsaens","t":"하바네라","alias":"Op.83","y":"1887","form":"협주곡","dur":"약 10분","lv":2,"q":"Saint Saens Havanaise","story":["쿠바 출신 바이올리니스트 디아스 알베르티니를 위해 쓴 곡입니다. 순회 연주 중 숙소에 불이 난 뒤 벽난로 앞에서 몸을 녹이며 떠올린 리듬이라고 전해집니다.","쿠바에서 유래한 느릿한 춤 리듬 “하바네라”를 바이올린으로 우아하게 그립니다."],"points":["반복되는 하바네라 리듬","바이올린의 나른하고 관능적인 선율","중간의 빠르고 화려한 기교"]},
  {"id":"saintsaens-vc3","c":"saintsaens","t":"바이올린 협주곡 3번","alias":"b단조 · Op.61","y":"1880","form":"협주곡","dur":"약 28분","lv":2,"q":"Saint Saens Violin Concerto No 3","story":["역시 사라사테를 위해 쓴 곡으로, 생상스의 바이올린 협주곡 중 가장 많이 연주됩니다.","열정적인 1악장, 뱃노래 같은 2악장, 찬가가 등장하는 3악장으로 구성됩니다."],"points":["1악장: 바이올린이 낮은 음으로 힘차게 시작하는 주제","2악장: 바이올린과 클라리넷이 함께 끝내는 뱃노래","3악장: 금관과 함께 울리는 찬가풍 선율"]},
  {"id":"tchai-swan","c":"tchaikovsky","t":"백조의 호수","alias":"모음곡 · Op.20","y":"1876","form":"발레","dur":"약 25분(모음곡)","lv":1,"q":"Tchaikovsky Swan Lake Suite","story":["저주에 걸려 낮에는 백조, 밤에만 사람이 되는 공주 오데트와 왕자 지크프리트의 이야기입니다.","1877년 초연은 형편없는 안무와 무대로 실패했고, 차이콥스키는 살아서 이 작품의 성공을 보지 못했습니다. 그가 죽은 뒤 1895년 새로운 안무로 재공연되면서 세계에서 가장 유명한 발레가 되었습니다."],"points":["“정경”: 오보에가 부르는 유명한 백조의 테마 — 쓸쓸하고 신비로운","“작은 백조들의 춤”: 네 명이 팔짱 끼고 추는 귀여운 춤","“왈츠”: 차이콥스키가 왜 왈츠의 대가인지 알 수 있는 곡"]},
  {"id":"tchai-pc1","c":"tchaikovsky","t":"피아노 협주곡 1번","alias":"b♭단조 · Op.23","y":"1875","form":"협주곡","dur":"약 35분","lv":2,"q":"Tchaikovsky Piano Concerto 1","story":["차이콥스키가 존경하던 피아니스트 니콜라이 루빈시테인에게 들려주었다가 “쓸모없고 연주할 수 없다”는 혹평을 들었습니다. 상처받은 그는 “한 음도 고치지 않겠다”고 했다고 합니다.","결국 독일 지휘자 겸 피아니스트 한스 폰 뷜로가 미국 보스턴에서 초연해 대성공을 거두었고, 루빈시테인도 나중에 생각을 바꿔 이 곡을 연주했습니다."],"points":["호른의 웅장한 신호와 함께 피아노가 거대한 화음을 내리치는 도입","그런데 이 유명한 도입 선율은 곡에서 다시 나오지 않습니다!","3악장: 우크라이나 민요에서 가져온 춤곡 리듬"]},
  {"id":"tchai-sym6","c":"tchaikovsky","t":"교향곡 6번 “비창”","alias":"b단조 · Op.74","y":"1893","form":"교향곡","dur":"약 45분","lv":3,"q":"Tchaikovsky Symphony 6 Pathetique","story":["차이콥스키는 이 곡을 “내 모든 작품 중 최고”라고 했습니다. 직접 지휘해 초연했는데, 9일 뒤 갑자기 세상을 떠났습니다. 사인은 콜레라로 알려졌지만 지금도 여러 설이 있습니다.","보통 교향곡은 빠르고 화려하게 끝나는데, 이 곡은 느리고 어둡게, 꺼져가듯 끝납니다. 그 자체가 당시엔 충격이었습니다."],"points":["1악장 두 번째 주제: 차이콥스키가 쓴 가장 아름다운 선율 중 하나","3악장: 승리의 행진처럼 끝나서 많은 청중이 여기서 박수를 칩니다(함정!)","4악장: 깊은 절망 속으로 가라앉으며 콘트라베이스만 남아 사라지는 끝"]},
  {"id":"tchai-nutcracker","c":"tchaikovsky","t":"호두까기 인형 모음곡","alias":"Op.71a","y":"1892","form":"발레","dur":"약 22분","lv":1,"q":"Tchaikovsky Nutcracker Suite","story":["크리스마스이브에 선물받은 호두까기 인형이 왕자로 변해 소녀 클라라를 과자의 나라로 데려가는 발레입니다.","차이콥스키는 파리에서 새 악기 첼레스타를 보고 몰래 러시아로 들여왔습니다. 다른 작곡가가 먼저 쓸까 봐 비밀로 했다고 전해지며, “사탕 요정의 춤”에서 처음 선보였습니다."],"points":["“사탕 요정의 춤”: 첼레스타의 영롱한 소리","“러시아 춤(트레팍)”의 신나는 에너지","“꽃의 왈츠”: 하프 카덴차 뒤의 화려한 왈츠"]},
  {"id":"tchai-sleeping","c":"tchaikovsky","t":"잠자는 숲속의 미녀 왈츠","alias":"Op.66","y":"1890","form":"발레","dur":"약 5분","lv":1,"q":"Tchaikovsky Sleeping Beauty Waltz","story":["샤를 페로의 동화를 바탕으로 한 발레로, 차이콥스키의 세 발레 중 생전에 가장 큰 성공을 거두었습니다.","1959년 디즈니 애니메이션 “잠자는 숲속의 공주”는 이 발레의 음악을 바탕으로 만들어졌습니다."],"points":["화려한 도입 후 펼쳐지는 우아한 왈츠","디즈니 노래로 익숙한 선율을 찾아보세요","오케스트라 전체가 소용돌이치는 마지막"]},
  {"id":"tchai-1812","c":"tchaikovsky","t":"1812년 서곡","alias":"Op.49","y":"1880","form":"관현악","dur":"약 16분","lv":1,"q":"Tchaikovsky 1812 Overture","story":["1812년 나폴레옹의 러시아 침공과 패퇴를 그린 곡으로, 프랑스 국가 “라 마르세예즈”와 러시아 제국 찬가가 맞부딪칩니다.","악보에 진짜 대포 소리와 교회 종소리가 적혀 있는 것으로 유명합니다. 정작 차이콥스키는 이 곡을 “시끄럽고 요란하다”며 그다지 좋아하지 않았다고 합니다."],"points":["시작: 비올라와 첼로가 부르는 러시아 정교회 성가","“라 마르세예즈”가 점점 커지다 밀려나는 전투","마지막: 대포 소리와 종소리 속의 승리"]},
  {"id":"tchai-vc","c":"tchaikovsky","t":"바이올린 협주곡","alias":"D장조 · Op.35","y":"1878","form":"협주곡","dur":"약 35분","lv":2,"q":"Tchaikovsky Violin Concerto Op 35","story":["불행한 결혼 생활에서 도망쳐 스위스 제네바 호숫가에 머물며 한 달 만에 쓴 곡입니다.","헌정하려던 바이올리니스트 아우어가 연주할 수 없다고 거절해 초연이 늦어졌고, 초연 후 비평가 한슬리크는 “악취 나는 음악”이라고 혹평했습니다. 지금은 가장 사랑받는 바이올린 협주곡 중 하나입니다."],"points":["1악장: 바이올린이 부르는 따뜻하고 넓은 주제","2악장 칸초네타: 약음기를 낀 슬픈 노래","3악장: 러시아 시골 축제 같은 신나는 춤"]},
  {"id":"tchai-serenade","c":"tchaikovsky","t":"현을 위한 세레나데","alias":"C장조 · Op.48","y":"1880","form":"관현악","dur":"약 30분","lv":1,"q":"Tchaikovsky Serenade for Strings","story":["존경하던 모차르트에게 바치는 마음으로 쓴 현악 합주곡입니다. 차이콥스키 스스로 “진심으로 느끼며 썼다”며 아꼈습니다.","2악장 왈츠는 따로 연주될 만큼 사랑받습니다."],"points":["1악장 시작: 현악기 전체가 부르는 장엄한 화음","2악장: 우아한 왈츠","4악장: 러시아 민요를 바탕으로 한 활기찬 피날레"]},
  {"id":"tchai-sym5","c":"tchaikovsky","t":"교향곡 5번","alias":"e단조 · Op.64","y":"1888","form":"교향곡","dur":"약 48분","lv":2,"q":"Tchaikovsky Symphony No 5","story":["클라리넷이 처음 부르는 어두운 “운명의 주제”가 네 악장 모두에 모습을 바꿔 등장합니다.","차이콥스키는 초연 직후 이 곡이 실패작이라고 괴로워했지만, 이후 연주가 거듭되며 대표작으로 자리 잡았습니다."],"points":["1악장 시작: 클라리넷 두 대의 무거운 운명 주제","2악장: 호른 독주가 부르는 감미로운 노래","4악장: 운명 주제가 장조의 승리 행진으로 바뀌는 순간"]},
  {"id":"tchai-june","c":"tchaikovsky","t":"사계 중 “6월: 뱃노래”","alias":"Op.37a-6","y":"1876","form":"피아노","dur":"약 5분","lv":1,"q":"Tchaikovsky The Seasons June Barcarolle","story":["상트페테르부르크의 음악 잡지가 1년 동안 매달 그 달에 어울리는 피아노 소품을 한 곡씩 실었는데, 그 12곡을 모은 것이 “사계”입니다.","6월 곡은 강 위를 떠가는 배와 여름밤의 정취를 그린 곡으로, 열두 곡 중 가장 유명합니다."],"points":["흔들리는 배 같은 6/8박자 반주","단조의 그리운 선율","중간부: 밝아지며 물결이 커지는 장면"]},
  {"id":"dvorak-nw","c":"dvorak","t":"교향곡 9번 “신세계로부터”","alias":"e단조 · Op.95","y":"1893","form":"교향곡","dur":"약 42분","lv":1,"q":"Dvorak Symphony 9 From the New World","story":["뉴욕 음악원 원장으로 일하던 드보르자크가 미국에서 쓴 교향곡입니다. 흑인 영가와 원주민 음악에서 받은 인상, 그리고 고향 보헤미아에 대한 그리움이 함께 담겼습니다. 1893년 뉴욕 카네기홀 초연은 대성공이었습니다.","2악장의 잉글리시 호른 선율은 훗날 제자가 가사를 붙여 “Goin' Home(집으로 가는 길)”이라는 노래가 되었고, 한국에선 “꿈속의 고향”으로도 알려져 있습니다."],"points":["2악장: 잉글리시 호른이 부르는 향수 어린 선율","4악장 도입: 점점 빨라지다 금관이 터뜨리는 강렬한 주제","앞 악장들의 주제가 4악장에 다시 등장하는 것을 찾아보세요"]},
  {"id":"dvorak-cello","c":"dvorak","t":"첼로 협주곡","alias":"b단조 · Op.104","y":"1894–95","form":"협주곡","dur":"약 40분","lv":2,"q":"Dvorak Cello Concerto Op 104","story":["미국에 머물던 마지막 해에 쓴 곡입니다. 작곡 중 젊은 시절 사랑했던 처형 요세피나가 위독하다는 소식을 듣고, 그녀가 좋아하던 자신의 가곡 선율을 2악장에 넣었습니다.","브람스는 이 곡을 보고 “첼로로 이런 협주곡을 쓸 수 있다는 걸 알았다면 내가 진작 썼을 것”이라고 말했다고 전해집니다."],"points":["1악장: 호른이 부르는 고향 보헤미아 같은 두 번째 주제","2악장 중간에 숨어 있는 처형이 좋아한 가곡 선율","마지막 악장 끝: 조용한 회상 뒤 터지는 마무리"]},
  {"id":"dvorak-slavonic","c":"dvorak","t":"슬라브 무곡","alias":"e단조 · Op.72-2","y":"1886","form":"관현악","dur":"약 5분","lv":1,"q":"Dvorak Slavonic Dance Op 72 No 2","story":["브람스의 “헝가리 무곡”이 크게 성공하자 출판사가 드보르자크에게 비슷한 곡을 의뢰해 탄생한 시리즈입니다. 1집으로 하룻밤 사이 유명해졌고, 8년 뒤 2집을 썼습니다.","Op.72-2는 체코와 폴란드의 민속춤 리듬을 담은 2집 중 가장 애틋한 곡입니다."],"points":["우수에 찬 단조 선율","중간부: 장조로 바뀌며 밝아지는 춤","처음 선율이 돌아오며 남는 여운"]},
  {"id":"dvorak-humoresque","c":"dvorak","t":"유모레스크","alias":"G♭장조 · Op.101-7","y":"1894","form":"피아노","dur":"약 3분","lv":1,"q":"Dvorak Humoresque Op 101 No 7","story":["미국 생활 중 여름 휴가로 고향 체코에 돌아갔을 때 쓴 8개의 피아노 소품 중 7번입니다. 미국에서 적어 둔 스케치를 바탕으로 했습니다.","“유모레스크”는 유머러스한 소품이라는 뜻으로, 바이올린 편곡으로 더욱 유명해졌습니다."],"points":["깡충거리는 부점 리듬의 장난스러운 선율","중간부: 단조로 바뀌는 쓸쓸한 노래","다시 돌아오는 밝은 주제"]},
  {"id":"dvorak-american","c":"dvorak","t":"현악4중주 12번 “아메리카”","alias":"F장조 · Op.96","y":"1893","form":"실내악","dur":"약 26분","lv":1,"q":"Dvorak String Quartet American Op 96","story":["미국 아이오와주의 체코 이민자 마을 스필빌에서 여름을 보내며 단 2주 만에 쓴 곡입니다.","흑인 영가와 원주민 음악에서 받은 인상, 새소리, 그리고 체코 고향의 정서가 함께 담겨 있습니다."],"points":["1악장: 비올라가 부르는 넓은 대지 같은 주제","3악장: 바이올린이 흉내 내는 새소리","5음 음계로 만든 단순하고 친근한 선율"]},
  {"id":"dvorak-rusalka","c":"dvorak","t":"달에게 바치는 노래","alias":"오페라 “루살카” 중","y":"1901","form":"성악","dur":"약 6분","lv":1,"q":"Dvorak Song to the Moon Rusalka","story":["인간 왕자를 사랑하게 된 물의 요정 루살카가 달에게 자신의 사랑을 왕자에게 전해 달라고 비는 아리아입니다.","드보르자크의 오페라 중 가장 성공한 작품이며, 이 아리아는 소프라노의 대표 레퍼토리입니다."],"points":["하프와 현악기가 그리는 달빛 비친 호수","루살카의 길고 간절한 선율","점점 고조되는 그리움"]},
  {"id":"dvorak-sym8","c":"dvorak","t":"교향곡 8번","alias":"G장조 · Op.88","y":"1889","form":"교향곡","dur":"약 36분","lv":2,"q":"Dvorak Symphony No 8","story":["체코 시골 별장에서 자연을 벗 삼아 쓴 교향곡으로, 새소리와 민요, 춤이 가득한 밝은 곡입니다.","드보르자크는 이 곡에서 “평소와 다른 방식으로” 쓰고 싶었다고 말했는데, 정해진 형식보다 자유롭게 흘러가는 구성이 특징입니다."],"points":["1악장: 첼로가 부르는 어두운 서주 뒤 플루트의 새소리","3악장: 보헤미아 왈츠 같은 우아한 춤","4악장: 트럼펫 팡파르로 시작하는 변주곡"]},
  {"id":"dvorak-quintet2","c":"dvorak","t":"피아노 5중주 2번","alias":"A장조 · Op.81","y":"1887","form":"실내악","dur":"약 40분","lv":2,"q":"Dvorak Piano Quintet No 2 Op 81","story":["피아노와 현악4중주를 위한 곡으로, 브람스·슈만의 피아노 5중주와 함께 이 장르의 대표작으로 꼽힙니다.","2악장은 체코 민요 장르 “둠카”로, 슬픔과 기쁨이 번갈아 나타나는 것이 특징입니다."],"points":["1악장: 첼로가 부르는 따뜻한 첫 주제","2악장 둠카: 우울함과 활기가 갑자기 바뀌는 대비","3악장 퓨리안트: 체코의 빠른 민속춤"]},
  {"id":"dvorak-gypsy","c":"dvorak","t":"어머니가 가르쳐 주신 노래","alias":"집시의 노래 Op.55-4","y":"1880","form":"가곡","dur":"약 3분","lv":1,"q":"Dvorak Songs My Mother Taught Me","story":["체코 시인 헤이두크의 집시 시에 붙인 가곡집 “집시의 노래” 7곡 중 네 번째 곡입니다.","어머니가 눈물을 흘리며 가르쳐 준 노래를, 이제는 자신이 아이들에게 가르치며 눈물짓는다는 내용입니다. 바이올린 편곡으로도 많이 연주됩니다."],"points":["피아노의 부드러운 흔들림","단순하고 그리운 선율","짧지만 깊은 여운의 끝"]},
  {"id":"dvorak-serenade","c":"dvorak","t":"현을 위한 세레나데","alias":"E장조 · Op.22","y":"1875","form":"관현악","dur":"약 28분","lv":1,"q":"Dvorak Serenade for Strings Op 22","story":["아직 무명이던 34세에 단 11일 만에 쓴 곡입니다. 결혼하고 첫아들을 얻고 국가 장학금을 받는 등 행복한 시기였습니다.","밝고 따뜻한 분위기 덕분에 드보르자크의 곡 중 가장 친근한 작품입니다."],"points":["1악장: 첼로와 바이올린이 주고받는 포근한 선율","2악장: 쓸쓸한 왈츠","5악장: 활기찬 피날레와 1악장 선율의 회상"]},
  {"id":"grieg-morning","c":"grieg","t":"아침 기분","alias":"“페르 귄트” 모음곡 1번 중 · Op.46-1","y":"1875","form":"관현악","dur":"약 4분","lv":1,"q":"Grieg Morning Mood Peer Gynt","story":["입센의 희곡 “페르 귄트” 공연을 위해 쓴 부수음악 중 한 곡입니다. 노르웨이의 아침 같지만, 실제 극에서는 페르 귄트가 북아프리카 모로코의 사막에서 아침을 맞는 장면입니다.","플루트와 오보에가 주고받는 선율은 광고와 영화에서 아침을 상징하는 음악으로 쓰입니다."],"points":["플루트와 오보에가 주고받는 아침 선율","점점 밝아지며 오케스트라 전체로 퍼지는 햇살","새소리 같은 목관의 장식"]},
  {"id":"grieg-hall","c":"grieg","t":"산 속 마왕의 궁전에서","alias":"“페르 귄트” 모음곡 1번 중 · Op.46-4","y":"1875","form":"관현악","dur":"약 3분","lv":1,"q":"Grieg In the Hall of the Mountain King","story":["페르 귄트가 산 속 트롤(요정)의 왕궁에 몰래 들어갔다가 트롤들에게 쫓기는 장면입니다.","그리그 본인은 이 곡을 쓰며 “정말 듣기 싫을 정도로 노르웨이 시골 냄새가 난다”고 투덜댔다고 하지만, 지금은 가장 유명한 곡 중 하나입니다."],"points":["시작: 첼로와 바순이 살금살금 걷는 주제","같은 주제가 계속 빨라지고 커집니다","마지막: 트롤들이 몰려드는 폭발적인 끝"]},
  {"id":"grieg-pc","c":"grieg","t":"피아노 협주곡","alias":"a단조 · Op.16","y":"1868","form":"협주곡","dur":"약 30분","lv":1,"q":"Grieg Piano Concerto in A minor","story":["24세에 덴마크에서 쓴 곡으로, 그리그가 남긴 유일한 협주곡입니다. 슈만의 피아노 협주곡과 같은 a단조이며 영향을 크게 받았습니다.","리스트가 악보를 처음 보고 즉석에서 쳐 보며 극찬했다고 전해집니다. 1960~70년대 TV 광고와 코미디 프로그램에도 자주 등장했습니다."],"points":["시작: 팀파니의 떨림 뒤 피아노가 위에서 아래로 쏟아지는 화음","2악장: 약음기 낀 현의 고요한 노래","3악장: 노르웨이 민속춤 “할링” 리듬과 장엄한 마무리"]},
  {"id":"grieg-holberg","c":"grieg","t":"홀베르그 모음곡","alias":"Op.40","y":"1884","form":"관현악","dur":"약 20분","lv":1,"q":"Grieg Holberg Suite","story":["베르겐 출신 극작가 홀베르그의 탄생 200주년을 기념해 쓴 곡입니다. 홀베르그가 살던 18세기 바로크 춤곡 형식을 빌렸습니다.","처음엔 피아노곡으로 썼다가 현악 오케스트라로 편곡했습니다."],"points":["1곡 프렐류드: 말발굽처럼 경쾌하게 튀는 현","4곡 아리아: 첼로의 깊고 애잔한 노래","5곡 리고동: 바이올린과 비올라 독주가 춤추는 마무리"]},
  {"id":"grieg-wedding","c":"grieg","t":"트롤하우겐의 결혼식날","alias":"서정 소품 Op.65-6","y":"1896","form":"피아노","dur":"약 6분","lv":1,"q":"Grieg Wedding Day at Troldhaugen","story":["그리그와 아내 니나의 결혼 25주년을 축하하며 쓴 곡입니다. 트롤하우겐은 부부가 살던 베르겐 근교의 집 이름입니다.","그리그가 평생 66곡을 남긴 피아노 소품집 “서정 소품” 중 하나입니다."],"points":["시작: 결혼식 하객들이 다가오는 듯한 행진","중간: 부부의 추억처럼 조용하고 다정한 부분","다시 돌아오는 축제의 행진"]},
  {"id":"grieg-solveig","c":"grieg","t":"솔베이지의 노래","alias":"“페르 귄트” 모음곡 2번 중 · Op.55-4","y":"1875","form":"성악","dur":"약 5분","lv":1,"q":"Grieg Solveig s Song","story":["페르 귄트가 세상을 떠돌며 방황하는 동안 고향의 연인 솔베이지가 그를 기다리며 부르는 노래입니다.","노르웨이 민요풍의 단조 선율과 밝은 후렴이 번갈아 나옵니다. 성악곡 외에 관현악 편곡도 자주 연주됩니다."],"points":["짧은 서주 뒤 시작되는 쓸쓸한 단조 선율","후렴: 가사 없이 부르는 맑은 노래","기다림이 계속되는 듯 조용히 끝나는 마무리"]},
  {"id":"grieg-butterfly","c":"grieg","t":"나비","alias":"서정 소품 Op.43-1","y":"1886","form":"피아노","dur":"약 2분","lv":1,"q":"Grieg Butterfly Op 43 No 1","story":["“서정 소품” 3권의 첫 곡으로, 꽃 사이를 팔랑팔랑 날아다니는 나비를 그렸습니다.","같은 곡집에 “고독한 방랑자”, “고향에서”, “작은 새”, “봄에게” 같은 곡이 있어 자연의 소품집처럼 들립니다."],"points":["손가락이 건반 위를 날듯이 움직이는 빠른 음형","올라갔다 내려가는 반음계 = 나비의 날갯짓","살짝 사라지는 마지막"]},
  {"id":"grieg-lastspring","c":"grieg","t":"마지막 봄","alias":"두 개의 슬픈 선율 Op.34-2","y":"1880","form":"관현악","dur":"약 5분","lv":1,"q":"Grieg The Last Spring","story":["원래 시인 비녜의 시에 붙인 가곡입니다. 병든 사람이 아마도 마지막일 봄을 바라보는 내용입니다.","그리그가 이 노래를 현악 오케스트라곡으로 편곡하면서 더 널리 알려졌습니다."],"points":["현악기만으로 부르는 느린 선율","같은 선율이 두 번 나오며 더 짙어집니다","고요하게 가라앉는 마지막 화음"]},
  {"id":"grieg-vs3","c":"grieg","t":"바이올린 소나타 3번","alias":"c단조 · Op.45","y":"1886–87","form":"실내악","dur":"약 24분","lv":2,"q":"Grieg Violin Sonata No 3","story":["그리그가 쓴 세 곡의 바이올린 소나타 중 가장 극적인 곡입니다. 초연은 그리그 본인이 피아노를 맡았습니다.","서정적인 그리그의 다른 면, 강렬하고 격정적인 모습을 보여 줍니다."],"points":["1악장: 바이올린의 거센 외침으로 시작","2악장: 피아노가 먼저 부르는 노르웨이 민요풍 노래","3악장: 민속춤 리듬의 힘찬 피날레"]},
  {"id":"grieg-norwegian","c":"grieg","t":"노르웨이 춤곡","alias":"Op.35","y":"1881","form":"관현악","dur":"약 17분","lv":1,"q":"Grieg Norwegian Dances Op 35","story":["노르웨이 민요 선율을 바탕으로 피아노 연탄곡으로 썼고, 나중에 관현악으로 편곡되었습니다.","브람스의 “헝가리 무곡”처럼 민족의 춤을 연주회장으로 옮긴 곡입니다."],"points":["1번: 낮은 현악기의 투박한 민속춤","2번: 오보에의 귀여운 춤 선율 — 가장 유명합니다","빠른 부분과 느린 부분이 번갈아 나오는 대비"]},
  {"id":"puccini-babbino","c":"puccini","t":"오 사랑하는 나의 아버지","alias":"“잔니 스키키” 중","y":"1918","form":"오페라","dur":"약 3분","lv":1,"q":"Puccini O mio babbino caro","story":["푸치니의 유일한 희극 오페라 “잔니 스키키”에 나오는 아리아입니다. 딸 라우레타가 아버지에게 연인과 결혼하게 해 달라고 조르는 노래입니다.","아름다운 선율과 달리 극 속에서는 “허락하지 않으면 강에 뛰어들겠다”고 투정하는 귀여운 협박이 담겨 있습니다. 영화 “전망 좋은 방”(1985)에 쓰였습니다."],"points":["짧고 단순하지만 가슴을 울리는 선율","현악기가 선율을 함께 노래합니다","마지막 고음으로 올라가는 간청"]},
  {"id":"puccini-nessun","c":"puccini","t":"아무도 잠들지 마라","alias":"“투란도트” 3막","y":"1924–26","form":"오페라","dur":"약 3분","lv":1,"q":"Puccini Nessun dorma","story":["얼음 같은 공주 투란도트가 수수께끼를 푼 왕자의 이름을 알아낼 때까지 “아무도 잠들지 말라”고 명령합니다. 왕자 칼라프는 새벽이 오면 자신이 이길 것이라 노래합니다.","1990년 이탈리아 월드컵 중계 주제곡으로 파바로티가 부르며 세계적으로 유명해졌습니다. 푸치니는 이 오페라를 완성하지 못하고 세상을 떠났습니다."],"points":["조용히 시작하는 테너의 노래","여성 합창이 멀리서 부르는 신비로운 부분","마지막 “빈체로(이기리라)”의 긴 고음"]},
  {"id":"puccini-gelida","c":"puccini","t":"그대의 찬 손","alias":"“라 보엠” 1막","y":"1896","form":"오페라","dur":"약 5분","lv":2,"q":"Puccini Che gelida manina","story":["파리의 가난한 시인 로돌포가 크리스마스이브에 촛불을 빌리러 온 이웃 미미의 차가운 손을 잡고 자신을 소개하는 아리아입니다.","“라 보엠”은 젊은 예술가들의 가난한 사랑과 이별을 그린 오페라로, 지금도 세계에서 가장 많이 공연되는 오페라 중 하나입니다."],"points":["부드럽게 말을 건네는 듯한 시작","자신이 시인이라고 소개하며 점점 커지는 노래","테너의 높은 C음이 나오는 클라이맥스"]},
  {"id":"puccini-musetta","c":"puccini","t":"무제타의 왈츠","alias":"“라 보엠” 2막","y":"1896","form":"오페라","dur":"약 3분","lv":1,"q":"Puccini Quando m en vo Musetta s Waltz","story":["카페 모무스에서 화려한 무제타가 옛 연인 마르첼로의 관심을 끌려고 부르는 왈츠입니다.","길거리를 걸으면 모두가 자신을 쳐다본다는 자랑을 늘어놓는, 유쾌하고 매혹적인 노래입니다."],"points":["느리고 우아하게 흔들리는 왈츠 리듬","점점 사람들의 노래가 겹쳐지는 앙상블","마르첼로가 결국 넘어가는 순간의 고조"]},
  {"id":"puccini-vissi","c":"puccini","t":"노래에 살고 사랑에 살고","alias":"“토스카” 2막","y":"1900","form":"오페라","dur":"약 3분","lv":2,"q":"Puccini Vissi d arte","story":["가수 토스카가 연인을 살려 주는 대가를 요구하는 악당 스카르피아 앞에서 신에게 탄식하며 부르는 아리아입니다.","“나는 예술과 사랑에 살았을 뿐인데 왜 이런 시련을 주시나요”라는 내용입니다."],"points":["조용한 독백처럼 시작하는 노래","점점 간절해지는 기도","클라이맥스의 높은 음과 무너지듯 끝나는 마무리"]},
  {"id":"puccini-stars","c":"puccini","t":"별은 빛나건만","alias":"“토스카” 3막","y":"1900","form":"오페라","dur":"약 3분","lv":2,"q":"Puccini E lucevan le stelle","story":["처형을 앞둔 화가 카바라도시가 새벽 감옥에서 토스카와의 추억을 떠올리며 부르는 아리아입니다.","클라리넷의 슬픈 선율이 먼저 노래를 들려주고, 테너가 이어받습니다."],"points":["시작: 클라리넷의 쓸쓸한 독주","회상하듯 조용히 시작하는 테너","마지막: 삶에 대한 절규"]},
  {"id":"puccini-unbel","c":"puccini","t":"어떤 갠 날","alias":"“나비부인” 2막","y":"1904","form":"오페라","dur":"약 5분","lv":2,"q":"Puccini Un bel di vedremo","story":["일본 나가사키를 배경으로 한 오페라 “나비부인”의 아리아입니다. 미국으로 떠난 해군 장교 핀커턴을 3년째 기다리는 초초상(나비부인)이 부릅니다.","“어느 갠 날 수평선 위로 그의 배가 보일 거야”라며 그가 돌아올 날을 상상합니다. 그러나 결말은 비극입니다."],"points":["조용히 시작하는 꿈꾸는 듯한 노래","배를 기다리는 장면을 상상하며 점점 커지는 감정","클라이맥스의 강렬한 고음"]},
  {"id":"puccini-humming","c":"puccini","t":"허밍 코러스","alias":"“나비부인” 2막","y":"1904","form":"오페라","dur":"약 3분","lv":1,"q":"Puccini Humming Chorus Madama Butterfly","story":["초초상이 핀커턴의 배가 항구에 들어온 것을 보고 밤새 그를 기다리는 장면에서 흐르는 음악입니다.","무대 뒤의 합창단이 입을 다문 채 허밍으로 부릅니다. 가사가 없어 오히려 기다림의 고요함이 더 깊게 전해집니다."],"points":["입을 다문 합창의 부드러운 허밍","피치카토(현을 뜯는) 반주","밤이 깊어 가듯 사라지는 마무리"]},
  {"id":"puccini-manon","c":"puccini","t":"마농 레스코 간주곡","alias":"3막 전","y":"1893","form":"오페라","dur":"약 5분","lv":2,"q":"Puccini Manon Lescaut Intermezzo","story":["푸치니에게 첫 큰 성공을 안겨 준 오페라 “마농 레스코”의 간주곡입니다. 같은 이야기를 마스네가 이미 오페라로 썼는데도 푸치니는 “나는 이탈리아인의 열정으로 쓰겠다”고 했다고 전해집니다.","체포된 마농을 따라 르아브르 항구로 가는 데 그뤼의 절망을 그린 곡입니다."],"points":["첼로와 비올라의 어두운 독주로 시작","오케스트라 전체로 번지는 열정적인 선율","절정 뒤 지쳐 가라앉는 마무리"]},
  {"id":"puccini-doretta","c":"puccini","t":"도레타의 아름다운 꿈","alias":"“제비” 1막","y":"1917","form":"오페라","dur":"약 3분","lv":2,"q":"Puccini Chi il bel sogno di Doretta","story":["파리 사교계의 여인 마그다가 모임에서 부르는 아리아입니다. 시인이 만든 노래를 마그다가 이어 부르며, 돈보다 사랑을 택한 소녀 도레타의 이야기를 들려줍니다.","오페라 “제비”는 자주 공연되지 않지만 이 아리아는 리사이틀 단골곡입니다."],"points":["피아노 반주로 시작하는 살롱 분위기","꿈꾸듯 떠오르는 소프라노 선율","높이 뻗는 마지막 고음"]},
  {"id":"mahler-adagietto","c":"mahler","t":"교향곡 5번 중 아다지에토","alias":"4악장","y":"1901–02","form":"교향곡","dur":"약 11분","lv":1,"q":"Mahler Symphony No 5 Adagietto","story":["현악기와 하프만으로 연주하는 느린 악장입니다. 말러가 나중에 아내가 될 알마에게 보낸 사랑의 편지라는 설이 유명합니다.","영화 “베니스에서의 죽음”(1971)에 쓰이며 말러의 가장 유명한 곡이 되었습니다."],"points":["하프의 고요한 분산화음","현악기가 숨을 길게 이어가는 선율","중간의 간절한 클라이맥스"]},
  {"id":"mahler-titan","c":"mahler","t":"교향곡 1번 “거인”","alias":"D장조","y":"1888","form":"교향곡","dur":"약 55분","lv":2,"q":"Mahler Symphony No 1 Titan","story":["20대 후반에 완성한 첫 교향곡입니다. “거인”이라는 제목은 장 파울의 소설에서 따왔다가 나중에 말러 스스로 지웠습니다.","자신의 가곡 “방랑하는 젊은이의 노래” 선율이 곳곳에 쓰였고, 3악장에는 프랑스 동요 “자크 형제”를 단조로 바꾼 장송 행진곡이 나옵니다."],"points":["1악장 시작: 아주 높은 현의 지속음 = 새벽 안개, 뻐꾸기 소리","3악장: 콘트라베이스 독주로 시작하는 단조 동요 장송 행진","4악장: 폭풍 같은 시작과 호른이 일어서는 승리의 끝"]},
  {"id":"mahler-resurrection","c":"mahler","t":"교향곡 2번 “부활”","alias":"c단조","y":"1894","form":"교향곡","dur":"약 80분","lv":3,"q":"Mahler Symphony No 2 Resurrection finale","story":["지휘자 한스 폰 뷜로의 장례식에서 클롭슈토크의 찬가 “부활”이 합창으로 불리는 것을 듣고 마지막 악장의 실마리를 얻었습니다.","1악장의 장례식에서 시작해 마지막에는 합창과 오르간이 부활을 노래하는 거대한 구원의 드라마입니다."],"points":["1악장: 첼로와 베이스의 거친 외침 = 장례식","4악장 “원광”: 알토 독창의 고요한 기도","5악장 끝: 합창과 오르간, 종소리가 터지는 부활"]},
  {"id":"mahler-erde","c":"mahler","t":"대지의 노래","alias":"","y":"1908–09","form":"가곡","dur":"약 63분","lv":3,"q":"Mahler Das Lied von der Erde Der Abschied","story":["당나라 시인 이백, 맹호연, 왕유 등의 시를 독일어로 옮긴 시집에서 가사를 가져온 6악장의 “노래 교향곡”입니다.","딸을 잃고 심장병 진단을 받은 해에 썼습니다. 9번째 교향곡을 쓰면 죽는다는 징크스를 두려워해 번호를 붙이지 않았다는 이야기가 전해집니다."],"points":["1악장: 테너가 부르는 술 노래의 격정","4악장: 젊은 여인들과 말 타고 달리는 젊은이","6악장 “고별”: 끝없이 반복되며 사라지는 “영원히”"]},
  {"id":"mahler-sym4","c":"mahler","t":"교향곡 4번","alias":"G장조","y":"1900","form":"교향곡","dur":"약 55분","lv":2,"q":"Mahler Symphony No 4","story":["말러 교향곡 중 가장 짧고 밝아 입문곡으로 자주 추천됩니다. 썰매 방울 소리로 시작합니다.","마지막 악장에서 소프라노가 아이의 눈으로 본 천국의 모습을 노래합니다(독일 민요 시집 “소년의 마술 뿔피리”)."],"points":["시작: 썰매 방울 소리","2악장: 일부러 음을 높게 조율한 바이올린 = 죽음의 신이 켜는 바이올린","4악장: 소프라노가 그리는 천국의 소박한 풍경"]},
  {"id":"mahler-rueckert","c":"mahler","t":"나는 세상에서 잊혀지고","alias":"뤼케르트 가곡 중","y":"1901","form":"가곡","dur":"약 7분","lv":2,"q":"Mahler Ich bin der Welt abhanden gekommen","story":["뤼케르트의 시에 붙인 가곡 5곡 중 하나입니다. 세상의 소란에서 벗어나 자신만의 고요한 세계로 들어가는 마음을 노래합니다.","말러는 이 곡을 두고 “바로 나 자신”이라고 말했다고 전해집니다. 같은 시기에 쓴 5번 교향곡의 아다지에토와 분위기가 닮았습니다."],"points":["잉글리시 호른이 여는 고요한 서주","느리게 숨 쉬듯 이어지는 노래","마지막: 모든 소리가 사라지는 평화"]},
  {"id":"mahler-sym9","c":"mahler","t":"교향곡 9번","alias":"D장조","y":"1909–10","form":"교향곡","dur":"약 80분","lv":3,"q":"Mahler Symphony No 9 finale","story":["말러가 완성한 마지막 교향곡입니다. 초연은 그가 세상을 떠난 뒤 1912년 제자 브루노 발터의 지휘로 이루어졌습니다.","삶에 대한 이별이라는 해석이 많습니다. 지휘자 번스타인은 이 곡을 깊이 사랑해 여러 번 녹음했습니다."],"points":["1악장: 불규칙한 심장 박동 같은 시작","3악장: 비틀거리는 듯한 격렬한 론도","4악장 끝: 현악기가 거의 들리지 않을 만큼 사라지는 마지막"]},
  {"id":"mahler-wayfarer","c":"mahler","t":"방랑하는 젊은이의 노래","alias":"","y":"1884–85","form":"가곡","dur":"약 17분","lv":2,"q":"Mahler Songs of a Wayfarer","story":["20대 중반, 카셀에서 일하던 시절 소프라노 가수와의 실연을 겪고 직접 쓴 시에 붙인 4곡의 연가곡입니다.","두 번째 곡과 네 번째 곡의 선율은 교향곡 1번에 그대로 옮겨져 쓰였습니다."],"points":["2곡: 아침 들판을 걷는 상쾌한 선율 — 교향곡 1번 1악장과 같습니다","3곡: 가슴에 칼이 박힌 듯한 격정","4곡: 보리수 아래 잠드는 고요한 마무리"]},
  {"id":"mahler-tragic","c":"mahler","t":"교향곡 6번 “비극적”","alias":"a단조","y":"1903–04","form":"교향곡","dur":"약 80분","lv":3,"q":"Mahler Symphony No 6 Tragic","story":["말러의 삶이 가장 행복하던 시기에 쓴, 가장 어두운 교향곡입니다. 알마는 1악장의 두 번째 주제가 자신을 그린 것이라고 회고했습니다.","마지막 악장에는 커다란 나무 해머로 내려치는 소리가 나옵니다. 말러는 이를 운명의 타격이라 불렀다고 알려져 있습니다."],"points":["1악장: 군대 행진 같은 단호한 시작","팀파니 리듬과 함께 장조에서 단조로 꺾이는 “운명의 화음”","4악장: 나무 해머의 충격적인 타격"]},
  {"id":"mahler-kindertoten","c":"mahler","t":"죽은 아이를 그리는 노래","alias":"","y":"1901–04","form":"가곡","dur":"약 25분","lv":3,"q":"Mahler Kindertotenlieder","story":["두 자녀를 잃은 시인 뤼케르트가 쓴 시에 붙인 5곡의 연가곡입니다. 말러는 이 곡을 쓰고 몇 년 뒤인 1907년 실제로 큰딸을 잃었습니다.","알마는 이 곡이 불운을 불러왔다고 여겼다고 합니다. 깊은 슬픔을 절제된 소리로 담았습니다."],"points":["1곡: 해가 다시 떠오르는 아침의 담담한 슬픔","관악기 몇 개만 남는 투명한 오케스트라","5곡: 폭풍이 지나간 뒤 자장가처럼 끝나는 마무리"]},
  {"id":"debussy-clair","c":"debussy","t":"달빛","alias":"베르가마스크 모음곡 3번","y":"1890 / 1905","form":"피아노","dur":"약 5분","lv":1,"q":"Debussy Clair de Lune","story":["프랑스 시인 베를렌의 시 “달빛”에서 제목을 가져왔습니다. 1890년경 쓰기 시작했지만 드뷔시가 오랫동안 고쳐서 15년 뒤에야 출판했습니다.","베토벤의 “월광”이 달빛 속의 슬픔이라면, 드뷔시의 “달빛”은 달빛 그 자체 — 빛이 물에 번지는 장면을 소리로 그린 그림입니다."],"points":["처음: 박자가 흐릿하게 느껴질 만큼 자유롭게 떠다니는 화음","중간: 물결치듯 흐르는 분산화음 위로 떠오르는 선율","소리가 커질 때보다 작아질 때의 아름다움에 귀 기울여 보세요"]},
  {"id":"debussy-faune","c":"debussy","t":"목신의 오후에의 전주곡","alias":"L.86","y":"1894","form":"관현악","dur":"약 10분","lv":3,"q":"Debussy Prelude a l apres-midi d un faune","story":["시인 말라르메의 시를 바탕으로, 더운 여름 오후 반쯤 졸며 요정들을 꿈꾸는 목신(반인반수의 숲의 신)의 몽롱한 상태를 그린 곡입니다.","지휘자이자 작곡가 피에르 불레즈는 “현대 음악은 이 곡의 플루트 소리와 함께 깨어났다”고 말했습니다. 20세기 음악의 출발점으로 꼽히는 곡입니다."],"points":["첫 소절: 반주 없이 혼자 나른하게 미끄러지는 플루트","하프와 호른이 만드는 아지랑이 같은 소리","뚜렷한 클라이맥스 없이 꿈처럼 왔다가 사라지는 흐름"]},
  {"id":"debussy-arabesque1","c":"debussy","t":"아라베스크 1번","alias":"E장조 · L.66-1","y":"1888–91","form":"피아노","dur":"약 5분","lv":1,"q":"Debussy Arabesque No 1","story":["20대의 드뷔시가 쓴 초기 피아노곡입니다. 아라베스크는 이슬람 건축의 덩굴무늬 장식을 뜻하는데, 드뷔시는 흐르는 곡선 같은 선율을 그 무늬에 빗댔습니다.","아직 인상주의 화성은 덜 드러나지만, 물 흐르듯 부드러운 피아노 소리에서 이미 드뷔시만의 색이 보입니다."],"points":["양손이 주고받는 셋잇단 음표의 물결","덩굴처럼 위아래로 감기는 선율","중간부의 약간 느려지는 몽환적인 부분"]},
  {"id":"debussy-children","c":"debussy","t":"어린이 차지","alias":"L.113","y":"1908","form":"피아노","dur":"약 16분","lv":1,"q":"Debussy Childrens Corner","story":["드뷔시가 세 살배기 딸 슈슈를 위해 쓴 6곡의 피아노 모음곡입니다. 악보에 “아빠의 다정한 사과와 함께”라는 헌사를 적었습니다.","피아노 연습곡을 비꼬는 “그라두스 아드 파르나숨 박사”, 코끼리 인형의 자장가, 눈송이의 춤 등 아이 방의 장면들을 그렸습니다."],"points":["1곡: 지겨운 피아노 연습을 흉내 내다 점점 딴청 피우는 장면","4곡 “눈송이가 춤춘다”: 창밖에 흩날리는 눈","마지막 곡: 재즈 래그타임 리듬의 장난기"]},
  {"id":"debussy-lamer","c":"debussy","t":"바다","alias":"L.109","y":"1905","form":"관현악","dur":"약 24분","lv":3,"q":"Debussy La Mer","story":["“바다의 새벽부터 정오까지”, “파도의 유희”, “바람과 바다의 대화”라는 세 장면으로 바다를 그린 교향적 스케치입니다.","초판 악보 표지에는 일본 화가 호쿠사이의 판화 “가나가와 해변의 높은 파도”가 실렸습니다. 드뷔시는 바다를 사랑해 선원이 되고 싶었다고 말하기도 했습니다."],"points":["1부: 어둠 속에서 서서히 빛이 퍼지는 새벽","2부: 하프와 목관악기가 그리는 반짝이는 물결","3부: 폭풍처럼 몰아치는 바람과 파도의 대결"]},
  {"id":"debussy-flaxen","c":"debussy","t":"아마빛 머리의 소녀","alias":"전주곡 1권 8번 · L.117-8","y":"1910","form":"피아노","dur":"약 3분","lv":1,"q":"Debussy La fille aux cheveux de lin","story":["드뷔시는 전주곡 24곡의 제목을 곡 맨 끝에 괄호로 적어, 먼저 소리를 듣고 나중에 제목을 떠올리게 했습니다.","르콩트 드 릴의 시에서 제목을 가져온 이 곡은 소박하고 맑은 5음 음계 선율로 순수한 소녀를 그립니다."],"points":["반주 없이 혼자 시작하는 단순한 선율","부드럽게 미끄러지는 화음","짧은 곡 안의 투명하고 고요한 분위기"]},
  {"id":"debussy-cathedral","c":"debussy","t":"가라앉은 성당","alias":"전주곡 1권 10번 · L.117-10","y":"1910","form":"피아노","dur":"약 6분","lv":2,"q":"Debussy La cathedrale engloutie","story":["프랑스 브르타뉴 지방의 전설 속 도시 “이스”를 그린 곡입니다. 바다에 가라앉은 성당이 맑은 날 아침이면 물 위로 떠올라 종소리와 성가가 들린다는 이야기입니다.","피아노의 가장 낮은 음과 높은 음을 함께 울려 물속에서 울리는 종소리를 표현했습니다."],"points":["안개 속에서 떠오르는 듯한 처음의 화음","성당이 물 위로 솟아오를 때의 장엄한 종소리","다시 물속으로 가라앉으며 희미해지는 끝"]},
  {"id":"debussy-reverie","c":"debussy","t":"꿈","alias":"L.68","y":"1890","form":"피아노","dur":"약 5분","lv":1,"q":"Debussy Reverie L 68","story":["젊은 시절 돈이 필요해 출판사에 판 초기 피아노 소품입니다. 드뷔시 본인은 나중에 이 곡을 대수롭지 않게 여겼다고 전해집니다.","하지만 꿈결 같은 선율 덕분에 지금은 드뷔시의 가장 사랑받는 피아노곡 중 하나가 되었습니다."],"points":["왼손의 잔잔한 분산화음","멀리서 들려오는 듯한 아련한 선율","중간부의 고조와 다시 찾아오는 고요"]},
  {"id":"debussy-fetes","c":"debussy","t":"녹턴 중 “축제”","alias":"L.91-2","y":"1899","form":"관현악","dur":"약 7분","lv":2,"q":"Debussy Nocturnes Fetes","story":["관현악 녹턴 3곡(구름, 축제, 사이렌) 중 두 번째 곡입니다. 드뷔시는 휘슬러의 그림 “녹턴”에서 영감을 받았다고 했습니다.","드뷔시는 이 곡이 대기 속에서 춤추는 축제의 빛과 리듬, 그리고 그 사이를 지나가는 행렬을 그린다고 설명했습니다."],"points":["시작: 현악기의 들뜬 리듬","멀리서 다가오는 행렬 — 약음기를 낀 트럼펫","행렬이 축제와 섞이며 커지는 클라이맥스"]},
  {"id":"debussy-pagodes","c":"debussy","t":"판화 중 “탑”","alias":"L.100-1","y":"1903","form":"피아노","dur":"약 5분","lv":2,"q":"Debussy Estampes Pagodes","story":["1889년 파리 만국박람회에서 들은 인도네시아 자바의 가믈란 음악의 영향이 가장 직접적으로 드러난 곡입니다.","피아노로 동양의 탑과 공(징)의 울림, 5음 음계의 이국적인 분위기를 그렸습니다."],"points":["5음 음계(피아노 검은건반 같은 음계)로 된 선율","징처럼 길게 울리는 저음","여러 층의 리듬이 겹치는 가믈란 같은 짜임"]},
  {"id":"sibelius-finlandia","c":"sibelius","t":"핀란디아","alias":"Op.26","y":"1899–1900","form":"관현악","dur":"약 8분","lv":1,"q":"Sibelius Finlandia","story":["러시아의 언론 탄압에 항의하는 행사를 위해 쓴 곡입니다. 러시아 당국의 검열을 피하려고 다른 제목으로 연주되기도 했다고 전해집니다.","중간의 찬가 선율은 나중에 가사가 붙어 “핀란디아 찬가”로 불리며 핀란드의 제2의 국가처럼 사랑받습니다."],"points":["시작: 금관악기의 무겁고 위협적인 화음 = 억압","빠른 부분: 투쟁의 리듬","중간: 목관악기가 부르는 고요하고 경건한 찬가"]},
  {"id":"sibelius-vc","c":"sibelius","t":"바이올린 협주곡","alias":"d단조 · Op.47","y":"1903–05","form":"협주곡","dur":"약 32분","lv":2,"q":"Sibelius Violin Concerto","story":["젊은 시절 바이올리니스트를 꿈꿨던 시벨리우스가 남긴 유일한 협주곡입니다. 초연이 좋지 않아 크게 고쳐 썼고, 수정판이 지금 연주됩니다.","20세기에 쓰인 바이올린 협주곡 중 가장 많이 연주되는 곡 중 하나입니다."],"points":["시작: 얼음 같은 현의 떨림 위로 떠오르는 바이올린","1악장 한가운데 놓인 긴 카덴차","3악장: 팀파니와 함께 쿵쿵 울리는 “북극곰의 폴로네즈”라는 별명의 리듬"]},
  {"id":"sibelius-sym2","c":"sibelius","t":"교향곡 2번","alias":"D장조 · Op.43","y":"1901–02","form":"교향곡","dur":"약 45분","lv":2,"q":"Sibelius Symphony No 2","story":["이탈리아에 머물며 쓰기 시작한 교향곡입니다. 시벨리우스 본인은 부인했지만, 핀란드 사람들은 이 곡을 독립을 향한 민족의 노래로 받아들였습니다.","조각난 동기들이 모여 점점 거대한 선율로 자라나는 방식이 특징입니다."],"points":["1악장: 현이 반복하는 물결 같은 화음과 목관의 짧은 선율","3악장에서 쉬지 않고 4악장으로 넘어가는 순간","4악장 끝: 금관이 울리는 장엄한 승리의 주제"]},
  {"id":"sibelius-valse","c":"sibelius","t":"슬픈 왈츠","alias":"Op.44-1","y":"1903–04","form":"관현악","dur":"약 5분","lv":1,"q":"Sibelius Valse triste","story":["처남이 쓴 연극 “쿠올레마(죽음)”를 위해 쓴 곡입니다. 병상의 여인이 꿈속에서 유령들과 왈츠를 추다 죽음이 문을 두드린다는 장면입니다.","시벨리우스는 이 곡의 판권을 헐값에 넘겨 큰 인기를 얻고도 돈은 거의 벌지 못했다고 합니다."],"points":["약음기를 낀 현악기의 희미한 왈츠","점점 빨라지며 열광하는 춤","갑자기 멈추는 춤 — 문을 두드리는 죽음"]},
  {"id":"sibelius-karelia","c":"sibelius","t":"카렐리야 모음곡","alias":"Op.11","y":"1893","form":"관현악","dur":"약 15분","lv":1,"q":"Sibelius Karelia Suite","story":["핀란드 동쪽 카렐리야 지방의 역사를 담은 연극을 위해 쓴 음악입니다. 카렐리야는 핀란드 서사시 “칼레발라”의 고향으로 여겨지는 곳입니다.","세 곡으로 된 모음곡으로, 특히 마지막 행진곡이 유명합니다."],"points":["1곡 “간주곡”: 멀리서 다가오는 호른과 행렬","2곡 “발라드”: 잉글리시 호른의 쓸쓸한 노래","3곡 “행진곡”: 경쾌하고 당당한 행진"]},
  {"id":"sibelius-swan","c":"sibelius","t":"투오넬라의 백조","alias":"레민카이넨 모음곡 중 · Op.22-2","y":"1895","form":"관현악","dur":"약 9분","lv":2,"q":"Sibelius The Swan of Tuonela","story":["핀란드 서사시 “칼레발라”에서 가져온 이야기입니다. 저승 “투오넬라”를 둘러싼 검은 강 위를 신성한 백조가 노래하며 떠다닙니다.","잉글리시 호른이 백조의 노래를 맡아 처음부터 끝까지 길게 이어갑니다."],"points":["잉글리시 호른 독주 = 백조의 노래","현악기의 어둡고 넓은 화음 = 검은 강","첼로 독주가 백조와 대화하는 장면"]},
  {"id":"sibelius-sym5","c":"sibelius","t":"교향곡 5번","alias":"E♭장조 · Op.82","y":"1915–19","form":"교향곡","dur":"약 32분","lv":2,"q":"Sibelius Symphony No 5 finale swan hymn","story":["50세 생일을 위해 썼다가 두 번이나 고쳐 1919년에야 완성했습니다. 1차 세계대전과 핀란드 독립의 시기입니다.","시벨리우스는 일기에 백조 16마리가 날아가는 것을 보고 큰 감동을 받았다고 적었는데, 그 장면이 4악장의 “백조의 찬가”가 되었습니다."],"points":["1악장: 호른의 부드러운 부름으로 열리는 시작","4악장: 호른이 흔드는 큰 종 같은 “백조의 찬가”","마지막: 사이를 두고 내리치는 여섯 번의 화음"]},
  {"id":"sibelius-festivo","c":"sibelius","t":"안단테 페스티보","alias":"JS 34","y":"1922","form":"관현악","dur":"약 5분","lv":1,"q":"Sibelius Andante Festivo","story":["원래 한 공장의 25주년 기념 행사를 위해 현악4중주로 쓴 곡입니다. 나중에 현악 오케스트라와 팀파니 편성으로 고쳤습니다.","1939년 시벨리우스가 직접 지휘해 라디오로 방송한 녹음이 남아 있으며, 그가 지휘한 몇 안 되는 녹음입니다. 핀란드에서는 국가적 추모 행사 때 자주 연주됩니다."],"points":["느리고 장엄한 현의 찬가","성가처럼 경건한 화음의 흐름","마지막에 팀파니와 함께 부풀어 오르는 화음"]},
  {"id":"sibelius-sym7","c":"sibelius","t":"교향곡 7번","alias":"C장조 · Op.105","y":"1924","form":"교향곡","dur":"약 22분","lv":3,"q":"Sibelius Symphony No 7","story":["시벨리우스의 마지막 교향곡으로, 악장 구분 없이 하나로 이어지는 단악장 교향곡입니다. 처음에는 “교향적 환상곡”이라는 이름으로 초연했습니다.","20분 남짓한 시간 안에 교향곡 전체가 압축되어 있고, 이후 그는 교향곡을 더 발표하지 않았습니다."],"points":["시작: 팀파니와 현이 계단처럼 올라가는 음계","트롬본의 장엄한 주제 — 곡 안에서 세 번 등장합니다","마지막: C장조 화음으로 맺는 거대한 해결"]},
  {"id":"sibelius-tapiola","c":"sibelius","t":"타피올라","alias":"Op.112","y":"1926","form":"관현악","dur":"약 18분","lv":3,"q":"Sibelius Tapiola","story":["“칼레발라”에 나오는 숲의 신 타피오의 영역을 그린 교향시로, 시벨리우스의 마지막 대규모 관현악곡입니다.","하나의 짧은 동기가 곡 전체를 끌고 가며 끝없이 이어진 북쪽 숲의 어둡고 신비로운 기운을 만듭니다."],"points":["시작: 현의 낮은 동기 = 깊은 숲","숲의 정령들이 속삭이는 목관","폭풍이 숲을 휘감는 현의 거대한 소용돌이"]},
  {"id":"rach-pc2","c":"rachmaninoff","t":"피아노 협주곡 2번","alias":"c단조 · Op.18","y":"1901","form":"협주곡","dur":"약 33분","lv":1,"q":"Rachmaninoff Piano Concerto 2","story":["교향곡 1번의 처참한 실패 후 우울증으로 작곡을 하지 못하던 라흐마니노프는 정신과 의사 니콜라이 달에게 치료를 받았습니다. 의사는 “당신은 훌륭한 협주곡을 쓰게 될 것”이라는 말을 반복해 들려주었다고 합니다.","자신감을 되찾고 완성한 이 곡은 대성공을 거두었고, 라흐마니노프는 이 곡을 달 박사에게 헌정했습니다. 수많은 영화와 대중음악에 인용된 곡입니다."],"points":["도입: 피아노 혼자 종소리처럼 점점 커지는 8개의 화음","1악장: 오케스트라가 거대한 주제를 노래하고 피아노는 물결처럼 감쌉니다","2악장: 플루트와 클라리넷이 부르는 꿈결 같은 선율"]},
  {"id":"rach-paganini","c":"rachmaninoff","t":"파가니니 주제에 의한 랩소디","alias":"18변주 · Op.43","y":"1934","form":"협주곡","dur":"약 3분(18변주)","lv":1,"q":"Rachmaninoff Rhapsody on a Theme of Paganini Variation 18","story":["리스트의 “라 캄파넬라”처럼, 이 곡도 파가니니의 바이올린 곡에서 주제를 가져왔습니다(파가니니 카프리스 24번). 미국 망명 중 스위스 별장에서 쓴 곡으로, 24개의 변주로 이루어져 있습니다.","가장 유명한 18변주는 파가니니의 주제를 거꾸로 뒤집고 느리게 늘린 것입니다. 라흐마니노프는 “이건 내 매니저를 위한 변주”라고 농담했다고 하는데, 그만큼 청중이 좋아할 줄 알았던 것이죠."],"points":["18변주 첫 소절: 피아노가 혼자 조용히 꺼내는 뒤집힌 주제","같은 선율을 오케스트라 전체가 이어받아 부풀어 오르는 순간","원래 주제(1번 변주 직후)와 비교해 들어보면 같은 재료라는 게 신기합니다"]},
  {"id":"rach-prelude-c#","c":"rachmaninoff","t":"전주곡 c#단조","alias":"Op.3-2","y":"1892","form":"피아노","dur":"약 4분","lv":1,"q":"Rachmaninoff Prelude in C sharp minor Op 3 No 2","story":["19세의 라흐마니노프가 쓴 곡으로, 발표되자마자 세계적인 인기를 얻었습니다. 하지만 판권을 출판사에 헐값에 넘겨 인세를 거의 받지 못했습니다.","연주회마다 청중이 이 곡을 앙코르로 요청해 라흐마니노프는 이 곡에 질려 버렸다고 합니다."],"points":["시작: 크렘린 종소리 같은 세 개의 무거운 음","중간부: 폭풍처럼 몰아치는 빠른 부분","마지막: 네 단으로 펼친 거대한 화음"]},
  {"id":"rach-vocalise","c":"rachmaninoff","t":"보칼리제","alias":"Op.34-14","y":"1915","form":"가곡","dur":"약 6분","lv":1,"q":"Rachmaninoff Vocalise","story":["가사 없이 “아” 같은 모음 하나로만 부르는 노래입니다. 소프라노 안토니나 네즈다노바에게 헌정했습니다.","가사가 없어서 바이올린, 첼로, 오케스트라 등 수많은 악기로 편곡되어 연주됩니다."],"points":["말 대신 목소리 자체로만 부르는 끝없이 이어지는 선율","느리게 내려앉는 반음계 화음","마지막 긴 숨의 고음"]},
  {"id":"rach-pc3","c":"rachmaninoff","t":"피아노 협주곡 3번","alias":"d단조 · Op.30","y":"1909","form":"협주곡","dur":"약 42분","lv":3,"q":"Rachmaninoff Piano Concerto No 3","story":["첫 미국 순회 연주를 위해 쓴 곡입니다. 미국으로 가는 배 위에서 소리가 나지 않는 연습용 건반으로 연습했다고 합니다.","피아노 협주곡 중 가장 어려운 곡 중 하나로 꼽히며, 영화 “샤인”(1996)의 소재가 되었습니다. 초연 몇 달 뒤 말러의 지휘로 뉴욕에서 다시 연주되었습니다."],"points":["시작: 피아노가 옥타브로 조용히 부르는 러시아 성가풍 선율","1악장 카덴차: 거대한 화음이 쏟아지는 장면","3악장 끝: 모든 주제가 모인 승리의 클라이맥스"]},
  {"id":"rach-sym2","c":"rachmaninoff","t":"교향곡 2번","alias":"e단조 · Op.27","y":"1907","form":"교향곡","dur":"약 60분","lv":2,"q":"Rachmaninoff Symphony No 2 Adagio","story":["교향곡 1번의 처참한 실패 후 10년 만에 쓴 교향곡으로, 이번에는 큰 성공을 거두었습니다.","3악장 아다지오에서 클라리넷이 길게 부르는 선율은 라흐마니노프의 가장 아름다운 선율 중 하나로 꼽힙니다."],"points":["1악장: 어둠 속에서 서서히 깨어나는 서주","3악장: 클라리넷 독주의 끝없는 노래","4악장: 축제처럼 밝은 피날레"]},
  {"id":"rach-isle","c":"rachmaninoff","t":"죽음의 섬","alias":"Op.29","y":"1909","form":"관현악","dur":"약 20분","lv":3,"q":"Rachmaninoff Isle of the Dead","story":["스위스 화가 뵈클린의 그림 “죽음의 섬”의 흑백 복제화를 보고 쓴 교향시입니다. 사공이 관을 실은 배를 저어 어두운 섬으로 향하는 장면입니다.","라흐마니노프는 나중에 컬러 원화를 보고는 “색이 있었다면 이 곡을 쓰지 않았을 것”이라고 말했다고 합니다."],"points":["5박자로 흔들리는 노 젓는 리듬","중세 장례 성가 “진노의 날” 선율이 숨어 있습니다","삶을 회상하는 듯한 중간의 격정"]},
  {"id":"rach-vespers","c":"rachmaninoff","t":"철야 기도 (만도)","alias":"“주여, 이제는 놓아주소서” · Op.37-5","y":"1915","form":"성악","dur":"약 4분","lv":2,"q":"Rachmaninoff All Night Vigil Nunc Dimittis","story":["러시아 정교회 철야 예배를 위한 무반주 합창곡입니다. 1차 세계대전 중 모스크바에서 초연되었습니다.","라흐마니노프는 5번 곡을 자신의 장례식에서 불러 주길 원했습니다. 마지막에 베이스가 아주 낮은 B♭음까지 내려가는 것으로 유명합니다."],"points":["악기 없이 사람 목소리만으로 만드는 깊은 울림","테너 독창의 따뜻한 기도","마지막 베이스의 초저음 하강"]},
  {"id":"rach-dances","c":"rachmaninoff","t":"교향적 무곡","alias":"Op.45","y":"1940","form":"관현악","dur":"약 35분","lv":3,"q":"Rachmaninoff Symphonic Dances","story":["미국 롱아일랜드에서 쓴 라흐마니노프의 마지막 작품입니다. 망명 이후 작곡이 크게 줄었던 그가 남긴 마지막 대작입니다.","1악장에서 알토 색소폰이 향수 어린 선율을 부르고, 마지막에는 실패했던 교향곡 1번의 주제를 조용히 인용합니다."],"points":["1악장: 알토 색소폰의 쓸쓸한 러시아풍 선율","2악장: 유령 같은 왈츠","3악장: “진노의 날”과 러시아 성가의 대결"]},
  {"id":"rach-prelude-g","c":"rachmaninoff","t":"전주곡 g단조","alias":"Op.23-5","y":"1901","form":"피아노","dur":"약 4분","lv":2,"q":"Rachmaninoff Prelude in G minor Op 23 No 5","story":["피아노 협주곡 2번으로 재기에 성공한 무렵 쓴 전주곡입니다. 군대 행진곡 같은 리듬으로 유명합니다.","라흐마니노프는 결국 모든 장조와 단조로 24곡의 전주곡을 완성했습니다."],"points":["행진곡 같은 날카로운 리듬","중간부: 갑자기 펼쳐지는 꿈결 같은 서정","행진이 다시 돌아오는 힘찬 마무리"]},
  {"id":"ravel-bolero","c":"ravel","t":"볼레로","alias":"M.81","y":"1928","form":"관현악","dur":"약 15분","lv":1,"q":"Ravel Bolero","story":["무용가 이다 루빈시테인의 발레를 위해 쓴 곡입니다. 스네어드럼이 처음부터 끝까지 같은 리듬을 반복하고, 두 개의 선율이 악기만 바꿔가며 계속 반복되면서 소리가 점점 커집니다.","라벨 본인은 이 곡을 “음악이 없는 오케스트라 작품”이라고 부르며 일종의 실험이라고 했는데, 정작 그의 가장 유명한 곡이 되었습니다."],"points":["스네어드럼의 같은 리듬이 15분 내내 이어집니다 — 끝까지 세어보세요","같은 선율을 플루트 → 클라리넷 → 바순 → … 악기가 바뀔 때마다 색깔이 바뀝니다","마지막 순간, 반복되던 조성이 갑자기 바뀌며 모든 것이 무너지는 결말"]},
  {"id":"ravel-pavane","c":"ravel","t":"죽은 왕녀를 위한 파반느","alias":"M.19","y":"1899","form":"피아노","dur":"약 6분","lv":1,"q":"Ravel Pavane pour une infante defunte","story":["파리 음악원 학생 시절에 쓴 피아노곡으로, 나중에 관현악으로도 편곡했습니다. 파반느는 16–17세기 궁정의 느린 춤입니다.","제목 때문에 슬픈 사연이 있을 것 같지만, 라벨은 단지 프랑스어 제목의 “소리가 좋아서” 지었다고 말했습니다. 옛 스페인 궁정에서 어린 공주가 추었을 법한 춤을 떠올린 곡입니다."],"points":["느리고 우아한 춤의 걸음걸이","첫 선율이 세 번 돌아오며 조금씩 다른 옷을 입습니다","관현악판에서는 호른이 부르는 첫 선율도 들어보세요"]},
  {"id":"ravel-concerto-g","c":"ravel","t":"피아노 협주곡","alias":"G장조 · M.83","y":"1931","form":"협주곡","dur":"약 22분","lv":2,"q":"Ravel Piano Concerto in G major","story":["미국 순회 연주 때 재즈에 매료된 라벨이 그 영향을 담아 쓴 협주곡입니다. 시작을 알리는 채찍 소리부터 블루스 화성까지 재즈의 색이 가득합니다.","라벨은 이 곡을 “모차르트와 생상스의 정신으로” 썼다고 말했습니다. 2악장은 피아노가 혼자 긴 선율을 이어가는 아름다운 악장입니다."],"points":["1악장 시작: 채찍 소리와 피콜로의 경쾌한 주제","2악장: 피아노 혼자 3분 가까이 이어가는 고요한 노래","3악장: 서커스 같은 질주"]},
  {"id":"ravel-lefthand","c":"ravel","t":"왼손을 위한 피아노 협주곡","alias":"D장조 · M.82","y":"1930","form":"협주곡","dur":"약 18분","lv":3,"q":"Ravel Piano Concerto for the Left Hand","story":["1차 세계대전에서 오른팔을 잃은 피아니스트 파울 비트겐슈타인(철학자 비트겐슈타인의 형)의 의뢰로 쓴 곡입니다.","왼손 하나로 두 손처럼 들리게 하는 놀라운 기법이 담겨 있습니다. 비트겐슈타인은 처음에 곡을 마음대로 고쳐 연주해 라벨과 갈등을 빚었습니다."],"points":["시작: 콘트라바순이 가장 낮은 곳에서 기어오르는 서주","왼손 혼자 연주하는 장엄한 카덴차","중간의 재즈풍 행진"]},
  {"id":"ravel-jeux","c":"ravel","t":"물의 유희","alias":"M.30","y":"1901","form":"피아노","dur":"약 5분","lv":2,"q":"Ravel Jeux d eau","story":["파리 음악원 학생 시절에 쓴 곡으로, 스승 포레에게 헌정했습니다. 분수와 폭포, 시냇물의 반짝임을 피아노로 그렸습니다.","리스트의 “에스테 별장의 분수”에서 영향을 받았으며, 드뷔시의 대표적 인상주의 피아노곡들보다 먼저 나와 새로운 피아노 음악의 문을 열었습니다."],"points":["높은 음역의 반짝이는 물방울 같은 음형","검은건반 글리산도 = 쏟아지는 물줄기","물소리 속에서 떠오르는 선율"]},
  {"id":"ravel-couperin","c":"ravel","t":"쿠프랭의 무덤","alias":"M.68","y":"1914–17","form":"피아노","dur":"약 25분","lv":2,"q":"Ravel Le Tombeau de Couperin","story":["18세기 프랑스 작곡가 쿠프랭과 바로크 춤곡에 바치는 모음곡입니다. 1차 세계대전 중 운전병으로 참전했던 라벨은 각 곡을 전사한 친구들에게 한 곡씩 헌정했습니다.","슬픈 헌사와 달리 음악은 밝고 우아합니다. “죽은 이들은 이미 영원한 침묵 속에서 충분히 슬프다”는 듯이."],"points":["1곡 프렐류드: 쉬지 않고 흐르는 16분음표","4곡 리고동: 경쾌한 바로크 춤","6곡 토카타: 손가락이 끊임없이 달리는 마무리"]},
  {"id":"ravel-daphnis","c":"ravel","t":"다프니스와 클로에 모음곡 2번","alias":"M.57","y":"1912","form":"발레","dur":"약 17분","lv":2,"q":"Ravel Daphnis et Chloe Suite No 2","story":["디아길레프의 발레단 “발레 뤼스”를 위해 쓴 발레 음악입니다. 고대 그리스 목동 다프니스와 클로에의 사랑 이야기를 그렸습니다.","모음곡 2번의 첫 곡 “해돋이”는 관현악으로 그린 가장 아름다운 새벽으로 꼽힙니다."],"points":["“해돋이”: 시냇물 소리 위로 떠오르는 해와 새소리","“팬터마임”: 긴 플루트 독주","“전원의 춤”: 합창까지 더해진 열광적인 마무리"]},
  {"id":"ravel-rapsodie","c":"ravel","t":"스페인 광시곡","alias":"M.54","y":"1907","form":"관현악","dur":"약 15분","lv":2,"q":"Ravel Rapsodie espagnole","story":["라벨의 어머니는 스페인 국경 근처 바스크 지방 출신으로, 어린 라벨에게 스페인 노래를 불러 주었습니다. 라벨의 첫 관현악 대작입니다.","실제로 스페인에 가 본 적 없이 썼지만, 스페인 작곡가 파야는 “놀랍도록 스페인답다”고 감탄했습니다."],"points":["1곡 “밤의 전주곡”: 4음짜리 신비로운 반복","3곡 “하바네라”: 나른한 춤 리듬","4곡 “축제”: 캐스터네츠와 탬버린이 터지는 축제"]},
  {"id":"ravel-lavalse","c":"ravel","t":"라 발스","alias":"M.72","y":"1920","form":"관현악","dur":"약 12분","lv":3,"q":"Ravel La Valse","story":["원래 디아길레프의 발레를 위해 썼지만, 디아길레프는 “걸작이지만 발레가 아니라 발레의 초상화”라며 거절했습니다.","19세기 빈 왈츠에 바치는 곡이지만, 1차 세계대전 직후에 쓰인 만큼 우아한 왈츠가 점점 일그러지며 파국으로 치닫습니다."],"points":["시작: 안개 속에서 왈츠의 조각들이 들려옵니다","화려한 무도회장이 펼쳐지는 장면","마지막: 왈츠가 소용돌이치며 무너지는 충격적인 끝"]},
  {"id":"ravel-pictures","c":"ravel","t":"전람회의 그림 (관현악 편곡)","alias":"무소륵스키 곡 · 라벨 편곡","y":"1922","form":"관현악","dur":"약 33분","lv":2,"q":"Mussorgsky Ravel Pictures at an Exhibition orchestra","story":["원곡은 러시아 작곡가 무소륵스키가 친구인 화가 하르트만의 유작 전시회를 보고 1874년에 쓴 피아노곡입니다.","지휘자 쿠세비츠키의 의뢰로 라벨이 관현악으로 편곡하면서 세계적인 명곡이 되었습니다. 라벨의 “오케스트라 마술사” 솜씨가 가장 잘 드러나는 작품입니다."],"points":["“프롬나드”: 그림 사이를 걸어가는 트럼펫 주제","“비드워(소달구지)”: 튜바 독주의 무거운 걸음","“키예프의 대문”: 종소리와 함께하는 장엄한 마지막"]},
  {"id":"stravinsky-firebird","c":"stravinsky","t":"불새 모음곡","alias":"1919년판","y":"1910","form":"발레","dur":"약 22분","lv":1,"q":"Stravinsky Firebird Suite 1919","story":["러시아 민담 속 불새와 왕자 이반, 악당 마왕 카셰이의 이야기를 그린 발레입니다. 원래 다른 작곡가에게 맡겼던 작품이 28세의 스트라빈스키에게 넘어왔습니다.","1910년 파리 초연으로 스트라빈스키는 하룻밤 사이에 유명해졌습니다. 그는 이 곡을 여러 번 모음곡으로 편집했는데, 1919년판이 가장 많이 연주됩니다."],"points":["“카셰이의 지옥의 춤”: 큰 타격으로 시작하는 격렬한 춤","“자장가”: 바순의 신비로운 선율","“피날레”: 호른의 선율이 점점 커지는 장엄한 마무리"]},
  {"id":"stravinsky-rite","c":"stravinsky","t":"봄의 제전","alias":"","y":"1913","form":"발레","dur":"약 33분","lv":3,"q":"Stravinsky The Rite of Spring","story":["고대 러시아의 이교도 부족이 봄의 신에게 처녀를 제물로 바치는 의식을 그린 발레입니다.","1913년 파리 초연 때 불협화음과 거친 리듬, 낯선 안무에 객석에서 야유와 고함이 터져 소동이 벌어졌습니다. 지금은 20세기 음악의 가장 중요한 작품 중 하나로 꼽힙니다."],"points":["시작: 바순이 아주 높은 음역에서 부르는 낯선 선율","“봄의 징조”: 같은 화음을 엇박으로 계속 내리치는 현","마지막 “희생의 춤”: 박자가 계속 바뀌는 격렬한 춤"]},
  {"id":"stravinsky-petrushka","c":"stravinsky","t":"페트루슈카","alias":"","y":"1911","form":"발레","dur":"약 34분","lv":2,"q":"Stravinsky Petrushka","story":["상트페테르부르크의 겨울 축제 시장에서 마술사가 꼭두각시 인형 셋에게 생명을 불어넣는 이야기입니다. 페트루슈카는 슬픈 광대 인형입니다.","두 개의 조성을 동시에 울리는 “페트루슈카 화음”이 유명합니다. 원래는 피아노 협주곡으로 구상했던 곡이라 피아노가 활약합니다."],"points":["1장: 축제 시장의 시끌벅적한 군중","2장: 클라리넷 두 대가 서로 다른 조로 부르는 “페트루슈카 화음”","4장: 유모의 춤, 곰 조련사 등 축제의 장면들"]},
  {"id":"stravinsky-soldier","c":"stravinsky","t":"병사의 이야기","alias":"","y":"1918","form":"실내악","dur":"약 60분","lv":2,"q":"Stravinsky L Histoire du soldat","story":["1차 세계대전과 러시아 혁명으로 수입이 끊긴 시기, 작은 극단이 돌아다니며 공연할 수 있도록 7명의 연주자와 해설자를 위해 쓴 음악극입니다.","고향으로 가던 병사가 바이올린을 악마에게 팔아넘기는 러시아 민담입니다. 재즈와 탱고, 래그타임의 영향이 보입니다."],"points":["“병사의 행진”: 콘트라베이스와 트롬본의 행진","“탱고·왈츠·래그타임”: 춤곡 세 개가 이어지는 장면","“악마의 승리의 행진”: 타악기만 남는 마무리"]},
  {"id":"stravinsky-pulcinella","c":"stravinsky","t":"풀치넬라 모음곡","alias":"","y":"1920","form":"발레","dur":"약 23분","lv":2,"q":"Stravinsky Pulcinella Suite","story":["디아길레프가 18세기 이탈리아 음악(당시 페르골레시의 곡으로 알려진 곡들)을 가져와 발레로 편곡해 달라고 맡긴 작품입니다.","옛 음악에 현대적인 화성과 리듬을 입히면서 스트라빈스키의 “신고전주의” 시대가 시작되었습니다. 그는 이 곡을 두고 “과거의 발견”이라고 말했습니다."],"points":["“신포니아”: 바로크 음악처럼 시작하는 첫 곡","“세레나타”: 오보에의 우아한 노래","“바리아치오네”: 트롬본과 콘트라베이스의 익살스러운 2중주"]},
  {"id":"stravinsky-psalms","c":"stravinsky","t":"시편 교향곡","alias":"","y":"1930","form":"성악","dur":"약 22분","lv":3,"q":"Stravinsky Symphony of Psalms","story":["보스턴 교향악단 창립 50주년을 위해 쓴 곡입니다. 스트라빈스키는 악보에 “하느님의 영광과 보스턴 교향악단에 바친다”고 적었습니다.","구약 성경의 시편을 라틴어로 노래하는 합창 교향곡으로, 오케스트라에서 바이올린과 비올라를 빼서 차갑고 투명한 소리를 만듭니다."],"points":["1악장: 쿵 하고 울리는 “시편 화음”","2악장: 목관악기의 이중 푸가","3악장 끝: 거의 멈춘 듯한 “할렐루야”와 찬양"]},
  {"id":"stravinsky-sym3","c":"stravinsky","t":"3악장의 교향곡","alias":"","y":"1945","form":"교향곡","dur":"약 22분","lv":3,"q":"Stravinsky Symphony in Three Movements","story":["2차 세계대전 중 미국에서 쓴 교향곡입니다. 스트라빈스키는 이 곡에 전쟁 뉴스 영화의 장면들이 반영되었다고 말했습니다.","피아노와 하프가 각각 협주곡처럼 활약하는 독특한 교향곡입니다."],"points":["1악장: 피아노가 강하게 리듬을 이끄는 시작","2악장: 하프가 중심인 고요한 간주","3악장: 행진과 푸가가 섞인 격렬한 마무리"]},
  {"id":"stravinsky-ebony","c":"stravinsky","t":"에보니 협주곡","alias":"","y":"1945","form":"협주곡","dur":"약 11분","lv":2,"q":"Stravinsky Ebony Concerto","story":["재즈 클라리네티스트 우디 허먼과 그의 빅밴드를 위해 쓴 곡입니다. “에보니(흑단)”는 클라리넷을 만드는 나무 이름입니다.","클래식 작곡가가 재즈 빅밴드를 위해 정식으로 쓴 협주곡이라는 점에서 특별합니다."],"points":["1악장: 클라리넷과 빅밴드의 재즈 리듬","2악장: 블루스풍의 느린 선율","3악장: 주제와 변주의 경쾌한 마무리"]},
  {"id":"stravinsky-dumbarton","c":"stravinsky","t":"덤바턴 오크스 협주곡","alias":"E♭조","y":"1937–38","form":"협주곡","dur":"약 15분","lv":2,"q":"Stravinsky Dumbarton Oaks Concerto","story":["미국 워싱턴의 덤바턴 오크스 저택에 사는 부부가 결혼 30주년을 기념해 의뢰한 곡입니다.","15명 정도의 작은 실내 오케스트라를 위한 곡으로, 스트라빈스키는 바흐의 “브란덴부르크 협주곡”을 즐겨 연구하던 중 이 곡을 썼다고 말했습니다."],"points":["1악장: 바흐 협주곡 같은 끊임없는 리듬","2악장: 섬세한 실내악의 대화","3악장: 현이 반복하는 경쾌한 화음"]},
  {"id":"stravinsky-circus","c":"stravinsky","t":"서커스 폴카","alias":"","y":"1942","form":"관현악","dur":"약 4분","lv":1,"q":"Stravinsky Circus Polka","story":["안무가 발란신의 의뢰로 쓴 곡입니다. 미국의 링링 브라더스 서커스에서 코끼리 50마리가 발레복을 입고 춤추는 공연에 쓰였습니다.","곡 마지막에 슈베르트의 “군대 행진곡” 선율을 비틀어 인용해 웃음을 줍니다."],"points":["어색하게 엇갈리는 폴카 리듬 = 코끼리의 발걸음","관악기의 익살스러운 선율","마지막: 슈베르트 “군대 행진곡”의 우스꽝스러운 인용"]},
  {"id":"gershwin-rhapsody","c":"gershwin","t":"랩소디 인 블루","alias":"","y":"1924","form":"협주곡","dur":"약 16분","lv":1,"q":"Gershwin Rhapsody in Blue","story":["밴드 리더 폴 화이트먼이 “현대 음악의 실험” 연주회를 열면서 거슈윈에게 곡을 맡겼다는 소식을 신문에서 보고 알았다고 전해집니다. 남은 기간은 몇 주뿐이었습니다.","보스턴행 기차의 덜컹거리는 소리에서 곡의 구조가 떠올랐다고 합니다. 원래는 재즈 밴드와 피아노를 위한 곡이었고 편곡은 퍼디 그로페가 맡았습니다."],"points":["시작: 클라리넷이 길게 미끄러져 올라가는 글리산도","재즈 리듬의 피아노 독주","중간의 넓고 낭만적인 선율 — 뉴욕의 꿈"]},
  {"id":"gershwin-american","c":"gershwin","t":"파리의 아메리칸","alias":"","y":"1928","form":"관현악","dur":"약 17분","lv":1,"q":"Gershwin An American in Paris","story":["파리를 여행하며 쓴 교향시로, 파리의 거리를 걸어 다니는 미국인의 하루를 그렸습니다.","거슈윈은 파리에서 실제 택시 경적을 사 와서 오케스트라에 넣었습니다. 1951년 같은 제목의 뮤지컬 영화가 아카데미 작품상을 받았습니다."],"points":["시작: 경쾌하게 걷는 산책 주제","택시 경적이 울리는 혼잡한 거리","트럼펫의 블루스 — 고향이 그리운 마음"]},
  {"id":"gershwin-summertime","c":"gershwin","t":"서머타임","alias":"“포기와 베스” 1막","y":"1935","form":"오페라","dur":"약 3분","lv":1,"q":"Gershwin Summertime Porgy and Bess","story":["미국 남부 흑인 마을을 배경으로 한 오페라 “포기와 베스”의 첫 곡입니다. 클래라라는 젊은 엄마가 아기에게 불러 주는 자장가입니다.","오페라 아리아이면서도 재즈 스탠더드가 되어 엘라 피츠제럴드, 마일스 데이비스 등 수많은 음악가가 다시 불렀습니다."],"points":["나른한 여름날 같은 느린 블루스","흑인 영가와 재즈의 색이 섞인 화음","부드럽게 흔들리는 자장가 리듬"]},
  {"id":"gershwin-concerto","c":"gershwin","t":"피아노 협주곡","alias":"F조","y":"1925","form":"협주곡","dur":"약 32분","lv":2,"q":"Gershwin Concerto in F","story":["“랩소디 인 블루”의 성공 뒤 뉴욕 심포니의 의뢰로 쓴 곡입니다. 이번에는 오케스트라 편곡까지 거슈윈이 직접 했습니다.","클래식 협주곡의 3악장 형식에 찰스턴 같은 재즈 춤 리듬과 블루스를 담았습니다."],"points":["1악장: 팀파니로 시작하는 찰스턴 리듬","2악장: 약음기 낀 트럼펫의 블루스","3악장: 기관총처럼 빠른 리듬의 피날레"]},
  {"id":"gershwin-preludes","c":"gershwin","t":"피아노를 위한 3개의 전주곡","alias":"","y":"1926","form":"피아노","dur":"약 7분","lv":1,"q":"Gershwin Three Preludes","story":["거슈윈이 직접 연주회에서 초연한 짧은 피아노곡 세 곡입니다. 쇼팽의 전주곡처럼 짧은 곡 안에 하나의 분위기를 담았습니다.","재즈와 블루스, 라틴 리듬이 섞여 있어 클래식 피아니스트와 재즈 피아니스트 모두가 즐겨 연주합니다."],"points":["1번: 탱고 같은 리듬의 경쾌한 곡","2번: 느릿한 블루스 — 거슈윈은 “블루스 자장가”라고 불렀습니다","3번: 짧고 화끈한 마무리"]},
  {"id":"gershwin-cuban","c":"gershwin","t":"쿠바 서곡","alias":"","y":"1932","form":"관현악","dur":"약 10분","lv":2,"q":"Gershwin Cuban Overture","story":["쿠바 아바나에서 2주간 휴가를 보내며 들은 룸바 음악에 매료되어 쓴 곡입니다.","악보에 마라카스, 클라베스, 봉고 같은 쿠바 타악기를 지휘자 바로 앞에 놓으라고 적었습니다."],"points":["쿠바 타악기들이 만드는 룸바 리듬","중간의 느리고 관능적인 부분","다시 돌아오는 축제의 리듬"]},
  {"id":"gershwin-rhythm","c":"gershwin","t":"I Got Rhythm 변주곡","alias":"","y":"1934","form":"협주곡","dur":"약 9분","lv":2,"q":"Gershwin I Got Rhythm Variations","story":["거슈윈의 뮤지컬 히트곡 “I Got Rhythm”의 선율을 주제로 쓴 피아노와 오케스트라를 위한 변주곡입니다. 형 아이라에게 헌정했습니다.","이 노래의 코드 진행은 재즈 음악가들 사이에서 “리듬 체인지”라 불리며 수많은 재즈 곡의 뼈대가 되었습니다."],"points":["시작: 클라리넷이 제시하는 짧은 주제","왈츠, 중국풍, 재즈 등으로 변하는 변주들","피아노와 오케스트라가 함께 질주하는 마지막"]},
  {"id":"gershwin-someone","c":"gershwin","t":"Someone to Watch Over Me","alias":"뮤지컬 “Oh, Kay!” 중","y":"1926","form":"가곡","dur":"약 4분","lv":1,"q":"Gershwin Someone to Watch Over Me","story":["거슈윈이 작곡하고 형 아이라가 가사를 쓴 뮤지컬 노래입니다. 처음엔 빠른 곡으로 썼다가 느리게 바꾸었더니 훨씬 좋아졌다고 합니다.","나를 지켜 줄 누군가를 기다리는 노래로, 프랭크 시나트라 등 수많은 가수가 불러 재즈 스탠더드가 되었습니다."],"points":["느리고 부드러운 발라드 선율","블루스 화음의 따뜻한 반주","그리움이 담긴 마지막 구절"]},
  {"id":"gershwin-manilove","c":"gershwin","t":"The Man I Love","alias":"","y":"1924","form":"가곡","dur":"약 4분","lv":1,"q":"Gershwin The Man I Love","story":["원래 뮤지컬에 넣었다가 몇 번이나 빠진 노래입니다. 그런데도 영국과 미국에서 따로 인기를 얻어 거슈윈의 대표곡이 되었습니다.","선율이 반음씩 내려가는 화음 위에서 반복되며, 사랑할 사람을 기다리는 마음을 그립니다."],"points":["조용하게 반복되는 단순한 선율","그 아래에서 반음씩 내려가는 화음","재즈 연주자마다 다르게 바꾸는 즉흥의 재미"]},
  {"id":"gershwin-lullaby","c":"gershwin","t":"현악4중주를 위한 자장가","alias":"","y":"1919–20","form":"실내악","dur":"약 8분","lv":2,"q":"Gershwin Lullaby for string quartet","story":["20대 초반, 화성학을 공부하던 시절 연습 삼아 쓴 곡입니다. 생전에 출판되지 않고 친구들 사이에서만 연주되다 그가 세상을 떠난 뒤 알려졌습니다.","거슈윈이 클래식 작곡을 진지하게 공부했다는 것을 보여 주는 작품으로, 블루스의 화성이 부드럽게 스며 있습니다."],"points":["약음기 낀 현악기의 부드러운 소리","하모닉스(유리처럼 맑은 고음)로 연주하는 첫 화음","블루스 느낌의 선율이 은은하게 흐르는 중간부"]}

<script>
(function(){
const ERA = {}; DATA.eras.forEach(e => ERA[e.id] = e);
const COMP = {}; DATA.composers.forEach(c => COMP[c.id] = c);
const PIECE = {}; DATA.pieces.forEach(p => PIECE[p.id] = p);
const COURSE_ORDER = DATA.course.flatMap(w => w.ids);

const S = { videos:{}, listened:{}, notes:{}, hasApiKey:false };
const view = document.getElementById('view');
const dock = document.getElementById('dock');
let route = { v:'home' }, stack = [], libFilter = { q:'', era:'', form:'', lv:'' };

/* ---------- 서버 호출 (GAS 밖에서 열면 브라우저 저장소로 동작) ---------- */
const isGAS = typeof google !== 'undefined' && google.script && google.script.run;
const LS = {
  get(k, d){ try { const v = localStorage.getItem('cw_'+k); return v ? JSON.parse(v) : (d === undefined ? {} : d); } catch(e){ return d === undefined ? {} : d; } },
  set(k,v){ try { localStorage.setItem('cw_'+k, JSON.stringify(v)); } catch(e){} }
};
const Mock = {
  getState(){ return { videos:LS.get('videos'), listened:LS.get('listened'), notes:LS.get('notes'), hasApiKey:false }; },
  setListened(id,on){ const m=LS.get('listened'); if(on) m[id]=new Date().toISOString().slice(0,10); else delete m[id]; LS.set('listened',m); return m; },
  saveNote(id,t){ const m=LS.get('notes'); if(t) m[id]=t; else delete m[id]; LS.set('notes',m); return true; },
  saveVideo(id,u){ const v=parseId(u); if(!v) throw new Error('유튜브 링크를 인식하지 못했어요.'); const m=LS.get('videos'); m[id]=v; LS.set('videos',m); return v; },
  clearVideo(id){ const m=LS.get('videos'); delete m[id]; LS.set('videos',m); return true; },
  findVideo(id){ return LS.get('videos')[id] || null; }
};
function parseId(s){ s=String(s||'').trim(); if(/^[\w-]{11}$/.test(s)) return s; const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/); return m?m[1]:null; }
/* 휴대폰 앱(설치형)에서는 Apps Script API로 기록을 주고받음 */
const API_ID = (typeof window.CW_API === 'string' && window.CW_API) || '';
const API_URL = 'https:/' + '/script.google.com/macros/s/' + API_ID + '/exec';
const APP_MODE = !isGAS;
let KEY = APP_MODE ? LS.get('key', '') : '';
if (APP_MODE) {
  const km = (location.hash || '').match(/k=([A-Za-z0-9]+)/);
  if (km) { KEY = km[1]; LS.set('key', KEY); try { history.replaceState(null, '', location.pathname); } catch(e){} }
}
const BACKEND = isGAS ? 'gas' : (KEY && API_ID ? 'api' : 'local');
function call(fn, ...args){
  if (BACKEND === 'gas') return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  if (BACKEND === 'api') {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: KEY, fn, args }) })
      .then(r => r.json())
      .then(j => { if (!j.ok) throw new Error(j.error || '서버 오류'); return j.data; });
  }
  return new Promise((res, rej) => { try { res(Mock[fn](...args)); } catch(e){ rej(e); } });
}

/* ---------- 유틸 ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars = n => '★'.repeat(n) + '☆'.repeat(3-n);
const LV = {1:'입문',2:'중급',3:'도전'};
const YTB = 'https:/' + '/www.youtube.com';
const ytSearch = p => YTB + '/results?search_query=' + encodeURIComponent(p.q);
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2400); }
function doneCount(ids){ return ids.filter(id => S.listened[id]).length; }
function markListened(id){
  if (S.listened[id]) return;
  call('setListened', id, true).then(m => { S.listened = m; if (!Drive.active) refreshMarks(); }).catch(()=>{});
}
function refreshMarks(){ if (['home','me','library','composer'].includes(route.v)) render(); }

/* ---------- 설정 (해설 켜기/길이/속도) ---------- */
const SET = Object.assign({ narr:true, len:'mid', rate:1 }, LS.get('set'));
function saveSet(){ LS.set('set', SET); }
const LEN_LABEL = { short:'짧게', mid:'보통', long:'길게' };
const RATE_LABEL = { 0.9:'느리게', 1:'보통', 1.15:'빠르게' };

/* ---------- 나레이션 (음성 읽기) ---------- */
function clean(s){
  return String(s)
    .replace(/[“”"‘’'「」]/g,'')
    .replace(/→/g,', ').replace(/[·•]/g,', ').replace(/[★☆]/g,'').replace(/—/g,', ')
    .replace(/(\d{4})–(\d{2,4})/g,'$1년에서 $2년').replace(/–/g,'에서 ')
    .replace(/([A-Ga-g])#/g,'$1샵 ').replace(/([A-Ga-g])♭/g,'$1플랫 ')
    .replace(/Op\.(\d+)-(\d+)/g,'작품번호 $1의 $2').replace(/Op\.(\d+)/g,'작품번호 $1').replace(/K\.(\d+)/g,'쾨헬 $1')
    .replace(/\s+/g,' ').trim();
}
const ORD = ['첫째','둘째','셋째','넷째','다섯째'];
function pieceScript(p, len, lead){
  const c = COMP[p.c], out = [];
  out.push((lead || '') + c.full + '의 ' + p.t + '입니다.');
  out.push('이 곡의 이야기입니다.');
  p.story.forEach(s => out.push(s));
  if (len !== 'short') {
    out.push('듣기 포인트를 알려드릴게요.');
    p.points.forEach((x, i) => out.push(ORD[i] + ', ' + x + '.'));
  }
  if (len === 'long') {
    out.push('그 무렵 ' + c.name + '에 대해 조금 더 이야기해 볼게요.');
    out.push(c.why);
  }
  out.push('그럼, 들어보시죠.');
  return out.map(clean);
}
function composerScript(c){
  return [c.full + '. ' + c.tagline + '.'].concat(c.story, ['왜 이 시대에 이런 음악이었을까요?', c.why]).map(clean);
}

const Narrator = {
  ok: 'speechSynthesis' in window,
  voice: null, queue: [], idx: 0, token: 0, speaking: false, paused: false, onEnd: null, cur: '', owner: null,
  pickVoice(){
    if (!this.ok) return;
    const vs = speechSynthesis.getVoices();
    this.voice = vs.find(v => /^ko/i.test(v.lang) && /google/i.test(v.name)) || vs.find(v => /^ko/i.test(v.lang)) || null;
  },
  split(text){ return String(text).replace(/([.!?])\s+/g, '$1\n').split('\n').map(s => s.trim()).filter(Boolean); },
  speak(parts, onEnd, owner){
    if (!this.ok) { toast('이 브라우저는 음성 읽기를 지원하지 않아요'); onEnd && onEnd(); return; }
    this.stop();
    if (!this.voice) this.pickVoice();
    this.queue = parts.flatMap(p => this.split(p));
    this.idx = 0; this.onEnd = onEnd || null; this.owner = owner || null;
    this.speaking = true; this.paused = false;
    this._next(++this.token);
  },
  _next(tok){
    if (tok !== this.token) return;
    if (this.idx >= this.queue.length) {
      this.speaking = false; this.cur = '';
      const f = this.onEnd; this.onEnd = null; this.owner = null;
      notify(); f && f(); return;
    }
    const u = new SpeechSynthesisUtterance(this.queue[this.idx]);
    u.lang = 'ko-KR'; if (this.voice) u.voice = this.voice; u.rate = SET.rate;
    u.onend = () => { if (tok !== this.token) return; this.idx++; this._next(tok); };
    u.onerror = e => { if (tok !== this.token) return; if (e.error === 'interrupted' || e.error === 'canceled') return; this.idx++; this._next(tok); };
    this.cur = this.queue[this.idx];
    speechSynthesis.speak(u);
    notify();
  },
  pause(){ if (!this.speaking) return; this.token++; speechSynthesis.cancel(); this.speaking = false; this.paused = true; notify(); },
  resume(){ if (!this.paused) return; this.paused = false; this.speaking = true; this._next(++this.token); },
  stop(){ this.token++; if (this.ok) speechSynthesis.cancel(); this.speaking = false; this.paused = false; this.onEnd = null; this.cur = ''; this.owner = null; },
  busy(){ return this.speaking || this.paused; }
};
if (Narrator.ok) { Narrator.pickVoice(); speechSynthesis.onvoiceschanged = () => Narrator.pickVoice(); }

/* ---------- 유튜브 플레이어 (iframe + postMessage 직접 제어) ---------- */
const Player = {
  frame: null, ready: false, st: -1, piece: null, cands: [], ci: 0, wantPlay: false, primeGuard: false, readyP: null, watch: null, ping: null,
  ensure(){
    if (this.readyP) return this.readyP;
    this.readyP = new Promise(res => {
      this._res = res;
      const f = document.createElement('iframe');
      f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
      f.setAttribute('allowfullscreen', '');
      f.src = YTB + '/embed/?enablejsapi=1&playsinline=1&rel=0&modestbranding=1&origin=' + encodeURIComponent(location.origin);
      f.onload = () => this._listen();
      document.getElementById('ytPlayer').appendChild(f);
      this.frame = f;
    });
    return this.readyP;
  },
  _post(o){ try { this.frame.contentWindow.postMessage(JSON.stringify(Object.assign({ id: 1, channel: 'widget' }, o)), '*'); } catch(e){} },
  _listen(){
    let n = 0; clearInterval(this.ping);
    this.ping = setInterval(() => {
      if (this.ready || ++n > 60) { clearInterval(this.ping); if (!this.ready) toast('플레이어를 불러오지 못했어요. 새로고침해 주세요.'); return; }
      this._post({ event: 'listening' });
    }, 250);
  },
  _msg(e){
    if (!/^https:.{2}(www\.)?youtube(-nocookie)?\.com$/.test(e.origin || '')) return;
    let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch(err){ return; }
    if (!d || !d.event) return;
    if (d.event === 'onReady' || (d.event === 'initialDelivery' && !this.ready)) {
      if (!this.ready) { this.ready = true; clearInterval(this.ping); this._res && this._res(); notify(); }
    } else if (d.event === 'onStateChange') {
      this._state(d.info);
    } else if (d.event === 'infoDelivery' && d.info && typeof d.info.playerState === 'number') {
      if (d.info.playerState !== this.st) this._state(d.info.playerState);
    } else if (d.event === 'onError') {
      this._error(d.info);
    }
  },
  cmd(func, args){ this._post({ event: 'command', func, args: args || [] }); },
  candidates(p){ return [...new Set([S.videos[p.id]].concat((DATA.videos || {})[p.id] || []).filter(Boolean))]; },
  load(p, autoplay){
    this.piece = p; this.cands = this.candidates(p); this.ci = 0; this.wantPlay = !!autoplay;
    setDockInfo(p);
    if (!this.cands.length) { toast('이 곡은 등록된 영상이 없어요'); return false; }
    this._loadCur();
    return true;
  },
  _loadCur(){
    const id = this.cands[this.ci];
    this.st = -1;
    this.cmd(this.wantPlay ? 'loadVideoById' : 'cueVideoById', [{ videoId: id }]);
  },
  _error(){
    if (this.ci < this.cands.length - 1) { this.ci++; this._loadCur(); return; }
    toast('재생 가능한 영상을 찾지 못했어요');
    if (Drive.started) setTimeout(() => Drive.next(), 1500);
  },
  _state(s){
    if (s === this.st) return;
    this.st = s;
    if (s === 1 && this.primeGuard) { this.primeGuard = false; this.cmd('pauseVideo'); this.cmd('unMute'); this.wantPlay = false; }
    if (s === 1) { Drive.needTap = false; }
    if (s === 0) { const p = this.piece; this.wantPlay = false; if (p) markListened(p.id); if (Drive.started) setTimeout(() => Drive.next(), 300); }
    notify();
  },
  mute(){ this.cmd('mute'); },
  play(){
    if (!this.frame) return;
    this.primeGuard = false; this.wantPlay = true;
    this.cmd('unMute'); this.cmd('playVideo');
    clearTimeout(this.watch);
    this.watch = setTimeout(() => {
      if (this.wantPlay && this.st !== 1 && this.st !== 3) { Drive.needTap = true; notify(); }
    }, 3500);
  },
  pause(){ this.wantPlay = false; this.cmd('pauseVideo'); },
  state(){ return this.st; },
  isPlaying(){ return this.st === 1; },
  currentId(){ return this.cands[this.ci]; }
};
window.addEventListener('message', e => Player._msg(e));

/* ---------- 라우팅 (앱에서는 휴대폰 뒤로가기 버튼과 연동) ---------- */
const NAV = APP_MODE && !!(window.history && history.pushState);
const DETAIL = ['piece', 'composer'];
let exitArmed = false;
window.go = function(v, id, opts){
  const tab = opts && opts.tab;
  if (NAV) {
    const st = { v, id: id || null };
    if (tab && route.v !== 'home') history.replaceState(st, '');
    else history.pushState(st, '');
  } else if (!tab) {
    stack.push(route);
  } else {
    stack = [];
  }
  route = { v, id };
  render();
  window.scrollTo(0,0);
};
window.back = function(){
  if (NAV) { history.back(); return; }
  route = stack.pop() || { v:'home' }; render(); window.scrollTo(0,0);
};
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.v === route.v) { window.scrollTo(0,0); return; }
  if (NAV && b.dataset.v === 'home') { history.replaceState({ v:'home', id:null }, ''); route = { v:'home' }; render(); window.scrollTo(0,0); return; }
  go(b.dataset.v, null, { tab:true });
});
if (NAV) {
  history.replaceState({ root: true }, '');
  history.pushState({ v: 'home', id: null }, '');
  window.addEventListener('popstate', e => {
    const s = e.state || {};
    if (Drive.active && !s.drive) Drive.close(true);
    if (s.root) {
      if (exitArmed) { history.back(); return; }
      exitArmed = true;
      toast('뒤로 버튼을 한 번 더 누르면 종료됩니다');
      setTimeout(() => { exitArmed = false; }, 2200);
      history.pushState({ v: 'home', id: null }, '');
      if (route.v !== 'home') { route = { v: 'home' }; render(); }
      return;
    }
    if (s.drive) return;
    if (s.v && (s.v !== route.v || s.id !== (route.id || null))) { route = { v: s.v, id: s.id }; render(); window.scrollTo(0,0); }
  });
}

function render(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on',
    b.dataset.v === route.v || (route.v==='composer' && b.dataset.v==='composers') || (route.v==='piece' && b.dataset.v==='library')));
  const fn = { home:vHome, eras:vEras, composers:vComposers, composer:vComposer, library:vLibrary, piece:vPiece, me:vMe }[route.v] || vHome;
  view.innerHTML = fn(route.id);
  if (route.v === 'piece') bindPiece(route.id);
  if (route.v === 'library') bindLibrary();
  if (route.v === 'composer') bindComposer(route.id);
  notify();
}
const backBtn = () => (NAV ? DETAIL.includes(route.v) : stack.length) ? '<button class="back" onclick="back()">← 뒤로</button>' : '';

function bindPiece(id){
  const p = PIECE[id], key = 'p-' + id;
  document.getElementById('playBtn').onclick = () => playPiece(p);
  document.getElementById('narrBtn').onclick = () => {
    if (Narrator.busy() && Narrator.owner === key) { Narrator.stop(); notify(); return; }
    const resume = Player.isPlaying(); if (resume) Player.pause();
    Narrator.speak(pieceScript(p, 'long', ''), () => { if (resume) Player.play(); }, key);
  };
  document.getElementById('swapLink').onclick = () => showFinder(p);
  document.getElementById('doneBtn').onclick = async () => {
    const on = !S.listened[id];
    S.listened = await call('setListened', id, on).catch(err => { toast('저장 실패: '+(err.message||err)); return S.listened; });
    if (on) toast('감상 기록에 추가했어요 🎵');
    render();
  };
  const note = document.getElementById('note'), st = document.getElementById('noteState');
  let h;
  note.addEventListener('input', () => {
    st.textContent = '입력 중…'; clearTimeout(h);
    h = setTimeout(async () => {
      const v = note.value.trim();
      try { await call('saveNote', id, v); if (v) S.notes[id] = v; else delete S.notes[id]; st.textContent = '저장됨 ✓'; }
      catch(e){ st.textContent = '저장 실패: ' + (e.message||e); }
    }, 900);
  });
}

function showFinder(p){
  const box = document.getElementById('finder'); if (!box) return;
  box.innerHTML = `<div class="finder">
      <b>원하는 연주 영상으로 바꾸기</b><br>
      ① <a href="${ytSearch(p)}" target="_blank" rel="noopener">유튜브에서 “${esc(p.q)}” 검색</a> → 마음에 드는 영상의 링크를 복사<br>
      ② 아래에 붙여넣고 저장하면 다음부터 그 영상으로 재생됩니다
      <div class="row"><input id="vurl" placeholder="유튜브 영상 링크 붙여넣기"><button class="btn" id="vsave">저장하고 듣기</button></div>
      ${S.videos[p.id] ? '<div style="margin-top:8px"><a href="javascript:void(0)" id="vreset">기본 영상으로 되돌리기</a></div>' : ''}
     </div>`;

  };

  if (r) r.onclick = async () => { await call('clearVideo', p.id).catch(()=>{}); delete S.videos[p.id]; box.innerHTML = ''; toast('기본 영상으로 되돌렸어요'); };
}

/* ---------- 드라이브 모드 ---------- */
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const Drive = {
  active: false, started: false, list: [], i: 0, label: '', needTap: false, lock: null,
  lists(){
    const firstUnheard = Math.max(0, COURSE_ORDER.findIndex(id => !S.listened[id]));
    const course = COURSE_ORDER.slice(firstUnheard).concat(COURSE_ORDER.slice(0, firstUnheard));
    return [
      { k:'course', label:'입문 코스 이어 듣기', sub: (firstUnheard + 1) + '번째 곡부터 · ' + PIECE[course[0]].t, ids: course, primary: true },
      { k:'all', label:'전체 곡 랜덤', sub: DATA.pieces.length + '곡을 섞어서', ids: shuffle(DATA.pieces.map(p => p.id)) }
    ].concat(DATA.eras.map(e => {
      const ids = DATA.pieces.filter(p => COMP[p.c].era === e.id).map(p => p.id);
      return { k: e.id, label: e.name, sub: e.years + ' · ' + ids.length + '곡', ids };
    })).concat([{ head: '작곡가별로 듣기' }]).concat(DATA.composers.map(c => {
      const ids = DATA.pieces.filter(p => p.c === c.id).map(p => p.id);
      return { k: 'c:' + c.id, label: c.name, sub: ids.length + '곡', ids };
    }).filter(l => l.ids.length));
  },
  open(){
    if (Narrator.busy()) Narrator.stop();
    this.active = true;
    if (NAV) history.pushState({ drive: true }, '');
    document.body.classList.add('drive');
    dock.classList.remove('hidden','min');
    this.render();
    Player.ensure().then(() => this.render());
    this.wake();
  },
  close(fromPop){
    if (NAV && !fromPop && history.state && history.state.drive) { history.back(); return; }
    Narrator.stop();
    this.active = false; this.started = false; this.needTap = false;
    document.body.classList.remove('drive');
    if (Player.piece) { showDock(); setDockInfo(Player.piece); }
    else { dock.classList.add('hidden'); document.body.classList.remove('docked'); }
    try { this.lock && this.lock.release(); } catch(e){}
    this.lock = null;
    render();
  },
  async wake(){
    try { if ('wakeLock' in navigator) this.lock = await navigator.wakeLock.request('screen'); } catch(e){}
  },
  start(k){
    const L = this.lists().find(x => x.k === k); if (!L || !Player.ready) return;
    this.list = L.ids; this.label = L.label; this.i = 0; this.started = true;
    this.step(true);
  },
  step(first){
    const p = PIECE[this.list[this.i]];
    Narrator.stop(); this.needTap = false;
    if (SET.narr) {
      if (first) {
        // 첫 곡: 탭한 순간 음소거로 재생을 시작해 모바일 자동재생 제한을 풀어둔다
        Player.mute(); Player.primeGuard = true; Player.load(p, true);
      } else {
        Player.load(p, false);
      }
      const lead = first ? '드라이브 모드를 시작합니다. 첫 곡은 ' : '다음 곡은 ';
      Narrator.speak(pieceScript(p, SET.len, lead), () => Player.play(), 'drive');
    } else {
      Player.load(p, true);
      if (first) Narrator.speak([clean(COMP[p.c].full + '의 ' + p.t + '입니다.')], null, 'drive');
    }
    this.render();
  },
  next(){
    if (!this.started) return;
    if (this.i < this.list.length - 1) { this.i++; this.step(false); }
    else { Player.pause(); Narrator.speak(['선택하신 목록을 모두 들었어요. 오늘도 좋은 음악과 함께해 주셔서 감사합니다.'], null, 'drive'); this.render(); }
  },
  prev(){ if (!this.started) return; if (this.i > 0) this.i--; this.step(false); },
  toggle(){
    if (Narrator.speaking) Narrator.pause();
    else if (Narrator.paused) Narrator.resume();
    else if (Player.isPlaying()) Player.pause();
    else { Player.play(); }
    this.needTap = false;
    this.render();
  },
  replay(){
    const p = PIECE[this.list[this.i]]; if (!p) return;
    Player.pause();
    Narrator.speak(pieceScript(p, SET.len, ''), () => Player.play(), 'drive');
  },
  toggleNarr(){ SET.narr = !SET.narr; saveSet(); if (!SET.narr && Narrator.busy()) { Narrator.stop(); Player.play(); } this.render(); },
  cycleLen(){ const o = ['short','mid','long']; SET.len = o[(o.indexOf(SET.len) + 1) % 3]; saveSet(); this.render(); },
  cycleRate(){ const o = [0.9, 1, 1.15]; SET.rate = o[(o.indexOf(SET.rate) + 1) % 3] || 1; saveSet(); this.render(); },
  backToLists(){ Narrator.stop(); Player.pause(); this.started = false; this.render(); },
  status(){
    if (Narrator.speaking) return ['🔊 해설 중', ''];
    if (Narrator.paused) return ['⏸ 해설 일시정지', 'idle'];
    const st = Player.state();
    if (st === 1) return ['▶ 음악 재생 중', 'play'];
    if (st === 3) return ['⏳ 불러오는 중', 'idle'];
    if (this.needTap) return ['👆 가운데 버튼을 눌러 재생', ''];
    return ['⏸ 일시정지', 'idle'];
  },
  render(){
    const el = document.getElementById('drive'); if (!el || !this.active) return;
    const sets = `<div class="dv-sets">
        <button class="dv-set" onclick="Drive.toggleNarr()"><small>해설</small>${SET.narr ? '켜짐' : '꺼짐'}</button>
        <button class="dv-set" onclick="Drive.cycleLen()"><small>해설 길이</small>${LEN_LABEL[SET.len]}</button>
        <button class="dv-set" onclick="Drive.cycleRate()"><small>읽기 속도</small>${RATE_LABEL[SET.rate] || '보통'}</button>
      </div>`;
    if (!this.started) {
      el.innerHTML = `<div class="dv-top"><b>🚗 드라이브 모드</b><button class="dv-exit" onclick="Drive.close()">나가기</button></div>
        <p class="dv-note">${Player.ready ? '출발 전에 들을 목록을 골라주세요. 곡마다 해설을 들려드린 뒤 음악이 이어지고, 끝나면 다음 곡으로 넘어갑니다.' : '플레이어 준비 중…'}</p>
        <div class="dv-lists">${this.lists().map(l => l.head ? `<h4 class="dv-head">${esc(l.head)}</h4>` : `<button class="dv-list ${l.primary ? 'primary' : ''}" ${Player.ready ? '' : 'disabled'} onclick="Drive.start('${l.k}')"><b>${esc(l.label)}</b><small>${esc(l.sub)}</small></button>`).join('')}</div>
        ${sets}
        <p class="dv-note">⚠️ 운전 중에는 화면 조작을 최소화하세요. 화면이 꺼지면 재생이 멈출 수 있으니 거치대에 두고 화면을 켜둔 채 사용하세요.</p>`;
      return;
    }
    const p = PIECE[this.list[this.i]], c = COMP[p.c];
    const [st, cls] = this.status();
    const playing = Narrator.speaking || Player.isPlaying();
    el.innerHTML = `<div class="dv-top"><b>🚗 ${esc(this.label)}</b><button class="dv-exit" onclick="Drive.close()">나가기</button></div>
      <div class="dv-status ${cls}">${st}</div>
      <div class="dv-count">${this.i + 1} / ${this.list.length} · ${esc(ERA[c.era].name)} · ${esc(p.form)}</div>
      <h2 class="dv-title">${esc(p.t)}</h2>
      <div class="dv-comp">${esc(c.full)}</div>
      <div class="dv-caption">${Narrator.speaking ? esc(Narrator.cur) : ''}</div>
      <div class="dv-ctrl">
        <button onclick="Drive.prev()" aria-label="이전 곡">⏮</button>
        <button class="main ${this.needTap ? 'tap' : ''}" onclick="Drive.toggle()" aria-label="재생/일시정지">${playing ? '⏸' : '▶'}</button>
        <button onclick="Drive.next()" aria-label="다음 곡">⏭</button>
      </div>
      <div class="dv-row">
        <button onclick="Drive.replay()">🔁 해설 다시</button>
        <button onclick="Drive.toggleNarr()">해설 ${SET.narr ? '끄기' : '켜기'}</button>
        <button onclick="Drive.backToLists()">📋 목록 바꾸기</button>
      </div>`;
  }
};
window.Drive = Drive;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Drive.active && !Drive.lock) Drive.wake(); });

function vMe(){
  const ids = Object.keys(S.listened).filter(id => PIECE[id]).sort((a,b) => S.listened[b].localeCompare(S.listened[a]));
  const noteIds = Object.keys(S.notes).filter(id => PIECE[id]);
  const byEra = DATA.eras.map(e => {

  });
  return `<h1 class="serif" style="margin:0 0 14px">내 기록</h1>
  <div class="grid g3">
    <div class="card"><div class="muted">감상한 곡</div><b class="serif" style="font-size:30px">${ids.length}</b><span class="muted"> / ${DATA.pieces.length}</span></div>

  <h2 class="sec-title">시대별 진행</h2>
  <div class="card">${byEra.map(x => `
    <div style="margin:8px 0"><span class="era-dot" style="background:${x.e.color}"></span>${esc(x.e.name)} <span class="muted">${x.n}/${x.t}</span>
    <div style="background:#eee5d7;border-radius:6px;height:7px;margin-top:4px"><div style="width:${x.t?x.n/x.t*100:0}%;height:100%;background:${x.e.color};border-radius:6px"></div></div></div>`).join('')}
  </div>

  ${noteIds.length ? `<h2 class="sec-title">감상 메모</h2>
  <div class="grid g2">${noteIds.map(id => `<div class="card" style="cursor:pointer" onclick="go('piece','${id}')">
    <b>${esc(PIECE[id].t)}</b> <small class="muted">${esc(COMP[PIECE[id].c].name)}</small>
    <p style="margin:8px 0 0;white-space:pre-wrap;font-size:14px">${esc(S.notes[id].slice(0,160))}${S.notes[id].length>160?'…':''}</p></div>`).join('')}</div>` : ''}

  ${connectCard()}

  <h2 class="sec-title">재생 · 해설 설정</h2>
  <div class="card" style="font-size:14px">
    곡마다 기본 연주 영상이 연결되어 있고, 재생이 안 되는 영상은 자동으로 다음 후보로 넘어갑니다. 곡 화면의 “다른 연주로 바꾸기”로 원하는 연주를 지정할 수 있어요.<br>
    직접 지정한 영상: ${Object.keys(S.videos).length}곡<br>
    해설 음성: ${Narrator.ok ? (Narrator.voice ? esc(Narrator.voice.name) : '한국어 음성을 찾는 중 (기기 설정의 텍스트 음성 변환에서 한국어를 설치하면 더 자연스러워요)') : '이 브라우저는 음성 읽기를 지원하지 않아요'}
  </div>`;
}

if (APP_MODE && 'serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
view.innerHTML = '<p class="muted" style="text-align:center;padding:60px 0">불러오는 중…</p>';
call('getState').then(st => { Object.assign(S, st); render(); })
  .catch(e => { toast('기록을 불러오지 못했어요'); render(); });
})();
