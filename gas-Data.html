    why:'러시아가 서유럽 음악을 배우며 자기 목소리를 찾던 시기였습니다. 차이콥스키는 독일식 교육을 받았지만 러시아의 정서와 극적인 선율을 결합해 가장 대중적인 낭만 음악을 만들었습니다.' },
  { id:'dvorak', name:'드보르자크', full:'안토닌 드보르자크', en:'Antonín Dvořák', era:'romantic', years:'1841–1904', country:'체코',

  { id:'rachmaninoff', name:'라흐마니노프', full:'세르게이 라흐마니노프', en:'Sergei Rachmaninoff', era:'modern', years:'1873–1943', country:'러시아 → 미국',
