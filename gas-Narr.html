페라 사업으로 큰돈을 벌기도, 크게 잃기도 했죠. 오페라 인기가 시들자 영어로 부르는 오라토리오로 방향을 바꿔 대성공을 거뒀어요. 묘하게도 말년에는 바흐와 같은 안과 의사에게 눈 수술을 받고, 두 사람 모두 시력을 잃었답니다. 왜 이런 음악이 나왔을까요? 바흐가 교회에 고용된 장인이었다면, 헨델은 시장에서 표를 팔아야 하는 사업가였어요. 런던이라는 대도시의 청중을 상대했기에, 그의 음악은 더 극적이고 웅장하고, 듣자마자 귀에 쏙 들어온답니다.","w":"그 무렵 헨델 이야기를 조금 더 해 볼게요. 바흐가 교회에 고용된 장인이었다면, 헨델은 표를 팔아야 하는 사업가였어요. 런던이라는 대도시의 청중을 상대했기에, 그의 음악은 더 극적이고 웅장하고, 듣자마자 귀에 들어온답니다."},"haydn":{"s":"프란츠 요제프 하이든. 교향곡의 아버지, 유머 넘치는 파파 하이든이에요. 하이든은 가난한 수레바퀴 장인의 아들로 태어났어요. 삼십 년 가까이 헝가리 귀족 에스테르하지 가문의 궁정 악장으로 일하며 시골 궁전에 고립되어 지냈는데, 본인은 그래서 독창적일 수밖에 없었다고 돌아봤죠. 후원자가 세상을 떠난 뒤에는 예순의 나이에 런던으로 건너가 대스타가 됐어요. 교향곡 백네 곡, 현악사중주 예순여덟 곡을 남겼고, 모차르트와는 나이를 뛰어넘은 친구, 베토벤에게는 스승이었답니다. 왜 이런 음악이 나왔을까요? 외딴 궁전에 전속 오케스트라가 있었기에, 하이든은 매일 새로운 실험을 하고 바로 들어볼 수 있었어요. 그 삼십 년의 실험이 교향곡과 현악사중주라는 형식을 완성했죠.","w":"그 무렵 하이든 이야기를 조금 더 해 볼게요. 외딴 궁전에 전속 오케스트라가 있었기에, 하이든은 매일 새로운 실험을 하고 바로 들어볼 수 있었어요. 그 삼십 년의 실험이 교향곡과 현악사중주라는 형식을 완성했답니다."},"mozart":{"s":"볼프강 아마데우스 모차르트. 서른다섯 해를 산 천재, 어떤 장르든 완벽했던 사람이에요. 모차르트는 다섯 살에 작곡을 시작했고, 어린 시절 대부분을 아버지를 따라 유럽 곳곳을 돌며 연주하면서 보냈어요. 잘츠부르크 대주교 밑에서 일하다 갈등 끝에 1781년 쫓겨나듯 나와서, 빈에서 자유로운 음악가로 살았죠. 오페라, 교향곡, 협주곡, 실내악까지 모든 장르에서 걸작을 남겼지만 수입은 늘 불안했고, 서른다섯 살에 레퀴엠을 다 끝내지 못한 채 세상을 떠났어요. 왜 이런 음악이 나왔을까요? 궁정에 묶여 있던 하이든과 달리, 모차르트는 고용된 음악가에서 독립 예술가로 넘어가는 경계에 선 첫 세대였어요. 빈의 시민들을 상대로 직접 연주회를 열어야 했기에, 피아노 협주곡처럼 자신이 직접 빛날 수 있는 곡을 많이 썼답니다.","w":"그 무렵 모차르트 이야기를 조금 더 해 볼게요. 모차르트는 고용된 음악가에서 독립 예술가로 넘어가는 경계에 선 첫 세대였어요. 빈의 시민들을 상대로 직접 연주회를 열어야 했기에, 자신이 직접 빛날 수 있는 피아노 협주곡 같은 곡을 많이 썼답니다."},"beethoven":{"s":"루트비히 판 베토벤. 귀가 들리지 않는 작곡가, 고전에서 낭만으로 건너가는 다리 같은 사람이에요. 베토벤은 독일 본에서 태어나, 술에 기대 살던 아버지 밑에서 혹독하게 피아노를 배웠어요. 스물두 살에 빈으로 가서 하이든에게 배우고, 격정적인 즉흥 연주로 이름을 날렸죠. 그런데 이십 대 후반부터 귀가 들리지 않기 시작했고, 1802년에는 하일리겐슈타트에서 동생들에게 유서까지 썼어요. 하지만 예술이 나를 붙잡았다며 다시 일어섰고, 완전히 들리지 않게 된 뒤에도 교향곡 9번 같은 걸작을 남겼답니다. 왜 이런 음악이 나왔을까요? 프랑스 혁명과 나폴레옹의 시대, 개인의 자유와 의지가 새로운 가치가 됐어요. 베토벤은 귀족의 하인이 아니라 귀족과 대등한 예술가로 행동한 첫 작곡가였고, 고통을 이겨 내는 투쟁의 이야기를 음악에 담았죠. 그래서 그의 음악은 고전의 형식 안에 낭만의 감정이 끓고 있어요.","w":"그 무렵 베토벤 이야기를 조금 더 해 볼게요. 프랑스 혁명과 나폴레옹의 시대, 개인의 자유와 의지가 새로운 가치가 됐어요. 베토벤은 귀족과 대등한 예술가로 행동한 첫 작곡가였고, 고통을 이겨 내는 투쟁의 이야기를 음악에 담았답니다."},"schubert":{"s":"프란츠 슈베르트. 가곡의 왕, 서른한 해의 짧은 생애를 산 사람이에요. 슈베르트는 빈의 학교 선생님 아들로 태어나, 평생 빈을 거의 떠나지 않았어요. 가곡을 육백 곡 넘게 썼지만 살아 있을 때는 크게 유명하지 않았고, 친구들 집에 모여 그의 노래를 듣는 슈베르티아데라는 작은 모임이 그의 무대였죠. 평생 가난했고, 서른한 살에 세상을 떠났어요. 존경하던 베토벤의 장례식에서 횃불을 들었고, 이듬해 그 가까이에 묻혔답니다. 왜 이런 음악이 나왔을까요? 나폴레옹 전쟁이 끝난 뒤 빈은 검열과 감시가 심했어요. 사람들은 정치 대신 집 안의 작은 모임으로 숨어들었고, 그 친밀한 공간에서 시를 노래로 만드는 가곡이 꽃폈죠. 슈베르트는 그 시대 사람들의 속마음을 노래한 작곡가예요.","w":"그 무렵 슈베르트 이야기를 조금 더 해 볼게요. 나폴레옹 전쟁 뒤 빈은 검열과 감시가 심했어요. 사람들은 집 안의 작은 모임으로 숨어들었고, 그 친밀한 공간에서 시를 노래로 만드는 가곡이 꽃폈죠. 슈베르트는 그 시대의 속마음을 노래한 작곡가랍니다."},"mendelssohn":{"s":"펠릭스 멘델스존. 모든 것을 가진 신동이자, 바흐를 다시 살려 낸 사람이에요. 멘델스존은 베를린의 부유한 은행가 집안에서 태어나 최고의 교육을 받았어요. 할아버지는 유명한 철학자 모제스 멘델스존이었죠. 열일곱 살에 쓴 한여름 밤의 꿈 서곡은 지금도 천재의 상징처럼 이야기돼요. 스무 살에는 백 년 가까이 잊혀 있던 바흐의 마태수난곡을 무대에 올려 바흐 부활의 계기를 만들었고요. 라이프치히의 오케스트라를 이끌고 음악원까지 세웠지만, 가장 가까웠던 누나 파니가 세상을 떠난 지 반년 만에 서른여덟 살로 숨을 거뒀어요. 왜 이런 음악이 나왔을까요? 멘델스존은 낭만주의 시대를 살았지만 바흐와 모차르트의 균형 감각을 사랑했어요. 그래서 그의 음악은 감정이 넘치기보다 맑고 우아하고, 여행에서 본 풍경을 수채화처럼 그려 낸답니다.","w":"그 무렵 멘델스존 이야기를 조금 더 해 볼게요. 멘델스존은 낭만주의 시대를 살았지만 바흐와 모차르트의 균형 감각을 사랑했어요. 그래서 그의 음악은 맑고 우아하고, 여행에서 본 풍경을 수채화처럼 그려 낸답니다."},"chopin":{"s":"프레데리크 쇼팽. 피아노의 시인, 돌아가지 못한 조국을 평생 그리워한 사람이에요. 쇼팽은 폴란드 바르샤바 근처에서 태어난 신동이었어요. 스무 살에 유학길에 올랐는데, 떠나자마자 바르샤바에서 러시아에 맞선 봉기가 일어났다가 실패했고, 그는 다시는 고국에 돌아가지 못했죠. 파리에 자리 잡아 살롱의 스타가 됐고, 작가 조르주 상드와 구 년을 함께했어요. 결핵으로 서른아홉 살에 세상을 떠났는데, 유언에 따라 심장만은 바르샤바로 옮겨져 지금도 그곳 성당에 모셔져 있답니다. 왜 이런 음악이 나왔을까요? 이 무렵 피아노는 기계적으로 크게 발전해서, 노래하듯 길게 울리고 아주 섬세하게 강약을 조절할 수 있게 됐어요. 쇼팽은 거의 피아노곡만 썼는데, 이 새로운 악기의 가능성과 조국을 잃은 사람의 그리움이 만나 그만의 시적인 음악이 태어났죠.","w":"그 무렵 쇼팽 이야기를 조금 더 해 볼게요. 이 무렵 피아노는 크게 발전해서, 노래하듯 길게 울리고 섬세하게 강약을 조절할 수 있게 됐어요. 그 새로운 악기의 가능성과, 조국을 잃은 사람의 그리움이 만나 쇼팽만의 시적인 음악이 태어났답니다."},"schumann":{"s":"로베르트 슈만. 문학을 사랑한 피아노의 시인, 그리고 클라라와의 사랑으로 기억되는 사람이에요. 슈만은 원래 법학을 공부했지만, 피아니스트가 되겠다며 음악으로 돌아섰어요. 손가락을 다쳐 연주자의 꿈을 접은 뒤로는 작곡과 음악 평론에 몰두했죠. 직접 만든 음악 잡지에서 젊은 쇼팽을, 여러분 모자를 벗으십시오, 천재입니다라는 말로 소개하기도 했어요. 스승의 딸이자 당대 최고의 피아니스트 클라라와 사랑에 빠졌지만, 그녀의 아버지가 결혼을 반대해서 소송 끝에 1840년에야 결혼했어요. 그해에만 가곡을 백 곡 넘게 쏟아냈대요. 말년에는 마음의 병에 시달리다 마흔여섯 살에 요양원에서 세상을 떠났어요. 왜 이런 음악이 나왔을까요? 낭만주의는 음악과 문학이 가장 가까웠던 시대였어요. 시와 소설을 사랑한 슈만은 음악에 이야기와 인물, 암호까지 숨겨 넣었고, 짧은 피아노 소품 하나에도 한 편의 시 같은 마음을 담았답니다.","w":"그 무렵 슈만 이야기를 조금 더 해 볼게요. 낭만주의는 음악과 문학이 가장 가까웠던 시대였어요. 시와 소설을 사랑한 슈만은 음악에 이야기와 인물, 암호까지 숨겨 넣었고, 짧은 소품 하나에도 한 편의 시 같은 마음을 담았답니다."},"liszt":{"s":"프란츠 리스트. 최초의 슈퍼스타 피아니스트예요. 리스트는 역사상 가장 뛰어난 피아니스트로 꼽혀요. 그의 연주회에서는 여성들이 기절하고, 그가 벗어 둔 장갑을 두고 다툼이 벌어졌대요. 시인 하이네는 이 열풍을 리스토마니아라고 불렀죠. 혼자 무대에서 연주회를 여는 리사이틀이라는 형식도 그가 자리 잡게 했어요. 그런데 정작 삼십 대 중반에 순회 연주를 그만두고 작곡과 후배 양성에 힘썼고, 말년에는 성직자의 길을 걸었어요. 쇼팽의 친구이자 바그너의 장인이기도 하답니다. 왜 이런 음악이 나왔을까요? 악마의 바이올리니스트라 불린 파가니니의 연주를 보고 충격을 받은 리스트는, 피아노의 파가니니가 되겠다고 결심했어요. 철도가 생겨 유럽을 돌기 쉬워지고, 신문이 스타를 만들어 내던 시대였기에, 그는 음악계 최초의 아이돌이 될 수 있었죠.","w":"그 무렵 리스트 이야기를 조금 더 해 볼게요. 파가니니의 연주에 충격을 받은 리스트는 피아노의 파가니니가 되겠다고 결심했어요. 철도가 생기고 신문이 스타를 만들던 시대였기에, 그는 음악계 최초의 아이돌이 될 수 있었답니다."},"verdi":{"s":"주세페 베르디. 이탈리아 오페라의 왕이자, 이탈리아 통일 운동의 상징이에요. 베르디는 시골 여관집 아들로 태어났고, 밀라노 음악원 입학시험에는 떨어졌어요. 젊은 시절 아내와 두 아이를 잇달아 잃고 작곡을 그만두려 했는데, 우연히 펼쳐 본 나부코의 대본에 마음이 움직여 다시 일어섰다고 전해져요. 스물여섯 편이 넘는 오페라를 썼고, 여든 살에 마지막 오페라 팔스타프를 완성했죠. 그가 세상을 떠났을 때 밀라노 거리에는 수많은 사람이 모여 그를 배웅했답니다. 왜 이런 음악이 나왔을까요? 이탈리아가 여러 나라로 쪼개져 오스트리아의 지배를 받던 시절, 오페라 극장은 사람들의 마음이 모이는 광장이었어요. 베르디의 합창과 극적인 선율은 통일을 꿈꾸던 이탈리아 사람들의 마음과 겹쳐졌죠.","w":"그 무렵 베르디 이야기를 조금 더 해 볼게요. 이탈리아가 여러 나라로 쪼개져 지배받던 시절, 오페라 극장은 사람들의 마음이 모이는 광장이었어요. 베르디의 합창과 극적인 선율은 통일을 꿈꾸던 사람들의 마음과 겹쳐졌답니다."},"brahms":{"s":"요하네스 브람스. 베토벤의 그림자와 싸운 고전주의자예요. 브람스는 함부르크의 가난한 음악가 집에서 태어나, 십 대 때는 술집에서 피아노를 치며 돈을 벌었어요. 스무 살에 슈만 부부를 만나 슈만에게 새로운 길이라는 극찬을 받았고, 슈만이 쓰러진 뒤에는 그의 아내 클라라 곁을 지켰죠. 클라라와의 깊은 우정은 평생 이어졌고, 그는 결혼하지 않았어요. 베토벤이라는 거인을 너무 의식한 나머지, 첫 교향곡을 완성하는 데 이십 년 넘게 걸렸답니다. 왜 이런 음악이 나왔을까요? 모두가 리스트와 바그너처럼 새로운 형식을 외치던 시대에, 브람스는 바흐와 베토벤의 전통 형식 안에 낭만의 감정을 담는 길을 택했어요. 그래서 그의 음악에는 단단한 구조 속에 억눌린 그리움이 흐른답니다.","w":"그 무렵 브람스 이야기를 조금 더 해 볼게요. 모두가 새로운 형식을 외치던 시대에, 브람스는 바흐와 베토벤의 전통 형식 안에 낭만의 감정을 담는 길을 택했어요. 그래서 그의 음악에는 단단한 구조 속에 억눌린 그리움이 흐른답니다."},"saintsaens":{"s":"카미유 생상스. 모차르트에 견줄 만한 신동이자, 여든여섯 해를 산 프랑스 음악의 기둥이에요. 생상스는 두 살에 피아노를 치고, 열 살에 데뷔 연주회를 연 신동이었어요. 파리 마들렌 성당의 오르가니스트로 이십 년을 일했고, 리스트는 그를 세계 최고의 오르가니스트라고 칭찬했죠. 음악뿐 아니라 천문학, 고고학, 시, 철학에도 조예가 깊었어요. 여든여섯 살까지 살며 낭만주의부터 드뷔시와 스트라빈스키의 시대까지 지켜봤지만, 새로운 음악에는 끝까지 비판적이었답니다. 왜 이런 음악이 나왔을까요? 1870년 프로이센과의 전쟁에서 진 뒤, 프랑스 음악가들은 독일 음악에 맞서 프랑스다운 음악을 세우려 했어요. 생상스는 국민음악협회를 함께 세우고, 명료한 형식과 우아한 색채를 갖춘 프랑스 기악 음악의 기틀을 다졌죠.","w":"그 무렵 생상스 이야기를 조금 더 해 볼게요. 전쟁에서 진 뒤 프랑스 음악가들은 독일 음악에 맞서 프랑스다운 음악을 세우려 했어요. 생상스는 명료한 형식과 우아한 색채를 갖춘 프랑스 기악 음악의 기틀을 다졌답니다."},"tchaikovsky":{"s":"표트르 일리치 차이콥스키. 눈물과 선율의 작곡가, 발레 음악의 왕이에요. 차이콥스키는 법률학교를 나와 공무원으로 일하다가, 이십 대에 음악으로 진로를 바꿨어요. 예민하고 우울한 성격이라 평생 고뇌했죠. 부유한 미망인 폰 메크 부인이 십삼 년 동안 그를 후원했는데, 두 사람은 천 통이 넘는 편지를 주고받으면서도 절대 만나지 않는다는 약속을 지켰대요. 마지막 교향곡 비창을 초연하고 아흐레 뒤, 그는 세상을 떠났어요. 왜 이런 음악이 나왔을까요? 러시아가 서유럽 음악을 배우며 자기 목소리를 찾아가던 시기였어요. 차이콥스키는 독일식 교육을 받았지만, 러시아의 정서와 극적인 선율을 결합해 가장 대중적인 낭만 음악을 만들어 냈답니다.","w":"그 무렵 차이콥스키 이야기를 조금 더 해 볼게요. 러시아가 서유럽 음악을 배우며 자기 목소리를 찾던 시기였어요. 차이콥스키는 러시아의 정서와 극적인 선율을 결합해, 가장 대중적인 낭만 음악을 만들어 냈답니다."},"dvorak":{"s":"안토닌 드보르자크. 보헤미아 시골의 소리를 세계로 가져간 사람이에요. 드보르자크는 체코 시골의 여관 겸 정육점 집 아들로 태어나, 가업을 이을 뻔했어요. 오랫동안 무명이었다가, 국가 장학금 심사위원이던 브람스의 눈에 띄어 출판사를 소개받으면서 이름을 알리기 시작했죠. 1892년에는 뉴욕 음악원 원장으로 초대받아 미국에서 삼 년을 살았어요. 기차와 증기기관차를 보러 다닐 만큼 철도를 좋아했대요. 왜 이런 음악이 나왔을까요? 유럽 곳곳에서 자기 민족의 정체성을 음악에 담으려는 움직임이 일어나던 때였어요. 드보르자크는 보헤미아 민요의 선율과 리듬을 교향곡이라는 큰 그릇에 담았고, 미국에서는 흑인 영가와 원주민 음악에도 귀를 기울였죠.","w":"그 무렵 드보르자크 이야기를 조금 더 해 볼게요. 유럽 곳곳에서 민족의 정체성을 음악에 담으려는 움직임이 일어나던 때였어요. 드보르자크는 보헤미아 민요의 선율과 리듬을 교향곡이라는 큰 그릇에 담았답니다."},"grieg":{"s":"에드바르 그리그. 노르웨이의 피오르와 민요를 노래한 서정 시인이에요. 그리그는 노르웨이 베르겐에서 태어나 독일 라이프치히에서 공부했어요. 키가 백오십 센티미터 남짓으로 작았고, 젊은 시절 늑막염을 앓아 폐 한쪽이 거의 기능하지 않아서 평생 몸이 약했죠. 스물네 살에 쓴 피아노 협주곡을 리스트가 처음 보자마자 쳐 보고 극찬했다는 이야기가 유명해요. 사촌이자 가수였던 니나와 결혼했고, 베르겐 근처 트롤하우겐이라는 집에서 작곡하며 노르웨이 음악의 얼굴이 됐답니다. 왜 이런 음악이 나왔을까요? 덴마크와 스웨덴의 지배를 오래 받아 온 노르웨이에서, 십구 세기 후반 민족의 정체성을 찾으려는 움직임이 커졌어요. 그리그는 노르웨이 민요의 선율과 춤 리듬을 소박하고 서정적인 음악으로 다듬어 냈죠.","w":"그 무렵 그리그 이야기를 조금 더 해 볼게요. 오랜 지배를 받아 온 노르웨이에서 민족의 정체성을 찾으려는 움직임이 커지던 때였어요. 그리그는 노르웨이 민요의 선율과 춤 리듬을 소박하고 서정적인 음악으로 다듬었답니다."},"puccini":{"s":"자코모 푸치니. 가슴을 울리는 선율, 오페라의 마지막 거장이에요. 푸치니는 대대로 교회 음악가인 집안에서 태어났어요. 십 대 시절 베르디의 아이다를 보려고 수십 킬로미터를 걸어갔다가, 오페라 작곡가가 되기로 마음먹었다고 전해져요. 라 보엠, 토스카, 나비부인으로 세계적인 인기를 얻었고, 사냥과 자동차를 무척 좋아했죠. 마지막 오페라 투란도트를 다 끝내지 못한 채, 치료를 받던 중 세상을 떠났어요. 왜 이런 음악이 나왔을까요? 베르디 이후 이탈리아 오페라는 신화나 왕의 이야기 대신, 평범한 사람들의 사실적인 삶을 다루는 쪽으로 흘러갔어요. 푸치니는 가난한 예술가, 버려진 여인 같은 인물의 감정을, 영화음악처럼 생생한 선율로 그려 냈답니다.","w":"그 무렵 푸치니 이야기를 조금 더 해 볼게요. 베르디 이후 이탈리아 오페라는 평범한 사람들의 사실적인 삶을 다루는 쪽으로 흘러갔어요. 푸치니는 가난한 예술가, 버려진 여인 같은 인물의 감정을 영화음악처럼 생생한 선율로 그려 냈답니다."},"mahler":{"s":"구스타프 말러. 교향곡 하나에 세상 전부를 담으려 한 사람이에요. 말러는 보헤미아의 유대인 가정에서 태어났고, 어린 나이에 형제 여럿을 잃었어요. 당대 최고의 지휘자로 이름을 날려 빈 궁정 오페라 극장을 십 년 동안 이끌었고, 작곡은 주로 여름휴가 때 호숫가의 작은 오두막에서 했죠. 살아 있을 때는 작곡가보다 지휘자로 더 유명했고, 그의 교향곡은 너무 길고 복잡하다는 말을 들었어요. 본인은 언젠가 나의 시대가 올 거라고 말했다고 전해지는데, 실제로 이십 세기 후반에 큰 인기를 얻었답니다. 왜 이런 음악이 나왔을까요? 십구 세기가 끝나고 이십 세기가 시작되던 무렵, 낭만주의는 거대하게 부풀어 오른 마지막 단계에 있었어요. 말러는 커다란 오케스트라에 민요, 행진곡, 새소리, 합창까지 넣어서, 삶과 죽음, 자연과 구원이라는 큰 질문을 교향곡에 담았죠.","w":"그 무렵 말러 이야기를 조금 더 해 볼게요. 십구 세기가 끝나 가던 무렵, 낭만주의는 거대하게 부풀어 오른 마지막 단계에 있었어요. 말러는 커다란 오케스트라에 민요와 행진곡, 합창까지 넣어, 삶과 죽음이라는 큰 질문을 교향곡에 담았답니다."},"debussy":{"s":"클로드 드뷔시. 소리로 그림을 그린 인상주의 작곡가예요. 드뷔시는 파리 음악원 시절부터 규칙을 거부하는 학생이었어요. 1889년 파리 만국박람회에서 인도네시아 자바의 가믈란 음악을 듣고 큰 충격을 받았고, 그때부터 서양 화성의 규칙에서 벗어난 새로운 소리를 찾기 시작했죠. 모네 같은 인상주의 화가들과 묶여 인상주의 음악이라고 불렸지만, 정작 본인은 그 말을 싫어했고, 오히려 상징주의 시인들과 더 가까웠어요. 왜 이런 음악이 나왔을까요? 독일 음악, 특히 바그너의 영향이 유럽을 뒤덮던 시기, 프랑스 작곡가들은 우리만의 음악을 원했어요. 드뷔시는 무거운 드라마 대신 빛과 물과 바람 같은 순간의 분위기를 소리의 색채로 그려 내서, 이십 세기 음악의 문을 열었답니다.","w":"그 무렵 드뷔시 이야기를 조금 더 해 볼게요. 바그너의 영향이 유럽을 뒤덮던 시기, 프랑스 작곡가들은 우리만의 음악을 원했어요. 드뷔시는 빛과 물과 바람 같은 순간의 분위기를 소리의 색채로 그려 내서, 이십 세기 음악의 문을 열었답니다."},"ravel":{"s":"모리스 라벨. 스위스 시계공처럼 정밀한, 오케스트라의 마술사예요. 라벨은 스위스 출신 기술자였던 아버지에게서 기계를 사랑하는 마음을 물려받았어요. 스트라빈스키가 그를 스위스 시계공이라고 불렀을 만큼, 한 음 한 음을 정밀하게 다듬었죠. 권위 있는 로마 대상에 여러 번 떨어져서 큰 스캔들이 나기도 했어요. 오케스트라의 색채를 다루는 솜씨는 누구도 따라오지 못했고, 무소륵스키의 전람회의 그림을 오케스트라로 편곡한 것으로도 유명하답니다. 왜 이런 음악이 나왔을까요? 라벨은 드뷔시와 같은 프랑스 새 음악의 흐름에 있었지만, 흐릿한 분위기보다 또렷한 윤곽과 고전적인 형식미를 좋아했어요. 재즈와 스페인 음악까지 받아들인 이십 세기 초 파리의 다채로운 분위기가 그의 음악에 녹아 있죠.","w":"그 무렵 라벨 이야기를 조금 더 해 볼게요. 라벨은 드뷔시와 같은 흐름에 있었지만, 흐릿한 분위기보다 또렷한 윤곽과 고전적인 형식미를 좋아했어요. 재즈와 스페인 음악까지 받아들인 그 시절 파리의 다채로운 분위기가 그의 음악에 녹아 있답니다."},"rachmaninoff":{"s":"세르게이 라흐마니노프. 낭만주의의 마지막 거장, 우울을 이겨 낸 피아니스트예요. 라흐마니노프는 러시아 귀족 집안에서 태어났고, 손이 무척 커서 다른 피아니스트는 닿지 않는 화음도 쉽게 짚었어요. 스물네 살 때 교향곡 1번 초연이 처참하게 실패하자 깊은 우울에 빠져, 삼 년 가까이 거의 작곡을 하지 못했죠. 한 의사의 치료로 회복해 피아노 협주곡 2번을 썼고, 1917년 러시아 혁명 뒤에는 가족과 함께 고국을 떠나 미국에서 피아니스트로 살았어요. 고향을 잃은 뒤로는 작곡이 크게 줄었답니다. 왜 이런 음악이 나왔을까요? 이십 세기 초 많은 작곡가가 새로운 실험으로 나아갈 때, 라흐마니노프는 차이콥스키에게서 이어받은 넓고 서정적인 러시아 낭만주의를 끝까지 지켰어요. 그래서 그의 음악은 할리우드 영화음악의 원형처럼 들리죠.","w":"그 무렵 라흐마니노프 이야기를 조금 더 해 볼게요. 많은 작곡가가 새로운 실험으로 나아갈 때, 라흐마니노프는 넓고 서정적인 러시아 낭만주의를 끝까지 지켰어요. 그래서 그의 음악은 할리우드 영화음악의 원형처럼 들린답니다."},"sibelius":{"s":"장 시벨리우스. 핀란드의 숲과 호수, 그리고 민족의 목소리예요. 시벨리우스는 원래 바이올리니스트를 꿈꿨지만 작곡가로 방향을 바꿨어요. 러시아의 지배를 받던 핀란드에서 그의 음악은 민족의 자부심이 됐고, 나라에서는 그에게 평생 연금을 줬죠. 교향곡 일곱 곡을 남긴 뒤, 예순 살 무렵부터 삼십 년 가까이 거의 작품을 발표하지 않았어요. 여덟 번째 교향곡을 썼다가 불태웠다고 알려져서, 이 시기를 야르벤페의 침묵이라고 불러요. 왜 이런 음악이 나왔을까요? 러시아 제국이 핀란드의 언어와 문화를 억누르던 시대, 핀란드 사람들은 서사시 칼레발라와 자연에서 민족의 정체성을 찾았어요. 시벨리우스는 그 숲과 호수의 차갑고 넓은 공기를 소리로 옮겨 냈답니다.","w":"그 무렵 시벨리우스 이야기를 조금 더 해 볼게요. 러시아 제국이 핀란드의 언어와 문화를 억누르던 시대, 사람들은 서사시와 자연에서 민족의 정체성을 찾았어요. 시벨리우스는 그 숲과 호수의 차갑고 넓은 공기를 소리로 옮겨 냈답니다."},"stravinsky":{"s":"이고르 스트라빈스키. 이십 세기 음악을 뒤흔든 카멜레온이에요. 스트라빈스키는 림스키코르사코프에게 배운 뒤, 파리의 발레단을 이끌던 디아길레프에게 발탁되어 불새로 단숨에 스타가 됐어요. 1913년 봄의 제전 초연은, 객석이 야유와 고함으로 뒤집힌 음악사의 사건이 됐죠. 러시아 혁명 이후 고국을 떠나 프랑스와 미국에서 살았고, 평생 스타일을 여러 번 바꿔 카멜레온이라고 불렸어요. 여든여덟 살까지 살았답니다. 왜 이런 음악이 나왔을까요? 일차 세계대전을 전후해 유럽의 낡은 질서가 무너지던 시대였어요. 스트라빈스키는 낭만주의의 넘치는 감정 대신 날카로운 리듬과 불협화음, 차가운 형식미로 새로운 시대의 소리를 만들었죠.","w":"그 무렵 스트라빈스키 이야기를 조금 더 해 볼게요. 일차 세계대전을 전후해 유럽의 낡은 질서가 무너지던 시대였어요. 스트라빈스키는 넘치는 감정 대신 날카로운 리듬과 불협화음으로 새로운 시대의 소리를 만들었답니다."},"gershwin":{"s":"조지 거슈윈. 재즈와 클래식을 이은 뉴욕의 천재예요. 거슈윈은 뉴욕 브루클린의 이민자 가정에서 태어났어요. 십 대에 악보 가게에서 신곡을 피아노로 쳐 주는 일을 하며, 형 아이라와 함께 브로드웨이 뮤지컬 히트곡을 만들었죠. 랩소디 인 블루로 클래식 무대에 나서면서 재즈를 연주회장으로 데려왔어요. 라벨 같은 유럽 작곡가에게 배우고 싶어 했지만, 뇌종양으로 서른여덟 살에 갑자기 세상을 떠났답니다. 왜 이런 음악이 나왔을까요? 1920년대 미국은 재즈의 시대였어요. 흑인 음악에서 태어난 재즈의 리듬과 블루스 화음이 도시의 활기와 만나던 때, 거슈윈은 그것을 오케스트라와 오페라라는 유럽의 그릇에 담아 미국의 소리를 만들었죠.","w":"그 무렵 거슈윈 이야기를 조금 더 해 볼게요. 1920년대 미국은 재즈의 시대였어요. 재즈의 리듬과 블루스 화음이 도시의 활기와 만나던 때, 거슈윈은 그것을 오케스트라라는 유럽의 그릇에 담아 미국의 소리를 만들었답니다."}}};
